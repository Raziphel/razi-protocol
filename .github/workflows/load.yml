name: Load

# Loads razi-protocol and the mods it needs in a real headless Factorio (tests/load/run.sh): a new map and some ticks
# on Normal and on Nightmare, so a prototype error or a bad number in the data stops a pull request before it reaches
# a player. Then the in-game tests of tests/funit run in the same game (the FUnit mod is one more mod of the cache).
# It runs apart from `check` (release.yml) because the mods are about 7 GB to download.
#
# The mods come from the mod portal with the secret FACTORIO_PLAYER_TOKEN (a player token, not the API key of the
# release) and the account it belongs to, Raziphel unless the variable FACTORIO_USERNAME says otherwise. A pull request from a fork gets no
# secrets: it is skipped with a note instead of failing. The Factorio builds are the `stable` and `experimental`
# headless ones from factorio.com; when both are the same version, one job is enough.
#
# The mod cache is about 7 GB and a repository holds 10 GB, and a pull request can only use caches of its own branch
# and of its base branch. So only a run on main or dev (a push or workflow_dispatch) saves the cache; a pull request
# restores it and downloads whatever has a newer version. Run it by hand after the mods have changed a lot:
# gh workflow run load.yml --ref dev
on:
  pull_request:
    paths:
      - .github/workflows/load.yml
      - control.lua
      - data*.lua
      - graphics/**
      - info.json
      - lib/**
      - locale/**
      - migrations/**
      - prototypes/**
      - scripts/**
      - settings*.lua
      - settings/**
      - tests/funit/**
      - tests/load/**
      - util.lua
  push:
    branches:
      - main
      - dev
    paths:
      - .github/workflows/load.yml
      - control.lua
      - data*.lua
      - graphics/**
      - info.json
      - lib/**
      - locale/**
      - migrations/**
      - prototypes/**
      - scripts/**
      - settings*.lua
      - settings/**
      - tests/funit/**
      - tests/load/**
      - util.lua
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  versions:
    name: game versions
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.versions.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve stable and experimental
        id: versions
        run: python3 -I tests/load/mods.py versions >> "$GITHUB_OUTPUT"

  skipped:
    name: skipped, pull request from a fork
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Say why
        run: |
          echo "::notice title=Game load skipped::A pull request from a fork gets no secrets, so the mods cannot be downloaded. A maintainer can run it with the Load workflow (workflow_dispatch) on a branch of this repository."
          echo "The game load was skipped: a pull request from a fork gets no secrets, so the mods cannot be downloaded." >> "$GITHUB_STEP_SUMMARY"

  load:
    name: load, Factorio ${{ matrix.version }} (${{ matrix.channels }})
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.versions.outputs.matrix) }}
    env:
      FACTORIO_USERNAME: ${{ vars.FACTORIO_USERNAME || 'Raziphel' }}
      FACTORIO_TOKEN: ${{ secrets.FACTORIO_PLAYER_TOKEN }}
      GAME_VERSION: ${{ matrix.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve the mods
        id: mods
        run: |
          python3 -I tests/load/mods.py resolve --info info.json --game "$GAME_VERSION" --out .load/mods.lock --extra-mod funit
          echo "key=$(python3 -I tests/load/mods.py key --lock .load/mods.lock)" >> "$GITHUB_OUTPUT"
      # The key is built from the resolved versions: with no new version nothing is downloaded. After a change the
      # newest older cache is restored, only the new versions are downloaded, and the result is saved under the new key.
      # Only main and dev save it (see the top), and in its own step, so a load that fails still keeps the mods.
      - name: Restore the mod cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .load/mods-cache
          key: mods-${{ steps.mods.outputs.key }}
          restore-keys: mods-
      - name: Download the mods that are not cached
        run: python3 -I tests/load/mods.py fetch --lock .load/mods.lock --dir .load/mods-cache
      - name: Save the mod cache
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && github.event_name != 'pull_request' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .load/mods-cache
          key: mods-${{ steps.mods.outputs.key }}
      - name: Load the game
        run: tests/load/run.sh --game "$GAME_VERSION" --resolved
      - name: Keep the logs of a failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: load-logs-${{ matrix.version }}
          path: |
            .load/run-*/*.txt
            .load/run-*/factorio-current.log
          retention-days: 7
