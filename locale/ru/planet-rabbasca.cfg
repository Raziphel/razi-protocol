[mod-setting-description]
rabbasca-bunnyhop-cooldown=Изменение применяется только к перезарядкам, начатым после него, и не сбрасывает и не меняет текущие.
rabbasca-deconstruct-captured-pylons=Если включено, после успешного взлома защитного пилона хранилища полученный межпланетный варп-пилон помечается для сноса.
rabbasca-ears-local-only=Если включено, здания с E.A.R.S. можно строить только в хареновом энергетическом поле. Взамен сильно сокращается время создания суб-ядер E.A.R.S.\nЭнергетический бетон по-прежнему можно укладывать на любой планете. На варп-пилоны не влияет.
rabbasca-enable-new-vault-progression=Новый способ открыть хареновую лаву требует создания предметов, а не боя. Прежний способ многих путал и вызывал проблемы совместимости с другими боевыми модами. Подробнее — в технологии «Вредные жидкости».
rabbasca-expand-athletic-science-usage=Добавляет атлетический научный пакет в стоимость технологий за границей солнечной системы
rabbasca-hard-science=Усложняет создание [item=athletic-science-pack], добавляя в рецепт [item=exoskeleton-equipment]. Пакетов получается немного больше.
rabbasca-harene-easy-mode=Создание очищенной Харены требует нескольких этапов на разных планетах. Этот параметр убирает условия поверхности у некоторых задействованных предметов.
rabbasca-map-dark-mode=Карта Раббаски режет глаза? Теперь на неё можно смотреть в любое время суток! (Перекрашивает клетки на карте, на вид самого мира не влияет)
rabbasca-no-extra-category=Убирает отдельную вкладку Раббаски в Факториопедии и меню создания, перенося предметы и рецепты в существующие категории
rabbasca-surface-megawatts=Мощность, доступная в электросети Раббаски.\nТакже ограничивает максимальное энергопотребление машин, для которых можно открыть улучшение [item=harene-ears-core]. (Для совместимости уже установленные машины с [item=harene-ears-core] сохранятся, но создавать их больше будет нельзя)
rabbasca-warp-core-spoils=Если выключено, [item=rabbasca-warp-core] больше не портится и не взрывается само со временем. Поведение при броске не меняется.

