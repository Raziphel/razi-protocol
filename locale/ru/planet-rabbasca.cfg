[recipe-description]
rabbasca-core-extraction-protocol=Разрушьте хранилище изнутри, чтобы обнажить его ядро.\n[color=yellow]ВНИМАНИЕ: ядро крайне нестабильно и, скорее всего, вызовет разрушения на большой площади. Раббасканская защита перейдёт в режим максимальной тревоги.\nПримите необходимые меры, прежде чем продолжить![/color]
rabbasca-quality-assurance=Повышает качество хранилища до качества этого рецепта. Качество можно только повысить: создание с таким же или более низким качеством, чем у хранилища, ничего не даст.\n\nТакже улучшает подключённую консоль и сразу прекращает текущий взлом.\nРоботы-защитники наследуют качество своего хранилища и становятся сильнее. Хранилища более высокого качества работают быстрее без роста расхода [item=vault-security-key].
rabbasca-security-modulation-down=Снижает глобальный модификатор настороженности на [planet=rabbasca] на 10%. Модификатор добавляется к уровню настороженности от взломанных хранилищ и может быть положительным или отрицательным.\nМинимум: -50%, максимум: +50%.
rabbasca-security-modulation-up=Повышает глобальный модификатор настороженности на [planet=rabbasca] на 10%. Модификатор добавляется к уровню настороженности от взломанных хранилищ и может быть положительным или отрицательным.\nМинимум: -50%, максимум: +50%.
rabbasca-warp-sequence-building=Варпом доставляет здания для [entity=entity-ghost].
rabbasca-warp-sequence-module=Варпом доставляет модули и другие запрошенные предметы в [entity=item-request-proxy]. Запросы на извлечение неварпуемых предметов отправляются в мусорный инвентарь пилона или выбрасываются на землю.
rabbasca-warp-sequence-reverse=Сносит здания и [entity=item-on-ground], помеченные для сноса. Здания, модули и клетки отправляются в [virtual-signal=rabbasca-warp-inventory], всё остальное попадает в инвентарь пилона. Содержимое снесённых зданий выбрасывается на землю и помечается для сноса.
rabbasca-warp-sequence-tile=Варпом укладывает клетки для [entity=tile-ghost].
rabbasca-warp-sequence-upgrade=Улучшает здания и отправляет заменённые здания в [virtual-signal=rabbasca-warp-inventory].

