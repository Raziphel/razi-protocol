[entity-description]
rabbasca-vault-meltdown=Варп-механизм, нестабильный и больше не управляемый своим хранилищем. Скоро его внутренности разрушатся под действием собственной хаотичной энергии.\n\n[color=red][img=virtual-signal.signal-alert] Рекомендуется эвакуироваться из окрестностей[/color]
rabbasca-vault-warp-spawner-inactive=Раббасканский защитный механизм, способный варпом подтягивать большие силы подкрепления. Сейчас неактивен. При обнаружении угрозы поблизости превращается в [entity=rabbasca-vault-warp-spawner], который можно взломать.
rabbasca-warp-uplink=Контейнер, который перемещает помещённые в него варпуемые предметы в [virtual-signal=rabbasca-warp-inventory]. Варпуются только размещаемые предметы (здания и клетки) и модули.\nТакже работает как сундук запроса и имеет логистическую секцию с количеством предметов в [virtual-signal=rabbasca-warp-inventory], которую можно использовать для учёта запросов.\n(подробнее в [tip=rabbasca-warp-inventory])

