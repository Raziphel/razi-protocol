warp-inventory-nodebug=[virtual-signal=rabbasca-warp-inventory] Варп-инвентарь
with-ears-description=__1__\nНужно размещать на [tile=rabbasca-energetic-concrete] или [tile=haronite-plate].
with-ears-description-noparam=Нужно размещать на [tile=rabbasca-energetic-concrete] или [tile=haronite-plate]

[tips-and-tricks-item-name]
rabbasca-warp-inventory=Варп-инвентарь

[tips-and-tricks-item-description]
rabbasca-warp-inventory=Поместите предметы в [entity=rabbasca-warp-uplink], чтобы перенести их в [virtual-signal=rabbasca-warp-inventory]. [entity=rabbasca-warp-pylon] может использовать этот инвентарь, чтобы варпом доставлять и забирать объекты (см. [recipe=rabbasca-warp-sequence]). Извлечь предметы из [virtual-signal=rabbasca-warp-inventory] можно только варпнув их на место.\n\nКаждый [entity=rabbasca-warp-uplink] работает как сундук запроса и имеет заранее настроенную логистическую секцию, в которой все предметы из [virtual-signal=rabbasca-warp-inventory] указаны с множителем -1. Эта секция «закрывает» запросы из других логистических секций того же сундука так же, как это делает содержимое обычного сундука запроса. Группа обновляется каждые несколько тиков, и её также можно использовать в других объектах, например в [entity=constant-combinator], чтобы отслеживать содержимое варп-инвентаря.\nВарп-инвентарь большой, но не бесконечный. Количество свободных ячеек показывает [virtual-signal=signal-black].

[tooltip]
rabbasca-warp-pylon-range=Зона действия

[virtual-signal-name]
rabbasca-warp-inventory=Варп-инвентарь
