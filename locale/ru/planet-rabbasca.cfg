energized=__1__ (энергетическая)
no-enemies-mode-ignored=Обнаружен режим без врагов. Защита хранилищ [planet=rabbasca] активна всегда. См. [tip=rabbasca-vaults].
robot-description-with-adds=\nВсегда появляется в сопровождении:
