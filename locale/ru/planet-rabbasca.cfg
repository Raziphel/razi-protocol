[technology-description]
harene-infusions=Крошечные количества [fluid=harene] можно добавлять в еду и топливо, резко повышая их эффективность.
rabbasca-document-forging-one=Возьмите образцы [item=vault-access-key] с [entity=rabbascan-scrap], чтобы научиться создавать их самостоятельно.
rabbasca-unhealthy-fluids=Если бы удалось добраться до лавы под корой [planet=rabbasca], это открыло бы путь к очень продвинутым процессам...
rabbasca-unhealthy-fluids-alt=Мощный взрыв мог бы пробить кору [planet=rabbasca] и открыть доступ к лаве под ней. Возможно, с этим поможет [recipe=rabbasca-core-extraction-protocol]...
rabbascan-vault-access=Добудьте [item=vault-access-key] из [entity=rabbascan-scrap], чтобы взламывать хранилища и извлекать их ресурсы.

