mech-armor-mk3=Меха-броня с сеткой больше и сопротивлениями выше, чем у MK2. Собирается на криогенном заводе в невесомости, на космической платформе.
mech-armor-mk4=Высший тир меха-брони. Собирается на криогенном заводе в невесомости, на космической платформе.

