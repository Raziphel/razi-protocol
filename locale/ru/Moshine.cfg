moshine-briefing=[planet=moshine] — горячая вулканическая планета, богатая [item=sand], открывающим [item=silicon] и [item=glass], а также [item=neodymium] — хорошей основой для [item=magnet]. Здесь настолько жарко, что строить [entity=accumulator] сложно, но повсюду встречаются горячие [entity=steam-geyser]. Рекомендуется привезти хотя бы [entity=foundry], чтобы перерабатывать [fluid=molten-iron] из железных озёр. [fluid=crude-oil] можно получать сжижением угля.
