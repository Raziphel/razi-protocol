[mod-setting-description]
athos-earthquake-stone-deconstruction=Если включено, каждый камень, который землетрясение выбросило на землю, автоматически отмечается для сноса.
athos-earthquakes=Землетрясения время от времени выбрасывают камни на поверхность. Камни могут падать на конвейеры и забивать их. Постройки не повреждаются. Камни, упавшие на землю, автоматически убираются через 30 секунд.
athos-masochism=Камни от землетрясений не убираются автоматически через 30 секунд. Кроме того, все новые чанки создаются покрытыми слоем камня. ВНИМАНИЕ: это крайне утомительно и сильно увеличит размер сохранения.
