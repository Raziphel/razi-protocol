; Russian for visible-planets: keys the mod and the translation packs leave in English or get wrong.

[mod-setting-name]
visible-planets-planetslib-dist=Расстояние фоновых тел от центра
visible-planets-planetslib-init-angle=Начальный угол фоновых тел
visible-planets-planetslib-spacing-mult=Множитель расстояния между фоновыми телами
visible-planets-vanilla-compat=Использовать фоны платформ из игры, если есть

[mod-setting-description]
visible-planets-planetslib-dist=Расстояние от центра родительского тела для фоновых объектов совместимости с PlanetsLib. При малых значениях тела могут отображаться под основной планетой.
visible-planets-planetslib-init-angle=Начальный угол первого фонового объекта в градусах. Почти не влияет при включённом вращении планет, но полезен в других случаях.
visible-planets-planetslib-spacing-mult=По умолчанию тела равномерно распределены вокруг родительского тела. Значения меньше 1 сближают их, а значения больше 1 делают интервалы неравномерными.
visible-planets-planetslib-x=Положение первого фонового объекта по X. Для планет с несколькими лунами остальные объекты размещаются относительно этой позиции.
visible-planets-planetslib-y=Положение первого фонового объекта по Y. Для планет с несколькими лунами остальные объекты размещаются относительно этой позиции.
visible-planets-vanilla-compat=По умолчанию VP заменяет новые ванильные фоны планет. С этой настройкой VP пропускает ЛЮБУЮ планету, у которой уже есть красивый фон. (Модовые планеты без ванильного фона используют VP как обычно.)
