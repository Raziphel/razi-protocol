; Russian for liquid_recycler: keys the mod and the translation packs leave in English or get wrong.

[tips-and-tricks-item-name]
asteroid-squeezing=[item=carbonic-asteroid-chunk] Выжимание астероидов
fluid-recycler=[entity=fluid-recycler] Пневматический пресс

[tips-and-tricks-item-description]
asteroid-squeezing=[entity=fluid-recycler] позволяет сжижать обломки астероидов и лёд под высоким давлением. Процесс быстрый, но расточительный.\n[item=metallic-asteroid-chunk] даёт [fluid=molten-iron].\n[item=carbonic-asteroid-chunk] даёт [fluid=crude-oil].\n[item=oxide-asteroid-chunk] и [item=ice] дают [fluid=water].
fluid-recycler=[entity=fluid-recycler] позволяет выжимать жидкие ингредиенты из различных продуктов: [fluid=water] из [item=raw-fish], [item=explosives] и [item=pentapod-egg], а также [fluid=sulfuric-acid] из [item=battery] и [item=processing-unit].

