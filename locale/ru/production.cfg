[technology-description]
razi-bio-rare-metal-casting=Свяжите литейные редких металлов Вулкануса с биологическими катализаторами Глебы. Необязательное литьё с большим выходом, не ослабляющее ни одну из исходных цепочек.
razi-electrobiological-components=Вложитесь в дальнюю логистику Глеба — Фульгора, чтобы увеличить выпуск электронных компонентов K2SO на электромагнитных машинах Фульгоры.
razi-gleba-tenebris-biopolymer=Поставки биофлюса Глебы объединяются с грибной и хитиновой промышленностью Тенебриса и улучшают выпуск пластика, когда доступны оба мира.
razi-modded-moshine-zinc-silicon=Электрохимические металлы Парацельсина в обмен на более эффективную обработку кремния на Мошайне. Нужны родные технологии кремниевой ячейки и цинкового припоя.
razi-modded-vesta-rare-earth-supermagnets=Переработка минералов Линокса и оптика Мошайна встраиваются в супермагниты Весты, а её атмосферная особенность сохраняется.
razi-network-precision-matrix=Переносной промышленный управляющий модуль из редких металлов Вулкануса, оптоволокна Мошайна, цинка Парацельсина и гольмия Фульгоры. Родное производство остаётся доступным, а улучшенные альтернативы не нужны для технологических карт систем.
razi-network-extreme-lattice=Поздний композит из прецизионных матриц, краптонита Рубии, хитозана Тенебриса, редкоземельных Линокса и стабильного углеволокна Глебы. Родное производство остаётся доступным, а улучшенные альтернативы не нужны для технологических карт систем.
razi-network-matrix-cryo-controllers=Привозная прецизионная матрица увеличивает выход четырёх родных партий блоков управления энергией K2SO на Аквило без наложения продуктивности. Родное производство остаётся доступным, а улучшенные альтернативы не нужны для технологических карт систем.
razi-network-lattice-vesta-magnets=Четыре родные партии супермагнитов Весты выигрывают от особой решётки, собранной из материалов Рубии, Тенебриса, Линокса и более ранней инженерии. Родное производство остаётся доступным, а улучшенные альтернативы не нужны для технологических карт систем.
razi-network-panglia-optic-bond=Переносные оптические связки из стекла Панглии, кабелей Мошайна и гольмия Фульгоры. Обратная грузовая линия даёт Панглии прочное место в далёких заводах.
razi-network-umbra-pressure-frame=Оптические связки Панглии, гольмий Фульгоры, супермагниты Весты и редкоземельные Линокса вместе дают поздний промышленный каркас. Открытие Крусибла и исходное производство по-прежнему обязательны, но карты науки как детали не расходуются.
razi-network-bond-paracelsin-coils=Оптические связки Панглии идут на Парацельсин: бережная альтернатива родному электрохимическому производству катушек с выигрышем на партии. Исходный рецепт катушек не заменяется.
razi-network-bond-linox-refining=Оптические связки Панглии улучшают партии редкоземельных Линокса, сохраняя его родную химию и исследования.
razi-network-frame-vesta-foundations=Каркасы давления из глубокого фронтира везут на Весту для усиленных фундаментов. Нужен родной процесс Весты; исходные ингредиенты сохраняются. Только в режиме «Глубокая».
razi-frontier-castra-composite-rounds=Необязательное производство боеприпасов на Кастре: родные бронебойные магазины и проверенные поставщики с Глебы и Мошайна. Исходные исследования и родные рецепты боеприпасов остаются.

[razi-industry-profile]
catalytic=[color=#D1B17A]КАТАЛИТИЧЕСКИЙ ПРОЦЕСС[/color]  Привозные реагенты заменяют часть конкретного родного ингредиента. Родной процесс и исследования по-прежнему нужны; экономия действует только в этом необязательном рецепте. Точная экономия округляется вниз для каждого крафта.
accelerated=[color=#84C8C0]УСКОРЕННОЕ ПРОИЗВОДСТВО[/color]  Привозное прецизионное оборудование ускоряет производство, но не больше чем на 17% к тем же родным партиям в секунду. Продуктивность и переработка не складываются с бонусом.
bulk=[color=#D1B17A]МАССОВОЕ ПРОИЗВОДСТВО[/color]  Вывозимые товары поддерживают более крупную партию с ограниченной прибавкой выхода. Родной процесс и условия мира остаются в силе.
