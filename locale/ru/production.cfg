[recipe-description]
razi-bio-rare-metal-casting=Биофлюс Глебы работает катализатором в литейных Вулкануса: пять пластин редких металлов из четырёх родных партий при чуть меньшем расходе расплава. Выход грязной воды сохраняется; родной рецепт не тронут.
razi-electrobiological-components=Гольмий Фульгоры вместе с привозным биофлюсом Глебы, родными кремнием, стеклом и пластиком. Нужна электромагнитная среда Фульгоры. Без продуктивности и автоматической переработки.
razi-gleba-tenebris-biopolymer=Биофлюс Глебы смешивается с хитином Тенебриса: десять пластиковых брусков из двух родных партий биополимера. Исходные ограничения давления Тенебриса и его хитиновая экономика остаются обязательными.
razi-modded-moshine-zinc-silicon=Цинковый припой Парацельсина улучшает контакты при сборке кремниевых ячеек Мошайна и экономит часть сырого кремния. Родная цепочка кремния и исследование ячеек по-прежнему нужны.
razi-modded-vesta-rare-earth-supermagnets=Оптоволокно Мошайна и редкоземельный порошок Линокса упрочняют супермагниты Весты: пять из четырёх родных партий, со всеми исходными требованиями к электролиту и местной атмосфере.
razi-network-precision-matrix=Переносной промышленный управляющий модуль из редких металлов Вулкануса, оптоволокна Мошайна, цинка Парацельсина и гольмия Фульгоры.
razi-network-extreme-lattice=Поздний композит из прецизионных матриц, краптонита Рубии, хитозана Тенебриса, редкоземельных Линокса и стабильного углеволокна Глебы.
razi-network-matrix-cryo-controllers=Привозная прецизионная матрица увеличивает выход четырёх родных партий блоков управления энергией K2SO на Аквило без наложения продуктивности.
razi-network-lattice-vesta-magnets=Четыре родные партии супермагнитов Весты выигрывают от особой решётки, собранной из материалов Рубии, Тенебриса, Линокса и более ранней инженерии.
razi-network-panglia-optic-bond=Переносные оптические связки из стекла Панглии, кабелей Мошайна и гольмия Фульгоры. Обратная грузовая линия даёт Панглии прочное место в далёких заводах.
razi-network-umbra-pressure-frame=Оптические связки Панглии, гольмий Фульгоры, супермагниты Весты и редкоземельные Линокса вместе дают поздний промышленный каркас. Открытие Крусибла и исходное производство по-прежнему обязательны, но карты науки как детали не расходуются.
razi-network-bond-paracelsin-coils=Оптические связки Панглии идут на Парацельсин: бережная альтернатива родному электрохимическому производству катушек с выигрышем на партии. Исходный рецепт катушек не заменяется.
razi-network-bond-linox-refining=Оптические связки Панглии улучшают партии редкоземельных Линокса, сохраняя его родную химию и исследования.
razi-network-frame-vesta-foundations=Каркасы давления из глубокого фронтира везут на Весту для усиленных фундаментов. Нужен родной процесс Весты; исходные ингредиенты сохраняются. Только в режиме «Глубокая».
razi-frontier-castra-composite-rounds=Необязательная партия боеприпасов на Кастре: углеволокно Глебы и кремниевые ячейки Мошайна. Родные рецепты бронебойных патронов и военные открытия не меняются.

