razi-network-precision-matrix=Используется в: экстремальная решётка, блоки управления энергией с прецизионной управляющей матрицей, сетевая переработка кусков ракеты.
razi-network-extreme-lattice=Используется в: супермагниты с экстремальной решёткой.
razi-network-panglia-optic-bond=Используется в: каркас давления Умбры, электрические катушки с оптической связкой Панглии, переработка редкоземельных металлов с оптической связкой Панглии.
razi-network-umbra-pressure-frame=Используется в: фундаменты Весты с каркасом давления Умбры. Только в режиме «Глубокая».

