razi-network-extreme-lattice=Используется в: композитные супермагниты Весты.
razi-network-panglia-optic-bond=Используется в: каркас давления Умбры, катушки Парацельсина на панглитовой связке, переработка Линокса с панглитовой калибровкой.
razi-network-umbra-pressure-frame=Используется в: фундаменты Весты с каркасом давления. Только в режиме «Глубокая».

