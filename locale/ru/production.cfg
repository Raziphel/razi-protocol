[technology-description]
razi-bio-rare-metal-casting=Открывает литьё редких металлов с биофлюсом Глебы: больше выхода за крафт.
razi-electrobiological-components=Открывает электронные компоненты с биофлюсом Глебы и гольмием Фульгоры: больше выхода за крафт.
razi-gleba-tenebris-biopolymer=Открывает пластик с биофлюсом Глебы на Тенебрисе.
razi-modded-moshine-zinc-silicon=Открывает кремниевые ячейки с цинковым припоем: больше выхода за крафт. Нужны исследования ячеек и цинкового припоя.
razi-modded-vesta-rare-earth-supermagnets=Открывает супермагниты с редкоземельным порошком и оптоволокном: больше выхода за крафт.
razi-network-matrix-cryo-controllers=Открывает блоки управления с прецизионной управляющей матрицей: больше выхода за крафт.
razi-network-lattice-vesta-magnets=Открывает супермагниты с экстремальной решёткой: больше выхода за крафт.
razi-network-bond-paracelsin-coils=Открывает электрические катушки с оптической связкой Панглии: больше выхода за крафт.
razi-network-bond-linox-refining=Открывает переработку редкоземельных металлов с оптической связкой Панглии: больше выхода за крафт.
razi-network-frame-vesta-foundations=Открывает фундаменты Весты с каркасом давления Умбры: больше выхода за крафт. Только в режиме «Глубокая».
razi-frontier-castra-composite-rounds=Открывает бронебойные магазины с углеволокном Глебы и кремниевыми ячейками Мошайна.

[razi-industry-profile]
catalytic=Расходует до 12% меньше одного обычного ингредиента, с округлением вниз за крафт. Нужны исследования обычного рецепта.
accelerated=Выход в секунду до 17% выше обычного рецепта. Без продуктивности и переработки.
bulk=Партия больше, выход больше. Требования к планете те же, что у обычного рецепта.
