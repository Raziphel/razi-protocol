[recipe-description]
razi-bio-rare-metal-casting=Даёт 5 редких металлов из ингредиентов 4 крафтов плюс биофлюс Глебы. Расходуется меньше расплава редких металлов.
razi-electrobiological-components=Гольмий Фульгоры вместе с привозным биофлюсом Глебы, родными кремнием, стеклом и пластиком. Нужна электромагнитная среда Фульгоры. Без продуктивности и автоматической переработки.
razi-gleba-tenebris-biopolymer=Даёт 10 пластиковых брусков из ингредиентов 2 крафтов плюс биофлюс Глебы. Делается на Тенебрисе.
razi-modded-moshine-zinc-silicon=Даёт 5 кремниевых ячеек из ингредиентов 4 крафтов плюс цинковый припой Парацельсина. Расходуется меньше кремния.
razi-modded-vesta-rare-earth-supermagnets=Оптоволокно Мошайна и редкоземельный порошок Линокса упрочняют супермагниты Весты: пять из четырёх родных партий, со всеми исходными требованиями к электролиту и местной атмосфере.
razi-network-matrix-cryo-controllers=Привозная прецизионная матрица увеличивает выход четырёх родных партий блоков управления энергией K2SO на Аквило без наложения продуктивности.
razi-network-lattice-vesta-magnets=Даёт 5 супермагнитов из ингредиентов 4 крафтов плюс экстремальная решётка.
razi-network-bond-paracelsin-coils=Даёт 5 электрических катушек из ингредиентов 4 крафтов плюс оптическая связка Панглии.
razi-network-bond-linox-refining=Переработка редкоземельных металлов с добавкой оптической связки Панглии: больше выхода за крафт.
razi-network-frame-vesta-foundations=Фундаменты Весты с добавкой каркаса давления Умбры: больше выхода за крафт. Только в режиме «Глубокая».
razi-frontier-castra-composite-rounds=Даёт 5 бронебойных магазинов из ингредиентов 4 крафтов плюс углеволокно Глебы и кремниевые ячейки Мошайна.

