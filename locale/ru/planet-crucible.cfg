[space-location-description]
crucible=Большой плотный каменистый мир с сокрушительной гравитацией и атмосферным давлением. Из-за сильного притяжения для строительства ракеты на [space-location=crucible] потребуется освоить ресурсы планеты. Возможностей предостаточно... если вы выдержите давление.
crucible-orbit=Безопасная орбита над [space-location=crucible]. [img=utility/warning_icon]ВНИМАНИЕ[img=utility/warning_icon] Из-за сильного притяжения [space-location=crucible] возвращение с планеты на [space-location=crucible-orbit] будет затруднено и может оказаться невозможным без использования ресурсов [space-location=crucible].

