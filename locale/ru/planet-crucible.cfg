[technology-description]
planet-crucible-gem-synthesis=Более эффективные рецепты [item=planet-crucible-ruby] и [item=planet-crucible-diamond].
planet-crucible-hydrogen-metallization=Создание металлического водорода — святого Грааля науки высокого давления.
planet-crucible-hydrogen-processing=Водород под высоким давлением обладает множеством полезных свойств, но требует осторожного обращения.
planet-crucible-kiln=Большая печь с прямым тепловым питанием. Помимо обычной плавки принимает жидкости, что необходимо для переработки [item=planet-crucible-skarn].
planet-crucible-laser=Более совершенное лазерное оружие, которому нужна линза для фокусировки повышенной энергии.
planet-crucible-lens-one=Фокусирующая линза для [entity=planet-crucible-laser-turret], наносящая ударный урон.
planet-crucible-military=Использование металлического водорода позволяет экономить боеприпасы в космосе.
planet-crucible-offshore-pump=Улучшенный [entity=offshore-pump], способный работать при экстремальной гравитации [space-location=crucible].
planet-crucible-optics=Продвинутые инструменты для фокусировки и управления светом.
planet-crucible-pressure-forge=Производственное сооружение для процессов высокого давления.
planet-discovery-crucible=Большой плотный каменистый мир с сокрушительной гравитацией и атмосферным давлением. Из-за сильного притяжения для строительства ракеты на [space-location=crucible] потребуется освоить ресурсы планеты. Возможностей предостаточно... если вы выдержите давление.

[tips-and-tricks-item-description]
planet-crucible-briefing=[planet=crucible] — плотная планета без [entity=iron-ore], [entity=copper-ore], [entity=uranium-ore], [entity=stone], [fluid=water] и [entity=crude-oil], однако все необходимые предметы можно производить из [entity=planet-crucible-skarn] и [entity=planet-crucible-emulsion].\n[entity=solar-panel] здесь эффективнее. Окружающая среда негостеприимна, но природных угроз нет.\n[tile=planet-crucible-lava] нельзя откачивать до более позднего этапа, а засыпать её можно ещё позже, однако над ней можно прокладывать эстакады.
planet-crucible-gravity=[img=utility/warning_icon]ВНИМАНИЕ[img=utility/warning_icon] Из-за экстремальной гравитации и атмосферного давления [planet=crucible] обычного [item=rocket-fuel] недостаточно для выхода в космос.\nПосле посадки на [planet=crucible] потребуется использовать [item=planet-crucible-science-pack], чтобы исследовать способ покинуть планету.
planet-crucible-metallic-hydrogen=Из-за высокой плотности энергии и низкой стабильности [tooltip=металлический водород,tips-and-tricks-item-description.planet-crucible-metallic-hydrogen-enum] крайне опасен, поэтому при его производстве необходимы меры предосторожности.\nВсе формы [tooltip=металлического водорода,tips-and-tricks-item-description.planet-crucible-metallic-hydrogen-enum] взрываются при уничтожении и не подлежат переработке, но их можно безопасно обработать в [entity=planet-crucible-pressure-forge] или утилизировать в космической пустоте.\n[tooltip=Наименее стабильные формы,tips-and-tricks-item-description.planet-crucible-metallic-hydrogen-unstable-enum] металлического водорода со временем взрываются сами, если их не обработать или не утилизировать, поэтому их нельзя складировать.
planet-crucible-metallic-hydrogen-enum=Металлический водород:\n[item=planet-crucible-denatured-hydrogen] Денатурированный водород\n[item=planet-crucible-denatured-hydrogen-critical] Денатурированный водород (критический)\n[item=planet-crucible-hydrogen-plate] Водородная пластина (стабильная)\n[item=planet-crucible-hydrogen-plate-activated] Водородная пластина (активированная)\n[item=planet-crucible-hydrogen-plate-unstable] Водородная пластина (нестабильная)\n[item=planet-crucible-hydrogen-plate-critical] Водородная пластина (критическая)\n[item=planet-crucible-lithium-hydride] Гидрид лития\n[item=planet-crucible-hydrogen-cable] Водородная нить
planet-crucible-metallic-hydrogen-unstable-enum=Наименее стабильный металлический водород:\n[item=planet-crucible-denatured-hydrogen] Денатурированный водород\n[item=planet-crucible-denatured-hydrogen-critical] Денатурированный водород (критический)\n[item=planet-crucible-hydrogen-plate-activated] Водородная пластина (активированная)\n[item=planet-crucible-hydrogen-plate-unstable] Водородная пластина (нестабильная)\n[item=planet-crucible-hydrogen-plate-critical] Водородная пластина (критическая)
planet-crucible-space-platform=[img=utility/warning_icon]ВНИМАНИЕ[img=utility/warning_icon] Из-за экстремальной гравитации [planet=crucible] космическим платформам нужна значительная тяга, чтобы достичь [space-location=crucible-orbit]. Пытаться совершить перелёт следует только платформе, способной долго поддерживать скорость значительно выше __1__ км/с.\nРядом с [planet=crucible] мало астероидов, поэтому для получения необходимых ресурсов в космосе может потребоваться исследование с помощью [item=planet-crucible-science-pack].
