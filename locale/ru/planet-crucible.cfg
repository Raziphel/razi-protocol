[string-mod-setting-description]
planet-crucible-vanilla-change-amount-all=Добавляет продукты производственных цепочек Крусибла в большинство рецептов, открываемых на Аквило. Это рекомендуемый вариант, особенно если Крусибл добавлен как единственная новая планета; он может хуже подходить для прохождений с большим числом дополнительных планет.
planet-crucible-vanilla-change-amount-no-recipes=Добавляет исследовательский пакет высокого давления в большинство технологий, требующих все остальные исследовательские пакеты внутренних планет.

