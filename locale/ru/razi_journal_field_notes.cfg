[journal-weather]
panglia=Мод погоды добавляет в этот мир облака, искры и пыль. Эффект только визуальный.
muria=Мод погоды добавляет споры, пыль, туман и облака. Он может заменить родной для планеты дождь, если отдельно не включить настройку дождя.
vesta=Мод погоды добавляет густой туман и слоистые облака, ограничивающие видимость. Требования к переработке газов не меняются.
rubia=Мод погоды добавляет облака и пыль. Производство и порча продуктов по-прежнему задаются модом планеты.
paracelsin=Зимний и тёмный режим по умолчанию выключен. При включении режим вечной тьмы меняет отображение дня и ночи.
cubium=Мод погоды добавляет облака и электрические искры. Рецепты переработки газов не меняются.
rabbasca=Мод погоды добавляет искры, туман и пыль. Хранилища и пределы энергии не меняются.
igrys=Настройте эффекты атмосферы в параметрах мода погоды. Они не меняют правила добычи.
khemia=Мод погоды добавляет дымку. Его настройки влияют только на изображение, но не на доступность исследований.
carna=Мод погоды добавляет визуальный слой. Родные опасности планеты не меняются.
pelagos=Мод погоды добавляет морскую погоду. Требования к производству не меняются.

