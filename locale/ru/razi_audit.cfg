[razi-audit]
help=Проверяет подготовку к Конвергенции: лаборатории, рецепты поставок, требования науки и недостающие материалы. Только для администраторов. Ничего не изменяет.
victory-help=Показывает, какие моды отключили победу и какие лишние игровые завершения были отменены. Только для администраторов. Ничего не изменяет.
admin-only=[Аудит RAZI] Только для администраторов.
summary=[Аудит RAZI] Груз Конвергенции: __1__/__2__. Блокирующие факторы: __3__.
blocker=[Аудит RAZI] Блокирующий фактор: __1__
note=[Аудит RAZI] Примечание: __1__
read-only=[Аудит RAZI] Только чтение: рецепты и сохранения не изменяются.
no-registry=Нет данных о силе или реестре прототипов.
missing-research=Не хватает исследования Конвергенции: __1__
missing-cargo=Не хватает основного груза: __1__
no-recipe=__1__: рецепт с таким именем не найден; проверьте другие способы производства.
recipe-locked=__1__: рецепт ещё не открыт исследованием.
victory-header=[Аудит RAZI] Победу в кампании устанавливает только Конвергенция.
victory-interface=[Аудит RAZI] __1__: __2__
victory-error=[Аудит RAZI] __1__: __2__ (__3__)
victory-recovered=Отменены лишние игровые завершения: __1__
victory-unmanaged=Не контролируется: другой мод отключил победу, но RAZI не вызывает его интерфейс, так как не может проверить API.
victory-note=Нельзя остановить мод, который напрямую вызывает game.set_game_state.
state-absent=не установлено
state-unsupported=отключение не поддерживается
state-unverified=отключение задано, состояние нельзя прочитать
state-error=ошибка чтения
state-disabled=победа отключена
state-enabled=победа включена
state-unmanaged=не контролируется
