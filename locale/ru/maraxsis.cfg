[technology-description]
legendary-quality=Позволяет производить предметы легендарного качества. Исследуется либо [item=hydraulic-science-pack], либо [item=cryogenic-science-pack].
maraxsis-geothermal-energy=Закачка воды глубоко в кору планеты даёт [fluid=maraxsis-supercritical-steam]. Этот пар вращает мощные регенеративные турбины.
maraxsis-glass-productivity=Увеличивает выход в рецептах обработки стекла.
maraxsis-omega_3=Сохраняйте портящиеся исследовательские пакеты, добавляя достаточно жирных кислот омега-3.
maraxsis-promethium-quality=Повышенное качество от прометиевых исследовательских пакетов.
lubricant-maraxsis-start=Забой и разжижение рыбы Мараксиса в смазку. Нужна для уменьшения трения в высокоскоростных механизмах, например в [entity=foundry].
maraxsis-casting=Позволяет отливать металлы из лавы. [fluid=lava] можно найти во впадине [planet=maraxsis-trench], погрузившись на подводной лодке. Чтобы погрузиться, нажмите __CONTROL__maraxsis-trench-submerge__ над [tile=maraxsis-trench-entrance].

