maraxsis-2-1-message=[color=orange]Maraxsis:[/color] загружено сохранение из старой версии Maraxsis. Обновление для Factorio 2.1 меняет многие рецепты, технологии и машины, поэтому старые сохранения может понадобиться почистить, а некоторые постройки могут сломаться.\nСделайте резервную копию: сохраните карту под новым именем, затем потратьте несколько минут, чтобы проверить завод на [planet=maraxsis] на ошибки.\nЕсли хотите играть в 2.1 как в 2.0, используйте вместо этого мод [color=orange]Maraxsis Classic[/color] от Kryzeth.

