[mod-setting-description]
foliax-infuser-level=Максимальный уровень качества, до которого инфузор повышает предметы. Уменьшите, если достигнут предел числа рецептов. По умолчанию 5 (легендарное), диапазон 2–20.
foliax-infuser-multiplier=Множитель времени изготовления для каждой ступени качества. По умолчанию 1,5, диапазон 1–20. Пример (время 10, множитель 1,5): обычное > необычное 10 с, необычное > редкое 15 с, редкое > эпическое 22,5 с, эпическое > легендарное 33,75 с.
foliax-infuser-speed=Время изготовления рецептов повышения качества в арканном инфузоре. По умолчанию 10 секунд.
