[technology-description]
foliax-basic-scrap-processing=Перерабатывайте дары природы и получайте дар Фолиакса! После изучения качества повышает качество сырья и промежуточных продуктов.
foliax-advanced-scrap-processing=Перерабатывайте дары природы и получайте дар Фолиакса! После изучения качества повышает качество сырья и промежуточных продуктов.
foliax-final-scrap-processing=Перерабатывайте дары природы и получайте дар Фолиакса! После изучения качества повышает качество сырья и промежуточных продуктов.
foliax-battery=Эта особая аккумуляторная ячейка может собирать арканную энергию и при определённых условиях давать электричество.
foliax-propellant=Используйте пропеллент, чтобы разрушать скалы, создавать оружие или отправлять ракеты в космос!
foliax-tech-pyrite=Получите семена из [recipe=seed-gambling], [recipe=seed-gambling-2] или [entity=foliax-willow].
foliax-welcome=Ищите семена и [item=foliax-scrap], сажайте деревья и перерабатывайте урожай в [entity=foliax-hybrid-processor].

