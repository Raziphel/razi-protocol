[recipe-name]
razi-kr-sand-crushing=Песок (дробление)

[recipe-description]
razi-kr-sand-crushing=Менее производительный запасной способ получения песка дроблением на случай, если водный процесс открывается раньше, чем становятся доступны машины для работы с жидкостями.

[space-location-name]
calidus-bellicos-stargate-calidus=Врата фронтира Эгиды

[space-location-description]
calidus-bellicos-stargate-calidus=Общие врата из Соляриса и Никсариса. Путь идёт к внешнему краю Эгиды, через пояс обломков к внутреннему краю, затем к ближней орбите Белликоса или точке Стража.

[technology-name]
razi-bz-diamond-processing=Синтетический алмаз
razi-omni-synthesis=Синтез OMNI
razi-omni-science=Научные пакеты OMNI

[technology-description]
razi-bz-diamond-processing=Выращивание алмазов из графита в электропечи.
razi-omni-synthesis=Рецепты лавы, фтора, литиевого раствора, сырой нефти, гольмиевого раствора, аммиачного раствора, угля, твёрдого топлива, гольмиевых плит, углеволокна и биофлюса из жидкостей OMNI, а также дробление кусков прометиевых астероидов. Работают только на OMNI.
razi-omni-science=Рецепты научных пакетов из жидкостей OMNI, а также клонирование яиц и рыбы. Работают только на OMNI.

[smart-inserters]
welcome=[Smart Inserters] Откройте манипулятор, чтобы сдвинуть точки захвата и выгрузки в пределах его дальности. Клавиши Smart Inserters по умолчанию не назначены, их задают в «Настройки → Управление».
