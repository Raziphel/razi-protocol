[space-location-description]
calidus-bellicos-stargate-calidus=Общие врата Эгиды из Соляриса и Никсариса. Отсюда путь идёт через внешний и внутренний края опасного астероидного поля к орбите Белликоса или точке Стража. Старые дальние врата удалены.
