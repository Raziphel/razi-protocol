razi-kr-sand-crushing=Песок (дробление)

[recipe-description]
razi-kr-sand-crushing=Менее производительный запасной способ получения песка дроблением на случай, если водный процесс открывается раньше, чем становятся доступны машины для работы с жидкостями.

[space-location-name]
calidus-bellicos-stargate-calidus=Врата фронтира Эгиды

[space-location-description]
calidus-bellicos-stargate-calidus=Общие врата из Соляриса и Никсариса. Путь идёт к внешнему краю Эгиды, через пояс обломков к внутреннему краю, затем к ближней орбите Белликоса или точке Стража.
