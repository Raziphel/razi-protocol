[entity-description]
ship-loading-pump=Помпа с длинным выходным рукавом для заправки танкеров. Длинная сторона подключается только к кораблям, короткая — только к трубам и поездам. Ставится на воду.
ship-unloading-pump=Помпа с длинным входным рукавом для слива танкеров. Длинная сторона подключается только к кораблям, короткая — только к трубам и поездам. Ставится на воду.

[entity-name]
ship-loading-pump=Помпа заправки кораблей
ship-unloading-pump=Помпа слива кораблей

[tips-and-tricks-item-description]
cargo-ships-tip-1=Водные пути выдаются кнопкой водного пути на панели быстрого доступа или клавишей __CONTROL__give-waterway__.
cargo-ships-tip-2=К [entity=oil_tanker] можно подключить до шести [entity=ship-loading-pump] или [entity=ship-unloading-pump] для заправки и слива жидкостей.
cargo-ships-tip-3=[item=boat] можно поставить на водный путь или отдельно, чтобы водить, как машину.

