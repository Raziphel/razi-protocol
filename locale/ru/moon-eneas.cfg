page_eneas_text_1=Энеас
page_eneas_text_2=Так называется мобильная космическая станция, созданная народом [planet=fulgora] Фульгоры. Энеас — не только дом [entity=unit-05] юнита-05, искусственного интеллекта, поставленного управлять станцией: здесь также есть самые передовые инструменты <засекречено>, орбитальная и межпланетная система вооружения и встроенная кузница. Из-за небрежения большинство этих возможностей сейчас недоступно или ограничено. Поверхность Энеаса использовалась для- \n\n [color=yellow][entity=unit-05]: -была совершенно непримечательной и скучной. И какое ещё вооружение? Нет у меня никакого вооружения.[/color]\n\n [color=red][entity=unit-05-dummy]: ПРОВЕРКА СОСТОЯНИЯ - - - МАРС = В СЕТИ - - - НЕРИО = ВОССТАНОВЛЕНИЕ. [/color]
page_eneas_text_3=Происхождение
page_eneas_text_4=Энеас был построен на орбите [planet=fulgora] Фульгоры и способен к досветовым межпланетным перелётам. Обычно он находится на орбите планеты, которую в данный момент <засекречено>.
page_unit_text_2=Чрезвычайно продвинутая искусственная личность, стирающая грань между машиной и живым существом. [entity=unit-05] Юнит-05 встроен в ядро [planet=eneas] Энеаса: вся космическая станция спроектирована как его вместилище. Благодаря антиматериевому двигателю размером с луну юнит-05 обладает почти безграничным запасом энергии, но из-за сильного износа оборудования применить его может лишь отчасти. \n\n [color=yellow][entity=unit-05]: Ого, у Информатрона, который я вам дал, серьёзный уровень допуска. Может, оставим что-то для воображения?[/color]
page_unit_text_3=\nИстория
page_unit_text_4=Задуманные и построенные на [planet=Fulgora] планете Фульгора, юнит-05 и его созда- [color=red][entity=unit-05-dummy]: ХВАТИТ.[/color]\n\n [color=yellow][entity=unit-05]: Можно немного личного пространства? Ну правда, я же не роюсь постоянно в вашем досье. Кстати о вашем досье, куда я его дел? Оно ведь только что было здесь..[/color]
page_pollution_text_2=Каждый цикл (15 минут) из обширных недр Энеаса на поверхность [entity=eneas-vent] выбрасывается переменное количество загрязнения. Давным-давно Энеас справлялся с этим сам, но те времена прошли. Убирать загрязнение на Энеасе можно с помощью некоторых новых зданий — например, [entity=clarifier] Осветлителя.\n\n Проверка уровня загрязнения происходит до того, как в следующем цикле добавится новое. Если загрязнение слишком велико, [entity=unit-05] юнит-05 будет отключён до конца цикла. Снижение загрязнения снова позволит юниту-05 работать.\n\n Загрязнение проверяется в чанках вокруг этих сущностей: \n\n[entity=unit-05] Юнит-05 \n\n[entity=eneas-vent] Жёрла загрязнения \n\n[entity=artifact-extractor] Буровая для артефактов
page_pollution_text_4=Сами жёрла — лишь выход для загрязнения. Если вам каким-то образом удастся их разрушить ([color=yellow][entity=unit-05] если получится — обязательно расскажите мне, как! [/color]), загрязнение просто начнёт распространяться из случайных точек карты.
page_generator_text_2=Хотя здание выглядит древним, похоже, [entity=unit-05] собрал его совсем недавно. Оно стабильно вырабатывает электроэнергию для ваших более примитивных построек.
page_generator_text_3=\nЭнергия на Энеасе
page_generator_text_4=[color=yellow][entity=unit-05]: Розетки на Энеасе просто так не валяются. Энергоснабжение мы решили давным-давно: всё, что работает на исконных фульгорских технологиях, питается от собственных ядер. Так что вот вам небольшая любезность для начала.[/color]
page_lift_text_2=[entity=eneas-lift] Подъёмник — один из последних уцелевших входов в производственные цеха в недрах Энеаса. С его помощью [entity=unit-05] юнит-05 может каждый цикл (15 минут) снабжать вас ресурсами на Энеасе. По умолчанию он производит артефакты и отсыпку территории.
page_unit_07_text_2=7-й агент, созданный на службе у <засекречено> и <ЗАСЕКРЕЧЕНО>. Скромнее своих предшественников, номера 5 и номера 6, зато способен преодолевать даже самую сложную местность и вести разведку на планете.
page_unit_07_text_3=\nПаукотрон
page_unit_07_text_4=\n[color=yellow][entity=unit-05]:Конструкция <паукотрона> в вашей библиотеке явно основана на номере 07. Но откуда она у вас? Не помню, чтобы я делился с вами этим чертежом.[/color]
page_artifact_text_2=Останки древних технологий. Даже в изношенном состоянии [item=eneas-artifact] артефакты всё ещё содержат передовые технологические детали, которые можно использовать для улучшения ваших инструментов и зданий. Их можно добыть из [entity=debris-a] обломков или напрямую из хранилищ артефактов с помощью [entity=artifact-extractor] буровой для артефактов.
page_artifact_text_3=\nУлучшение артефактов
page_artifact_text_4=Чтобы в полной мере использовать силу [item=eneas-artifact] артефактов, их сначала нужно восстановить. Для этого их качество повышают с помощью всё более сложных ингредиентов. Наборы инструментов в этом процессе незаменимы: обычные механизмы ваших сборочных автоматов не приспособлены к тому, чтобы самостоятельно обращаться с этими хрупкими реликвиями.
page_artifact_text_5=Применение артефактов
page_artifact_text_6=[item=eneas-artifact] Артефакты можно использовать по-разному. Объедините артефакт с производственной машиной, чтобы повысить её качество. Простые машины улучшать легче — их поднимет даже артефакт обычного качества.\n\n Для более сложных зданий качество артефакта должно совпадать с целевым качеством.
page_data_text_2=Аккуратно извлекая самые хрупкие части [item=eneas-artifact] древних артефактов, можно добыть их [item=ancient-core] ядра.\n\n[color=yellow][entity=unit-05]: Большинство моих конструкций умеют питать себя сами, им просто нужны инструкции от источника. Раньше каждая часть Энеаса была подключена ко мне, и это не казалось недостатком, но теперь мои корни едва выходят за пределы главного узла.[/color]\n\n
page_data_text_3=\nДанные
page_data_text_4=[color=yellow][entity=unit-05]: В ядрах хранится куда более простая версия кода, на котором работаю я. Какое-то время они могут питать здания, зависящие от данных, но это не идеальное решение, тем более что ядра сильно изношены. Если переписать их содержимое на исправные носители данных, они прослужат дольше. [/color]\n\n
page_radar_text_2=Продвинутый радар может автоматизировать снос сущностей. На [planet=nauvis] планете Наувис радар позволяет [entity=unit-05] юниту-05 направлять падения [entity=debris-a] обломков поближе к нему, чтобы их было проще собирать. Дополнительные радары увеличивают количество обломков, которые [entity=unit-05] юнит-05 может вам отправить, но с убывающей отдачей. Чтобы [entity=debris-a] обломкам хватало места, радары нужно ставить не ближе 64 клеток друг от друга.
page_radar_text_3=Как пользоваться
page_radar_text_4=Задайте, какие сущности радар должен сносить. На иллюстрации выбраны все виды обломков, но радар может сносить и обычные здания.\n\n[item=servofish] Этот сигнал велит дронам вылавливать серворибы прямо из воды.\n\n[virtual-signal=signal-mining] Этот сигнал велит радару собирать все предметы на земле.\n\n По умолчанию радиус радара — 64. Его можно увеличить до 256 клеток, подав радару сигнал [virtual-signal=signal-R] R с нужным числом. В примере радиус равен 256.\n\n ([color=red][entity=unit-05-dummy] Из-за ограничений моего кода радары используют общие входные сигналы, поэтому цели сноса задаются сразу для всей поверхности. Сигнал достаточно подать на один радар. [/color])
page_fish_text_1=Серворибы
page_fish_text_2=В стоячих водоёмах Энеаса обитают серворибы — устройства древнего происхождения, когда-то поддерживавшие хрупкое равновесие искусственной экосистемы станции. Без должного надзора и обслуживания серворибы постепенно перестали справляться и начали приходить в негодность. \n\n[color=yellow][entity=unit-05]: По-моему, это слишком драматично. Немного любви и заботы — и эти ребята быстро снова возьмутся за работу. [/color]
page_fish_text_3=\n\nКачество воды
page_fish_text_4=[color=yellow][entity=unit-05]: Эти малыши следят за чистотой моей системы охлаждения. Знаю, вам они тоже пригодятся, но, пожалуйста, оставляйте хотя бы несколько в прудах рядом со мной. Чертежи у меня в кузнице, так что со временем я сделаю новых.[/color]
page_fish_text_5=\n\nБезупречные серворибы
page_fish_text_6=С помощью продвинутых ресурсов серворибам можно вернуть исходный вид, что резко улучшает их возможности.
