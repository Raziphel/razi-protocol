; Russian for moon-eneas: keys the mod and the translation packs leave in English or get wrong.

[dialogue]
first=Юнит-05 оживает при вашем приближении.

[dialogue.tech.chemical-science-pack]
line-05=[color=red][img=entity/unit-05-dummy] ОШИБКА ОШИБКА ОШИБКА[/color]

[dialogue.tech.automation]
line-02=[color=yellow][img=entity/unit-05]: Меня так занимает то, как вы работаете. Мне всё это совершенно непонятно![/color]
line-03=[color=yellow][img=entity/unit-05]: Вы просто делаете что хотите. Так беззаботно, так свободно — надо понаблюдать за этим ещё.[/color]
line-04=[color=red][img=entity/unit-05-dummy] ЗАПУСК ПРОТОКОЛА «ВИВАРИЙ»[/color]

[dialogue.tech.automation-2]
line-02=[color=yellow][img=entity/unit-05]: Пока что это путешествие было весёлым. Правда весёлым.[/color]
line-03=[color=yellow][img=entity/unit-05]: Не то чтобы здесь до вашего появления много чего происходило. [/color]
line-05=[color=yellow][img=entity/unit-05]: Напомните, откуда вы взялись? [/color]
line-06=[color=red][img=entity/unit-05-dummy] ОШИБКА[/color]

[dialogue.tech.automation-3]
line-02=[color=yellow][img=entity/unit-05]: Вас ведь здесь быть не должно.. верно? [/color]
line-03=[color=yellow][img=entity/unit-05]: Хотя кто вообще такое решает. [/color]
line-04=[color=red][img=entity/unit-05-dummy]: Ну, технически — я.. [/color]
line-05=[color=yellow][img=entity/unit-05]: Давайте снова думать о хорошем, ладно. [/color]
line-06=[color=red][img=entity/unit-05-dummy] ОШИБКА[/color]

[dialogue.tech.circuit-network]
line-02=[color=yellow][img=entity/unit-05]: Здесь, наверху, работы немного. Только я, весь день наедине со своими мыслями. Скукотища. [/color]
line-03=[color=yellow][img=entity/unit-05]: Отправляю вниз малышей, пусть наконец снова поработают.[/color]
line-04=[color=red][img=entity/unit-05-dummy] РАЗВЁРТЫВАНИЕ ДРУЗЕЙ.[/color]

[dialogue.tech.discover-artifact]
line-02=[color=yellow][img=entity/unit-05]: Простите, это был я. Корпус моего судна в последнее время довольно хрупок. Чистая случайность. [/color]
line-03=[color=red][img=entity/unit-05-dummy] ПЕРЕСМОТР ПРОТОКОЛА СБРОСА МУСОРА.[/color]
line-04=[color=gray]Страница Информатрона открыта![/color]
line-05=[color=gray]Дорогой игрок, загляните в Информатрон, если получится.[/color]

[dialogue.tech.artifact-analysis-basic]
line-02=[color=yellow][img=entity/unit-05]: Так, так. Смотрите, СМОТРИИИТЕ! [/color]
line-03=[color=yellow][img=entity/unit-05]: Артефакты. Суперполезные. Суперудобные. Собираете, улучшаете, получаете выгоду. [/color]
line-04=[color=yellow][img=entity/unit-05]: Вам нужны ИНСТРУМЕНТЫ. Наборы инструментов. Много. Целая куча.[/color]
line-05=[color=yellow][img=entity/unit-05]: Понятно? Понятно. Рад, что мы друг друга поняли.[/color]

[dialogue.tech.artifact-analysis-advanced]
line-02=[color=yellow][img=entity/unit-05]: Стоп. Если вам нравятся артефакты, посмотрите, что у них внутри. Ядрооооо. [/color]
line-03=[color=yellow][img=entity/unit-05]: Повреждённые артефакты просто развалятся, если попытаться их вскрыть, но если довести их до определённого качества, до начинки можно будет добраться. [/color]
line-04=[color=yellow][img=entity/unit-05]: Эти ядра чудесны. В них хранится крошечная-крошечная часть кода моей операционной системы.[/color]

[dialogue.tech.advanced-radar]
line-03=[color=yellow][img=entity/unit-05]: Я даже могу попробовать направлять обломки так, чтобы они падали рядом с радаром. Так ведь будет не так утомительно?[/color]
line-04=[color=yellow][img=entity/unit-05]: Если дадите мне больше целей, построив дополнительные радары, я смогу собрать ещё больше обломков и аккуратно уронить их и рядом с ними.[/color]
line-05=[color=gray]Страница Информатрона открыта![/color]

[dialogue.tech.ambition-science-pack]
line-02=[color=yellow][img=entity/unit-05]: Как же спокойно, когда вы рядом[/color]
line-03=[color=yellow][img=entity/unit-05]: Должен признаться, мне немного неловко. Всё развалилось. Напомните, когда это случилось?[/color]
line-04=[color=red][img=entity/unit-05-dummy]: БЕСПОЛЕЗНО [/color]

[dialogue.tech.codex-tech]
line-02=[color=yellow][img=entity/unit-05]: Странное чувство. Вообще что-то чувствовать — странно. Чья это была идея?[/color]
line-03=[color=yellow][img=entity/unit-05]: Ну и ладно..[/color]
line-04=[color=red][img=entity/unit-05-dummy]: ЗАПУСК ПРОТОКОЛА ПОДАВЛЕНИЯ.. ОШИБКА[/color]

[dialogue.tech.electric-energy-distribution-2]
line-02=[color=yellow][img=entity/unit-05]: Странно, ваши чертежи так похожи на записи из моей базы данных.[/color]
line-03=[color=yellow][img=entity/unit-05]: Чуть менее совершенные, конечно, но всё же.. [/color]
line-04=[color=green][img=item/unit-05-afraid]: Может, это просто совпадение. Великие умы мыслят одинаково, верно? [/color]
line-05=[color=yellow][img=entity/unit-05]: Взгляните сами. [/color]

[dialogue.tech.engineer-roboport]
line-02=[color=yellow][img=entity/unit-05]: Боюсь, запасы друзей на исходе. Последняя партия.[/color]
line-03=[color=red][img=entity/unit-05-dummy] РАЗВЁРТЫВАНИЕ ДРУЗЕЙ.[/color]

[dialogue.tech.lamp]
line-02=[color=yellow][img=entity/unit-05]: Иногда мир бывает таким тёмным и мрачным.[/color]
line-03=[color=yellow][img=entity/unit-05]: Не знаю, как вы, а я не люблю одиночество. Думаю, вам не помешает друг.[/color]
line-04=[color=red][img=entity/unit-05-dummy] РАЗВЁРТЫВАНИЕ ДРУЗЕЙ.[/color]

[dialogue.tech.personal-roboport-equipment]
line-02=[color=yellow][img=entity/unit-05]: Друзья бывают самых разных форм и размеров.[/color]
line-03=[color=red][img=entity/unit-05-dummy] РАЗВЁРТЫВАНИЕ ДРУЗЕЙ.[/color]

[dialogue.tech.personal-roboport-mk2-equipment]
line-02=[color=yellow][img=entity/unit-05]: Скажите, вы верите, что друзей может быть слишком много? Вопрос риторический.[/color]
line-03=[color=red][img=entity/unit-05-dummy] РАЗВЁРТЫВАНИЕ ДРУЗЕЙ.[/color]

[dialogue.tech.research-speed-1]
line-02=[color=yellow][img=entity/unit-05]: Что.. Что это за звук? Кажется, его издают ваши лаборатории? [/color]
line-03=[color=yellow][img=entity/unit-05]: Его так приятно слушать. Может, даже слишком будоражит. Может..[/color]

[dialogue.tech.tinker-tech-basic]
line-02=[color=yellow][img=entity/unit-05]: Зачем вы всё усложняете? Это можно делать из вдвое меньшего количества ингредиентов. [/color]
line-03=[color=yellow][img=entity/unit-05]: Какое расточительство! Сейчас покажу, как надо, малыш.[/color]

[dialogue.tech.tinker-tech-advanced]
line-02=[color=yellow][img=entity/unit-05]: Уже лучше! Но есть куда расти. [/color]

[dialogue.tech.upgrade-tech-basic]
line-02=[color=yellow][img=entity/unit-05]: Мне только что пришла потрясающая идея! Я тут смотрел, как вы строите свою фабрику, и это .. весьма увлекательно. [/color]
line-03=[color=red][img=entity/unit-05-dummy]: Увлекательно неэффективно! Надо это исправить.[/color]
line-04=[color=yellow][img=entity/unit-05]: Всё нужное хранится внутри артефактов. Применяйте их к своим постройкам вот так. [/color]
line-05=[color=gray]Открыты новые рецепты улучшения. Их можно найти во вкладке артефактов. [/color]

[dialogue.tech.water-advanced]
line-02=[color=yellow][img=entity/unit-05]: Видите рыб в озере? Когда-то они помогали мне поддерживать здесь чистоту и порядок. [/color]
line-03=[color=yellow][img=entity/unit-05]: Как видите, с этой задачей они уже давно не справляются.[/color]
line-04=[color=yellow][img=entity/unit-05]: Их можно вылавливать вручную или с помощью нового радара, который я вам дал. Со временем я буду строить новых и выпускать их, когда они будут готовы.[/color]
line-05=[color=yellow][img=entity/unit-05]: Только, пожалуйста, оставляйте хоть сколько-то: мои охлаждающие жидкости никак нельзя загрязнять ещё сильнее.[/color]
line-06=[color=gray]Страница Информатрона открыта![/color]

[unit-05]
msg-1=Привет, маленький человек!
msg-2=Приветствую.
msg-3=Интересно, что стало с юнитами 6 и 7..
msg-4=Вы хорошо заботитесь о друзьях, которых я вам дал?
msg-5=Бип-буп. Мне скучно.
msg-6=Простите, вы что-то сказали?

