[item-description]
Construction_Drone=[color=yellow][entity=unit-05]: Эти малыши составляли мне компанию, сколько я себя помню. Вряд ли я бы протянул без них. Надеюсь, они принесут вам столько же радости, сколько мне! [/color]
rotund-friend=[color=yellow][entity=unit-05]: Они такие милые. Обожаю тихий звук, который они издают в полёте. Я взял вашу конструкцию, только сделал их чуть эффективнее. Берегите их![/color]
volatile-nutrients=[color=yellow][img=entity/unit-05]: Мощные питательные вещества, хранящие много энергии в малом объёме. Нестабильны.[/color]
volatile-spoilage=[color=red][img=entity/unit-05-dummy]: Испорченные нестабильные питательные вещества, которые вот-вот бурно ВЗОРВУТСЯ.[/color]

