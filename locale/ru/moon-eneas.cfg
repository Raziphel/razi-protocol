[recipe-description]
filter-water-copper=Используя камень в качестве фильтрующего вещества, загрязнённую воду можно отфильтровать и попутно получить ценные материалы.
filter-water-iron=Используя камень в качестве фильтрующего вещества, загрязнённую воду можно отфильтровать и попутно получить ценные материалы.
significant-data-artifact-epic=Извлечение данных из древних ядер артефактов. Записанные карты данных питают инженерные машины дольше, чем сырое ядро. \n\n[color=yellow][entity=unit-05]: При этом ядро будет уничтожено.[/color]
significant-data-artifact-legendary=Извлечение данных из древних ядер артефактов. Записанные карты данных питают инженерные машины дольше, чем сырое ядро. \n\n[color=yellow][entity=unit-05]: При этом ядро будет уничтожено.[/color]
significant-data-artifact-normal=Извлечение данных из древних ядер артефактов. Записанные карты данных питают инженерные машины дольше, чем сырое ядро. \n\n[color=yellow][entity=unit-05]: При этом ядро будет уничтожено.[/color]
significant-data-artifact-rare=Извлечение данных из древних ядер артефактов. Записанные карты данных питают инженерные машины дольше, чем сырое ядро. \n\n[color=yellow][entity=unit-05]: При этом ядро будет уничтожено.[/color]
significant-data-artifact-uncommon=Извлечение данных из древних ядер артефактов. Записанные карты данных питают инженерные машины дольше, чем сырое ядро. \n\n[color=yellow][entity=unit-05]: При этом ядро будет уничтожено.[/color]
tinker-for-robots-1=С помощью улучшенных артефактов можно изготавливать припасы другими способами.
tinker-for-modules-1=С помощью улучшенных артефактов можно изготавливать припасы другими способами.
tinker-for-robots-2=С помощью улучшенных артефактов можно изготавливать припасы другими способами.
tinker-for-modules-2=С помощью улучшенных артефактов можно изготавливать припасы другими способами.
