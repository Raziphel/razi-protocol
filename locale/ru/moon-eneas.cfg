[mod-setting-description]
integrate-lignumis=Ряд изменений, механически связывающих Лигнумис и Энеас. Артефакты можно разбирать на золотые плиты. Артефактам нужен дополнительный этап восстановления с помощью простых ремонтных комплектов. И многое другое.
moon-eneas-enable-supply-drops=Получать разовые подарки при исследовании определённых ключевых технологий
moon-eneas-enable-tech-messages=Получать сообщения в чате и видеопередачи при исследовании определённых ключевых технологий
moon-eneas-science-multiplier=Задаёт свой множитель стоимости исследований для технологий Энеаса, так как общий множитель стоимости исследований на них не действует
moon-eneas-unit-05-talks=Юнит-05 выводит сообщения, когда рядом игрок. На многопользовательском сервере может сильно снижать производительность.
tier4-modules=Технологии, открывающие модули 4-го уровня, будут требовать исследований Энеаса

