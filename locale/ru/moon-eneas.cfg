[technology-description]
ancient-core-tech=Извлекайте из артефактов [item=ancient-core] ядра с важными данными, которые служат топливом для более продвинутых зданий.
artifact-analysis-basic=[item=eneas-artifact] Артефакты можно использовать для улучшения простых зданий. Чтобы улучшать более сложные постройки, сначала нужно восстановить сами артефакты.
artifact-analysis-advanced=Позволяет улучшать артефакты до более высоких уровней. Так они смогут улучшать больше видов зданий и поднимать их качество выше.
artifact-analysis-master=Позволяет улучшать артефакты до более высоких уровней. Так они смогут улучшать больше видов зданий и поднимать их качество выше.
artifact-analysis-expert=Позволяет улучшать артефакты до более высоких уровней. Так они смогут улучшать больше видов зданий и поднимать их качество выше.
artifact-analysis-grandmaster=В разработке — на этом заканчивается первая часть Энеаса. Аквило и финал игры будут раскрыты во второй части.
basic-data-management=С помощью [ancient-core] древних данных можно питать более сложные здания, а также улучшать части фабрики, связанные с исследованиями и интеллектом.
advanced-radar=Продвинутый радар с гораздо большим радиусом постоянного обзора. На Наувисе такие радары притягивают к себе падения [entity=debris-a] обломков. Несколько радаров повышают шанс дополнительных обломков, но с убывающей отдачей.\n\n Радар также может автоматически отдавать приказы на снос по сигналам логической сети. Подробнее — на странице Информатрона о радаре.
discover-artifact=Хотя их истинное назначение остаётся неизвестным, [item=eneas-artifact] артефакты, разбросанные по Наувису, можно разобрать на полезные припасы.
engineer-roboport=Улучшенный робопорт, который покрывает бо́льшую площадь при том же расходе энергии.
gantry-tech=[entity=gantry] Портал улучшает сущности, стоящие внутри него.
supply-tech=Позволяет [entity=unit-05] юниту-05 производить больше ресурсов за цикл на Энеасе. Также повышает качество поставляемых [item=eneas-artifact] артефактов.
tinker-tech-advanced=С помощью улучшенных артефактов можно изготавливать припасы другими способами.
tinker-tech-basic=С помощью улучшенных артефактов можно изготавливать припасы другими способами.

