[entity-description]
gantry=[entity=gantry] Портал улучшает сущности, стоящие внутри него.\n\n Чтобы улучшить сущность, откройте окно производства портала и выберите целевое качество. Оно должно быть на одну ступень выше качества транспорта, который вы улучшаете (например, выберите рецепт <необычное>, чтобы улучшить обычный локомотив до необычного качества).\n\n Затем подайте в портал нужные ингредиенты. Если увести транспорт во время улучшения, ингредиенты могут пропасть впустую.
rotund-friend=[color=yellow][entity=unit-05]: Они такие милые. Обожаю тихий звук, который они издают в полёте. Я взял вашу конструкцию, только сделал их чуть эффективнее. Берегите их![/color]
auto-deconstruct-radar=Продвинутый радар с гораздо большим радиусом постоянного обзора. На Наувисе такие радары притягивают к себе падения [entity=debris-a] обломков. Несколько радаров повышают шанс дополнительных обломков, но с убывающей отдачей.\n\n Радар также может автоматически отдавать приказы на снос по сигналам логической сети. Подробнее — на странице Информатрона о радаре.
eneas-lift=Доставляет ресурсы из подземных производственных цехов Энеаса на поверхность. Количество за цикл зависит от уровня загрязнения на Энеасе.\n\nВыработку можно повысить, исследуя технологии, связанные с [entity=eneas-lift] подъёмником.\n\n [color=red][img=entity/unit-05-dummy] ВНИМАНИЕ: ВСЕ ПРЕДМЕТЫ, ОСТАВШИЕСЯ В ПОДЪЁМНИКЕ, БУДУТ УДАЛЕНЫ ПРИ СЛЕДУЮЩЕЙ ДОСТАВКЕ [/color]

