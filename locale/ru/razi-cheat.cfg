[razi-cheat]
help=Безопасно открывает исследования по этапам для тестов: /razi-cheat [start|status|cancel]
admin-tip=Совет по тестам Razi Protocol: на больших сборках используйте /razi-cheat вместо /cheat. Исследования открываются небольшими шагами, и игра не зависает надолго. Прогресс можно посмотреть командой /razi-cheat status.
builtin-warning=Razi Protocol: встроенная команда /cheat может надолго подвесить игру с большим числом модов. В следующий раз используйте /razi-cheat. Это сообщение не остановит уже запущенную команду.
message=[Razi Protocol] __1__
player-only=Запускайте /razi-cheat от имени игрока-администратора.
admin-only=Команда /razi-cheat доступна только администраторам сервера.
usage=Использование: /razi-cheat [start|status|cancel]
status=Исследование: __1__ из __2__ технологий.
status-idle=Для вашей фракции поэтапное исследование не запущено.
cancelled=Остановлено на __1__ из __2__ технологий. Уже открытые исследования сохранены.
cancel-idle=Нечего останавливать: поэтапное исследование не запущено.
already-running=Исследование уже идёт. Используйте /razi-cheat status или cancel.
nothing-left=Все доступные технологии уже изучены. Бесплатный крафт включён.
started=Бесплатный крафт включён. Технологий к исследованию: __1__, они открываются небольшими шагами.
progress=Прогресс исследования: __1__%.
complete=Поэтапное исследование завершено: открыто __1__, не удалось __2__.
