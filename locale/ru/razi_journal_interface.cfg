project-next-ark-build=Постройте тяжёлую платформу с двигателями, турелями и сборочными автоматами, затем завершите рейс в глубокий космос.
project-next-ark-done=Ковчег достиг глубокого космоса. Рейс зарегистрирован.
project-skybridge-guide=Постройте машины орбитальной катапульты на обоих концах настроенного коридора. Оформите квитанцию на планете отправления и доставьте её на планету назначения.
project-skybridge-native-unavailable=В установленных модах не найдена машина орбитальной катапульты. Прогресс не учитывается.
project-skybridge-link=Доступный коридор: __1__ — __2__
project-skybridge-sign=Оформить квитанцию
project-skybridge-pending=Квитанция оформлена: __1__ — __2__. Доставьте её в пункт назначения.
project-skybridge-deliver=Подтвердить доставку
project-skybridge-evidence=Подписанная квитанция подтверждает доставку между двумя мирами. Игра не записывает, каким транспортом её перевезли, поэтому она не доказывает, что катапульта сработала.
project-beltbreaker-guide=Платформа должна отправиться от соединения с поясом, завершить перелёт и прибыть к месту назначения. Посещение отметок на краях пояса не учитывается.
project-beltbreaker-vibrant=Астероидный пояс Вайбранта
project-beltbreaker-umbra=Расколотый разлом Умбры
project-beltbreaker-crossed=Зарегистрировано: __1__
project-beltbreaker-uncrossed=Не пересечено: __1__
project-array-guide=Разместите ретрансляторы архива на планетах из трёх разных звёздных систем и обеспечьте им питание. Проект не открывает технологии и не даёт боевых бонусов.
project-array-site=Подключённые ретрансляторы: __1__ / __2__
project-array-record-1=АРХИВ 01 / ПОТЕРЯ СТАНЦИИ. Станция замолчала после того, как экипаж сообщил о штатной работе всех систем. В последнем сообщении просили установить второй приёмник.
project-array-record-2=АРХИВ 02 / ВОЗВРАТ СИГНАЛА. Пропавшие отчёты переслали на внутренний адрес, которого нет ни в одной уцелевшей ведомости сотрудников.
project-array-record-3=АРХИВ 03 / ИЗМЕНЕНИЕ ПРИОРИТЕТА. Сеть RAZI приказали сохранить сообщение, прежде чем сохранять машины. Личность отправителя остаётся зашифрованной.
project-ark-guide=Постройте тяжёлую платформу минимум с 3 двигателями, 4 пулемётными турелями и 2 сборочными автоматами. Одного веса недостаточно.
project-ark-requirements=Перед отправлением нужны платформа весом не менее __1__ кг, 3 двигателя, 4 пулемётные турели и 2 сборочных автомата. Затем выполните рейс к Краю Солнечной системы, Краю глубокого космоса, Нексусу или Разрушенной планете.
project-ark-candidate=Платформа готова к отправлению: __1__
