project-nexus-defeated=Побеждён
project-nexus-unbeaten=Не побеждён
project-nexus-open-codex=Кодекс
project-nexus-silence=После победы над всеми девятью боссами используйте их трофеи, чтобы создать ключ перехода и открыть маршруты к Безмолвию. Это этап прогресса Nexus Bosses, он не завершает Конвергенцию.
project-next-nexus-unavailable=Требуется Nexus Bosses, но запись о победах недоступна. Проверьте, установлен ли мод и работает ли его удалённый интерфейс.
project-next-nexus-boss=Победите __1__ в испытании призыва Nexus Bosses на Нексусе.
project-next-nexus-done=Все девять боссов Нексуса побеждены. Можно доставлять финальный груз для запуска.
project-next-convergence-nexus=Победите всех девять боссов Нексуса до финальной поставки для запуска. Прогресс показан в проекте «Испытания Нексуса».
project-next-convergence-witness=Постройте и подключите якорь-свидетель (радар с питанием) в каждой из семи звёздных систем до финальной поставки.
project-next-convergence-chart=Граф маршрутов глубокого космоса недоступен. Проверьте проект экспедиции до финальной поставки.
project-next-convergence-deep-tour=Лично посетите места глубокого космоса: __1__ / __2__. В журнале указаны оставшиеся пункты.
archive-array-heading=ВОССТАНОВЛЕНО / СЕТЬ АРХИВА
archive-array-title-1=ПЕРЕДАЧА СЕТИ 01 / ПОТЕРЯ СТАНЦИИ
archive-array-title-2=ПЕРЕДАЧА СЕТИ 02 / ВОЗВРАТ СИГНАЛА
archive-array-title-3=ПЕРЕДАЧА СЕТИ 03 / ИЗМЕНЕНИЕ ПРИОРИТЕТА
archive-array-record-1=Первая станция отключилась в 04:12 по станционному времени. За шесть секунд до этого экипаж сообщил, что энергосеть работает безупречно, и обнаружил сигнал с адреса, не назначенного ни одному известному кораблю. В последнем сообщении не просили об эвакуации — требовался второй пост прослушивания. Кто-то ждал ответа.
archive-array-record-2=Часы трёх приёмников показывают разное время отправки следующего сообщения. Его содержимое во всех копиях совпадает. Каждая копия пересылает отчёты пропавшей станции на внутренний адрес RAZI без записи о сотруднике. Служба обслуживания назвала расхождение дрейфом датчиков. В архивной подписи указано, что ответ получен.
archive-array-record-3=Корпоративный приказ / приоритет прослушивания — семь. Сначала сохраните сигнал, затем машины. Сначала сохраните машины, затем манифест. Не раскрывайте отправителя, пока независимые приёмники в трёх звёздных системах не подтвердят сигнал. Последняя строка не подписана. Архив пока хранит её без изменений.
