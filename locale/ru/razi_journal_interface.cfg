project-caption-nexus-trials=Победите всех девять боссов Нексуса в кругах Шёпота, Хора и Финала.
project-progress-nexus-trials=Побеждённые боссы Нексуса: __1__ / __2__
project-measures-nexus-trials=Учитывает девять отметок о победах, которые мод Nexus Bosses сохраняет для вашей команды. Трофеи, исследования и журналы схваток не учитываются.
project-nexus-guide=Призовите каждого босса маяком, защитите маяк и победите появившегося босса. Соберите трофеи. Новые круги открываются после трёх побед. Ключ перехода и Безмолвие относятся к прогрессу Nexus Bosses.
