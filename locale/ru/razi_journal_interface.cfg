project-progress-ark=Завершено рейсов Ковчега: __1__ / __2__
project-measures-skybridge=Требуются машины орбитальной катапульты на обоих концах настроенного коридора и квитанция, доставленная между мирами. Игра не записывает, каким транспортом её перевезли.
project-measures-beltbreaker=Учитывает прибытия платформ после зарегистрированного прямого пересечения поясов Вайбранта и Умбры. Посещения не учитываются.
project-measures-array=Считает подключённые ретрансляторы архива в трёх разных звёздных системах. Отключённые или не подключённые к сети ретрансляторы не учитываются.
project-measures-ark=Требуется тяжёлая платформа с двигателями, турелями и сборочными автоматами, завершившая рейс в глубокий космос. Одного веса недостаточно.
project-next-skybridge-missing=В установленных модах не найдена машина орбитальной катапульты. Проверьте мод Orbital Catapult и настройки коридоров.
project-next-skybridge-build=Постройте машины орбитальной катапульты на обоих концах доступного коридора.
project-next-skybridge-sign=Оформите квитанцию на планете отправления. Это стоит 20 процессорных блоков.
project-next-skybridge-deliver=Доставьте квитанцию на планету назначения и подтвердите прибытие.
project-next-skybridge-done=Оба конца маршрута готовы, квитанция доставлена.
project-next-beltbreaker-vibrant=Перевезите платформу напрямую между внутренним и внешним краями пояса Вайбранта.
project-next-beltbreaker-umbra=Перевезите платформу напрямую через Расколотый разлом Умбры.
project-next-beltbreaker-done=Оба пересечения поясов зарегистрированы.
project-next-array-build=Постройте и подключите ретрансляторы архива в трёх разных звёздных системах.
