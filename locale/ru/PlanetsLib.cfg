; Russian for PlanetsLib: keys the mod and the translation packs leave in English or get wrong.

[planetslib]
entity-removal-floor-waiting=__1__: разбор приостановлен, пока не построено покрытие на замену (__2__).
planetslib-entity-migration=[PlanetsLib]: Перенос __1__ -> __2__.
planetslib-entity-replacement-rule-changed=[PlanetsLib]: Обнаружено изменение правила замены объектов:

[mod-setting-description]
PlanetsLib-disable-all-entity-replacements=Принудительно отключает все замены объектов во всех модах. Нужно, только если какой-то мод сильно неправильно настроен.
PlanetsLib-enable-entity-replacements=Включает замены объектов, не привязанные к другой начальной настройке. Запасной вариант для удаления модов, если их авторы не привязали замены к настройке.
PlanetsLib-enable-lab-science-pack-preview-size-change=Меняет размер значков исследовательских пакетов на лабораториях в режиме Alt в зависимости от того, сколько пакетов принимает лаборатория.
PlanetsLib-enable-runtime-rocket-silo-replacements=Если планеты задают множитель грузоподъёмности ракеты или количества деталей ракеты, ракетные шахты заменяются во время игры. Отключите, чтобы безопасно выключить это поведение и откатить замены в сохранениях, если какой-то мод пользуется им небезопасно.

[mod-setting-name]
PlanetsLib-disable-all-entity-replacements=Принудительно отключить ВСЕ замены объектов
PlanetsLib-enable-entity-replacements=Прочие замены объектов
PlanetsLib-enable-lab-science-pack-preview-size-change=Менять размер значков пакетов на лабораториях
PlanetsLib-enable-runtime-rocket-silo-replacements=Замена ракетных шахт во время игры

