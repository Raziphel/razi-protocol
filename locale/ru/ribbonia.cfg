[recipe-description]
bulk-barrel-casting=Массовое производство бочек. Отлично подходит, чтобы избавиться от ненужных жидкостей. Или открыть пивоварню.

[technology-name]
ribbonia-beacon=Древняя передача эффектов
ribbonia-lignumis-throwers=Паровые метательные манипуляторы
ribbonia-barrel-recipes=Безумное обращение с жидкостями
ribbonia-maintenance=Обслуживание Риббонии

[technology-description]
ribbonia-beacon=Маяки первого поколения намного мощнее, но подвержены сильным помехам. На машину одновременно может воздействовать только один [entity=ribbonia-beacon], иначе эффекты становятся отрицательными.
ribbonia-lignumis-throwers=Оказывается, давление пара прекрасно подходит для метания предметов на большие расстояния. Предметы могут прибыть частично или полностью приготовленными.
ribbonia-barrel-recipes=Вдохновившись тем, как ты обращаешься с жидкостями на Риббонии, C.H.A.R.L.E.S. придумал безумные способы применения бочек. Позволяет разливать в бочки новые жидкости — одни практичнее других.
ribbonia-fuel-cell-productivity=Повышает продуктивность рецептов топливных элементов для реакторов.
ribbonia-maintenance=Дальнейший ремонт и оптимизация Риббонии делают кольцевой мир эффективнее и продуктивнее.
ribbonia-special-fuel-productivity=Повышает продуктивность рецептов высококлассного топлива.
ribbonia-tech-simple-molten-plastic=Частичный ремонт разрушенного кольцевого мира.

[tile-name]
ribbonia-void=Пустое пространство?

[tile-description]
ribbonia-void=Это явно пустой космос, но Ч.А.Р.Л.З. иногда называет его «звёздным морем», «простором» или «астральным планом».

[tips-and-tricks-item-name]
ribbonia=[space-location=ribbonia] Инструктаж по Риббонии

[tips-and-tricks-item-description]
ribbonia=[space-location=ribbonia] — искусственный кольцевой мир под властью [entity=ribbonia-charles], безумного фульгоранского ИИ. Чтобы выжить здесь, придётся освоить расплавленную пластмассу, термоядерную плазму и летающие поезда в тесном пространстве.

[mod-setting-description]
ribbonia-cap-nuclear=Риббония добавляет технологию с бесконечным бонусом продуктивности ядерных топливных элементов. Без ограничения продуктивности цикл восстановления ядерных топливных элементов становится прибыльным.

[modifier-description]
ribbonia-tech-atmosphere=Засевает атмосферу Риббонии облаками, туманом и дождём, помогая жизни процветать.
ribbonia-tech-electric-network=Восстанавливает глобальную электросеть Риббонии.
ribbonia-tech-repair-gaps=Устраняет часть повреждений от астероидов, найденных на Риббонии.
ribbonia-tech-shorter-day=Ускоряет вращение Риббонии, сокращая цикл дня и ночи.
ribbonia-tech-terraform=Орошает пустыни и участки грязи, постепенно превращая их в траву.
