[item-description]
ribbonia-beacon=Намного мощнее новых поколений [entity=beacon], но на машину может воздействовать только один базовый маяк.
lava-barrel=Лава в бочке. Со временем превратится в камень.
molten-copper-barrel=Расплавленная медь в бочке. Со временем превратится в кусок меди.
molten-iron-barrel=Расплавленное железо в бочке. Со временем превратится в кусок железа.
molten-plastic-barrel=Расплавленный пластик в бочке. Со временем превратится в кусок пластика.
steam-barrel=Пар в бочке. Со временем выйдет из бочки.
thruster-fuel-barrel=Топливо для ускорителя в качественной бочке, достаточно прочной, чтобы его удержать.
thruster-oxidizer-barrel=Окислитель для ускорителя в бочке повышенного качества, достаточно прочной, чтобы его удержать.
ribbonia-maintenance-station=Технический шахтный ствол кольцевого мира. Подключена напрямую к термоядерным реакторам Риббонии и не требует внешнего питания.

