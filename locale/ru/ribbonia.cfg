[compat]
big-crusher=[color=#be7318][font=default-large-bold]Ч.А.Р.Л.З.[/font][/color]: Каждый год эти дробилки становятся всё больше и больше.
blueprint-deployer2=[color=#be7318][font=default-large-bold]Ч.А.Р.Л.З.[/font][/color]: Плохой сундук? Ты что, водишься с этим занудой Л.О.Р.А.К.С.? По крайней мере, он наконец-то завёл друзей.
burner-assembling-machine=[color=#be7318][font=default-large-bold]Ч.А.Р.Л.З.[/font][/color]: Чтобы попасть сюда, вам ведь пришлось открыть электричество, правда?
cerys-fulgoran-reactor=[color=#be7318][font=default-large-bold]Ч.А.Р.Л.З.[/font][/color]: Это собрал на коленке тот безумный обитатель луны? Проследите, чтобы он не облучил мои схемы.
diesel-assembling-machine=[color=#be7318][font=default-large-bold]Ч.А.Р.Л.З.[/font][/color]: Ископаемое топливо? На моей планете? Так и быть, разрешаю.
kr-air-purifier=[color=#be7318][font=default-large-bold]Ч.А.Р.Л.З.[/font][/color]: Простите? Этот воздух вручную очищен лучшими фульгоранскими фильтрами.
linox-building_mantle-extractor=[color=#be7318][font=default-large-bold]Ч.А.Р.Л.З.[/font][/color]: Вы бурите мой реактор? Л.О.Р.А.К.С. за это заплатит!
lumber-mill=[color=#be7318][font=default-large-bold]Ч.А.Р.Л.З.[/font][/color]: Лесопилка? Хиппи.
maraxsis-conduit=[color=#be7318][font=default-large-bold]Ч.А.Р.Л.З.[/font][/color]: Требуется построить дополнительные пилоны.
outer-rim-manufactory=[color=#be7318][font=default-large-bold]Ч.А.Р.Л.З.[/font][/color]: Бывали на Секретасе? Этот выживший из ума Вармайнд всё ещё играет со своими кораблями?
planetaris-hyper-transport-belt=[color=#be7318][font=default-large-bold]Ч.А.Р.Л.З.[/font][/color]: Эй, почему этот конвейер весь в песке?
ribbonia-beacon=[color=#be7318][font=default-large-bold]Ч.А.Р.Л.З.[/font][/color]: Ах, элегантный маяк для более цивилизованной эпохи. Берёшь маяк нового поколения, усиливаешь антенну, выбрасываешь защиту. Мне нравится.
steam-assembling-machine=[color=#be7318][font=default-large-bold]Ч.А.Р.Л.З.[/font][/color]: Машина на пару? Это что, третья промышленная революция?
tiny-solar-matrix=[color=#be7318][font=default-large-bold]Ч.А.Р.Л.З.[/font][/color]: Тук-тук, Нео. Это самая милая и крошечная солнечная матрица из всех, что ты видел!
catalytic-chemical-plant=[color=#be7318][font=default-large-bold]C.H.A.R.L.E.S.[/font][/color]: Это перекрашенный химзавод? Халтура, но так и быть.
gold-railgun-turret=[color=#be7318][font=default-large-bold]C.H.A.R.L.E.S.[/font][/color]: Твой золотой пистолет против моего Walther PPK?
machining-assembler=[color=#be7318][font=default-large-bold]C.H.A.R.L.E.S.[/font][/color]: Какой трудолюбивый с виду сборщик.
steam-recycler=[color=#be7318][font=default-large-bold]C.H.A.R.L.E.S.[/font][/color]: Я же сказал: никакой переработки! Стоп, оно на пару? Зачем?
wsr-big-assembler=[color=#be7318][font=default-large-bold]C.H.A.R.L.E.S.[/font][/color]: Ну и громадина! С какой луны ты его стащил?
