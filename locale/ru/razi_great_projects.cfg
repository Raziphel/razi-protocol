project-skybridge-deliver=Подтвердить прибытие
project-skybridge-evidence=Квитанция подтверждает перемещение между мирами, но исходный мод не сообщает, какое транспортное средство использовалось.
project-beltbreaker-guide=Требуется настоящее пересечение маршрута, завершённый перелёт и прибытие. Посещение обоих краёв другим путём не засчитывается.
