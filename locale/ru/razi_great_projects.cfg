project-progress-array=__1__ / __2__ работающих систем
project-progress-ark=__1__ / __2__ экспедиций Ковчега
project-context-skybridge=Первая транспортная хартия задавала простой вопрос: могут ли две колонии подтвердить реальную доставку?
project-context-beltbreaker=Грузовые книги обрываются у астероидных поясов. Для кораблей, которые не вернулись, не составляли накладных.
project-context-array=Три частоты указывают на сообщения старше самой экспедиции. Получатели этих сигналов неизвестны.
project-context-ark=Это не пассажирский корабль, а мобильная фабрика за пределами обычного снабжения.
project-measures-skybridge=Учитывает реальные установки катапульт, разрешённый маршрут и физическую передачу квитанции. Точный способ перевозки недоступен.
project-measures-beltbreaker=Учитывает реальные прибытия после зарегистрированных пересечений поясов Вайбранта и Умбры.
project-measures-array=Учитывает запитанные архивные станции в трёх разных системах.
project-measures-ark=Требует большого защищённого корабля с производством и завершённого рейса в Глубокий космос.
project-next-skybridge-missing=Установки исходного мода «Орбитальная катапульта» не распознаны. Проверьте версию и настройки.
project-next-skybridge-build=Установите настоящие катапульты на обоих концах открытого регионального маршрута.
project-next-skybridge-sign=На исходной планете предъявите 20 процессоров для регистрации груза.
project-next-skybridge-deliver=Доставьте запечатанную квитанцию на планету назначения.
project-next-skybridge-done=Две установки и доставка подтверждены.
project-next-beltbreaker-vibrant=Пройдите напрямую между внутренним и внешним краями пояса Вайбранта.
project-next-beltbreaker-umbra=Пройдите через Разлом Умбры.
project-next-beltbreaker-done=Оба опасных перехода зарегистрированы.
project-next-array-build=Установите и запитайте архивные станции в трёх разных системах.
project-next-array-done=Три станции работают. Архивный сигнал восстановлен.
project-next-ark-build=Постройте тяжёлый защищённый заводской корабль и выполните рейс в Глубокий космос.
project-next-ark-done=Ковчег достиг дальнего рубежа. Экспедиция сохранена в журнале.
project-skybridge-guide=Подтвердите двустороннюю инфраструктуру родной катапульты, оформите квитанцию и доставьте её на другой мир.
project-skybridge-native-unavailable=Не обнаружены поддерживаемые физические катапульты. Ложное продвижение не начисляется.
project-skybridge-link=Доступный маршрут: __1__ → __2__
project-skybridge-sign=Оформить груз
project-skybridge-pending=Груз __1__ → __2__. Доставьте квитанцию адресату.
project-skybridge-deliver=Подтвердить прибытие
project-skybridge-evidence=Квитанция подтверждает перемещение между мирами, но исходный мод не сообщает, какое транспортное средство использовалось.
project-beltbreaker-guide=Требуется настоящее пересечение маршрута, завершённый перелёт и прибытие. Посещение обоих краёв другим путём не засчитывается.
project-beltbreaker-vibrant=Пояс Вайбранта
project-beltbreaker-umbra=Разлом Умбры
project-beltbreaker-crossed=Пройдено: __1__
project-beltbreaker-uncrossed=Не пройдено: __1__
project-array-guide=Установите архивные ретрансляторы RAZI на мирах трёх разных звёздных систем. Поддерживайте электропитание.
project-array-site=Приёмник работает: __1__ / __2__
project-array-record-1=АРХИВ 01 / ПОТЕРЯ СТАНЦИИ. После штатного отчёта экипажа станция замолчала. Последняя просьба: установить второй приёмник.
project-array-record-2=АРХИВ 02 / ОТВЕТНЫЙ СИГНАЛ. Пропавшие отчёты отправили на внутренний адрес, которого нет в реестре персонала.
project-array-record-3=АРХИВ 03 / ПРИОРИТЕТ. Приказ RAZI: сохранить сообщение прежде машин. Личность отправителя по-прежнему скрыта.
project-ark-guide=Создайте большую самостоятельную производственную платформу с двигателями, защитой и сборочными автоматами.
project-ark-requirements=Не менее __1__ кг массы, 3 двигателей, 4 турелей и 2 сборочных автоматов. Достигните края системы, Нексуса или Разрушенной планеты.
project-ark-candidate=Ковчег готов к вылету: __1__
archive-array-heading=ВОССТАНОВЛЕНО / АРХИВНАЯ СЕТЬ
archive-array-title-1=ПЕРЕДАЧА 01 / ПОТЕРЯ СТАНЦИИ
archive-array-title-2=ПЕРЕДАЧА 02 / ОТВЕТНЫЙ СИГНАЛ
archive-array-title-3=ПЕРЕДАЧА 03 / ПРИОРИТЕТНЫЙ ПРИКАЗ
archive-array-record-1=В 04:12 станция перестала отвечать. За шесть секунд до этого экипаж сообщил о штатной работе энергосети и сигнале неизвестного корабля. Последним распоряжением стала просьба о втором пункте наблюдения.
archive-array-record-2=Часы трёх приёмников показывают разное время отправления, но сам текст одинаков. Копии направлены на внутренний адрес RAZI без связанной записи о сотруднике. Система отметила сообщение полученным.
archive-array-record-3=Корпоративный приказ: прежде всего сохранить сигнал. Затем сохранить машины. До подтверждения тремя независимыми системами личность отправителя не раскрывать. Последняя строка не подписана.
