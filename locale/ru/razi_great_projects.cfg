project-context-skybridge=Первая транспортная хартия задавала простой вопрос: могут ли две колонии подтвердить реальную доставку?
project-context-beltbreaker=Грузовые книги обрываются у астероидных поясов. Для кораблей, которые не вернулись, не составляли накладных.
project-context-array=Три частоты указывают на сообщения старше самой экспедиции. Получатели этих сигналов неизвестны.
project-context-ark=Это не пассажирский корабль, а мобильная фабрика за пределами обычного снабжения.
project-measures-skybridge=Учитывает реальные установки катапульт, разрешённый маршрут и физическую передачу квитанции. Точный способ перевозки недоступен.
project-measures-beltbreaker=Учитывает реальные прибытия после зарегистрированных пересечений поясов Вайбранта и Умбры.
project-measures-array=Учитывает запитанные архивные станции в трёх разных системах.
project-measures-ark=Требует большого защищённого корабля с производством и завершённого рейса в Глубокий космос.
project-next-skybridge-missing=Установки исходного мода «Орбитальная катапульта» не распознаны. Проверьте версию и настройки.
project-next-skybridge-build=Установите настоящие катапульты на обоих концах открытого регионального маршрута.
project-next-skybridge-sign=На исходной планете предъявите 20 процессоров для регистрации груза.
project-next-skybridge-deliver=Доставьте запечатанную квитанцию на планету назначения.
project-next-skybridge-done=Две установки и доставка подтверждены.
project-next-beltbreaker-vibrant=Пройдите напрямую между внутренним и внешним краями пояса Вайбранта.
project-next-beltbreaker-umbra=Пройдите через Разлом Умбры.
project-next-beltbreaker-done=Оба опасных перехода зарегистрированы.
project-next-array-build=Установите и запитайте архивные станции в трёх разных системах.
project-next-array-done=Три станции работают. Архивный сигнал восстановлен.
project-next-ark-build=Постройте тяжёлый защищённый заводской корабль и выполните рейс в Глубокий космос.
project-next-ark-done=Ковчег достиг дальнего рубежа. Экспедиция сохранена в журнале.
project-skybridge-guide=Подтвердите двустороннюю инфраструктуру родной катапульты, оформите квитанцию и доставьте её на другой мир.
project-skybridge-native-unavailable=Не обнаружены поддерживаемые физические катапульты. Ложное продвижение не начисляется.
