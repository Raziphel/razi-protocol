project-beltbreaker-uncrossed=Не пройдено: __1__
project-array-guide=Установите архивные ретрансляторы RAZI на мирах трёх разных звёздных систем. Поддерживайте электропитание.
project-array-site=Приёмник работает: __1__ / __2__
project-array-record-1=АРХИВ 01 / ПОТЕРЯ СТАНЦИИ. После штатного отчёта экипажа станция замолчала. Последняя просьба: установить второй приёмник.
project-array-record-2=АРХИВ 02 / ОТВЕТНЫЙ СИГНАЛ. Пропавшие отчёты отправили на внутренний адрес, которого нет в реестре персонала.
project-array-record-3=АРХИВ 03 / ПРИОРИТЕТ. Приказ RAZI: сохранить сообщение прежде машин. Личность отправителя по-прежнему скрыта.
project-ark-guide=Создайте большую самостоятельную производственную платформу с двигателями, защитой и сборочными автоматами.
project-ark-requirements=Не менее __1__ кг массы, 3 двигателей, 4 турелей и 2 сборочных автоматов. Достигните края системы, Нексуса или Разрушенной планеты.
project-ark-candidate=Ковчег готов к вылету: __1__
archive-array-heading=ВОССТАНОВЛЕНО / АРХИВНАЯ СЕТЬ
archive-array-title-1=ПЕРЕДАЧА 01 / ПОТЕРЯ СТАНЦИИ
archive-array-title-2=ПЕРЕДАЧА 02 / ОТВЕТНЫЙ СИГНАЛ
archive-array-title-3=ПЕРЕДАЧА 03 / ПРИОРИТЕТНЫЙ ПРИКАЗ
archive-array-record-1=В 04:12 станция перестала отвечать. За шесть секунд до этого экипаж сообщил о штатной работе энергосети и сигнале неизвестного корабля. Последним распоряжением стала просьба о втором пункте наблюдения.
archive-array-record-2=Часы трёх приёмников показывают разное время отправления, но сам текст одинаков. Копии направлены на внутренний адрес RAZI без связанной записи о сотруднике. Система отметила сообщение полученным.
archive-array-record-3=Корпоративный приказ: прежде всего сохранить сигнал. Затем сохранить машины. До подтверждения тремя независимыми системами личность отправителя не раскрывать. Последняя строка не подписана.

