project-caption-skybridge=Постройте реальные катапульты на двух мирах и зарегистрируйте доставку.
project-caption-beltbreaker=Преодолейте оба настоящих астероидных пояса на космических платформах.
project-caption-array=Постройте и запитайте архивные ретрансляторы в трёх звёздных системах.
project-caption-ark=Проведите тяжёлый защищённый заводской корабль до Глубокого космоса.
