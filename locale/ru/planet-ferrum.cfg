[recipe-description]
ferrum-atmospheric-condensation=Выжимает воду и растворённые соли из мёртвого воздуха Феррума.
ferrum-coal-agglomeration=Простые атомы углерода можно снова связать в более сложные соединения.
ferrum-copper-cementation=В растворе железо теряет твёрдую форму, а медь оседает на нём, и плиты словно превращаются в другой металл.
ferrum-crude-agglomeration=Без катализатора связывание углерода расходует впустую бо́льшую часть кислоты.
ferrum-crude-molten-iron=Плавить плиты, сжигая топливо, можно, но это обходится дорого.
ferrum-holmium-separation=Гольмий в растворе — такой же редкоземельный элемент, как и все остальные.
ferrum-lubricant-pyrolysis=Пиролиз позволяет расщеплять сложные углеводороды, такие как смазочная жидкость, на составляющие элементы.
ferrum-lubricant-reclamation=Разделяет смазочную жидкость на исходные кислоту и мазут.
ferrum-molten-iron=Мазут переносит тепло и оставляет после себя немного углерода.
ferrum-rare-earth-micronutrients=В больших концентрациях редкоземельные элементы губительны для живого, но в крайнем случае небольшое их количество может стимулировать рост растений.
ferrum-rare-earth-separation=Прогоняет раствор по циклу, понемногу отбирая всё, что в нём было.
ferrum-solvent-extraction=Расточительно извлекает бо́льшую часть редкоземельных элементов из глины за один цикл.

