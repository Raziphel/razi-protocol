[item-description]
ferrum-clay=Ионное выщелачивание глины — один из самых распространённых способов начать добычу редкоземельных металлов.
ferrum-concentrated-clay=Содержание редкоземельных элементов в сырой глине резко повышают дроблением, измельчением и электромагнитной сепарацией.
ferrum-fabricator=Экспериментальный сборочный автомат со встроенной дронстанцией, который использует пристыкованных дронов, чтобы усилить собственные возможности.
ferrum-infuser=Экспериментальная камера пропитки высокого давления, в которой жидкости быстро реагируют с предметами, проходящими через неё по конвейеру.
ferrum-overclock-robot=Экспериментальный транспортный дрон. Вылетая из дронстанции, он испускает ЭМ-волну по местной сети маяков и временно усиливает их эффекты.
ferrum-rare-earth-magnet=Наконец-то из оксидов редкоземельных элементов можно получить сплав и изготовить мощный постоянный магнит для самых разных потребительских нужд.
ferrum-rare-earth-oxide=Растворы редкоземельных элементов разделяют на отдельные элементы за сотни стадий отстаивания и получают полезные оксиды высокой чистоты.
ferrum-robotics-science-pack=Используется лабораториями для исследований.

[fluid-name]
ferrum-rare-earth-solution=Раствор редкоземельных элементов

[fluid-description]
ferrum-rare-earth-solution=Концентрат редкоземельных элементов дополнительно очищают, растворяя его, чтобы извлечь оставшиеся осадки и следы радиоактивных соединений.

