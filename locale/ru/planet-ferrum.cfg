[entity-description]
ferrum-clay-ore=Богатые редкоземельными элементами отложения, которые за многие эпохи наросли ржавчиной на поверхности планеты из ионов её атмосферы.
ferrum-frame-ore=Прорвавшаяся внутренняя артерия, из которой высыпались каркасы дронов. Их скопилось так много, что можно добывать.
ferrum-gear-ore=Прорвавшаяся внутренняя артерия, из которой высыпались железные шестерни. Их скопилось так много, что можно добывать.
ferrum-lubricant=Разорванная внутренняя артерия, из которой смазочная жидкость вытекает на поверхность Феррума.
ferrum-roboport=Связь с ней установлена с орбиты. Ни починить, ни убрать её нельзя. Подключена напрямую к внутренней электросети планеты.

