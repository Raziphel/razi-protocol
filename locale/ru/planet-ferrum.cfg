[technology-description]
ferrum-adaptive-chemistry=Первый фабрикатор доказывает, что на поверхности можно вести химию без присмотра.
ferrum-advanced-rare-earth-processing=Оптимизация переработки редкоземельных металлов повысит производство на Ферруме и за его пределами.
ferrum-contact=Установите связь с поверхностью Феррума.
ferrum-deionizing-belts=Защитите конвейеры от заряженной пыли Феррума, чтобы их можно было строить на поверхности.
ferrum-electrolysis=Те же ионы атмосферы, из-за которых Феррум непригоден для жизни, могут стать ценным источником электролитов.
ferrum-fabricator=Переработка редкоземельных элементов потребует большой гибкости и точности.
ferrum-frontline-robotics=Дронам нужно выживать в огне, в который они влетают.
ferrum-hydrocarbons=Способы преобразовывать, извлекать и соединять простые углеводороды.
ferrum-infusion-chemistry=Теперь реакции могут проходить прямо на конвейере.
ferrum-lubricant-reclamation=Сложные химические вещества можно разложить на основные составляющие.
ferrum-overclock-robots=Экспериментальные дроны, которые при вылете разгоняют ближайшие маяки.
ferrum-rare-earth-processing=Нововведения, необходимые, чтобы завершить наше производство редкоземельных металлов.
ferrum-robotics-science-pack=Хотя планета мертва, дроны Феррума могут многому нас научить.
planet-discovery-ferrum=Определите текущую траекторию Феррума.

