; Russian for diesel_machines: keys the mod and the translation packs leave in English or get wrong.

[entity-description]
diesel-agricultural-tower=Сажает и собирает растения высоким краном на грубой дизельной тяге. Опоры ЛЭП на полях не нужны — лишь бы двигатель был заправлен.
diesel-cargo-bulk-inserter=Мощный топливный манипулятор для массовой перевалки грузов. Легко переносит целые стопки за один захват.\nИдеален для разгрузки кораблей и перекладки предметов между большими хранилищами.
diesel-cargo-stack-inserter=Мощный топливный манипулятор для огромной пропускной способности. Складывает предметы стопками прямо на конвейер без единой искры электричества.
diesel-extra-long-handed-inserter=Мощный дизельный двигатель позволяет этому манипулятору двигать исключительно длинной и тяжёлой рукой. Дотягивается гораздо дальше обычных манипуляторов. Электросеть ему не нужна — лишь бы жидкое топливо поступало исправно.
diesel-fast-inserter=Работает на грубом дизельном двигателе и двигается гораздо быстрее обычного электрического собрата. Не требует электросети, но постоянно нуждается в жидком топливе.
diesel-long-handed-inserter=Топливный манипулятор с увеличенным вылетом. Работает без электросети, пока дизельный двигатель заправлен.
diesel-miner=Ревущая машина беспощадной добычи. Этот колосс грубой силой вгрызается в месторождения. Ему важна огромная немедленная выработка, а не бережливость: снижения расхода ресурсов, на которое полагаются слабые электрические собратья, у него нет.
diesel-asteroid-collector=Сборщик астероидов с дизельным двигателем на жидком топливе. Работает независимо от электросети. Медленнее электрического аналога, но имеет вдвое больший радиус сбора.

