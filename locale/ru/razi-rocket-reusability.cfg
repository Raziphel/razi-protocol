[mod-setting-description]
debug-mode=Писать диагностические сообщения в factorio-current.log. Рекомендуется: выключено.
enable-incomplete-rocket-parts=Меняет способ сборки ракет.\nНужно в основном для баланса: без этого можно просто запускать ракеты и получать бесконечно процессоров и конструкций малой плотности.\nРекомендуется: включено.
enable-incomplete-rocket-parts-productivity=Разрешает продуктивность для незавершённых деталей ракеты. С модулями высшего уровня может сильно ломать баланс.\nРекомендуется: выключено.
razi-rocket-reusability-allow-modded-platforms=Если включено, учитываются все построенные платформы, включая стартовые наборы из модов. Если выключено — только разрешённые стартовые наборы.
razi-rocket-reusability-max-active-wrecks=Ограничивает число целых отработанных ракет на одной платформе. Если платформа заполнена, ракеты могут достаться другим доступным платформам. По умолчанию: 3.
razi-rocket-reusability-recovery-chance=Шанс появления отработанной ракеты при каждом подходящем запуске. По умолчанию: 100%.
razi-rocket-reusability-side-arrival-chance=Доля подходящих отработанных ракет, которые пытаются подлететь слева или справа, если подлёт сбоку включён. По умолчанию: 35%. 100% — сначала сбоку, 0% — только спереди. Если обе стороны небезопасны, ракета подлетает спереди.
razi-rocket-reusability-side-arrivals=Отработанные ракеты могут подлетать к космической платформе сбоку — это сложнее. По умолчанию выключено. Общее число ракет не увеличивается.
razi-rocket-reusability-spawn-distance=Минимальное расстояние появления перед хабом, в клетках. На длинных платформах точка появления автоматически сдвигается за передний край корпуса. По умолчанию: 64.
