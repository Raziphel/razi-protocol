[mod-setting-description]
pre-heated-exchanger-crafting-mode=[font=default-bold]Раздельно:[/font] в меню крафта остаются и обычный, и догревающий теплообменник.\n[font=default-bold]Вместе:[/font] рецепт обычного теплообменника скрыт, а догревающий ставится в режиме теплообменника (вода → пар 500°C). Построенные машины и предметы в инвентаре остаются. Если сборка запрещает переключать режимы, работает «Раздельно».

