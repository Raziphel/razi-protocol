inert-acidworking-science-pack=Химическую реакцию внутри нужно запустить с помощью [fluid=hydrogen-chloride].
muriatic-solution-barrel=Муриатический раствор в бочке. Со временем бочка разъедается и кислота выливается. Бочки более высокого качества держатся дольше, но взрываются сильнее.
acidophile-lichen=Кремниевые лишайникоподобные организмы, которые живут за счёт хлоридных солей.

