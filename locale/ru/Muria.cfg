; Russian for Muria: keys the mod and the translation packs leave in English or get wrong.

[entity-description]
scrubber=Машина, поглощающая загрязнители и компоненты атмосферы с помощью катализатора.
biovat=Малоэффективная машина для биологических процессов. На Мурии поглощает часть кислот из воздуха.
fungicultural-tower=Машина для выращивания грибов и лишайников.
lead-construction-robot=Более медленный строительный дрон с повышенной стойкостью. Переносит больше груза.
lead-logistic-robot=Более медленный транспортный дрон с повышенной стойкостью. Переносит больше груза.
smelting-plant=Постройка для плавки материалов и металлургии. Позволяет обрабатывать свинец. На Мурии выделяет кислоты и разъедает уязвимые постройки поблизости.
big-chloric-rock=Большой конгломерат хлоридных солей и камня.
metallic-lichen-colony=Колония кислотолюбивого лишайника, выросшая на хлоридных солях.
shotgun-turret=Мощная турель, стреляющая патронами для дробовика. Наносит урон дружественным объектам перед собой.

