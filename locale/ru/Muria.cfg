[technology-description]
air-scrubbing=Вода и различные катализаторы позволяют очищать атмосферы планет от загрязнений и извлекать из воздуха следовые ресурсы.
acidworking-science-pack=Открывает продвинутые способы применения кислот и токсичных материалов, а также строительство ракет, способных покинуть Мурию.
advanced-acid-processing=Более продвинутые процессы получения и использования [fluid=sulfuric-acid] и [fluid=hydrogen-chloride].
explosive-shotgun-shell=Модифицированные патроны для дробовика с разрывным зарядом на основе [fluid=chlorine] и [item=carbon]. Идеальны для уничтожения крупных астероидов в космосе.
hydrogen-chloride-explosives=Альтернативный рецепт [item=explosives] с использованием свойств [fluid=hydrogen-chloride].
hydrogen-chloride-from-biter-egg=Аккуратно извлекая кислотные железы у растущих кусак и плевак, можно получить простой источник [fluid=hydrogen-chloride] на Нувисе.
hydrogen-chloride-lead-battery=Альтернативный рецепт [item=battery] с использованием [item=lead-plate].
lead-robots=Дроны, усиленные [item=anti-corrosion-cladding]. Они стойче, переносят больше груза и выдерживают кислоты Мурии, но летают медленнее.
leaded-fuel=Свинцовые гранулы позволяют улучшить ракетное топливо: невероятная прибавка к скорости, но огромный множитель загрязнения.
murian-oil-processing=Переработка биомассы из [entity=eschatotaxite] вместе с другими ресурсами Мурии даёт нефть и нефтепродукты прямо на Мурии.
offworld-chlorine-compounds-production=Процессы получения и переработки [fluid=chlorine] и [fluid=hydrogen-chloride] за пределами [planet=muria].
pickled-casting=Более продвинутый метод литья. [fluid=hydrogen-chloride] вместе с расплавленным металлом стравливает примеси и сокращает потери: промежуточные рецепты литья расходуют на 25% меньше расплава.
planet-discovery-muria=Небольшая планета с сильным парниковым эффектом. Мелкие озёра едкого [fluid=muriatic-solution] выделяют газы, которые греют планету. Жидкость из озёр можно качать [entity=offshore-pump]. На поверхности, похоже, есть жизнь.
hydronium-destruction-productivity=Более современные методы разрушения [fluid=hydronium] позволяют восстановить больше молекул [fluid=kr-oxygen] и [fluid=kr-hydrogen].
holmium-chloride=Изучение хлоридных солей позволяет искусственно синтезировать хлорид гольмия, чтобы продлить цепочку переработки гольмия и получать на Фульгоре больше гольмия. Вместе с этим открывается искусственное выращивание колоний лишайника, способных жить в нефтяном океане Фульгоры и на глубоких участках муриатических озёр Мурии.
lead-refining=Продвинутый рецепт, повышающий качество свинца.

[tile-description]
muriatic-solution=Раствор [fluid=chlorine] и [fluid=hydronium] с рассеянными кусками [item=cotunnite]. Брошенные в него ресурсы уничтожаются.
acidophile-lichen=Колония кремниевых лишайникоподобных организмов, живущих за счёт солей хлора. Подавайте на неё соли [entity=fungicultural-tower], чтобы выращивать колонии лишайника.
artificial-lichen-colony=Искусственно собранная колония кислотолюбивого лишайника.

[tips-and-tricks-item-description]
acid-immunity-list=Сбор [entity=metallic-lichen-colony] и [entity=cotunnite-lichen-colony] высвобождает коррозионные газы, повреждающие большинство машин. Слой загрязнения на карте показывает опасные для них области. Коррозионную атмосферу можно ослабить посадкой и сбором [entity=eschatotaxite].\nБольшинство созданных игроком объектов на загрязнённых клетках [planet=muria] постоянно получают урон от кислот, кроме следующих:\n- [entity=fungicultural-tower] — основной источник и поглотитель кислот;\n- [entity=acidworking-plant] и [entity=smelting-plant] — они, напротив, увеличивают количество коррозионных кислот;\n- [entity=biovat] — поглощает часть кислот из воздуха;\n- [entity=scrubber] — специально предназначен для поглощения кислот и других загрязнителей;\n- все энергетические объекты: опоры, генераторы и аккумуляторы;\n- все логистические объекты, кроме роботов; дронстанции не получают урон;\n- поезда, включая [entity=locomotive], [item=rail] и другие;\n- [entity=rocket-silo], [entity=cargo-landing-pad] и [entity=cargo-bay];\n- все буры;\n- [entity=beacon];\n- все трубы;\n- все сундуки.

