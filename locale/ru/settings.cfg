[mod-setting-name]
razi-enable-enemy-routing=[color=yellow][font=heading-2]Миры и угрозы[/font][/color] Распределять фракции врагов по планетам
razi-planetary-interdependence=[color=cyan][font=heading-2]Промышленная интеграция[/font][/color] Взаимосвязь планет
razi-enable-k2so-production-exchanges=[color=cyan][font=heading-2]Промышленная интеграция[/font][/color] Межпланетное производство K2SO
razi-enable-modded-planet-exchanges=[color=cyan][font=heading-2]Промышленная интеграция[/font][/color] Производственные связи планет из модов
razi-hide-redundant-assembler-tiers=[color=green][font=heading-2]Удобство[/font][/color] Скрыть лишние сборочные автоматы 4-го уровня
razi-enable-expedition-briefings=[color=green][font=heading-2]Удобство[/font][/color] Экспедиционные описания на звёздной карте
razi-starmap-orbit-density=[color=#B7A0FF][font=heading-2]Карта галактики[/font][/color] Детализация орбит
razi-starmap-soften-bellicos=[color=#B7A0FF][font=heading-2]Карта галактики[/font][/color] Яркость пульсара

[string-mod-setting]
razi-planetary-interdependence-off=Выкл.: независимые миры
razi-planetary-interdependence-balanced=Сбалансировано (рекомендуется)
razi-planetary-interdependence-deep=Глубокая: расширенная торговля
razi-starmap-orbit-density-clean=Чистая: одна орбита на систему
razi-starmap-orbit-density-balanced=Сбалансированная: основные орбиты
razi-starmap-orbit-density-full=Полная: все орбиты планет (по умолчанию)
razi-starmap-orbit-density-off=Выкл.: скрыть стандартные орбиты планет

[mod-setting-description]
razi-enable-enemy-routing=[font=default-bold]Распределение врагов по мирам[/font]\nДа: Расселить поддерживаемые фракции врагов по тематическим планетам и убрать там появление стандартных врагов. [color=red]РЕКОМЕНДУЕТСЯ[/color]\nНет: Оставить появление врагов под управлением исходных модов.\n\n[font=default-small][color=yellow]Влияет на генерацию новой местности. Уже появившиеся враги не исчезают.[/color][/font]
razi-planetary-interdependence=[font=default-bold]Взаимосвязь планет[/font]\\nСбалансировано: стандартные научные связи, исследовательские данные K2SO и альтернативные рецепты. [color=red]РЕКОМЕНДУЕТСЯ[/color]\\nГлубокая: ещё девять необязательных производственных связей с ограниченной прибавкой продукции до 30%, без бонусов продуктивности.\\nВыкл.: отключить дополнительные связи исследований и производства Razi; основные системные исследования и рецепты других модов остаются.\\n\\n[font=default-small][color=cyan]Настройка запуска. Перед сменой режима сохраните резервную копию. Два дополнительных переключателя рецептов продолжат действовать.[/color][/font]
razi-enable-k2so-production-exchanges=[font=default-bold]Дополнительные производства K2SO[/font]\nДа: Добавить необязательные улучшенные рецепты, связывающие промышленность разных систем, когда доступны исходные материалы, технологии и оборудование. [color=red]РЕКОМЕНДУЕТСЯ[/color]\nНет: Оставить обычные рецепты K2SO без дополнительных производственных связей Razi.\n\n[font=default-small][color=cyan]Не отключает K2SO, системные техкарты, обязательные исследования или исходные рецепты.[/color][/font]
razi-enable-modded-planet-exchanges=[font=default-bold]Промышленность планет из модов[/font]\nДа: Добавить необязательные альтернативные рецепты, объединяющие материалы Рубии, Парацельсина, Мошина, Линокса, Весты и Тенебриса. [color=red]РЕКОМЕНДУЕТСЯ[/color]\nНет: Сохранить исходные производства планет без дополнительных связей Razi.\n\n[font=default-small][color=cyan]Настройка независима от производства K2SO. Обязательное открытие планет не меняется.[/color][/font]
razi-hide-redundant-assembler-tiers=[font=default-bold]Упрощение технологической ветки[/font]\nДа: Скрыть лишние сборочные автоматы 4-го уровня из Planetaris Hyarion и Lithium Battery, включая их предметы, рецепты и ненужные связи улучшений. [color=red]РЕКОМЕНДУЕТСЯ[/color]\nНет: Оставить исходные уровни сборочных автоматов.\n\n[font=default-small][color=green]Продвинутый сборочный автомат K2SO уже выполняет ту же роль. Для применения нужен перезапуск.[/color][/font]
razi-starmap-soften-bellicos=Уменьшает яркость пульсара Белликос без изменения маршрутов и опасностей.
razi-starmap-orbit-density=По умолчанию отображаются все стандартные орбиты планет. Сбалансированная и чистая настройки показывают меньше колец; «Выкл.» скрывает стандартные орбиты планет Razi. Особые орбиты и орбиты спутников сохраняются. Положения планет, маршруты и исследования не меняются. Требуется перезапуск.
razi-enable-expedition-briefings=[font=default-bold]Заметки исследователя галактики[/font]\nДа: Сохранить описания авторов планет и дополнить их цветными заголовками систем Razi и краткими сведениями об экспедиции. [color=red]РЕКОМЕНДУЕТСЯ[/color]\nНет: Оставить исходные описания планет и космических объектов без изменений.\n\n[font=default-small][color=green]Меняет только текст, не маршруты, исследования или производство.[/color][/font]
