[mod-setting-name]
razi-enable-enemy-routing=Расселение врагов Razi
razi-hide-redundant-assembler-tiers=Скрыть лишние уровни сборочных автоматов

[mod-setting-description]
razi-enable-enemy-routing=Если включено, Razi Protocol переносит врагов из поддерживаемых модов на тематические планеты и отключает появление ванильных врагов на этих планетах. Выключите, чтобы появлением врагов управляли сами моды врагов и планет.
razi-hide-redundant-assembler-tiers=Скрывает сборочные автоматы 4-го уровня из Planetaris Hyarion и Lithium Battery вместе с их предметами, рецептами и открытиями. Эту роль уже выполняет более ранний продвинутый сборочный автомат Krastorio 2, так что они только загромождают прогрессию и Factoriopedia.
