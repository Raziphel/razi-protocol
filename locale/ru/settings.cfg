[mod-setting-description]
razi-habitat-armoured-biters=Выбирает планеты с дополнительными гнёздами Бронированные кусаки. Легко: мало; Обычно: стандарт; Сложно: расширено; Кошмар: все. Нексус включён при любом активном режиме. Выкл. отключает только RP3, а не родные гнёзда. Нужен перезапуск. Планеты: Hyarion, Crucible, Castra, Athos, Ferrum, Obsidiax, и Нексус при включённом режиме. Авто по умолчанию следует выбранной сложности, а ручной выбор меняет только этот вид.
razi-habitat-cold-biters=Выбирает планеты с дополнительными гнёздами Ледяные кусаки. Легко: мало; Обычно: стандарт; Сложно: расширено; Кошмар: все. Нексус включён при любом активном режиме. Выкл. отключает только RP3, а не родные гнёзда. Нужен перезапуск. Планеты: Aquilo, Frozeta, Shchierbin, Vesta, Muria, Balack, и Нексус при включённом режиме. Авто по умолчанию следует выбранной сложности, а ручной выбор меняет только этот вид.
razi-habitat-explosive-biters=Выбирает планеты с дополнительными гнёздами Взрывные кусаки. Легко: мало; Обычно: стандарт; Сложно: расширено; Кошмар: все. Нексус включён при любом активном режиме. Выкл. отключает только RP3, а не родные гнёзда. Нужен перезапуск. Планеты: Moshine, Cubium, Corrundum, Crucible, Obsidiax, и Нексус при включённом режиме. Авто по умолчанию следует выбранной сложности, а ручной выбор меняет только этот вид.
razi-habitat-toxic-biters=Выбирает планеты с дополнительными гнёздами Ядовитые кусаки. Легко: мало; Обычно: стандарт; Сложно: расширено; Кошмар: все. Нексус включён при любом активном режиме. Выкл. отключает только RP3, а не родные гнёзда. Нужен перезапуск. Планеты: Cubium, Vesta, Paracelsin, Rabbasca, Foliax, Gleba, Velora, Khemia, Crucible, и Нексус при включённом режиме. Авто по умолчанию следует выбранной сложности, а ручной выбор меняет только этот вид.
razi-habitat-arachnids=Выбирает планеты с дополнительными гнёздами Арахниды. Легко: мало; Обычно: стандарт; Сложно: расширено; Кошмар: все. Нексус включён при любом активном режиме. Выкл. отключает только RP3, а не родные гнёзда. Нужен перезапуск. Планеты: Arig, Crucible, Castra, Athos, Panglia, Tenebris, и Нексус при включённом режиме. Авто по умолчанию следует выбранной сложности, а ручной выбор меняет только этот вид.
razi-habitat-electric-enemies=Выбирает планеты с дополнительными гнёздами Электрические враги. Легко: мало; Обычно: стандарт; Сложно: расширено; Кошмар: все. Нексус включён при любом активном режиме. Выкл. отключает только RP3, а не родные гнёзда. Нужен перезапуск. Планеты: Corrundum, Ribbonia, Fulgora, Ferrum, Cerys, Khemia, и Нексус при включённом режиме. Авто по умолчанию следует выбранной сложности, а ручной выбор меняет только этот вид.
razi-factory-throughput=Скорость производства печей и сборочных машин из базовой игры и других модов.
razi-fortification-durability=Максимальное здоровье стен и ворот из базовой игры и других модов. Не влияет на врагов или турели.
razi-resource-frequency=В режиме Своя изменяет частоту ресурсов на подходящих планетах.
razi-resource-patch-size=В режиме Своя изменяет размер месторождений, не создавая новые типы руды.
razi-resource-richness=В режиме Своя изменяет богатство ресурсов, включая материалы других модов.
razi-science-demand=В режиме Своя изменяет стоимость исследований, сохраняя технологии.
razi-evolution-speed=В режиме Своя изменяет эволюцию врагов без новых скриптов.
razi-rocket-launch-cost=Изменяет требуемое число частей ракеты для запуска в поддерживаемых шахтах. В уже начатых играх возможны изменения незавершённых ракет.
razi-spoilage-pressure=Скорость порчи скоропортящихся предметов. На лёгкой сложности больше времени на доставку, на сложной и Кошмаре требуется быстрая логистика.
razi-pollution-pressure=Изменяет распространение загрязнения через настройки движка Factorio.
razi-raid-coordination=Размер и число групп нападения. Лимиты для мультиплеера.
razi-colony-expansion=Частота и размер групп для создания колоний без новых скриптов.
razi-default-new-game-map=Выбирать Razi Protocol при создании игры. Сложность применяется к поддерживаемым базовым параметрам карты. Полные профили можно выбрать вручную. Отключите, чтобы сохранить обычный выбор.
razi-enemy-pressure=Плотность гнёзд на новых участках планет. Ранее открытые участки не меняются.
razi-nexus-hostility=Плотность всех видов врагов на Нексусе, обычные кусалы остаются.
razi-big-monsters-events=На сложностях Сложная и Кошмар включает события Big-Monsters через официальный интерфейс. Частота остаётся в настройках исходного мода.
razi-difficulty-preset=Обычная сложность по умолчанию. Ручное изменение расширенных игровых настроек включает режим Своя для эффективного баланса. Интерфейс выбора сам не переключается. Настройки других модов и уже созданные участки карт не перезаписываются. Нужен перезапуск.
razi-hide-spoilers=Скрывает будущие исследования и главы журнала. Доступные открытия остаются видимыми. Общая настройка карты; применяется сразу.
razi-hide-other-tech-spoilers=Также скрывает будущие исследования других модов. Отключите при конфликтах с их деревом технологий. Требует скрытия открытий.
razi-clean-startup-chat=Один раз очищает чат при запуске новой карты, включая предупреждения других модов. Поздние сообщения сохраняются.
razi-show-welcome=Показывает краткое приветствие со ссылками на журнал, вики и Discord. Команда /razi-welcome повторит его.
razi-journal-show-button=Показывает золотую кнопку журнала слева сверху. Горячая клавиша Ctrl+Shift+J работает и без кнопки. Применяется сразу.
razi-journal-show-tracker=Показывает боковую панель закреплённой цели. Скрытие не снимает закрепление. Применяется сразу.
razi-enable-enemy-routing=Распределяет поддерживаемые фракции по подходящим мирам. Выкл.: размещение исходных модов. Влияет лишь на новые участки.
razi-quality-asteroids=Добавляет астероиды высокого качества на опасных маршрутах по 10-уровневой шкале. Домашние маршруты остаются безопасными.
razi-asteroid-difficulty-scale=Баланс: стандартная шкала 1–10. Сложный и Безжалостный усиливают угрозы на дальних маршрутах.
razi-asteroid-population=Частота враждебных астероидов на маршрутах Razi: 65%, 100%, 130% или 160%. Типы астероидов не меняются.
razi-belt-threats=Множитель дополнительных крупных астероидов в поясах Razi: 50%, 100% или 150%. Исходные встречи не затрагиваются.
razi-belt-resource-richness=Количество дополнительной руды Razi в поясах: 60%, 100% или 150%. Остальные месторождения не меняются.
razi-belt-midsection-salvage=Добавляет руду в опасную центральную часть пересечения пояса. Выкл.: исходное размещение ресурсов.
razi-belt-edge-harvesting=Позволяет добывать руду на более безопасных краях поясов. Выкл.: больше зависимости от боёв.
razi-performance-asteroid-particles=Убирает часть декоративных частиц от астероидов. Возможен прирост FPS, но не UPS. Добыча не меняется. Выкл. по умолчанию.
razi-performance-weapon-particles=Уменьшает частицы выстрелов и лучей. Урон прежний; эффекты проще. Выкл. по умолчанию.
razi-performance-reduced-fragments=Сокращает число обломков крупных астероидов. Уменьшает И нагрузку, И добычу. Выкл. по умолчанию.
razi-performance-outer-hostile-density=На 28% снижает число враждебных астероидов на маршрутах уровней 8–10. Игра становится легче. Выкл. по умолчанию.
razi-performance-space-explosion-smoke=Уменьшает дым космических взрывов. Урон и звуки сохраняются. Выкл. по умолчанию.
razi-performance-asteroid-creation-dust=Уменьшает пыль от появления астероидов. Сами астероиды и качество не меняются. Выкл. по умолчанию.
razi-performance-compact-route-overlays=Рисует меньше графических слоёв маршрутов. Кривые чуть грубее, UPS не меняется. Выкл. по умолчанию.
razi-planetary-interdependence=Выкл.: убирает необязательные связи. Баланс: задуманный режим. Глубокая: больше рецептов с импортом. Основной прогресс сохранён.
razi-enable-k2so-production-exchanges=Добавляет необязательные межпланетные рецепты из ресурсов K2SO. Основные исследования и рецепты не меняются.
razi-enable-modded-planet-exchanges=Добавляет необязательные производственные связи модифицированных планет. Исходные рецепты сохраняются.
razi-distributed-technology=Привязывает некоторые технологии роботов, ядерной энергии и модов к науке планет. Выкл.: исходные требования.
razi-companion-science-weave=Подключает поддерживаемые железные дороги и щиты к региональной науке при наличии требований. Выкл.: исходные технологии.
razi-orbital-catapult-local-links=Добавляет двусторонние грузовые пути между Мурией, Рубией и Аквило. Действуют стандартные правила катапульт.
razi-orbital-catapult-regional-links=Добавляет короткие двусторонние пути катапульт в трёх системах. Астероидные пояса не обходятся.
razi-route-distance-repair=Исправляет слишком короткие расстояния до дальних миров. Выкл.: расстояния исходных модов.
razi-dyson-milestone-weave=Привязывает поздние улучшения сферы Дайсона к исследованиям планет. Исходные машины не меняются.
razi-dyson-calidus-layout=Размещает исходные орбиты Дайсона компактно вокруг Калидуса. Меняет только карту.
razi-helios-progression=Поздний режим добавляет HELIOS. Эпический режим требует исследований внешних систем, если не возникает цикл. Исходный режим оставляет прежние требования.
razi-helios-construction=Выкл.: исходные рецепты. Инженерия добавляет щиты, каркасы и матрицы. Спутники требуют дополнительные компоненты, если производственные машины их поддерживают.
razi-helios-commissioning=Экспедиция требует реальные грузы на орбитах звезды и питаемые энергией станции на планетах. Монументальный режим увеличивает требования. Выкл.: исходная механика сохраняется.
razi-helios-coronal-surges=Всплески прерывают работу и сбрасывают время ожидания на орбите. Иногда: 60 секунд каждые 10 минут; Часто: 80 секунд каждые 6 минут 40 секунд. Повреждения плазмой остаются под управлением исходного мода.
razi-helios-convergence-proof=Необязательная цель новой кампании: требует завершить проект HELIOS перед последней поставкой Конвергенции. По умолчанию выключено.
razi-helios-route-danger=Добавляет опасные астероиды ко всем подходам к звезде. Плазменные угрозы других модов сохраняются.
razi-helios-route-distance=Все пути к звезде остаются опасными. Длинный режим: внешняя орбита 125 000 км, внутренняя 65 000 км. Марафон: 175 000 и 100 000 км. Более длинные исходные маршруты сохраняются; сложность 8–9 и 9–10.
razi-hide-redundant-assembler-tiers=Скрывает дублирующие сборочные автоматы 4-го уровня, уже заменённые K2SO. Выкл.: исходные машины.
razi-enable-expedition-briefings=Добавляет короткие сведения об экспедиции к описанию планет. Выкл.: исходный текст. Только оформление.
razi-group-barreling-recipes=Переносит рецепты заполнения и опустошения бочек в группу жидкостей. Производство не меняется.
razi-group-spoilable-recipes=Отдельная группа для некоторых портящихся компонентов. Экспериментально; таймеры не меняются.
razi-hand-crafting-cleanup=Убирает рецепты, доступные только в машинах, из меню ручного создания. Ручные рецепты, машины, исследования и Факториопедия сохраняются. Все: включая другие моды; Razi: только рецепты с префиксом razi-. Общая настройка при запуске; нужен перезапуск.
razi-route-overlay-mode=Выкл.: стандартные линии. Угроза: цвета 1–10. Главы: цвета с оформлением глав. Маршруты остаются активными.
razi-route-overlay-scope=Все: цвет всех проверенных маршрутов. Основные: только главные пути и пояса. Неизвестные остаются стандартными.
razi-curated-space-routes=Использует авторские маршруты Razi с сохранением важных путей исходных модов. Выкл.: дополнительные исходные пути.
razi-route-intelligence=Добавляет расстояние, угрозы, ресурсы и советы к подсказкам маршрутов. Полёт не меняется.
razi-route-visibility=Яркость цветных линий: мягкая, стандартная или высокая. Стандартные пути сохраняются.
razi-route-detail=Экономия: меньше точек кривой. Плавно: больше. Стандартно: баланс внешнего вида и графической нагрузки.
razi-route-show-danger=Показывает оценку опасности от 1 до 10 в подсказках маршрутов.
razi-route-show-sizes=Показывает размер самого опасного астероида на маршруте.
razi-route-show-salvage=Показывает виды собираемых астероидных обломков.
razi-route-show-advice=Добавляет советы по обороне корабля на опасных путях.
razi-route-show-unknown=Предупреждает, если угрозы чужого маршрута не удалось определить.
razi-route-show-belts=Отмечает обязательные пересечения астероидных поясов.
razi-route-show-sectors=Показывает звёздные системы начала и конца пути.
razi-route-show-haul=Отмечает дальние грузовые перевозки.
razi-starmap-background-style=Выкл.: обычный фон. Сдержанно: спокойная навигационная карта. Кино: плотнее звёзды, объёмное свечение звёзд и цветная пыль вдали от маршрутов. Только оформление.
razi-starmap-orbit-density=Полная: все орбиты планет. Баланс и Чистая: меньше. Выкл.: убрать управляемые Razi орбиты.
razi-starmap-system-halos=Показывает мягкое цветное свечение звёзд. Положения миров не меняются.
razi-starmap-belt-atmosphere=Показывает тонкие пылевые кольца настоящих поясов. Угрозы не меняются.
razi-starmap-soften-bellicos=Приглушает яркость пульсара Белликос без изменения его формы.
razi-starmap-fine-details=Добавляет редкие дальние звёзды на фоне.
razi-starmap-galactic-ornaments=Добавляет слабые туманности между системами.
razi-starmap-micro-details=Добавляет мелкие полупрозрачные звёзды на фоне.
razi-starmap-cinematic-extras=Только в режиме Кино: звёздные скопления, многослойное свечение реальных звёзд и цветные облака пыли вдали от планет. Учитывает остальные настройки оформления. Без новых текстур и скриптов в каждом тике.
razi-starmap-cartography=Добавляет небольшую звёздную карту у Калидуса. Выкл. по умолчанию.
razi-map-star-intensity=Регулирует яркость звёздного фона. Только оформление.
razi-map-halo-intensity=Регулирует яркость свечения звёздных систем. Только оформление.
razi-map-belt-intensity=Регулирует яркость пыли в поясах. Астероиды не меняются.
razi-map-dust-intensity=Регулирует яркость туманностей. Только оформление.
