[mod-setting-description]
razi-enable-enemy-routing=Если включено, Razi Protocol переносит врагов из поддерживаемых модов на тематические планеты и отключает появление ванильных врагов на этих планетах. Выключите, чтобы появлением врагов управляли сами моды врагов и планет.
razi-hide-redundant-assembler-tiers=Скрывает сборочные автоматы 4-го уровня из Planetaris Hyarion и Lithium Battery вместе с их предметами, рецептами и открытиями. Эту роль уже выполняет более ранний продвинутый сборочный автомат Krastorio 2, так что они только загромождают прогрессию и Factoriopedia.
razi-starmap-orbit-density=Полная: все орбиты планет. Баланс и Чистая: меньше. Выкл.: убрать управляемые Razi орбиты.
razi-planetary-interdependence=Баланс: открытие планет в системе требует и науку соседних планет, например Ариг и Хайарион ждут боевую науку Кастры; необязательные рецепты обмена дают прибавку выхода за грузы с других планет. Глубокая: то же, но каждый привозной ингредиент на 50% больше и добавлен ещё один обмен. Выкл.: планеты системы открываются независимо, действуют только ворота систем, обменных рецептов нет. Рекомендуется для новых кампаний.
razi-stage-aquilo-breakthroughs=Криогенные инструменты Аквило остаются, но фундамент изучается после Мараксиса и Парацельсина, термоядерный реактор — после Кубиума и Тенебриса, легендарное качество — после «Освоения внешнего фронтира». Выкл.: исходное время открытия. Рекомендуется для новых кампаний.
razi-distributed-technology=Привязывает ядерную энергию и торговые исследования Planet Express к науке первых планет: ядерная энергия ждёт Вулканус и Глебу. Роботы и логистическая система остаются на Наувисе. Выкл. (по умолчанию): исходные требования; тяжёлая и кошмар включают сами. Баланс ещё не подтверждён.
razi-group-barreling-recipes=Переносит рецепты заполнения и опустошения бочек в группу жидкостей. Производство не меняется.
razi-group-spoilable-recipes=Отдельная группа для некоторых портящихся компонентов. Экспериментально; таймеры не меняются.
razi-hand-crafting-cleanup=Убирает из меню ручного создания рецепты, которые делаются только в машинах. Ручные рецепты, машины, исследования и Факториопедия не меняются. Все: рецепты всех модов. Razi: только рецепты с префиксом razi-. Выкл.: все рецепты видны. Общая настройка запуска: нужен перезапуск.
razi-curated-space-routes=Использует авторские маршруты Razi с сохранением важных путей исходных модов. Выкл.: дополнительные исходные пути.
razi-route-distance-repair=Исправляет слишком короткие расстояния до дальних миров. Выкл.: расстояния исходных модов.
razi-difficulty-preset=Задаёт сразу несколько настроек Razi: опасность и число астероидов, угрозы и руду в поясах, взаимосвязь планет и разделение технологий. Обычная ничего не меняет. Настройка, изменённая вручную, сохраняет своё значение; «Своя» берёт только сохранённые значения. Ниже показаны сохранённые значения, а не значения уровня. Тяжёлая и кошмар также ужесточают Razi Rocket Reusability. После смены перезапустите Factorio.
razi-asteroid-difficulty-scale=Баланс сохраняет задуманную десятиуровневую опасность маршрутов. «Сложнее» и «Беспощадно» повышают её на дальних маршрутах. Тяжёлая и кошмар выбирают их сами.
razi-asteroid-population=Частота враждебных астероидов на маршрутах Razi: 65%, 100%, 130% или 160%. Типы астероидов не меняются.
razi-belt-threats=Множитель больших и огромных астероидов на двух переходах поясов, Вайбранта и Умбры: 50%, 100% или 150%.
razi-belt-resource-richness=Количество дополнительной руды Razi в поясах: 60%, 100% или 150%. Остальные месторождения не меняются.
razi-belt-midsection-salvage=Добавляет руду в опасную центральную часть пересечения пояса. Выкл.: исходное размещение ресурсов.
razi-belt-edge-harvesting=Позволяет добывать руду на более безопасных краях поясов. Выкл.: больше зависимости от боёв.
razi-enable-expedition-briefings=Добавляет короткие сведения об экспедиции к описанию планет. Выкл.: исходный текст. Только оформление.
razi-starmap-soften-bellicos=Приглушает яркость пульсара Белликоса без изменения его формы.
razi-performance-compact-route-overlays=Рисует меньше графических слоёв маршрутов. Кривые чуть грубее, UPS не меняется. Выкл. по умолчанию.
razi-route-overlay-mode=Выкл.: стандартные линии. Угроза: цвета 1–10. Главы: цвета с оформлением глав. Маршруты остаются активными.
razi-route-overlay-scope=Все: цвет всех проверенных маршрутов. Основные: только главные пути и пояса. Неизвестные остаются стандартными.
razi-route-intelligence=Добавляет расстояние, угрозы, ресурсы и советы к подсказкам маршрутов. Полёт не меняется.
razi-route-visibility=Яркость цветных линий: мягкая, стандартная или высокая. Стандартные пути сохраняются.
razi-route-detail=Экономия: меньше точек кривой. Плавно: больше. Стандартно: баланс внешнего вида и графической нагрузки.
razi-route-show-danger=Показывает оценку опасности от 1 до 10 в подсказках маршрутов.
razi-route-show-sizes=Показывает размер самого опасного астероида на маршруте.
razi-route-show-salvage=Показывает виды собираемых астероидных обломков.
razi-route-show-advice=Добавляет советы по обороне корабля на опасных путях.
razi-route-show-unknown=Предупреждает, если угрозы чужого маршрута не удалось определить.
razi-route-show-belts=Отмечает обязательные пересечения астероидных поясов.
razi-route-show-sectors=Показывает звёздные системы начала и конца пути.
razi-route-show-haul=Отмечает дальние грузовые перевозки.
razi-starmap-background-style=Выкл.: обычный фон. Сдержанно: лёгкие детали. Кино: более яркий фон. Только оформление.
razi-starmap-system-halos=Показывает мягкое цветное свечение звёзд. Положения миров не меняются.
razi-starmap-belt-atmosphere=Показывает тонкие пылевые кольца настоящих поясов. Угрозы не меняются.
razi-starmap-fine-details=Добавляет редкие дальние звёзды на фоне.
razi-starmap-galactic-ornaments=Добавляет слабые туманности между системами.
razi-starmap-micro-details=Добавляет мелкие полупрозрачные звёзды на фоне.
razi-starmap-cartography=Добавляет небольшую звёздную карту у Калидуса. Выкл. по умолчанию.
razi-map-star-intensity=Регулирует яркость звёздного фона. Только оформление.
razi-map-halo-intensity=Регулирует яркость свечения звёздных систем. Только оформление.
razi-map-belt-intensity=Регулирует яркость пыли в поясах. Астероиды не меняются.
razi-map-dust-intensity=Регулирует яркость туманностей. Только оформление.
razi-quality-asteroids=Враждебные астероиды на космических маршрутах иногда появляются с повышенным качеством; шанс растёт с опасностью маршрута. Ресурсные куски не меняются. Вкл. по умолчанию; на старом сейве перед обновлением усильте защиту платформ или выключите настройку.
razi-performance-asteroid-particles=Убирает декоративные частицы и клубы дыма из взрывов, которые создают разрушающиеся астероиды. Возможен прирост FPS, но не UPS. Добыча не меняется. Выкл. по умолчанию.
razi-performance-weapon-particles=Убирает декоративные частицы снарядов и лучей. Урон прежний, часть эффектов выглядит проще. Выкл. по умолчанию.
razi-performance-reduced-fragments=Вдвое сокращает осколки, которые оставляют малые металлические, углеродные, оксидные и прометиевые астероиды. Уменьшает и число объектов, и добычу ресурсов. Выкл. по умолчанию.
razi-performance-outer-hostile-density=На 28% снижает число враждебных астероидов на самых опасных маршрутах (опасность 8–10). Ресурсные куски не меняются, но дальняя галактика становится легче. Выкл. по умолчанию.
razi-performance-space-explosion-smoke=Убирает дым и декоративные частицы взрывов астероидов, ракет, рельсотронов, артиллерии и других космических боёв. Урон и звуки сохраняются. Выкл. по умолчанию.
