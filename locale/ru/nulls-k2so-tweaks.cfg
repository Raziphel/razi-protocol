[mod-setting-description]
nulls-k2so-backport-K2SO-features=Переносит изменения дизайна и возможности из Krastorio 2 Spaced Out.
nulls-k2so-expanded-matter-recipes=Добавляет дополнительные рецепты преобразования материи, прежде всего для получения основных ресурсов K2SO на планетах, где иначе это было бы невозможно.
nulls-k2so-maraxsis-quantum-revert=Отменяет внесённые Мараксисом изменения названия и требований к строительству квантового компьютера.
nulls-k2so-modify-recycling-results=Пытается исправить несогласованные результаты переработки при игре с другими модами.
nulls-k2so-standardize-electrolysis=Переносит рецепты электролиза в электролизную установку K2 или электромагнитный завод. При отключении эти машины всё ещё можно использовать, но они перестают быть обязательными.

