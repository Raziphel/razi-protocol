convergence-deep-tour-unavailable=Не удалось прочитать граф маршрутов глубокого космоса. Пока он недоступен, финальная поставка закрыта.
convergence-deep-tour-arrived=[color=#7CD9AD]Посещено[/color]  __1__
convergence-deep-tour-missing=[color=#F7A969]Не посещено[/color]  __1__
convergence-deep-tour-proof=Лично посетите каждое место из списка на космической платформе своей команды. Перелёт без игрока, исследования, отметки на звёздной карте и Удалённый обзор не засчитываются. Могут помочь товарищи по команде. Отсутствующие или отсоединённые необязательные пункты посещать не требуется.
convergence-need-deep-chart=Не удалось прочитать места и маршруты глубокого космоса. Проверьте описания маршрутов. Без посещений финальная поставка закрыта.
convergence-need-deep-expedition=До финальной поставки для запуска лично посетите все связанные места глубокого космоса на платформе своей команды.
convergence-next-action-deep-tour=Посетите оставшиеся места глубокого космоса из проекта экспедиции.
