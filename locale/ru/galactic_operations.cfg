dyson-unavailable=В этом сохранении не найдены технологии Сферы Дайсона.
dyson-satellites=Запустите спутники Дайсона на звёздную орбиту, а спутники-ретрансляторы — к принимающей планете. Мод Dyson Sphere отслеживает их постройку и распределение по энергетическим соединителям.
dyson-safety=На внутренних солнечных орбитах опасны столкновения с плазмой. Возьмите средства защиты и соблюдайте ограничения энергетических соединителей из мода Dyson Sphere. Razi не создаёт бесплатную энергию и не запускает спутники.
convergence-heading=[color=#DBBCFF]Конвергенция[/color]
convergence-overview=Доставьте пять грузов на платформе у Края Солнечной системы или дальше, затем завершите финальную передачу. Для последнего груза также нужны исследования «Запуск Конвергенции» и «Сеть свидетелей Конвергенции», победа над всеми девятью боссами Нексуса, действующий якорь-свидетель в каждой из семи звёздных систем, личное посещение всех пунктов глубокого космоса и один приёмник Дайсона.
convergence-unavailable=В этом наборе модов нет технологий Конвергенции. Проверьте наличие нужных технологических карт и лаборатории, которая их принимает.
