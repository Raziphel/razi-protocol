convergence-stage-description-stellar=Спутники Дайсона, а также гольмий, вольфрам, процессорные блоки, низкоплотные конструкции, сверхпроводники и литий.
convergence-stage-description-industry=Редкие металлы, а также оптоволоконный кабель, рамы из краптонита, хитозан, цинк, электрические катушки и порошок редкоземельных металлов.
convergence-stage-description-deep-space=Прометиевые научные пакеты, а также данные криогенных, электромагнитных и аграрных исследований, научные пакеты Крусибла и научные пакеты пульсара.
convergence-stage-description-resonance=Сверхпроводники, а также супермагниты, золото, блоки управления энергией, гольмий и литий.
convergence-stage-description-ignition=Технологические карты сингулярности, а также карты технологий глубокого космоса, семь планетарных карт технологий и научные пакеты антиматерии.
convergence-build-stellar=Создайте предметы на заводе и перенесите их на экспедиционную платформу.
convergence-build-industry=Создайте предметы, погрузите их на корабль и доставьте на платформу.
convergence-build-deep-space=Поставка откроется после исследования Синхронизации глубокого космоса. Создайте предметы и возьмите их с собой.
convergence-build-resonance=Создайте предметы и доставьте их на платформу.
convergence-build-ignition=Исследуйте Протокол запуска Конвергенции, затем создайте предметы и доставьте их на платформу.
convergence-submit=Сдать груз
convergence-continued-play=После приёма пятого груза идёт финальная передача длительностью две минуты, затем появляется экран победы. Сохранение и загрузка не прерывают передачу. Команды, уже одержавшие победу, сохраняют её.
convergence-need-research=Перед доставками исследуйте Комиссию Конвергенции.
convergence-need-synchronization=До третьей поставки исследуйте Синхронизацию глубокого космоса.
convergence-need-ignition=До финальной поставки исследуйте Протокол запуска Конвергенции.
convergence-need-receiver=Для финальной поставки нужен размещённый приёмник Дайсона, принадлежащий вашей команде.
convergence-transmission-started=Финальная поставка принята: предметов — __1__. Началась финальная передача.
convergence-need-platform=Чтобы сдать груз, встаньте на платформу своей команды у Края Солнечной системы или дальше.
convergence-wrong-stage=Это не текущая поставка или она уже завершена.
convergence-no-force=Действующая команда не найдена.
convergence-no-cargo=В основном инвентаре нет предметов для следующей поставки.
convergence-delivered=Доставлен груз Конвергенции: __1__
convergence-broadcast=Команда __1__ завершила Конвергенцию.
convergence-victory-title=Razi Protocol: право продолжать
convergence-victory-message=Сеть семи систем ответила. Двигатель непрерывности наконец признал колонии живыми и отозвал чрезвычайные полномочия, которые сохранял после ухода их владельцев.
convergence-victory-stellar=Сигнал поддержала действующая звёздная сеть Калидуса.
convergence-victory-industry=Независимые заводы представили доказательство сотрудничества.
convergence-victory-deep=Внешние экспедиции ответили из-за пределов знакомых маршрутов.
convergence-victory-resonance=Отдельные сигналы живых свидетелей синхронизировались на одной частоте.
convergence-victory-ignition=Физическая поставка позволила Протоколу отменить устаревший мандат.
convergence-victory-final=Приказы RAZI Industries больше не действуют. Фабрики, колонии и будущее принадлежат тем, кто поддерживает в них жизнь. Продолжайте строить.
