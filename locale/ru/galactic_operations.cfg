convergence-legacy-victory=Команды, уже одержавшие победу, сохраняют её. Для них последующие этапы считаются завершёнными.
convergence-travel=Встаньте на платформу своей команды у Края Солнечной системы или на другом поддерживаемом пункте глубокого космоса. Удалённый обзор не позволяет сдать груз.
