[map-gen-preset-description]
razi-protocol=Автоматически выбранные базовые параметры мира для сложности RP3. Для полной настройки начальной зоны и ресурсов выберите соответствующий профиль.
razi-protocol-easy=Большая безопасная зона, больше ресурсов и медленный рост врагов.
razi-protocol-normal=Сбалансированный старт с развитием врагов и доступными ресурсами.
razi-protocol-hard=Небольшая безопасная зона, скромные ресурсы, опасные враги.
razi-protocol-nightmare=Минимальная безопасность, дефицит ресурсов и быстрая эволюция.
razi-protocol-custom=Изменяемый стандартный профиль. Настройки карты не изменяют глобальную сложность RP3.
