[map-gen-preset-description]
razi-protocol-easy=Частота руды 130%, размер 130%, богатство 155%; богатство нефти 162%; вражеские базы 48%; стартовая зона 255%; эволюция медленнее; цена исследований 100%. Лёгкая сложность применяет те же множители на каждой планете.
razi-protocol-normal=Собственные настройки карты игры. Планеты модов сохраняют свои значения. Выбран при обычной сложности.
razi-protocol-hard=Частота руды 82%, размер 85%, богатство 75%; богатство нефти 82%; вражеские базы 135%; стартовая зона 115%; эволюция и расселение врагов быстрее; цена исследований 125%. Тяжёлая сложность применяет те же множители на каждой планете.
razi-protocol-nightmare=Частота руды 68%, размер 75%, богатство 60%; богатство нефти 65%; вражеские базы 170%; стартовая зона 90%; эволюция и расселение врагов быстрее; цена исследований 175%. Сложность «Кошмар» применяет те же множители на каждой планете.
razi-protocol-curated=Частота руды 105%, размер 108%, богатство 120%; богатство нефти 120%; вражеские базы 85%; деревья 105%; стартовая зона 165%; расселение врагов на 2-7 чанков, группы поселенцев по 5-12, пауза от 4 до 60 минут. Выбирается только здесь; ни одна сложность его не выбирает.
razi-protocol-custom=Собственные настройки карты игры и сохранённые вручную настройки Razi Protocol. Выбран при сложности «Своя».
