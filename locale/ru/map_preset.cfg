[map-gen-preset-description]
razi-protocol-easy=Перед началом игры откройте Настройки > Настройки модов > Razi Protocol. Выберите Лёгкую сложность и перезапустите Factorio. На поддерживаемых планетах больше ресурсов и меньше врагов.
razi-protocol-normal=Перед созданием галактики откройте Настройки > Настройки модов > Razi Protocol. Выберите сложность и нужные игровые параметры, затем перезапустите Factorio. Соответствующий профиль карты выбирается автоматически: ресурсы, враги, эволюция и исследования зависят от сложности.
razi-protocol-hard=Перед началом откройте Настройки модов > Razi Protocol. Выберите Сложную игру и перезапустите Factorio. Ресурсы беднее, враги активнее, а исследования дороже.
razi-protocol-nightmare=Перед началом откройте Настройки модов > Razi Protocol. Выберите Кошмар и перезапустите Factorio. Дефицит ресурсов и опасные враги на совместимых планетах.
