[recipe-description]
razi-research-exchange=Создаёт три системные технологические карты из двух обычных наборов ингредиентов и дополнительных научных пакетов с двух планет. Исходный рецепт остаётся доступным.

[technology-description]
razi-calidus-research-exchange=Научные открытия Соляриса повышают эффективность производства карт Калидуса.
razi-solaris-research-exchange=Экологические и биологические науки Никсариса усиливают промышленность Соляриса.
razi-nyxaris-research-exchange=Экзотические науки Вайбранта объединяются с исследованиями Никсариса.
razi-vibrant-research-exchange=Открытия Кубиума и Тенебриса усиливают научное производство Вайбранта.
razi-beetlejuice-research-exchange=Прометий и Крусибл расширяют научную инфраструктуру дальнего космоса.

