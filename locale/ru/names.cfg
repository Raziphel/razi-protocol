[razi-location-briefing]
aegis-inner-edge=Вы пересекли поле Эгиды. Здесь находятся путь к Стражу и ответвление к пульсару. Оставьте боеприпасы на обратный рейс.
aegis-outer-edge=Дальше камней заметно больше. Почините платформу до перехода к внутреннему краю.
near-bellicos-orbit=Пульсар заполняет иллюминаторы. Это короткая разведывательная ветвь от внутреннего края, не путь к Калидусу.
bellicos-near-orbit=Разведка возле пульсара с внутреннего края Эгиды. Припасы на обратный путь берите с собой.
near_bellicos_orbit=Разведка возле пульсара с внутреннего края Эгиды. Припасы на обратный путь берите с собой.
point-warden=Последний пункт разведанного маршрута Эгиды. Всё необходимое для возвращения должно быть на корабле.
aegis-point-warden=Последний пункт разведанного маршрута Эгиды. Всё необходимое для возвращения должно быть на корабле.
skewer_shattered_planet=Это настоящая Расколотая планета за точкой подхода. Прежде чем лететь дальше, проверьте состояние платформы.
skewer_lost_beyond=Маршрут продолжается за Расколотой планетой. Карт здесь меньше, а быстрой дороги домой нет.

nulla=Поселение пустует. Ремонтные роботы всё ещё выходят на смену, а некоторые плохо реагируют на радиосигналы.
nauvis=Сначала наладьте питание, железо и производство без постоянного присмотра. Старый терминал всё ещё раздаёт задания отсутствующим сотрудникам.
muluna=Близко к Наувису для испытательного полёта, но достаточно далеко, чтобы ошибки дорого обошлись. Нужны регулярные поставки между луной и платформой.
vulcanus=Поддерживайте литейные цеха и отправляйте металл. На Кастре и Аригe ему найдётся применение.
castra=Среди боевых обломков осталось много исправных деталей. Восстановите станки и маршруты к Аригу и Хайариону.
arig=Пыль забивается повсюду, даже в водяные насосы. Не останавливайте подачу: Хайариону нужны минералы и стекло.
hyarion=Кристаллы требуют точной обработки. Другим заводам Соляриса понадобятся результаты.
tellus=Живые системы не подстраиваются под план выпуска. Защитите машины и наладьте перевозки к Коррундуму.
corrundum=Серная химия завершает промышленную цепочку Соляриса. Большая часть сырья уже производится на освоенных мирах.
igrys=Стекло, жидкости и голый камень. Необязательный мир, но ради его оборудования стоит подумать о грузовом рейсе.
gleba=Всё рано или поздно портится. Настройте производство так, чтобы урожай не погибал на складе.
moshine=Зонды, процессоры и жара пустыни. Данные пригодятся Панглии позже; пока наладьте местные заводы.
apia=Апия делит орбиту с Карновой, но не производство. Для её биологии и маточного молочка нужны отдельные линии.
carnova=Название на карте соседствует с Апией, но оборудование и биологические эксперименты здесь другие.
panglia=Временные искажения ломают привычные графики. Данные Мошина помогут, но корни и ДНК придётся исследовать на месте.
foliax=Необязательная ботаническая экспедиция. Возьмите оборудование для переработки: одной добычей здесь не обойтись.
rabbasca=На маленькой луне Глебы мало свободной энергии и есть охраняемые объекты. Запасите аккумуляторы.
pelagos=Здесь большая часть работ проходит на воде. Необязательный мир со своими правилами исследования и производства.
lemures=Лава и приливное тепло помогают выживать на ледяном мире Деа Диа. Сначала изучите местные маршруты.
prosephina=Мелководье и более тёплый климат делают этот мир непохожим на Лемурес. Для основной кампании он не обязателен.
fulgora=Под молниями хватает ценных обломков. Наладьте электротехнику, прежде чем отправлять грузы на Риббонию.
ribbonia=Риббония находится внутри пояса Вайбранта. Отсюда можно добраться до Хемии и внутреннего края. Для выхода наружу нужен корабль с защитой от астероидов.
paracelsin=Холодная химия, цинк и жидкий азот за поясом Вайбранта. Летите через внешний край; дальше расположен Ширбин.
cerys=Ядерное производство на луне Фульгоры. Исходные задачи восстановления реактора не изменены.
muria=Едкая химия осложняет первую высадку. Сначала запустите хлорное производство, потом снабжайте Рубию и Атос.
aquilo=Тепло здесь необходимо для работы оборудования. Следите за трубами и подвозом грузов из Рубии.
rubia=Буря может задержать рейс на несколько дней. Хороший склад полезнее оптимистичного расписания.
maraxsis=Купола, подлодки и огромное количество труб. Под водой ремонтировать их непросто.
obsidiax=Холодная лава и растущий камень требуют особых станков. Путь от Весты проходит снаружи пояса Умбры.
cubium=Кубическая переработка не прощает ошибок. Наладьте базу, прежде чем снабжать Линокс и Секретас.
linox-planet_linox=Под землёй тесно и жарко. Продумайте производство редкоземельных материалов до первой большой поставки.
secretas=У газового гиганта пересекаются астероидные пути. Перед рейсом к Фрозете запасите всё необходимое для возвращения.
frozeta=Замёрзшее кладбище кораблей. Главная задача — забрать материалы и при этом сохранить собственную платформу.
tenebris=Свет здесь так же важен, как руда. Учитывайте местную биологию, прежде чем лететь к Крусиблу.
crucible=Давление и металлический водород выводят обычные машины за пределы возможностей. Используйте родной орбитальный переход.
vesta=Подходящая внешняя база, если газовые и жидкостные линии работают стабильно. Отсюда идут пути к Обсидиаксу и Абакайбе.
abacayba=Руины, опасные заросли и Итаверакс. Без серьёзной подготовки сюда лучше не садиться.
carna=Чувствительные к холоду станки и старые машины под снегом. Не самая простая побочная вылазка.
nexus=Девять испытаний боссов и сложное оборудование. Журнал сохранит результаты, но побеждать придётся вам.
shattered-planet=Это точка подхода, а не настоящая Расколотая планета. Проверьте название места, прежде чем отмечать экспедицию завершённой.
solaris=Шесть промышленных миров с разными задачами. Наладьте совместную работу литейных заводов, обороны и химии.
nyxaris=Глеба выращивает, Мошин считает, а парные миры добавляют новые задачи. Одним заводом здесь не обойтись.
vibrant=Фульгора, Риббония и Хемия внутри пояса. Парацельсин и Ширбин снаружи. Между ними один опасный переход.
vespera=Химия Мурии, заводы Рубии и холодное производство Аквило зависят от регулярных поставок.
beetlejuice=Кубиум — главный перевалочный пункт. Линоксу нужны жар и редкоземельные материалы, Секретасу и Фрозете — сборщики обломков.
umbra=Организуйте снабжение на Весте снаружи пояса. За опасным переходом расположены Тенебрис и Крусибл.
sye-calidus=Домашний отправной пункт. Солярис и Никсарис открываются отдельно, и исследования одного не заменяют другое.
sye-solaris=Грузовой узел Соляриса. Исследованный путь к Эгиде уходит на юг, а местные промышленные маршруты остаются доступны.
sye-nyxaris=Грузовой узел Никсариса. Его отдельный путь встречается с солярисским у входных врат Эгиды.
sye-vibrant=Внешний подход к Вайбранту. Здесь расположен внешний край пояса; Риббония, Фульгора и Хемия находятся по другую сторону.
sye-vespera=Первый грузовой пункт Весперы. Начните с Мурии, затем снабжайте Рубию и более холодные миры.
sye-beetlejuice=Вход во внешний грузовой узел. Постройте базу на Кубиуме, прежде чем разделять флот между Линоксом и Секретасом.
sye-umbra=Подход к Умбре снаружи. Веста — удобная база перед переходом к Тенебрису.
solar-system-edge=Здесь сходятся внешние маршруты. Нексус, Чёрная дыра и Расколотая планета требуют собственных исследований.
apia-carnova-orbit=Общий перевалочный пункт Апии и Карновы. Транспорт они делят, а производственные цепочки — нет.
star-dea-dia=Необязательная соседняя звезда с двумя мирами. Для основной кампании она не нужна.
dea-dia-system-edge=Вход к паре миров Деа Диа. Проверьте местные пути, прежде чем планировать обратный груз.
razi-umbra-belt-inner=Переход через пояс Умбры заканчивается здесь. По эту сторону находятся Тенебрис и Крусибл.
razi-umbra-belt-outer=Последняя стоянка перед внутренним поясом Умбры. Проверьте орудия, ремонт и питание.
crucible-orbit=Орбитальный подход к Крусиблу. Переход к миру высокого давления начинается здесь.
pulsar=Яркий и неприветливый центр Эгиды расположен ниже Соляриса и Никсариса. Местные астероидные поля — не украшение.
calidus-bellicos-stargate-calidus=Пути из Соляриса и Никсариса сходятся здесь. Через внешний и внутренний края можно добраться к пульсару и точке Стража.
black-hole-approach=Западный маршрут Глубокого космоса от границы Солнечной системы. Возьмите припасы на обратный путь.
black-hole=За этой точкой старые навигационные карты мало помогают. Экспедиция необязательна.
oort-cloud=Далеко за Нексусом, ещё дальше по пути расположен Сол. Запасов должно хватить на оба участка.
sol=Необязательная конечная точка за облаком Оорта. Исходные правила исследования сохраняются.
halo-solar-orbit=Близкая солнечная орбита со вспышками и сложным обслуживанием станций. Не пренебрегайте защитой.
halo-solar-station=Солнечная вычислительная станция с жёсткими температурными ограничениями. Нужны охлаждение и питание.
velora=Необязательная луна Глебы с руинами и необычным производством. Основным научным путём она не требуется.
ferrum=Искусственный мир магнитов и дистанционно управляемых машин. Обычное строительство здесь не главное.
khemia=Алхимия внутри пояса Вайбранта, рядом с Риббонией. Сюда летят ради кристаллов и трансмутации.
alchemy-planet=Хемия находится глубоко внутри пояса Вайбранта. Добирайтесь от Риббонии; производство следует местным алхимическим рецептам.
bm-balack=Суровый необязательный мир за Аквило, где переработка обломков и биофабрикация связаны с исследованиями прометия.
arcanyx=Необязательная ветвь Умбры с призмами и обработкой пустотных материалов. Это не обход пояса.
athos=Каменная пыль, землетрясения, алмазы и Particulate Science. Путь идёт из Мурии.
shchierbin=Ванадиевое производство за поясом Вайбранта. Летите от Парацельсина после обязательного перехода.
asteroid-belt-inner-edge=Сторона Риббонии у юго-западного пояса. Перед коротким опасным перелётом проверьте орудия.
asteroid-belt-outer-edge=Внешняя сторона юго-западного кольца Вайбранта. Здесь же расположены пути к Парацельсину и внешнему потоку.
razi-deep-space-edge=Северная перевалочная стоянка. Эгида находится к югу от первых двух звёзд, а не здесь.
razi-dea-dia-slip-stream=Необязательный переход к Деа Диа. У двух её миров собственные местные пути.
igrys-orbit=Орбитальная стоянка Игрисa. Ради местного производства и опасностей поверхности сюда и летят.
planet-ferrum=Подход к искусственному миру Феррума. Магнитные машины и дистанционная работа здесь важнее обычных заводов.
