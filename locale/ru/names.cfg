[recipe-description]
razi-solaris-multiplex-cards=Четыре обычные партии карт Соляриса с привозными металлами Вулкана и вольфрамом дают пять карт. Экономит 20% обычных входов на карту; крафт на 15% дольше на каждую базовую партию.
razi-nyxaris-multiplex-cards=Четыре обычные партии карт Никсариса с биофлюсом Глебы и оптоволокном Мошайна дают пять карт. Обычный рецепт карты остаётся.
razi-vibrant-multiplex-cards=Четыре партии карт Вайбранта с катушками Парацельсина и гольмием Фульгоры дают пять карт. Открывается после исследования Парацельсина.
razi-vespera-multiplex-cards=Четыре партии карт Весперы с краптонитом Рубии и углеволокном Глебы дают пять карт. Обычные рецепты остаются.
razi-beetlejuice-multiplex-cards=Четыре обычные партии карт плюс золото Секреты и редкоземельные Линокса дают пять карт. Нужно исследование Секреты.
razi-umbra-multiplex-cards=Хитозан Тенебриса, супермагниты Весты и редкоземельные Линокса вместе с четырьмя партиями карт Умбры дают пять карт. Сначала исследуйте Весту.
razi-deep-space-multiplex-cards=Четыре обычные партии карт глубокого космоса плюс логистическая наука Эгиды и Белликоса и пульсарная наука дают пять карт.

