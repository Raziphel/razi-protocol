[recipe-description]
razi-solaris-multiplex-cards=Четыре обычные партии карт Соляриса с привозными металлами Вулкануса и вольфрамом дают пять карт. Экономит 20% обычных входов на карту; крафт на 15% дольше на каждую базовую партию.
razi-nyxaris-multiplex-cards=Четыре обычные партии карт Никсариса с биопотоком Глебы и оптическим кабелем Мошина дают пять карт. Обычный рецепт карты остаётся.
razi-vibrant-multiplex-cards=Четыре партии карт Вайбранта с катушками Парацельсина и гольмием Фульгоры дают пять карт. Открывается после исследования Парацельсина.
razi-vespera-multiplex-cards=Четыре партии карт Весперы с краптонитом Рубии и углеволокном Глебы дают пять карт. Обычные рецепты остаются.
razi-beetlejuice-multiplex-cards=Золото Секретас и редкоземельные Линокса идут в производство карт Битлджуса. Четыре обычные партии и привозные материалы дают пять карт после исследования Секретас.
razi-umbra-multiplex-cards=Хитозан Тенебриса, супермагниты Весты и редкоземельные Линокса вместе с четырьмя партиями карт Умбры дают пять карт. Сначала исследуйте Весту.
razi-deep-space-multiplex-cards=Логистическая наука Эгиды и Белликоса и пульсарная наука вместе с четырьмя обычными партиями дают пять карт глубокого космоса. Обычный рецепт карты глубокого космоса остаётся.

