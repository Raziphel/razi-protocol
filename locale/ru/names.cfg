[space-location-description]
asteroid-belt-inner-edge=Разведывательная точка сразу внутри юго-западного кольца Вайбранта. Путь сюда идёт от Риббонии, а дальше начинается опасный переход.
asteroid-belt-outer-edge=Разведывательная точка сразу снаружи астероидного кольца Вайбранта. Можно отправиться к Парацельсину или через пояс к внутренним фабрикам.

[razi-location-primary]
calidus-bellicos-stargate-calidus=Общие врата из Соляриса и Никсариса. Путь ведёт к внешнему краю Эгиды, через опасные астероиды к внутреннему краю, затем к пульсару или точке Стража.
aegis-outer-edge=Внешняя граница астероидного поля Эгиды. От входных врат путь ведёт через опасный пояс к внутреннему краю.
aegis-inner-edge=Внутренняя граница поля Эгиды. Отсюда доступны орбита Белликоса и точка Стража.
near-bellicos-orbit=Разведывательная остановка у пульсара Эгиды, доступная по короткой ветви от внутреннего края.
bellicos-near-orbit=Разведывательная остановка у пульсара Эгиды, доступная по короткой ветви от внутреннего края.
near_bellicos_orbit=Разведывательная остановка у пульсара Эгиды, доступная по короткой ветви от внутреннего края.
point-warden=Внутренняя разведывательная точка Эгиды, конечный пункт основной линии. Обратный путь проходит через внутренний край.
aegis-point-warden=Внутренняя разведывательная точка Эгиды, конечный пункт основной линии. Обратный путь проходит через внутренний край.

