[razi-location-briefing]
nauvis=Родной мир и отправная точка промышленной экспедиции Калидуса. Создайте основу для освоения луны и первого межзвёздного перелёта.
muluna=Безжизненная луна Наувиса — первое внеземное испытание Калидуса. Производство на основе астероидов поможет подготовить платформы к дальнейшим полётам.
eneas=Необязательная лунная экспедиция в Калидусе. Её собственные исследования и ресурсы не входят в обязательный маршрут к Солярису и Никсарису.
vulcanus=Вулканическая промышленная опора Соляриса. Освойте металлургию перед переходом к Кастре и специализированным мирам первого фронтира.
castra=Военизированный мир маршрута Соляриса. Военное производство открывает пути к Аригу и Хайариону, которые позже сходятся у Теллуса.
arig=Пустынный мир Соляриса с подземными ресурсами и песчаными бурями. Развивайте эту ветвь параллельно Хайариону перед путешествием к Теллусу.
hyarion=Мир Соляриса с лавой, самоцветами и разрушительным преломлённым светом. Освойте обработку кристаллов параллельно экспедиции на Ариг.
tellus=Пышный, но опасный перекрёсток путей Арига и Хайариона. Живые машины, паразиты и едкая пыльца превращают биологию в промышленный риск.
corrundum=Мир серной химии, завершающий ветвь Соляриса. Его исследования помогают освоить первый фронтир и открыть системы следующего этапа.
igrys=Необязательная экспедиция Соляриса в мир камня, стеклоделия и загадочной магической жидкости. Она расширяет регион, не задерживая основной путь.
athos=Экспериментальный необязательный мир Соляриса, где важны камень, углерод и нестабильная почва. Он не требуется для освоения системы.
gleba=Плодородный, но беспощадный биологический фронтир Никсариса. Живые производственные цепочки становятся основой для новых экспериментов системы.
moshine=Раскалённая пустыня Никсариса с металлами, научными зондами и вычислительными исследованиями. Это одна из независимых начальных ветвей системы.
apia=Одна половина двойной планетной экспедиции Никсариса. Освойте богатый жизнью мир королевского желе, сохранив родные связи с Карновой.
carnova=Кроваво-красная пара Апии в Никсарисе. Местные биологические процессы дополняют производство Апии в их общей экспедиции.
panglia=Тревожный мир Никсариса со странными металлами, ускоренным временем и биологическими вычислениями. Его эксперименты завершают первый фронтир.
foliax=Необязательный мир Никсариса, где ботаника и таинственные процессы заменяют обычную добычу. Его производство остаётся отдельной экспедицией.
rabbasca=Забытая луна Глебы сохраняет родную орбиту в Никсарисе. Ограниченная местная энергия и охраняемые хранилища создают особые испытания.
pelagos=Необязательная экспедиция Никсариса через ветвь Панглии. Её природные условия, ресурсы и исследования остаются без изменений.
lemures=Ледяной мир необязательной подсистемы Деа Диа с собственными маршрутами. Приливное тепло, редкая лава и холодное производство определяют его характер.
prosephina=Более тёплый мир необязательной подсистемы Деа Диа. Мелкие моря и следы искусственно занесённой жизни создают контраст ледяному Лемуресу.
fulgora=Электромагнитная опора Вайбранта. Восстановите древние технологии и заложите основу для исследования искусственного кольцевого мира и химических планет.
ribbonia=Заброшенный кольцевой мир фулгоранцев в Вайбранте. Плазма и необычная логистика ведут к промышленной цепочке Парацельсина и Щербина.
paracelsin=Криовулканический мир Вайбранта с цинком и жидким азотом. Защитите машины от холода, чтобы открыть путь электрохимии к Щербину.
shchierbin=Богатый ванадием мир в конце химической ветви Вайбранта. Его исследования помогают освоить средний фронтир перед дальним путешествием.
cerys=Луна Фулгоры сохраняет связь с родительским миром, теперь в Вайбранте. Необязательная экспедиция следует родным механикам и открытиям.
muria=Едкие, богатые хлором врата Весперы. Химия свинца и живые средства защиты начинают суровую экспедицию к Аквило.
aquilo=Замёрзший промышленный рубеж Весперы. За криогенными фабриками лежит Пояс обломков, через который проходит путь к Рубии.
rubia=Продуваемый ветрами заводской мир Весперы за Поясом обломков. Освойте особую логистику и потоки отходов перед переходом к Мараксису.
maraxsis=Океаническая планета в глубине маршрута Весперы. Подводные купола, субмарины и инженерия жидкостей завершают суровую ветвь системы.
obsidiax=Необязательный мир ледяного воздуха и лавы, где камни выращивают вместо добычи. Он входит в Весперу, но не требуется для завершения главы.
cubium=Промышленные врата внешнего рубежа Битлджуса. Необычные кубические процессы ведут к Линоксу и цепочке Секретас–Фрозета.
linox-planet_linox=Разрушительный раскалённый мир на ветви Кубиума в Битлджусе. Опасная поверхность и тесное подземное производство сохранили свою роль в новой галактике.
secretas=Колоссальный газовый гигант и опасный астероидный перекрёсток Битлджуса. Его спутник Фрозета превращает обломки в новое производственное испытание.
frozeta=Ледяной спутник Секретаса в конце ветви переработки Битлджуса. Используйте обломки космических кораблей для завершения экспедиции.
tenebris=Умбра начинается в вечной темноте Тенебриса. Биолюминесцентное производство и враждебная атмосфера открывают путь к Крусиблу и Весте.
crucible=Массивный мир огромного давления, где металлургия металлического водорода испытывает пределы инженерии. С его орбиты начинается путь к расколотому поясу Умбры.
vesta=Далёкий газовый мир атмосферной и жидкостной химии. Чтобы достичь его в Умбре, нужно исследовать и преодолеть расколотый пояс за орбитой Крусибла.
carna=Необязательная экспедиция Умбры в мир вечного снега, замерзающих машин, плазмы и спящих механоидов. Местная переработка обломков сохранена.
nexus=Необязательная экспедиция в Глубокий космос за пределами семи систем. Экзотические технологии не обязательны для финала с межгалактическим передатчиком.
shattered-planet=Далёкий расколотый рубеж за Краем Солнечной системы. Богатый прометием космос ждёт после освоения обеих внешних систем.
solaris=Первый промышленный фронтир: Вулканус, Кастра и ветви Арига и Хайариона сходятся через Теллус к Коррундуму. Солярис можно начать независимо от Никсариса.
nyxaris=Параллельный биологический и вычислительный фронтир. Глеба, Мошин, Апия/Карнова и Панглия предлагают разные пути; следующий этап требует и Никсарис, и Солярис.
vibrant=Электромагнитный и химический средний фронтир. Фулгора служит опорой, а Риббония, Парацельсин и Щербин образуют специальную промышленную цепочку.
vespera=Веспера испытывает фабрики кислотой, холодом, ветром и океаном. Маршрут идёт от Мурии через Аквило и Пояс обломков к Рубии и Мараксису.
beetlejuice=Промышленный внешний фронтир. От Кубиума расходятся пути к опасному Линоксу и далёкой цепочке переработки Секретас–Фрозета перед Глубоким космосом.
umbra=Экспериментальный внешний фронтир. Тенебрис и Крусибл ведут к опасному астероидному поясу и газоперерабатывающей Весте.
sye-calidus=Коридор отправления из Наувиса и Мулуны. Отсюда можно сначала исследовать Солярис или Никсарис после соответствующего открытия.
sye-solaris=Точка прибытия и отправления Соляриса. Межзвёздные связи входят в сеть семи систем, но каждое направление требует отдельного открытия.
sye-nyxaris=Точка прибытия и отправления Никсариса. Эту ветвь можно исследовать раньше Соляриса; для следующих рубежей нужны обе.
sye-vibrant=Транзитный коридор электрических и химических миров Вайбранта. Дальние пути становятся доступны с открытием среднего фронтира.
sye-vespera=Транзитный коридор суровых миров Весперы. Пояс обломков за Аквило по-прежнему требует отдельного исследования.
sye-beetlejuice=Точка входа во внешний фронтир Кубиума, Линокса и Секретаса. Диагональные межзвёздные маршруты не обходят требования исследований.
sye-umbra=Коридор прибытия к тёмным мирам Умбры с высоким давлением. Путь к Весте проходит через исследованный расколотый пояс.
solar-system-edge=Рубеж за пределами обеих внешних систем. Здесь освоение миров сменяется путешествием к Расколотой планете, пульсару и необязательным ветвям Глубокого космоса.
apia-carnova-orbit=Общие орбитальные врата Апии и Карновы. Их родные связи двойной системы сохранены внутри Никсариса.
star-dea-dia=Необязательная звёздная подсистема Никсариса. Её внутренние маршруты сохранены и не заменены сетью основных семи систем.
dea-dia-system-edge=Вход в необязательную подсистему Деа Диа. Исследуйте её миры по сохранённым местным маршрутам.
razi-vespera-belt-inner=Богатая ресурсами стоянка за Аквило. Подготовьтесь к плотному потоку средних и крупных астероидов Пояса обломков Весперы.
razi-vespera-belt-outer=Дальний край Пояса обломков. Пополните запасы после перелёта, прежде чем отправляться к Рубии.
razi-umbra-belt-inner=Последняя точка подготовки перед расколотым поясом. Здесь появляются огромные астероиды, поэтому нужна серьёзная оборона.
razi-umbra-belt-outer=Выход из самого опасного астероидного пояса Умбры. Впереди Веста и задачи атмосферной химии.
crucible-orbit=Орбита Крусибла и отправная точка перехода через расколотый пояс к Весте. Родной путь посадки на планету сохранён.
pulsar=Далёкий пульсар за Краем Солнечной системы. Экспедиция Эгиды и Белликоса сохраняет родную науку и отдельные маршруты звёздных врат.
calidus-bellicos-stargate-calidus=Вход в экспедицию Эгиды и Белликоса через звёздные врата Глубокого космоса. Внутренние маршруты сохранены.
calidus-bellicos-stargate-bellicos=Внутренние врата далёкой экспедиции к пульсару, расположенные на подлёте к Белликосу.
black-hole-approach=Необязательный путь к чёрной дыре. Он остаётся за пределами обязательной кампании семи систем и межгалактического передатчика.
black-hole=Необязательная гравитационная бездна в конце пути к чёрной дыре. Подготовьтесь к собственным испытаниям Глубокого космоса.
oort-cloud=Необязательная далёкая ветвь за Нексусом, сохраняющая родной путь к Солу.
sol=Необязательный далёкий пункт в конце ветви Нексуса и облака Оорта, вне обязательного маршрута к победе.
