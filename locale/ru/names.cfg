[razi-location-briefing]
aegis-inner-edge=Внутренний край опасного астероидного поля. Отсюда можно лететь к пульсару или точке Стража, но не к другим звёздам напрямую.
aegis-outer-edge=Промежуточная стоянка после врат из Соляриса и Никсариса. До внутреннего края предстоит опасный перелёт через астероиды.
near-bellicos-orbit=Разведка рядом с пульсаром; ответвление от внутреннего края. Исходные опасности сохранены, старые дальние врата удалены.
bellicos-near-orbit=Разведка рядом с пульсаром; ответвление от внутреннего края. Старые дальние врата удалены.
near_bellicos_orbit=Разведка рядом с пульсаром; ответвление от внутреннего края. Старые дальние врата удалены.
point-warden=Последняя точка основного маршрута Эгиды. Возвращайтесь через внутренний край, а не через удалённые врата.
aegis-point-warden=Последняя точка основного маршрута Эгиды. Возвращайтесь через внутренний край, а не через удалённые врата.
skewer_shattered_planet=Настоящая Расколотая планета находится за отдельным подходом Глубокого космоса. Исходные условия не изменены.
skewer_lost_beyond=За настоящей Расколотой планетой лежит ещё одна необязательная дальняя экспедиция, не связанная с вратами Эгиды.

nulla=Далёкий ремонтный пункт Весперы, где ведомости обслуживания словно никогда не закрываются. Родные правила добычи и производства сохранены; это необязательная экспедиция.
nauvis=Последний уцелевший маршрутный журнал начинается здесь, среди заводов исчезнувшей компании. Создайте надёжную энергетику, автоматизацию и снабжение луны перед полётом к звёздам.
muluna=Первая внеземная проверка: луна, где экипажи научились превращать астероиды в производство. Отработайте логистику платформ перед межзвёздными рейсами.
vulcanus=Солярис начинается с жара и металла. Старые грузовые ведомости ценили здешние литейные цеха; развивайте металлургию для Кастры и Арига.
castra=Военная ведомость учитывала грузы, но не людей, которым они были нужны. Используйте местное производство и откройте путь к Аригу и Хайариону.
arig=Песчаные бури стирают пути, но скрытые запасы остаются. Сочетайте сухую промышленность Арига с кристальными технологиями Хайариона перед Теллусом.
hyarion=Над лавой свет преломляется в опасных кристаллах. Освойте точную обработку и объедините её с материалами Арига перед Теллусом.
tellus=На пересечении промышленных ветвей едкая пыльца и паразиты угрожают производству. Живые машины напоминают: не все опасности исходят от печей.
corrundum=Серная химия замыкает промышленную цепь Соляриса. Её исследования превращают разрозненные заводы в общий первый фронтир.
igrys=Необязательная разведка: камень, стеклоделие и необычные жидкости. Этот мир помогает Солярису, но не обязателен для основной кампании.
gleba=Старые ведомости пытались учесть производство, которое непрерывно портится. Освойте биологическую логистику: она пригодится далеко за пределами Глебы.
moshine=Жаркая пустыня, где зонды и вычисления превращают наблюдения в промышленность. Научные данные пригодятся Никсарису и поздним исследованиям Панглии.
apia=Половина двойной биологической экспедиции. Развивайте производство королевского желе, сохраняя исходные маршруты к Карнове.
carnova=Красный близнец Апии со своей необычной биологией. Старые реестры объединяли два мира; их производства стоит изучать отдельно.
panglia=Искажения времени и хищные энергетические корни требуют осторожности. Объединяйте данные Мошина с местными ДНК-исследованиями, не подменяя живой мир симуляцией.
foliax=Необязательная ветвь Никсариса, где ботаника вытесняет обычную добычу. Центральный путь её не требует.
rabbasca=Забытая луна Глебы с малым запасом энергии и охраняемыми хранилищами. Подготовьте питание для отдельной экспедиции.
pelagos=Необязательная морская экспедиция Никсариса. Родные среды, ресурсы и исследования сохранены.
lemures=Ледяной мир необязательной Деа Диа, где помогают приливное тепло и редкая лава. Местные пути сохранены.
prosephina=Тёплая соседка Лемуреса с мелкими морями и следами занесённой жизни. Главная экспедиция её не требует.
fulgora=Внутренний электрический мир Вайбранта. Риббония связывает его с Хемией и единственным переходом через астероидный пояс.
ribbonia=Риббония находится внутри пояса Вайбранта. Отсюда путь ведёт к Хемии и внутреннему краю; для Парацельсина требуется опасный переход.
paracelsin=Холод, цинк и жидкий азот поддерживают промышленность за поясом Вайбранта. Путь идёт от внешнего края; далее расположен Ширбин.
cerys=Родная луна Фульгоры остаётся на исходной орбите. Ядерные технологии доступны как отдельное исследование без изменения авторских опасностей.
muria=Жаркий и едкий вход в Весперу. Хлорная химия начинает цепь грузоперевозок к Рубии, Аквило и необязательному Атосу.
aquilo=На ледяном краю Весперы надёжное тепло зависит от поставок. Развивайте криогенную промышленность после Рубии; искусственного пояса здесь нет.
rubia=Ветер точит цеха между химией Мурии и дальними мирами Весперы. Старые реестры считали груз; вам предстоит снова сделать его полезным.
maraxsis=Под тёплым океаном тепличной планеты фабрики сменяются подводными куполами. Путь ведёт из Рубии; главная задача — глубоководная инженерия.
obsidiax=За внешним кольцом Умбры холодная лава и растущий камень усложняют производство. Связь с Вестой не пересекает Разлом.
cubium=Начало Битлджуса: необычные кубические процессы и две ветви. Постройте снабжение перед выбором между раскалённым Линоксом и добычей обломков у Секретаса.
linox-planet_linox=Ветвь Кубиума заканчивается жестоким миром печей и ограниченного подземного производства. Его грузы ценны, но путь опасен.
secretas=Огромный газовый гигант на перекрёстке астероидных путей. Отсюда начинается холодная ветвь Фрозеты; старые карты не дают гарантий.
frozeta=За Секретасом разбитые корабли становятся сырьём. Собирайте и перерабатывайте оставленное прежними экспедициями, сохраняя их оригинальную историю.
tenebris=За внутренним поясом Умбры свет становится частью производственной задачи. Биолюминесцентная промышленность открывает путь к Крусиблу.
crucible=Высокое давление и металлический водород испытывают заводы на прочность. Посетите мир через его родную орбиту, сохранив исходную механику.
vesta=Далёкий газовый мир на безопасной внешней дуге Умбры. Давление и жидкости важны здесь; Обсидиакс и луна Абакайба отходят в сторону, не пересекая пояс.
abacayba=Необязательная заражённая луна Весты. Руины, боссы и Итаверакс принадлежат исходному моду; это опасная экспедиция, не обязательная глава.
carna=Необязательная снежная экспедиция Умбры. Холодочувствительные машины, плазма и спящие механоиды делают её отдельной задачей.
nexus=Далёкий полигон Глубокого космоса с девятью боссами. Путь к облаку Оорта и Солу не связан с южной Эгидой.
shattered-planet=Подход к отдельной экспедиции на Расколотую планету. Достижение этой точки ещё не означает посещение настоящей планеты.
solaris=Промышленный первый фронтир — единая цепь из Вулкануса, Кастры, Арига, Хайариона, Теллуса и Коррундума. Каждый мир решает свою часть общей задачи.
nyxaris=Независимый выбор первого фронтира: биология Глебы, вычисления Мошина и парные миры Апии и Карновы. Обе начальные системы нужны для следующего этапа.
vibrant=Внутри металлического пояса находятся Фульгора, Риббония и Хемия. Опасный переход ведёт к внешним Парацельсину и Ширбину.
vespera=Средний фронтир без выдуманного барьера. Мурия, Рубия, Мараксис и Аквило связывают тепло, материалы и выживание; Атос — побочная ветвь.
beetlejuice=Внешняя промышленность расходится от Кубиума: печи Линокса с одной стороны, переработка Секретаса и Фрозеты с другой.
umbra=Внешние станции Умбры лежат перед опасным Разломом. Веста служит базой; единственный переход ведёт внутрь к Тенебрису и Крусиблу.
sye-calidus=Исходящий грузовой журнал: теперь платформы способны уйти дальше луны. Солярис и Никсарис открываются независимо, но обе системы важны.
sye-solaris=Перевалочный пункт Соляриса. Отсюда отдельный исследованный путь ведёт к общим вратам Эгиды к югу от первых двух звёзд.
sye-nyxaris=Перевалочный пункт Никсариса. Собственный исследованный путь ведёт к вратам Эгиды, не проходя через Глубокий космос.
sye-vibrant=Внешний транзитный пункт Вайбранта ведёт к внешнему краю пояса. Для Фульгоры, Риббонии и Хемии требуется переход через астероиды.
sye-vespera=Подход к Веспере ведёт сначала к едкой Мурии, затем к Рубии и холодным дальним мирам. Искусственного астероидного перехода нет.
sye-beetlejuice=Вход во внешний фронтир, но не замена исследованиям. Кубиум открывает выбор между горячим производством и переработкой обломков.
sye-umbra=Внешний подход к Умбре. Снабдите Весту и подготовьтесь на краю пояса перед опасным переходом к внутренним мирам.
solar-system-edge=Северный рубеж Глубокого космоса. Отсюда ветви ведут к Нексусу, Чёрной дыре и Расколотой планете после соответствующих исследований.
apia-carnova-orbit=Общая орбита двух исходных миров. Грузовые рейсы связывают исследования Апии и Карновы, не стирая их различий.
star-dea-dia=Необязательная звёздная ветвь Никсариса. Сохраняет родные открытия и пути; основной поход от неё не зависит.
dea-dia-system-edge=Спокойный вход в необязательную ветвь Деа Диа. Сначала изучите её местные маршруты.
razi-umbra-belt-inner=Опасный переход позади корабля. От внутреннего края Разлома настоящие пути ведут к Тенебрису и Крусиблу.
razi-umbra-belt-outer=Последний безопасный пункт перед Разломом. Пополните боеприпасы, ремонтные материалы и энергию перед переходом.
crucible-orbit=Родной орбитальный подход к Крусиблу. Контролируемый переход ведёт из внутренней транспортной сети Умбры.
pulsar=Пульсар Эгиды и Белликоса расположен к югу от Соляриса и Никсариса, а не в Глубоком космосе. Астероидное поле и исходная наука сохранены; дальние врата удалены.
calidus-bellicos-stargate-calidus=Общие врата Эгиды, доступные из Соляриса и Никсариса. Путь ведёт через внешний край пояса к внутреннему, затем к орбите Белликоса и точке Стража.
black-hole-approach=Западная ветвь от границы Глубокого космоса. Этот подход к Чёрной дыре не связан с Эгидой.
black-hole=У гравитационной границы старые карты теряют смысл. Эта необязательная цель сохраняет собственные испытания.
oort-cloud=Дальний пункт после Нексуса, откуда путь идёт к Солу, а не к перенесённому пульсару Эгиды.
sol=Необязательная дальняя цель после Нексуса и облака Оорта. Исходные исследования и условия сохранены.
halo-solar-orbit=Необязательная горячая солнечная орбита. Родные вспышки и требования станции важнее пометок RAZI.
halo-solar-station=Необязательная солнечная станция. Управление теплом и вычислениями остаётся задачей исходного мода.
velora=Необязательная луна Глебы с древними руинами и необычным производством. Родная орбита сохранена; это не обязательная наука.
ferrum=Искусственный экспериментальный мир с дистанционным управлением и магнитным производством. Родная робототехника сохранена.
khemia=Необязательный алхимический мир внутри пояса Вайбранта, рядом с Риббонией. Путь к Хемии не заменяет переход к Парацельсину.
alchemy-planet=Хемия теперь расположена внутри пояса Вайбранта рядом с Риббонией. Её родная добыча кристаллов и трансмутация сохранены.
bm-balack=Необязательный опасный мир после Аквило, связанный с обломками и биофабрикацией. Родные исследования прометия сохраняются.
arcanyx=Побочная ветвь внешней Умбры: призмы и производство в пустоте. Следуйте её родным исследованиям.
athos=Засушливая ветвь от Мурии: землетрясения, обработка камня и алмазов, особая наука. История крушения остаётся за исходным модом.
shchierbin=Мир ванадия за астероидным поясом Вайбранта. Связь с Парацельсином не позволяет обойти основной переход.
asteroid-belt-inner-edge=Внутренний край юго-западного астероидного кольца рядом с Риббонией. Единственный переход ведёт к внешнему краю.
asteroid-belt-outer-edge=Внешний край юго-западного кольца Вайбранта. Здесь можно готовиться к перелёту к Парацельсину или внутрь пояса.
razi-deep-space-edge=Северная стоянка Глубокого космоса, отдельная от южнего фронтира Эгиды.
razi-dea-dia-slip-stream=Необязательный подход к Деа Диа. Это вход в родную подсистему, а не замена её собственным маршрутам.
igrys-orbit=Местная орбита необязательного Игрисa. Оригинальные условия поверхности и производства не меняются.
planet-ferrum=Искусственный мир с дистанционным управлением и магнитным производством. Исходная наука и логистика остаются без изменений.
