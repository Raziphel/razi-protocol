[technology-description]
space-discovery-asteroid-belt=Разведайте металлический пояс вокруг Вайбранта. Подготовьте защищённую платформу к обязательному переходу в 5000 км.
razi-umbra-belt-survey=Разведайте Расколотый разлом Умбры на безопасном внешнем краю, прежде чем идти внутрь к Тенебрису и Крусиблу. В переходе летят большие и огромные астероиды, так что нужна защищённая платформа.

[space-location-description]
asteroid-belt-inner-edge=Богатый рудой внутренний край металлического пояса Вайбранта. Пополните запасы перед опасным переходом.
asteroid-belt-outer-edge=Внешний край металлического пояса Вайбранта. Дальше путь ведёт к Парацельсину и Битлджусу.
razi-umbra-belt-inner=Внутренний край Расколотого разлома Умбры, где можно добывать руду. За ним лежат Тенебрис и Крусибл.
razi-umbra-belt-outer=Внешний край Расколотого разлома Умбры — последняя безопасная стоянка перед опасным переходом внутрь.
