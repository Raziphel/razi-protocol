[item-description]
rabbasca-obscure-theories=Хаотичная мешанина сведений. Повсюду нацарапаны уравнения. Одно повторяется снова и снова: «[img=fluid.beta-carotene]=[img=virtual-signal.signal-heart]!», «[img=fluid.beta-carotene]=[img=virtual-signal.signal-heart]!», «[img=fluid.beta-carotene]=[img=virtual-signal.signal-heart]!!!»...\nВы смотрите и не верите своим глазам: то ли в этом есть смысл, то ли вы медленно сходите с ума...
rabbasca-powerspike=Устройство, которое можно превратить в улучшения для [entity=rabbasca-warp-stabilizer]. Появляется при выполнении рецепта [recipe=rabbasca-warp-trace]. Каждый следующий всплеск мощности создаётся дольше предыдущего.
rabbasca-powerspike-weak=В этом состоянии непригоден.
rabbasca-psychosis=В тенях что-то таится. Вы их видите...\n\nВлияет на разум [entity=character], время от времени создавая [item=rabbasca-rampant-imagination] и, вероятно, что-то ещё.
rabbasca-rampant-imagination=От всех этих странных знаний болит голова.
rabbasca-restored-knowledge=На краткие мгновения всё обретает смысл. Но потом всё исчезает. Кажется, глубже в эти темы лучше не погружаться...
rabbasca-sanity-loss=«Это ценное знание, что может пойти не так?»
rabbasca-underground-worker-agreement=Содержит кучу мер безопасности, предупреждений и юридических лазеек.\nВы никогда не видели подобного контракта, но он нужен, чтобы видеть [planet=rabbasca-underground]. Если пропустить всю юридическую чепуху, важные пункты, похоже, такие:\n\n1) [planet=rabbasca-underground] требуют особого обращения. Для вашего удобства прилагается [tip=rabbasca-underground-briefing].\n412) Вы понимаете, что имущество, не покрытое работающим [entity=rabbasca-stability-pylon], будет оставлено при варпе.\n691) При длительном отсутствии перевод всех [item=rabbasca-warp-cell] в спящий режим [img=virtual-signal.signal-moon] обязателен, если система не полностью самодостаточна.\n708) Вы понимаете, что неправильное обращение с [item=rabbasca-powerspike] может оставить стабилизаторы в неоптимальном состоянии.\n1338) Подписать этот контракт можно, только если вы уже знаете местоположение [planet=rabbasca-underground]. Мы требуем [color=yellow]невозвратный залог добросовестности в размере 1 [item=rabbasca-warp-core][/color] из вашего инвентаря.\n\n__CONTROL_LEFT_CLICK__ [shortcut=rabbasca-underground-worker-agreement]
rabbasca-warp-cell=Непрерывно вырабатывает энергию для привязанного потребителя. Выработка зависит от свежести. Когда ячейка полностью испортится, привязка разорвётся, и ячейка снова станет [item=rabbasca-warp-cell-recharging].\n\nМожно перепривязать в любой момент ценой половины свежести. Свежесть восстанавливается за счёт топливного буфера [entity=rabbasca-warp-stabilizer].
rabbasca-warp-cell-recharging=Можно привязать к потребителю, и тогда она станет [item=rabbasca-warp-cell]. При этом расходуется немного топлива [entity=rabbasca-warp-stabilizer] и восстанавливается 5% заряда (свежести). Храните её в [entity=rabbasca-warp-stabilizer], чтобы поддерживать заряд.
rabbasca-warp-trace=Мимолётный признак существования местного варп-поля. До одной пачки удерживается в стазисе в [entity=rabbasca-warp-stabilizer]. Стабилизатор автоматически использует их для подзарядки хранящихся в нём [item=rabbasca-warp-cell].

