[entity-description]
rabbasca-anomaly-storage=[entity=rabbasca-collector-pylon] складывает в этот контейнер извлечённые [item=rabbasca-warp-anomaly].
rabbasca-collector-pylon=Устраняет [entity=rabbasca-warp-anomaly], автоматически перемещаясь между ними варпом и складывая извлечённые [item=rabbasca-warp-anomaly] в [entity=rabbasca-anomaly-storage].
rabbasca-hellvent=Передайте мышление на аутсорс. Идеи, порождающие идеи. Воображаемая рекурсия.\nНе используешь — теряешь.
rabbasca-relicary=Тайники прошлого, хранящие схемы, которые помогают открыть мощные технологии. В обмен на [item=rabbasca-powershard] отдаёт гораздо больше схем. Сначала его нужно найти с помощью [recipe=rabbasca-hunt-relicaries]
rabbasca-relicary-remote=Подключается к ближайшему [entity=rabbasca-relicary]. Позволяет собирать знания, не покидая безопасного [tile=rabbasca-underground-rubble-powered].
rabbasca-remote-access-chest=В разработке. Направьте на ближайший сундук или машину, чтобы получить доступ к их инвентарю.
rabbasca-stability-pylon=Поддерживает [tile=rabbasca-underground-rubble-powered] на полу, расширяя область, которую можно перенести варпом в другие места. Для работы нужны [item=rabbasca-warp-cell].\nКогда не работает, теряет здоровье, пока не останется 1 единица. При здоровье ниже 10 обслуживание прекращается, и пол становится [tile=rabbasca-underground-rubble]. \n\n[color=red][img=virtual-signal.signal-alert]Все постройки, не полностью стоящие на [tile=rabbasca-underground-rubble-powered], будут уничтожены при варпе! Включая [entity=rabbasca-warp-stabilizer] и сам [entity=rabbasca-stability-pylon]![/color]
rabbasca-warp-anomaly=Их добыча помогает стабилизировать варп-поле.\nКогда [entity=rabbasca-warp-stabilizer] меняет местоположение, каждая аномалия с небольшим шансом превращается во временные ресурсы, характерные для нового места (см. [tip=rabbasca-manifest-anomaly]).\nАномалии никогда не появляются на [tile=rabbasca-underground-rubble-powered].
rabbasca-warp-stabilizer=Настоящее чудо раббасканской инженерии: активно ищет и устраняет [entity=rabbasca-warp-anomaly], превращая их в топливо для [item=rabbasca-warp-cell].\nРаботает вблизи ядер различных планет и защищает вашу подземную фабрику от экстремальных условий.

[entity-status]
rabbasca-fuel-consumer-desynced=Потеряна связь с [entity=rabbasca-warp-stabilizer]! Невозможно восстановить [virtual-signal=signal-fuel]!

