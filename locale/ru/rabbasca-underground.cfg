[recipe-description]
rabbasca-abandon-stabilizer=Отказаться от этого стабилизатора. Возможно, это последний выход, если у стабилизатора кончилось топливо. После этого [entity=rabbasca-vault-crafter] может найти новый стабилизатор.\n[color=red][img=virtual-signal.signal-alert] Всё вокруг стабилизатора будет уничтожено, включая вашу фабрику![/color]\n[color=#33aaff][img=virtual-signal.signal-info][entity=rabbasca-warp-stabilizer] может выполнять рецепты даже без топлива[/color]
rabbasca-amplify-anomaly=Дестабилизирует положение машины, повышая шанс проявления залежи ресурсов под ней (см. [tip=rabbasca-manifest-anomaly]). Так ресурсы могут появиться на [tile=rabbasca-underground-rubble-powered], что позволяет создать постоянные места добычи.
rabbasca-contained-imagination-refresh=Поддерживает ваши идеи относительно свежими.\nТребует подготовки через [recipe=rabbasca-hellvent-refreshing]. Качество этого рецепта определяется качеством использованного [item=ice].
rabbasca-floor-stability-work=Предотвращает потерю здоровья
rabbasca-hellvent=Можно создать, только пока [entity=character] находится под действием психоза; продукты наследуют его качество.
rabbasca-hellvent-refreshing=Подготавливает воображаемую яму к однократному выполнению рецепта [recipe=rabbasca-contained-imagination-refresh].
rabbasca-hunt-anomalies=Повышает выход ресурсов из [entity=rabbasca-warp-anomaly] на 3% при следующем варпе. После варпа выход сбрасывается до 100%. Выход для следующего варпа можно посмотреть в [entity=rabbasca-warp-stabilizer] или в показаниях [entity=constant-combinator].
rabbasca-hunt-relicaries=Повышает шанс найти [entity=rabbasca-relicary] при следующих варпах на 0,4%. Шанс сохраняется между варпами и сбрасывается, когда архив найден. Текущий шанс можно посмотреть в [entity=rabbasca-warp-stabilizer] или в показаниях [entity=constant-combinator].
rabbasca-locate-stabilizer=Поручает хранилищу найти [space-location=rabbasca-underground] и разместить рядом [entity=rabbasca-warp-pylon]. Может потребоваться несколько попыток, но при неудаче пилон возвращается.\nЕсли стабилизатор уже найден, при успехе рядом с ним будет размещён ещё один [entity=rabbasca-warp-pylon].\n[color=#33aaff][img=virtual-signal.signal-info]После успеха этот рецепт снимается с выбора.[/color]
rabbasca-plastic-from-petroleum-gas=Экстремальные условия позволяют получать пластмассу без [item=coal].
rabbasca-powershard=Временно ослабляет [item=rabbasca-powerspike], чтобы получить дополнительное топливо для [entity=rabbasca-relicary].
rabbasca-psychosis=Можно создать, только пока [entity=character] находится под действием психоза; продукты наследуют его качество.\n[entity=character] автоматически ставит этот рецепт в очередь, пока находится под действием психоза.
rabbasca-relocate-floorthing=[entity=rabbasca-stability-pylon] нельзя снести, но при выполнении этого рецепта он попытается переместиться на [virtual-signal=signal-ghost][entity=rabbasca-stability-pylon].
rabbasca-restored-knowledge-2=Вы освоили опасности раббасканских знаний. Осторожное обращение с ними даёт меньше результатов, но гораздо легче для разума.
rabbasca-stabilizer-recharge=Пока выполняется этот рецепт, все [item=rabbasca-warp-cell-recharging] и [item=rabbasca-warp-cell] переносятся варпом в топливный инвентарь стабилизатора.\n\n[color=#33aaff][img=virtual-signal.signal-info]Ячейки, не затронутые этим рецептом, нужно зарегистрировать заново, открыв их с помощью __CONTROL__open-item__[/color]
rabbasca-stabilizer-warp-sequence=Варп в следующее место; [color=yellow]всё, что не стоит на [tile=rabbasca-underground-rubble-powered], останется позади[/color] (исключение: [entity=rabbasca-collector-pylon]). Оставшиеся аномалии могут превратиться в ресурсы. Стазис [item=rabbasca-warp-trace] на время варпа приостанавливается.\n[color=#33aaff][img=virtual-signal.signal-info]Рецепт не выполняется, если [entity=rabbasca-warp-stabilizer] не полностью стоит на [tile=rabbasca-underground-rubble-powered][/color]\n[color=#33aaff][img=virtual-signal.signal-info]Если в панели управления [entity=rabbasca-warp-stabilizer] включён «Автопилот», стабилизатор автоматически переключится на этот рецепт при стабилизации 100%[/color]
rabbasca-summon-ufo=Вызовите на помощь флот [entity=rabbasca-ufo]. Все [entity=rabbasca-ufo] без группы управления попытаются переместиться варпом поближе из любой точки.\nВарп расходует 50% топлива и блокируется, если внутри есть водитель или в инвентаре варпотрона есть предметы (боеприпасы в оружии допускаются).
rabbasca-summon-ufo-with-filter=Вызовите на помощь флот [entity=rabbasca-ufo]. Все [entity=rabbasca-ufo] с группой управления, совпадающей с любым сигналом в [item=__1__], попытаются переместиться варпом поближе из любой точки.\nВарп расходует 50% топлива и блокируется, если внутри есть водитель или в инвентаре варпотрона есть предметы (боеприпасы в оружии допускаются).
rabbasca-underground=Найдите [entity=rabbasca-warp-stabilizer] и раскройте секреты раббасканской варп-технологии.
rabbasca-warp-cell=[color=#33aaff][img=virtual-signal.signal-info]При создании в [entity=rabbasca-warp-stabilizer] этот рецепт не расходует топливо.[/color]\n[color=#33aaff][img=virtual-signal.signal-info]Если в панели управления [entity=rabbasca-warp-stabilizer] включён «Синтез топлива», стабилизатор автоматически переключится на этот рецепт, когда кончится топливо.[/color]
rabbasca-warp-cell-recharging=[color=#33aaff][img=virtual-signal.signal-info]Результат помещается прямо в хранилище ячеек [entity=rabbasca-warp-stabilizer][/color]
rabbasca-warpfield-science-pack-wi-download=Извлекает из этого хранилища до 100 [item=rabbasca-warpfield-science-pack] выбранного качества. Запас ограничен количеством, ранее загруженным через [recipe=rabbasca-warpfield-science-pack-wi-upload].
rabbasca-warpfield-science-pack-wi-upload=Загружает входные предметы в сеть [entity=rabbasca-vault-crafter], откуда их можно получить через [recipe=rabbasca-warpfield-science-pack-wi-download]. Нужно не меньше 10 штук, за раз можно загрузить до 100.

