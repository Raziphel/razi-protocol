[tips-and-tricks-item-description]
rabbasca-fuel-management=[item=rabbasca-warp-anomaly] собирает [entity=rabbasca-collector-pylon] в [entity=rabbasca-anomaly-storage]. Это главный источник энергии для [item=rabbasca-warp-cell]. Откройте [item=rabbasca-warp-cell-recharging], чтобы назначить цель: после этого ячейка будет подзаряжаться за счёт топливного буфера [entity=rabbasca-warp-stabilizer].\nЧем больше активных [item=rabbasca-warp-cell], тем больше [item=rabbasca-warp-anomaly] нужно, чтобы производство топлива через [recipe=rabbasca-warp-trace] успевало за расходом.\nЧтобы избежать отключения энергии, переключите режим топлива на [img=virtual-signal.signal-moon]: это приостановит передачу из топливного буфера [entity=rabbasca-warp-stabilizer] в [item=rabbasca-warp-cell].\nПолоса порчи каждой ячейки показывает её заряд, полоса здоровья — топливный буфер текущей цели (полоса скрыта: буфер полон)
rabbasca-manifest-anomaly=[entity=rabbasca-warp-stabilizer] перемещается варпом между местами, чтобы устранять [entity=rabbasca-warp-anomaly]. В каждом месте находится новый набор аномалий.\n\nПри смене места аномалии с некоторым шансом проявляются в виде ресурсов, характерных для нового места. Шанс зависит от количества ресурсов, оставшихся в аномалии, и от стабильности текущего места.\n\nСтабилизация растёт по мере уменьшения количества [item=rabbasca-warp-anomaly], поэтому для эффективного поиска новых ресурсов важно найти правильный баланс.\n\nДля проявления ресурсов можно также использовать [recipe=rabbasca-amplify-anomaly]. Каждое выполнение увеличивает количество виртуальных [item=rabbasca-warp-anomaly] в позиции машины на 1. Шанс проявления считается так же, как для [item=rabbasca-warp-anomaly], но поскольку они не влияют на прогресс стабилизации, их шанс всегда максимален при стабилизации 100%.\n\n[color=yellow]Пример[/color]: [entity=rabbasca-warp-stabilizer] перемещается на [planet=fulgora], где [entity=rabbasca-holmium-ore] может проявиться с базовым шансом [color=green]6%[/color]. Стабилизация — [color=yellow]75%[/color].\n 1) В аномалии осталось [color=cyan]69[/color] [item=rabbasca-warp-anomaly].\n    После варпа шанс, что аномалия станет залежью [entity=rabbasca-holmium-ore], равен [color=green]0.06[/color] * [color=cyan]69[/color] * [color=yellow]0.75[/color] = 310.5% (гарантированно). Количество ресурсов в залежи умножается на [color=cyan]69[/color] * [color=yellow]0.75[/color].\n 2) [entity=rabbasca-warp-pylon] выполнил [color=cyan]14[/color] [recipe=rabbasca-amplify-anomaly] в этом месте.\n    После варпа шанс проявления залежи [entity=rabbasca-holmium-ore] в его позиции равен [color=green]0.06[/color] * [color=cyan]14[/color] * [color=yellow]0.75[/color] = 63%. Количество ресурсов в залежи умножается на [color=cyan]14[/color] * [color=yellow]0.75[/color].
rabbasca-underground-automation=[entity=rabbasca-warp-stabilizer] выводит данные о своём окружении и прогрессе стабилизации в логистическую группу, доступную через [entity=constant-combinator], логистические сундуки и т. п.\nПо умолчанию группа называется «[item=rabbasca-warp-trace] Warpfield stabilizer readings». Это позволяет гибко автоматизировать работу в зависимости от текущего состояния подземелья или от того, полностью ли стабилен пол и безопасен ли варп.\n\nСписок выводимых сигналов:\n- [сигнал любой планеты] = текущая планета. Число показывает прогресс стабилизации в процентах.\n- [entity=rabbasca-warp-anomaly] = сколько аномалий осталось добыть (если 0, стабилизация достигла 100%)\n- [entity=rabbasca-stability-pylon] = сколько таких устройств сейчас НЕ поддерживают [tile=rabbasca-underground-rubble-powered]\n- [item=rabbasca-warp-trace] = заполненность топливного буфера стабилизатора (в процентах)\n- [item=rabbasca-powerspike] = сколько их создал этот стабилизатор\n- [item=rabbasca-progress-powerspike] = сколько осталось до создания следующего [item=rabbasca-powerspike]\n- [recipe=rabbasca-hunt-relicaries] = шанс в процентах найти [entity=rabbasca-relicary] при следующем варпе. Значение уменьшается, только когда архив найден\n- [recipe=rabbasca-hunt-anomalies] = средний выход ресурсов [entity=rabbasca-warp-anomaly] при следующем варпе в процентах. После варпа сбрасывается до 100%.
rabbasca-underground-briefing=Раббасканские архивы содержат сведения о [space-location=rabbasca-underground], которые помогают сделать варп-технологии возможными. [entity=rabbasca-warp-stabilizer] часто меняют место, чтобы устранять [entity=rabbasca-warp-anomaly]. Посетить эти места лично нельзя, и снабжение через космические платформы недоступно, но после того как место найдено с помощью [recipe=rabbasca-locate-stabilizer], им можно управлять удалённо через [entity=rabbasca-warp-pylon].\n\nСтройте фабрику на [tile=rabbasca-underground-rubble-powered]: всё, что за его пределами, останется позади при смене места (исключение: частично выступающие [entity=offshore-pump]).\nЭто покрытие также подходит для машин с [item=harene-ears-core], которые помогут продержаться, пока не появятся ресурсы для выработки энергии. Без дальнейших исследований добываемые ресурсы будут доступны только за пределами безопасной зоны, что потребует активного управления добывающими аванпостами.\nМеста различаются атмосферой, которая даёт бесконечное количество газов и жидкостей. На них указывает особая технология, зависящая от текущей планеты, например [technology=rabbasca-stabilizer-on-aquilo].\n\nСтабилизаторы деградировали и требуют постоянного обслуживания, чтобы не застрять. Приблизьте их к былой мощи, открывая [item=rabbasca-powerspike], — со временем это позволит полностью автоматизировать подземную фабрику для производства [item=rabbasca-warpfield-science-pack].\nЕсли же вы застряли, отказ от стабилизатора через [recipe=rabbasca-abandon-stabilizer] позволит найти новый и начать заново. Только сначала перенесите фабрику варпом в безопасное место.
rabbasca-upgrade-placements=[entity=rabbasca-collector-pylon] и [entity=rabbasca-stability-pylon] размещаются как обычные постройки. После размещения их нельзя снести, но можно переместить.\n[entity=rabbasca-collector-pylon] автоматически перемещается к [entity=rabbasca-warp-anomaly], когда ему больше нечего добывать.\n[entity=rabbasca-stability-pylon] переместится на [entity=entity-ghost] самого себя после выполнения рецепта [recipe=rabbasca-relocate-floorthing].\n\nОбе постройки можно отправить в [virtual-signal=rabbasca-warp-inventory], но при гибели [entity=rabbasca-warp-stabilizer] они удаляются и не могут использоваться со следующим стабилизатором.

