rabbasca-tinfoil-hat=Понижает IQ, зато повышает терпимость к опасности.\nПока шапочка надета, [item=rabbasca-psychosis] действует иначе: эффект проходит вдвое быстрее, а галлюцинации появляются как союзники.\n[color=#33aaff]Пока эффекты работают только с качеством [img=quality.normal].[/color]

