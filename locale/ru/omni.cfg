[space-location-description]
OMNI=Искусственная планета с давлением 1500 и гравитацией 15. Руд нет. Сырьё получают из дерева беренготенго, которое выращивают из семян на тайлах манча и виту. На планете есть ульи чудовищных кусак и плевак.

