[entity-factoriopedia-description]
muluna-telescope-combinator=Наблюдает за Вселенной и собирает сведения об окружении телескопа.\nНа планетах:\n[img=quality.normal]: индекс каждой космической платформы на орбите\n[img=quality.uncommon]: состояние каждой космической платформы на орбите\n      [font=default-bold]1[/font]: ожидание стартового набора.\n      [font=default-bold]2[/font]: стартовый набор запрошен из логистической сети.\n      [font=default-bold]3[/font]: стартовый набор в пути.\n      [font=default-bold]4[/font]: движение по маршруту.\n      [font=default-bold]5[/font]: платформа готова покинуть планету и не принимает доставки.\n      [font=default-bold]6[/font]: в расписании нет станций.\n      [font=default-bold]7[/font]: нет маршрута.\n      [font=default-bold]8[/font]: ожидание на станции.\n      [font=default-bold]9[/font]: пауза.\n[img=quality.rare]: каждая платформа на орбите может покинуть её, если значение равно 2 или не равно 1\nНа платформах:\n[img=virtual-signal.signal-I]: индекс космической платформы\n[img=virtual-signal.signal-X]: текущая позиция на космическом маршруте\n[img=virtual-signal.signal-L]: полная длина космического маршрута\nТелескоп также выдаёт сигнал для каждого астероида вокруг платформы. Компонент [entity=muluna-telescope].
muluna-telescope-combinator-no-quality=Вглядывается во Вселенную и собирает сведения об окружении телескопа.\nНа планетах: номер каждой космической платформы на орбите\nНа платформах:\n[img=virtual-signal.signal-I]: номер космической платформы\n[img=virtual-signal.signal-X]: в перелёте — текущая позиция на маршруте\n[img=virtual-signal.signal-L]: в перелёте — полная длина маршрута\nТакже выдаёт сигнал для каждого астероида вокруг платформы. Часть [entity=muluna-telescope].

