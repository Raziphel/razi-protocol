[tips-and-tricks-item-description]
orbital-cannon=Орбитальная катапульта напрямую связывает с целевой поверхностью: ракеты и капсулы не нужны. Она и отправляет, и принимает предметы.\n\nНа каждой поверхности можно поставить сколько угодно катапульт.\nПриёмную сторону катапульты можно отфильтровать, чтобы ограничить, какие предметы попадают на планету, а содержимое обеих сторон можно считывать по сети.\n\nДоступные связи отмечены на карте космоса красными линиями.
