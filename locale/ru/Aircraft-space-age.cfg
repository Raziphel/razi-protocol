[mod-setting-description]
carbon-fiber-aircraft=Добавляет самолёты из углеволокна с вдвое меньшими массой и запасом прочности по сравнению с обычными.
disable-tank-controls=Делает поведение самолётов реалистичнее: отключает танковое управление и задаёт радиус разворота.
experimental-features=Включает функции, которые ещё разрабатываются. Нет гарантии, что настройка на что-либо влияет.
lex-tech=Помещает авиацию Lex за технологией продвинутой аэродинамики. Используйте только вместе с Lex's Aircraft.
lock-surfaces-space-age=Ограничивает использование авиации условиями поверхности. Имеет значение только в Space Age.
space-age-easy-mode=Возвращает рецепты и технологии авиации высоких уровней к варианту без Space Age.
use-old-stats=Использует старые характеристики авиации из версии 2.0.2 вместо текущих перебалансированных.
