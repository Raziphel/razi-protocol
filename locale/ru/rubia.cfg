[technology-description]
rubia-craptonite-sunglasses=Покажите миру свой дурно пахнущий вкус с этими модными очками из этично добытого краптонита. Алмазные линзы создают ощущение, будто вы видите давление в различных материалах.
rubia-craptonite-cannister=Храните бутылку охлаждённого Геймерского энергетика™ в канистре, укреплённой краптонитом. Охлаждённый аквилонскими криогенными технологиями, один глоток этого «напитка?» всегда бодрит — и слегка мутит.
rubia-craptonite-eyedrop=Глаза щиплет, пока они впитывают эту жижу, зато обещано суперзрение. Производитель снимает с себя всякую ответственность. А в настройках мода эти щедроты всегда можно вежливо отвергнуть.
rubia-craptonite-codpiece=Прибавь себе уверенности с этим золотистым блестящим наплечником на краптонитовом каркасе: безвкусно, зато видно с орбиты. Он постоянно напоминает — выжимай максимум из того, что имеешь, даже если имеешь в основном мусор.
rubia-craptonite-grillz=Докажи вселенной, что по части дурновкусия тебе нет равных, — надень эти цинковые грилзы, укреплённые краптонитом. После такого «улучшения» твои зубы стали шокирующе токопроводящими.
rubia-craptonite-carrot=Эта «морковка» набита раббасканской аппаратурой, которая тянет энергию из окружающего эфира. Краптонитовая начинка выдерживает любые перегрузки, пока морковка заряжает хозяина по полной. Кролики одобряют.

[alert]
pre-rubia-recommended-difficulty=Рекомендуемая сложность Рубии для вашего уровня технологий: [color=0,250,250]«__1__».[/color]\nЕё можно поменять в Настройки/Настройки модов/Карта/Rubia, не выходя из игры. Лучше выставить сложность до полёта на Рубию.

[item-name]
ghetto-biorecycling-science-pack=Почти настоящий исследовательский пакет биопереработки

[mod-setting-description]
rubia-buttplug-integration=Рубия умеет дёргать внешнее устройство через Intiface Central во время катсцен и порывов ветра. Вам это не нужно. Правда. Работает только на Linux.

[rubia-taunt]
rubia-first-blast-off-part1=(Рубия) И вот инженер взлетел на своей ракете из мусора и палок, стремясь открыть больше материалов и планет и дать им имена ещё хуже, чем на Рубии.
