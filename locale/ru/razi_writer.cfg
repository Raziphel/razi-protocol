[razi-writer]
command-help=Режим сценариста для сюжетного текста. Только для администраторов. Использование: /razi-writer on|off, /razi-writer keys on|off, /razi-writer quest <id>, /razi-writer chapter <id>, /razi-writer records [off]
slot=[color=gray][слот __1__ — __2__, не более __3__ символов][/color]
key-tooltip=Ключ слота: __1__
admin-only=Режим сценариста доступен только администраторам.
mode-on=Режим сценариста включён. Показывается текст из locale/en/story-*.cfg или заглушка для незаполненного слота.
mode-off=Режим сценариста выключен.
not-on=Режим сценариста выключен. Включите его командой /razi-writer on.
keys-on=Ключи слотов показываются в подсказках к тексту.
keys-off=Ключи слотов скрыты.
records-on=Открыты все записи архива.
records-off=Записи архива открываются по мере выполнения заданий.
unknown-id=Неизвестный id: __1__
quest-hidden=Задание __1__ ещё недоступно. Изучите необходимые технологии, например с помощью /razi-cheat.
usage=Использование: /razi-writer on|off, /razi-writer keys on|off, /razi-writer quest <id>, /razi-writer chapter <id>, /razi-writer records [off]
