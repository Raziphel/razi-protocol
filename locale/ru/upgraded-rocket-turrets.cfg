[item-description]
upgraded-rocket-mk1=Ствол и система подачи из вольфрамовых сплавов, выкованные в литейных Вулкана. Каждая ракета летит как управляемый метеор.
upgraded-rocket-mk2=Сверхпроводящие катушки и суперконденсаторы, откалиброванные в магнитных бурях Фульгоры, ускоряют перезарядку.
upgraded-rocket-mk3=Переделана на Аквило: литиевая обшивка и аммиачное охлаждение позволяют точно стрелять даже в экстремальных условиях.
upgraded-rocket-mk4=Собрана в невесомости на космической платформе: квантовые процессоры и кристаллы прометия выводят пусковую установку за все известные пределы.

