[technology-description]
upgraded-rocket-1=Жар Вулкана позволяет укрепить ствол и механизм подачи вольфрамом. Повышает скорострельность и урон.
upgraded-rocket-2=Электромагнитные бури Фульгоры позволяют встроить сверхпроводники и суперконденсаторы. Ускоряет перезарядку и наведение.
upgraded-rocket-3=На Аквило ядро турели переделано: литиевая обшивка и аммиачное охлаждение позволяют быстро стрелять в сильный мороз.
upgraded-rocket-4=Квантовые процессоры и прометий превращают пусковую установку в предельно мощное осадное оружие.
