[technology-description]
coconut-drop-technology=Позволяет сбрасывать кокосы на поверхность Цериса ещё до пробоя магнитосферы, а также на Ариг, несмотря на его песчаную атмосферу.
crane-stack-diesel-inserter=Специализированный топливный кран для точного массового перемещения. Подобно пакетному манипулятору, он набирает полную пачку перед поворотом и плотно укладывает предметы слоями на конвейер. Усиленный захват переносит целые пачки, сочетая грузоподъёмность крана с точностью пакетного манипулятора.
diesel-agriculture=Сельское хозяйство с двигателями на жидком топливе.
ethanol-thruster=Этот ускоритель из лёгкого титана на чистом этаноле создаёт чистую и эффективную тягу без окислителя.
improvised-concrete=Позволяет создавать импровизированный бетон из местной биомассы и разложившихся материалов.
pelagos-asteroid-bioprocessing=Позволяет биокамере перерабатывать астероиды.
pelagos-biodiesel=Перерабатывает подготовленную биомассу в биодизель — возобновляемую альтернативу традиционному топливу.
pelagos-casting-engine-unit=Позволяет отливать блоки двигателя прямо из расплавленного железа и активированного углерода, минуя обычную механическую обработку.
project-diesel-dragon=Вершина дизельной инженерии: ракетная шахта на жидком топливе, независимая от электросети и пробивающая себе путь на орбиту грубой мощью. Открывает «Дизельного дракона».
titanium-technology=Открывает переработку титана.

