pelagos-boat-friction=Трение малой лодки. Чем оно меньше, тем быстрее лодка. Переопределяет настройку скорости лодок из Cargo Ships.
pelagos-methane-on-vesta=Удаляет метановые плитки при генерации Весты и добавляет добываемые нефтяной вышкой метановые пятна. Чтобы гарантировать доступ к метану, Веста будет зависеть от технологии нефтяной вышки.
pelagos-override-vesta-methane-fluid-icon=По умолчанию Веста и Пелагос используют разные значки метана. Включение заменит значок Весты значком Пелагоса.

