[tips-and-tricks-item-name]
electromagnetic_waves=Электромагнитные волны

[tips-and-tricks-item-description]
electromagnetic_waves=Каждая электрическая машина и генератор, включая солнечные панели и аккумуляторы, излучают невидимые электромагнитные волны.\nОни отражают излучение и помехи, возникающие при использовании электричества.\nРазные поверхности поглощают их с разной скоростью: вода почти не поглощает, а песок постепенно нейтрализует.\nРассадники и существа Пелагоса обнаруживают эти излучения и реагируют на них: чем мощнее электросеть, тем вероятнее она их потревожит.\nУчитывайте это при строительстве крупных энергоёмких заводов или используйте дизельные машины, если хотите оставаться в безопасности.
