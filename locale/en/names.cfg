[recipe-description]
razi-research-exchange=Manufacture three system tech cards from two standard batches plus additional sciences from two different planetary disciplines. This optional recipe does not replace the original.

[technology-description]
razi-calidus-research-exchange=Solaris materials engineering helps the original Calidus industry scale up. Unlocks a late-game alternative recipe for Calidus Tech Cards.
razi-solaris-research-exchange=Nyxaris' environmental and biological sciences are fed back into Solaris industrial production.
razi-nyxaris-research-exchange=Combine the exotic sciences of Vibrant with Nyxaris' original research chain.
razi-vibrant-research-exchange=Bring industrial breakthroughs from Cubium and Tenebris back to Vibrant's advanced science network.
razi-beetlejuice-research-exchange=Return discoveries from Promethium and Crucible to Beetlejuice's outer-system research infrastructure.
