[razi-location-briefing]
aegis-inner-edge=You've cleared the Aegis belt. Point Warden and the pulsar survey are on this side; save some ammunition for the trip back.
aegis-outer-edge=The rocks get thicker from here. Repair the ship before crossing to Inner Edge.
near-bellicos-orbit=The pulsar fills the windows. This survey route branches from Inner Edge, not Calidus.
bellicos-near-orbit=Close-range pulsar survey off Inner Edge. Bring supplies for the return trip.
near_bellicos_orbit=Close-range pulsar survey off Inner Edge. Bring supplies for the return trip.
point-warden=Last stop on the surveyed Aegis route. Whatever you'll need to get home has to come with you.
aegis-point-warden=Last stop on the surveyed Aegis route. Whatever you'll need to get home has to come with you.
skewer_shattered_planet=This is the real Shattered Planet, beyond its approach waypoint. Check the ship's condition before going any farther.
skewer_lost_beyond=The route carries on past the Shattered Planet. There are fewer charts and no quick way home.


nulla=The settlement is empty. Maintenance robots still make their rounds, and some react badly to radio traffic.
nauvis=Start with power, iron and a factory that runs without constant attention. The old terminal still assigns work to people who aren't here.
muluna=Close enough for a test flight, far enough to punish a sloppy one. Build a working supply loop between the moon and your platform.
vulcanus=Keep the foundries running and ship the metal. Castra and Arig will give it plenty to do.
castra=Useful machines are buried in the battlefield wreckage. Salvage them and reopen the routes to Arig and Hyarion.
arig=Dust gets into everything, including the water system. Keep the pumps working; Hyarion needs the minerals and glass.
hyarion=Crystal processing needs steadier hands than a furnace. Solaris's other worlds can use the results.
tellus=Living systems don't stop for production targets. Protect the machinery and keep the route to Corrundum open.
corrundum=Sulfur chemistry closes the Solaris industrial loop. Most inputs come from factories you've already built.
igrys=Glass, fluids and bare rock. An optional stop, but its machinery may justify the freight.
gleba=Everything spoils eventually. Keep the lines moving before the harvest becomes a warehouse problem.
moshine=Probes, processors and desert heat. The data will help Panglia later; get local production stable first.
apia=Apia shares an orbit with Carnova, not a factory. Its biology and royal-jelly processes need their own setup.
carnova=It shares a map label with Apia, but its biology calls for different equipment and experiments.
panglia=Timewarp zones ruin ordinary schedules. Moshine's data helps, but the roots and DNA work need careful testing.
foliax=An optional botanical detour. Bring processing capacity; mining alone won't do much here.
rabbasca=Gleba's moon has poor natural power and guarded sites. Pack extra energy storage.
pelagos=Most of the work happens on the water. This optional world keeps its own exploration and production rules.
lemures=Lava and tidal heat make parts of this icy Dea Dia world workable. Learn the local routes first.
prosephina=Shallow seas and warmer weather make this a different job from Lemures. No campaign deadline requires it.
fulgora=There's plenty to salvage under the lightning. Sort out electrical production before sending freight to Ribbonia.
ribbonia=Inside Vibrant's belt, Ribbonia leads to Khemia and Inner Rim. Bring a ship built for asteroids before heading outward.
paracelsin=Cold chemistry, zinc and liquid nitrogen beyond Vibrant's belt. Come via Outer Rim; Shchierbin lies farther out.
cerys=A nuclear industry on Fulgora's moon. The native reactor challenges are left as they were.
muria=Corrosive chemistry makes this a hard first stop. Build the chlorine lines before shipping toward Rubia or Athos.
aquilo=Heat is a resource here, not a side effect. Keep machines warm and freight moving from Rubia.
rubia=A storm can hold a delivery for days. Good storage beats another optimistic timetable.
maraxsis=Pressure domes, submarines and a lot of pipework. Underwater repairs don't get easier with distance.
obsidiax=Cold lava and growing stone need unfamiliar machinery. The Vesta route stays outside Umbra's inner belt.
cubium=Cube processing is its own headache. Stabilize the yard before sending freight to Linox or Secretas.
linox-planet_linox=There's little working room underground and plenty of heat. Plan the rare-earth lines before the first big shipment.
secretas=An asteroid crossroads beside a gas giant. Stock the recovery ship before taking the Frozeta route.
frozeta=A frozen graveyard of spacecraft. Recovering the material without losing your ship is the job.
tenebris=Light matters as much as ore. Build around the biology before moving on to Crucible.
crucible=Pressure and metallic hydrogen put ordinary equipment out of its depth. Use the native orbital transfer.
vesta=A workable outer staging stop if the fluid systems keep running. Obsidiax and Abacayba branch from here.
abacayba=Ruins, hostile growths and Itaverax make this moon a bad place for an unprepared landing.
carna=Cold-sensitive machinery, buried salvage and old machines under the snow. Not a casual side trip.
nexus=Nine boss trials and demanding native machinery. The journal records victories; you'll still have to earn them.
shattered-planet=This is the approach, not the real Shattered Planet. Check the destination name before claiming arrival.
solaris=Six industrial worlds, several different problems. Get their foundries, defenses and chemistry working together.
nyxaris=Gleba grows it, Moshine measures it, and the twin worlds complicate it. No one factory handles everything.
vibrant=Fulgora, Ribbonia and Khemia are inside the belt. Paracelsin and Shchierbin are outside. There's one defended crossing.
vespera=Muria's chemistry, Rubia's factories and Aquilo's cold supply need regular freight. Build that first.
beetlejuice=Cubium is the branching yard. Linox needs heat and rare earths; Secretas and Frozeta need salvage ships.
umbra=Stage at Vesta on the outside. A defended crossing leads to Tenebris and Crucible.
sye-calidus=Home departure. Solaris and Nyxaris are separate first trips; neither replaces the other's research.
sye-solaris=Solaris freight hub. Its researched Aegis connection heads south; the local industrial routes remain open.
sye-nyxaris=Nyxaris freight hub. Its own researched approach joins Solaris at the Aegis Frontier Gate.
sye-vibrant=Exterior arrival for Vibrant. Outer Rim is on this side; Ribbonia, Fulgora and Khemia are across the belt.
sye-vespera=Vespera's first freight stop. Muria is the practical starting point, followed by Rubia and the colder outer destinations.
sye-beetlejuice=Outer freight entrance. Build a Cubium base before splitting the fleet between Linox and Secretas.
sye-umbra=Approach Umbra from the outside. Vesta is a useful supply stop before the crossing to Tenebris.
solar-system-edge=The mapped outer routes meet here. Nexus, the Black Hole and Shattered Planet each have their own research requirements.
apia-carnova-orbit=Shared transfer point for Apia and Carnova. The planets share transport, not their production chains.
star-dea-dia=An optional nearby star with its own two-world route. The main campaign doesn't require it.
dea-dia-system-edge=Arrival point for the Dea Dia pair. Check local connections before planning return cargo.
razi-umbra-belt-inner=The Umbra crossing ends here. Tenebris and Crucible are on this side.
razi-umbra-belt-outer=Last supply stop before Umbra's inner belt. Check guns, repairs and power before departure.
crucible-orbit=Orbital approach to Crucible. The pressure-world transfer starts here.
pulsar=Aegis's bright, inhospitable center sits below Solaris and Nyxaris. The native rock fields aren't decorative.
calidus-bellicos-stargate-calidus=Solaris and Nyxaris approaches meet here. Cross from Outer Edge to Inner Edge for the pulsar survey or Point Warden.
black-hole-approach=Western Deep Space route from Solar System Edge. Carry supplies for the return flight.
black-hole=Beyond this point the old navigation charts aren't much help. The journey is optional.
oort-cloud=A long way beyond Nexus, with Sol farther along. Bring enough for two legs.
sol=The optional last stop beyond Oort Cloud. Its native exploration rules still apply.
halo-solar-orbit=A close solar orbit with flare hazards and difficult station logistics. Take the source safety rules seriously.
halo-solar-station=Solar computing on a tight thermal budget. Keep the station cooled and powered.
velora=An optional Gleba moon with ruins and unusual production. Not part of the main science gate.
ferrum=An artificial world of magnets and remote-controlled machinery. Very little conventional settlement work.
khemia=Inner Vibrant alchemy near Ribbonia. Crystal processing and transmutation are the reason to stop.
alchemy-planet=Khemia sits well inside Vibrant's belt. Reach it from Ribbonia; its native alchemy recipes do the hard work.
bm-balack=A harsh optional stop beyond Aquilo, where salvage and biofabrication meet promethium research.
arcanyx=An optional Umbra branch with prism and void processing, not a shortcut through the belt.
athos=Stone dust, earthquakes, diamond work and Particulate Science. Come from Muria.
shchierbin=Vanadium production beyond Vibrant's belt. Reach it from Paracelsin, after the required crossing.
asteroid-belt-inner-edge=Ribbonia's side of the southwest belt. Check defenses before the short, rough crossing outward.
asteroid-belt-outer-edge=The outside of Vibrant's southwest rock belt. Paracelsin and the exterior Slip Stream are on this side.
razi-deep-space-edge=Northern staging stop. Aegis is south of the first-frontier stars, nowhere near here.
razi-dea-dia-slip-stream=Optional transfer into Dea Dia. Its two worlds still have their own local routes.
igrys-orbit=Orbital stop for Igrys. Its industry and surface hazards are the point of the visit.
planet-ferrum=Ferrum's artificial-world approach. Magnetic machinery and remote operations come before ordinary factory work.
