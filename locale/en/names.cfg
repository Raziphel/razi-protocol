[recipe-description]
razi-convergence-calidus-frame=Combine research from Calidus, Solaris and Nyxaris into a stellar frame built in an existing assembler.
razi-convergence-outer-matrix=The four industrial frontier systems lock their science into one engineering matrix.
razi-convergence-void-lens=Fuse true Deep Space research with available optional pulsar and high-energy material sources.
razi-panglia-biooptic-glass=Import Moshine optical cables and Gleba bioflux into Panglia\'s native glassmaking. The bonus is limited and cannot use productivity.
razi-moshine-panglia-optical-cables=Return Panglite glass to Moshine to make a small additional batch of optical cables. Native recipes remain available.

razi-solaris-multiplex-cards=Combine four normal Solaris card batches with imported Vulcanus metals and tungsten for five cards. Saves 20% of ordinary card inputs per output; the craft takes 15% longer per base batch.
razi-nyxaris-multiplex-cards=Combine four normal Nyxaris card batches with Gleba bioflux and Moshine optical cable for five cards. Native card synthesis remains available.
razi-vibrant-multiplex-cards=Combine four Vibrant card batches with Paracelsin coils and Fulgoran holmium for five cards. Unlocks after Paracelsin research.
razi-vespera-multiplex-cards=Combine four Vespera card batches with Rubia craptonite and Gleba carbon fiber for five cards. Native recipes remain available.
razi-beetlejuice-multiplex-cards=Ship Secretas gold and Linox rare earths into Beetlejuice card production. Four regular batches and imported materials produce five cards, once Secretas research is complete.
razi-umbra-multiplex-cards=Combine Tenebris chitosan, Vesta supermagnets, and Linox rare earths with four Umbra card batches to create five. Research Vesta first.
razi-deep-space-multiplex-cards=Return real Aegis/Bellicos logistics and pulsar science to make five Deep Space cards from four ordinary batches. The native Deep Space recipe stays available.
razi-convergence-stellar-mandate=Package Calidus, Solaris and Nyxaris research with orbital electronics for the Convergence expedition.
razi-convergence-industrial-mandate=Forge a cross-frontier mandate from Vibrant, Vespera and existing planetary manufacturing.
razi-convergence-deep-space-mandate=Bind Beetlejuice, Umbra and Deep Space research into a physical outer-expedition payload.
razi-convergence-resonance-mandate=Calibrate an expedition payload from the outer science cards, high-power processors and suitable installed pulsar technology.
razi-convergence-ignition-mandate=Manufacture the final accord from all seven system technology cards, Deep Space science and advanced materials.
