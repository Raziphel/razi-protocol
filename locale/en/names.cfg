[razi-location-briefing]
razi-calidus-drift=A small salvage anchorage in the home system. Collect common asteroid chunks after early lunar space science, then transfer supplies between Nauvis, Muluna and the slipstream.
nauvis=The homeworld and industrial starting point of the Calidus expedition. Build the foundation for lunar industry and the first interstellar departure.
muluna=Nauvis's barren moon is Calidus's first off-world proving ground. Its asteroid-fed industry prepares early space platforms for the wider galaxy.
eneas=An optional satellite expedition within Calidus. Its native exploration and resource challenges remain separate from the required route to Solaris and Nyxaris.
vulcanus=Solaris's volcanic industrial anchor. Master metallurgy here before pressing into Castra and the more specialized worlds of this first frontier.
castra=A militarized world on the Solaris route. Its battlefield industry opens the way to Arig and Hyarion, the two branches that later converge at Tellus.
arig=Solaris's furnace of sand, drought and buried resources. Sandstorms complicate automation; progress through this branch alongside Hyarion before reaching Tellus.
hyarion=A Solaris world of lava, gemstones and destructive light refraction. Refine its crystals and industrial techniques as the counterpart to the Arig expedition.
tellus=A lush but hostile crossroads where Solaris's Arig and Hyarion routes meet. Living machinery, parasitic life and corrosive pollen turn biology into an industrial risk.
corrundum=The sulfur-chemistry culmination of Solaris. Its industrial science helps complete the first-frontier research needed before the middle systems open.
igrys=An optional Solaris expedition into barren stone, advanced glassmaking and mysterious magic-fluid production. It enriches the region without blocking chapter mastery.
gleba=Nyxaris's fertile yet unforgiving biological frontier. Its living production chains provide the foundation for the system's stranger experiments.
moshine=A scorching Nyxaris desert rich in metals, scientific probes and computational research. The data industry opens a later research expedition to Panglia.
apia=One half of Nyxaris's native twin-planet expedition. Industrialize Apia's life-rich royal-jelly environment while preserving the source system's links to Carnova.
carnova=The blood-red counterpart to Apia in Nyxaris. Its biology contributes to Panglia\'s later DNA and simulation laboratories.
panglia=A distant Nyxaris world of timewarp zones, Panglite, predatory energy roots and source-owned DNA experiments. Ship Moshine data cells and Apia biological expertise; recover native materials for guarded photonic exports.
foliax=An optional Nyxaris world where botany and arcane processing replace conventional mining. Its unusual production chains remain an independent expedition.
rabbasca=Gleba's forgotten moon remains in its native orbit within Nyxaris. Limited ambient power and defended vaults make it a distinctive optional expedition.
pelagos=An optional Nyxaris expedition reached from Moshine. Its own environment, resource systems and discovery mechanics remain intact.
lemures=An icy world of the optional Dea Dia subsystem, still governed by its native routes. Tidal heat, scattered lava and cold-environment industry set its challenges.
prosephina=The warmer companion in the optional Dea Dia subsystem. Shallow seas and signs of seeded life offer a very different industrial puzzle from frozen Lemures.
fulgora=Vibrant's electromagnetic anchor. Recover ancient technology and build the electrical foundation for the artificial ringworld and specialized chemical worlds beyond.
ribbonia=A derelict Fulgoran ringworld within Vibrant. Its plasma engineering and unusual transport challenges lead through the asteroid belt into Paracelsin's cryogenic industry.
paracelsin=Vibrant's cryovolcanic world of zinc and liquid nitrogen. Keep machinery working through the cold as its electrochemical industry completes the industrial discipline beyond the asteroid belt.
cerys=Fulgora's moon keeps its native relationship with its parent, now in Vibrant. This optional expedition retains its source-mod mechanics and discovery path.
muria=The corrosive, chlorine-rich gateway to Vespera. Its lead chemistry and living defenses begin the harsh-environment expedition that continues toward Aquilo.
aquilo=The frozen industrial threshold of Vespera. Beyond its cryogenic facilities lies the Debris Divide, whose surveyed crossing leads onward to Rubia.
rubia=Vespera's wind-scoured factory world lies beyond the Debris Divide. Master its unconventional belts, inserters and waste streams before continuing to Maraxsis.
maraxsis=An ocean planet deep in Vespera's route. Underwater pressure domes, submarines and fluid engineering cap the system's demanding environmental progression.
obsidiax=An optional world of freezing air and expansive lava, where rocks are grown rather than mined. It joins Vespera without becoming a chapter requirement.
cubium=Beetlejuice's outer-rim industrial entry. Its unusual cube-focused processes branch toward both the extreme Linox expedition and the Secretas/Frozeta chain.
linox-planet_linox=A devastating furnace-world on Beetlejuice's Cubium branch. Its brutal surface and confined underground industry remain intact despite its new place in the galaxy.
secretas=A colossal gas giant and dangerous asteroid crossroads of Beetlejuice. Its distant companion Frozeta turns wreckage into the next industrial challenge.
frozeta=Secretas's frozen companion at the end of Beetlejuice's salvage branch. Recover and recycle spacecraft wreckage to complete this outer-frontier expedition.
tenebris=Umbra begins beneath the permanent darkness of Tenebris. Bioluminescent production and a hostile atmosphere mark the first step toward Crucible and Vesta.
crucible=An immense, high-pressure world whose metallic-hydrogen industry tests the limits of engineering. Its orbital approach leads toward Umbra's shattered belt.
vesta=A distant gas world devoted to atmospheric and fluid processing. To reach it through Umbra, first survey and survive the Shattered Divide beyond Crucible Orbit.
carna=An optional Umbra expedition into perpetual snow, cold-sensitive machinery, plasma and dormant mechanoids. Its native salvage challenges are preserved.
nexus=An optional Deep Space venture beyond the seven-system campaign. Its exotic technologies extend the expedition without becoming prerequisites to the transceiver finale.
shattered-planet=The remote shattered frontier beyond the Solar System Edge. Promethium-rich space belongs to the late expedition, after both outer-system chapters are mastered.
solaris=The first industrial frontier: Vulcanus, Castra and the two Arig/Hyarion branches converge through Tellus toward Corrundum. Explore Solaris independently of Nyxaris.
nyxaris=The parallel biological and computational frontier. Moshine and Apia/Carnova lead to Panglia\'s timewarp and DNA studies; both Nyxaris and Solaris must be mastered for the next frontier.
vibrant=An electromagnetic and chemical middle frontier. Fulgora anchors the system while Ribbonia and Paracelsin form the specialist route across the asteroid belt.
vespera=Vespera tests industrial survival across acid, cold, wind and ocean. Travel from Muria through Aquilo and the Debris Divide to Rubia and Maraxsis.
beetlejuice=The industrial outer frontier. Cubium branches toward the extreme Linox world and the distant Secretas/Frozeta salvage chain before Deep Space.
umbra=The experimental outer frontier. Tenebris and Crucible lead to a dangerous asteroid divide and the gas-processing world of Vesta.
sye-calidus=The departure corridor from Nauvis and Muluna. From here, either Solaris or Nyxaris may be explored first after its discovery research.
sye-solaris=Interstellar arrival and departure point for Solaris. Its crosslinks form part of the seven-system lattice, but new destinations still require their own discoveries.
sye-nyxaris=Interstellar arrival and departure point for Nyxaris. This branch may be explored before Solaris; later frontiers require mastery of both.
sye-vibrant=Transit corridor for Vibrant's electrical and chemical worlds. Its outward links become useful as the middle frontier opens.
sye-vespera=Transit corridor for Vespera's hostile industrial worlds. The inner Debris Divide still lies beyond Aquilo and requires its own survey.
sye-beetlejuice=Outer-frontier arrival point for the Cubium, Linox and Secretas expeditions. Interstellar diagonals do not bypass their research gates.
sye-umbra=Arrival corridor for Umbra's dark and high-pressure worlds. The journey to Vesta continues through the surveyed Shattered Divide.
solar-system-edge=The threshold beyond both outer frontiers. Here the campaign moves from system mastery to the Shattered Planet, pulsar expedition and optional Deep Space branches.
apia-carnova-orbit=The shared orbital gateway to Apia and Carnova. Their native paired-world connections remain intact inside Nyxaris.
star-dea-dia=An optional stellar subsystem attached to Nyxaris. Its native internal routes are preserved rather than merged into the core seven-system lattice.
dea-dia-system-edge=Entry to the optional Dea Dia subsystem. Discover its internal worlds along their original local connections.
razi-vespera-belt-inner=A resource-rich staging point beyond Aquilo. Prepare for the concentrated medium and big asteroids of Vespera's Debris Divide.
razi-vespera-belt-outer=The far side of the Debris Divide. Refit and resupply after the crossing before continuing toward Rubia.
razi-umbra-belt-inner=The last preparation point before the Shattered Divide. Huge asteroids begin to matter here; heavy defenses are essential.
razi-umbra-belt-outer=The exit from Umbra's most dangerous belt crossing. Beyond lies Vesta and its atmospheric-processing challenge.
crucible-orbit=The orbital approach to Crucible and the departure point for the Shattered Divide crossing toward Vesta. Preserve Crucible's native landing route.
pulsar=A distant pulsar beyond the Solar System Edge, home to the preserved Aegis and Bellicos expedition. Its native science and stargate routes remain distinct.
calidus-bellicos-stargate-calidus=The Deep Space entrance to the Aegis/Bellicos stargate expedition. Its original internal network remains intact.
calidus-bellicos-stargate-bellicos=The inner gate of the distant pulsar expedition, positioned on the approach toward Bellicos.
black-hole-approach=An optional route into the black-hole branch. It remains outside the required seven-system and transceiver campaign.
black-hole=An optional gravitational extreme at the end of the black-hole approach. Enter only after preparing for the native Deep Space challenges.
oort-cloud=An optional distant branch beyond Nexus that preserves its source-mod journey toward Sol.
sol=An optional faraway destination at the end of the Nexus/Oort Cloud branch, outside the required victory route.
halo-solar-orbit=Solar Halo's high-energy orbit. Native solar flare hazards and its station connection are preserved.
halo-solar-station=Solar-powered high-energy research station. Manage heat and supercomputing in the original production chain.
velora=Optional Gleba moon with ancient ruins, unusual enemies and unique manufacturing. Its original orbital links remain intact.
ferrum=Experimental artificial world controlled remotely. Its branching research, magnetic industry and robot factory are preserved.
khemia=Alchemical world of crystals, glyph logistics and transmutation. Solve its native fluid and extraction challenges.
nulla=Abandoned drone-factory moon of Aquilo. Its original defense mechanics and satellite routes are untouched.
bm-balack=Dangerous post-Aquilo scrap and biofabrication world. Its original promethium science requirements are retained.
arcanyx=Distant prism-and-voidcrafting factory world. Native Voidcraft and Iridescent Industry progression remains intact.
