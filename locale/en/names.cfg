razi-vespera-belt-survey=Chart the debris divide beyond Aquilo. Inner and outer rim waypoints are rich in asteroid resources, but the crossing is filled with medium and big asteroids.
razi-umbra-belt-survey=Chart the shattered divide beyond Crucible Orbit. This treacherous belt contains heavy concentrations of big and huge asteroids. Bring a properly defended platform.

