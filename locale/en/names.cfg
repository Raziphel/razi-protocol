[technology-description]
razi-panglia-biooptic-glass=Coordinate the Moshine, Gleba and Panglia factories. Requires original Panglite glass and imported optical supplies.
razi-moshine-panglia-optical-cables=Return Panglite glass to Moshine without bypassing any of the native glass or optical-cable research steps.
razi-vespera-belt-survey=Chart the debris divide beyond Aquilo. Inner and outer rim waypoints are rich in asteroid resources, but the crossing is filled with medium and big asteroids.
razi-umbra-belt-survey=Chart the shattered divide beyond Crucible Orbit. This treacherous belt contains heavy concentrations of big and huge asteroids. Bring a properly defended platform.

[space-location-description]
razi-calidus-drift=A quiet field of metallic, carbonic and oxide fragments near Nauvis. Park platforms here to gather modest supplies after lunar space science. This is an orbital destination, not a landable planet.
razi-vespera-belt-inner=Resource-rich inner rim of Vespera's debris belt. Prepare your platform before crossing.
razi-vespera-belt-outer=Outer rim of Vespera's debris belt, on the way to Rubia.
razi-umbra-belt-inner=Resource-rich entry to Umbra's shattered belt. Massive asteroid encounters ahead.
razi-umbra-belt-outer=Outer rim of Umbra's shattered belt, on the way to Vesta.

