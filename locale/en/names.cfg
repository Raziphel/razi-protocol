[technology-description]
space-discovery-asteroid-belt=Survey the metallic belt around Vibrant. Prepare a defended platform for the mandatory 5,000 km crossing.
razi-umbra-belt-survey=Survey Umbra's Shattered Divide at its safe outer rim, before heading inward to Tenebris and Crucible. The passage contains big and huge asteroids, so bring a defended space platform.

[space-location-description]
asteroid-belt-inner-edge=The resource-rich inner rim of Vibrant's metallic belt. Resupply before the hazardous passage.
asteroid-belt-outer-edge=The outer rim of Vibrant's metallic belt, leading onward to Paracelsin and Beetlejuice.
razi-umbra-belt-inner=The inner rim of Umbra's Shattered Divide, with harvestable ore. Tenebris and Crucible lie beyond it.
razi-umbra-belt-outer=The outer rim of Umbra's Shattered Divide, the last safe staging point before the dangerous passage inward.
