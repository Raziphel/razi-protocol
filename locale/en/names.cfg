[razi-location-briefing]
nulla=A remote Vespera repair outpost whose maintenance reports never seem to close. Preserve the source world's salvage and production rules; this optional journey is a choice, not a chapter requirement.
nauvis=The last surviving departure manifest begins here, beneath factories that still answer to a vanished company. Establish dependable power, automation and a lunar supply line before seeking another system.
muluna=The first off-world test was never a grand colony, just a moon where crews learned to turn passing asteroids into industry. Prove your platform logistics here before trusting them between stars.
vulcanus=Solaris begins in heat and heavy metal. Old freight ledgers prized its foundries for what they could supply elsewhere; establish metallurgy, then carry it into the Castra and Arig branches.
castra=The defense ledger records materials, not the people who needed them. Recover the value of Castra's battlefield manufacturing, then open the way toward Arig and Hyarion.
arig=Sandstorms erase easy routes but leave buried industry intact. Its dry-world processing complements Hyarion's crystal works; bring both specialties toward Tellus.
hyarion=Light bends through dangerous crystals above the lava fields. Use that precision industry beside Arig's harsher materials before the Solaris branches meet at Tellus.
tellus=At the junction of two industrial routes, pollen and parasites make every sealed production line worth protecting. Solaris's living machinery is a warning that not every hazard comes from a furnace.
corrundum=Sulfur chemistry closes the Solaris industrial circuit. The old network treated this world as a final invoice; the expedition needs its science to turn separate factories into a shared frontier.
igrys=Optional survey: bare stone, advanced glass and unusual fluid processing. Its independent industries can reinforce Solaris, but no central charter requires you to land here.
gleba=The Nyxaris manifests describe living production as inventory that could never be held still. Learn spoilage and biological logistics; these materials will matter far beyond this fertile world.
moshine=A burning desert where probes and processors turn observations into industry. Its research data supports the wider Nyxaris network and later work on Panglia.
apia=Half of a paired biological expedition whose native orbital routes still matter. Develop Apia's royal-jelly industry and compare its findings with Carnova without severing their shared system.
carnova=A red twin to Apia with its own unsettling biology. The old ledgers filed both worlds under one heading; their distinct production chains deserve separate investigation.
panglia=Time-distorted terrain and predatory energy roots make precision planning essential. Combine Moshine's data work with native DNA research; do not mistake a simulation for the living world beneath it.
foliax=Optional survey: botany and unusual processing displace ordinary mining. RAZI's archive lists an independent supply opportunity, not a required link in the main campaign.
rabbasca=A forgotten moon of Gleba with scarce ambient power and guarded vaults. The source expedition stands on its own; carry dependable energy if you choose to recover its abandoned facilities.
pelagos=Optional sea-bound Nyxaris expedition. Its environment and native discoveries are preserved; treat any recovered freight entry as an invitation, never an obligation.
lemures=An icy world in the optional Dea Dia subsystem, held together by tidal heat and scattered lava. Local routes and native survival rules remain the authority here.
prosephina=The warmer Dea Dia companion has shallow seas and traces of seeded life. Its conditions contrast with Lemures, but neither world is required for the seven-system charter.
fulgora=Vibrant's broken electrical archive hides working principles among the ruins. Salvage electromagnetic technology before tackling the ringworld and the industries across its asteroid belt.
ribbonia=An abandoned ringworld where power, plasma and transport are inseparable. The outward route reaches the inner asteroid-belt rim; prepare the ship before crossing to Paracelsin.
paracelsin=Cold machinery, zinc and liquid nitrogen sustain the far side of Vibrant's belt. Recover the chemical discipline here rather than treating the crossing as the end of the expedition.
cerys=Fulgora's native moon remains on its original orbit. Its nuclear industry offers a valuable side study without rewriting the discoveries or hazards its authors placed there.
muria=Vespera's hot, corrosive entrance defeats careless materials handling. Chlorine chemistry begins a chain of shipments toward Rubia, Aquilo and a dry-world spur to Athos.
aquilo=At the cold end of Vespera, reliable heat is a supply-chain decision. Develop cryogenic industry here after the Rubian corridor; no invented asteroid belt blocks the approach.
rubia=Wind scours the factories between Muria's corrosive chemistry and Vespera's outer destinations. The old freight network counted cargo; your task is to make it useful again.
maraxsis=Beneath a greenhouse-warmed ocean, pressure domes and submarines replace the usual surface works. Rubia provides the approach; deep fluid engineering is the reason to stay.
obsidiax=On Umbra's exterior, cold lava and growing stone challenge conventional machines. Its Vesta connection avoids the Shattered Divide; treat the native industrial puzzles as their own expedition.
cubium=Beetlejuice begins with strange cube-based processes and two very different outward branches. Build a dependable cargo base before choosing the furnace of Linox or Secretas's salvage chain.
linox-planet_linox=The Cubium branch ends in an unforgiving furnace world with tightly constrained underground industry. Its output is valuable, but the journey should not be mistaken for ordinary freight.
secretas=A vast gas giant at an asteroid crossroads. Its native conditions lead toward the frozen wreckage of Frozeta; the old route charts contain warnings, not guarantees.
frozeta=Beyond Secretas, broken spacecraft become raw material in the cold. Recover and recycle what the expeditions before you left behind without rewriting their source-owned story.
tenebris=Beyond the surveyed Umbra belt, light itself becomes part of the factory plan. Bioluminescent industry marks the inward path toward Crucible; carry a ship capable of reaching it.
crucible=Pressure and metallic hydrogen push factories beyond familiar limits. Reach this immense world through its original orbit, and let its engineering speak for itself.
vesta=A distant gas world on Umbra's safer outer arc. Build pressure and fluid expertise here; Obsidiax and the optional Abacayba moon branch outward without crossing the belt.
abacayba=An optional infested satellite of Vesta. Ruins, native bosses and Itaverax belong to its source expedition; approach as a hazardous investigation, not an automatic chapter requirement.
carna=Optional snowbound Umbra salvage route. Cold-sensitive equipment, plasma and dormant mechanoids make the visit its own industrial problem, separate from the main belt gate.
nexus=Deep Space's native proving ground: storm control, omega industry and nine boss trials remain intact. RAZI can record the results, but it cannot claim ownership of the trials or their trophies.
shattered-planet=Promethium-rich fragments mark the remote boundary of familiar space. The old network has few reliable records here; approach only with a ship built for the final frontier.
skewer_shattered_planet=Optional. Reached through the Shattered Planet approach.
skewer_lost_beyond=Optional. Beyond the Shattered Planet; the last location of that expedition.
solaris=The industrial first frontier is a loop, not a single factory. Vulcanus, Castra, Arig, Hyarion, Tellus and Corrundum each supply a different answer to the same question: how does a system sustain itself?
nyxaris=An independent first-frontier choice: biological production on Gleba, computation on Moshine and paired-world research around Apia and Carnova. Both first frontiers feed the next stage.
vibrant=The middle frontier turns salvage into precision. Fulgora and Ribbonia occupy the inner electrical side; crossing the real asteroid belt opens Paracelsin and its chemical industry.
vespera=A middle frontier without a fabricated belt barrier. Muria, Rubia, Maraxsis and Aquilo trade heat, materials and survival techniques; optional Athos records a different path.
beetlejuice=The outer industry splits at Cubium: Linox's furnaces in one direction, Secretas and Frozeta's recovery chain in the other. Master the work before attempting the distant exits.
umbra=Umbra's outer yards lie beyond one dangerous Shattered Divide. Vesta and its companions offer staging; the single surveyed belt crossing leads inward to Tenebris and Crucible.
sye-calidus=Outbound manifest: the home factories can now send a platform farther than the moon. Solaris and Nyxaris are separate first-frontier destinations; choose either, then build toward both.
sye-solaris=Solaris transfer point. Metal, heat and defensive industry move through this corridor, with research opening new destinations rather than the starmap granting free access.
sye-nyxaris=Nyxaris transfer point. Biology and computation share a cargo network, but the world discoveries remain independent of the route lines.
sye-vibrant=Vibrant's exterior transfer corridor connects the electrical frontier to the broader lattice. Its inner and outer belt approaches are distinct; do not infer a safe bypass.
sye-vespera=Vespera's approach opens corrosive Muria before industrial Rubia and the cold outward routes. The passage itself has no artificial belt crossing.
sye-beetlejuice=Outer-rim arrival: a functioning supply route, not a waiver of discovery research. Cubium anchors the next choices between high-heat industry and wreckage recovery.
sye-umbra=Umbra exterior approach. Supply Vesta and stage at the outer belt rim before committing a ship to the one hazardous crossing toward the inner worlds.
solar-system-edge=The charter's survey coverage ends here. Both outer industries can feed this staging corridor, but Deep Space and the distant expeditions still obey their own research.
apia-carnova-orbit=A shared orbital gateway that respects the two source-owned worlds below. Industrial deliveries can join their investigations without flattening their differences.
star-dea-dia=Optional stellar branch of Nyxaris. Keep its native routes and discoveries intact; the seven-system expedition does not depend on its worlds.
dea-dia-system-edge=A quieter arrival point for the optional Dea Dia branch. Establish local navigation before investigating its cold and warm companion worlds.
razi-umbra-belt-inner=The hard part is behind the ship, not the factory. From the inner Shattered Divide, Tenebris and Crucible become reachable along their actual local routes.
razi-umbra-belt-outer=Last safe staging point before the Shattered Divide. Ammunition, repairs and power reserves belong on the manifest before the inward crossing.
crucible-orbit=Crucible's original orbital approach preserves its source-world arrival. A controlled transfer separates the inner Umbra shipping lane from the pressure world below.
pulsar=The Aegis pulsar, south of Solaris and Nyxaris. The inner expedition follows the research of the Bellicos and Aegis mod.
calidus-bellicos-stargate-calidus=Shared arrival gate for Solaris and Nyxaris. The Aegis survey research opens it.
black-hole-approach=Optional Deep Space branch. Sparse records and difficult travel make preparation more useful than speculation; native research controls what lies ahead.
black-hole=At the gravitational extreme, inherited charts stop being useful. This optional destination keeps its own challenges outside the required main campaign.
oort-cloud=A distant optional branch beyond the main network. Follow its original routes toward Sol without inventing a shortcut back into the charter.
sol=An optional faraway destination at the end of the Nexus and Oort path. Its source exploration remains separate from the campaign's required victory.
velora=Optional moon of Gleba, with ancient ruins and unfamiliar manufacturing. Keep the source orbit and local dangers; this is a side journey, not a missing core science gate.
ferrum=An experimental artificial world where remote control and magnetic industry matter more than conventional settlement. Native robotics research stays intact.
khemia=An alchemical side expedition of crystals, glyph logistics and transmutation. Preserve its original extraction and fluid challenges; no mandatory charter depends on it.
alchemy-planet=A Vibrant side expedition into crystal processing and transmutation. Its native extraction puzzle remains independent of the main electrical corridor.
bm-balack=An optional, hazardous post-Aquilo world of salvage and biofabrication. Its source-owned promethium research is not replaced by the Vespera network.
arcanyx=An outer Umbra side path of prism and voidcrafting industries. Explore its native research after establishing a reliable route to the dark frontier.
athos=An arid side route from Muria: earthquakes, stone and diamond processing, and Particulate Science shape its challenge. Its crash-site story stays with the original mod.
shchierbin=A vanadium-rich specialist world outside Vibrant's inner asteroid band. Its Paracelsin supply link supports outer chemistry without reopening a forbidden shortcut.
asteroid-belt-inner-edge=The inner Vibrant belt rim is a loading dock, not a destination. Ribbonia's freight arrives here; the physical crossing demands a defended platform.
asteroid-belt-outer-edge=The far side of Vibrant's real belt crossing. Paracelsin and the outer-bound network lie ahead, but a safe inbound shortcut has not been invented.
razi-deep-space-edge=A remote staging waypoint where reliable charter charts thin out. The native discovery requirements still decide which distant route can be attempted.
razi-dea-dia-slip-stream=Optional interstellar approach to Dea Dia. Treat it as a gateway to the source subsystem, not a replacement for its own local navigation.
igrys-orbit=Local orbital approach for the optional Igrys expedition. Its original surface and production challenges remain unaffected by the wider Solaris routes.
planet-ferrum=Artificial-world expedition focused on remotely controlled machinery and magnetic production. Its original research and logistics remain the authority.
