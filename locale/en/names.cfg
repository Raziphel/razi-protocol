aegis-outer-edge=Outer side of the Aegis debris belt. Arrive from the Frontier Gate; cross the hazardous field inward toward the Inner Edge.
aegis-inner-edge=Inner side of the Aegis debris belt. Connects the outer crossing to Near Bellicos Orbit and Point Warden.
near-bellicos-orbit=A pulsar-side survey waypoint reached from Aegis Inner Edge, not a return passage to Calidus.
bellicos-near-orbit=A pulsar-side survey waypoint reached from Aegis Inner Edge, not a return passage to Calidus.
near_bellicos_orbit=A pulsar-side survey waypoint reached from Aegis Inner Edge, not a return passage to Calidus.
point-warden=Interior Aegis survey outpost and the last curated destination. Return through Inner Edge.
aegis-point-warden=Interior Aegis survey outpost and the last curated destination. Return through Inner Edge.

