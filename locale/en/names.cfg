[item-description]
razi-convergence-witness-anchor=A physical proof of an independent system's right to refuse executive control.
razi-convergence-array-core=Expedition-mounted 50 MW transmitter that completes the independent seven-system countersignature.
razi-archive-relay=Powered interstellar evidence station. Connect three separate star systems to recover the lost Archive Array.
razi-skybridge-consignment=Sealed proof-of-freight ticket minted only at a provisioned orbital catapult origin.
razi-convergence-stellar-mandate=The first three stars send their science and orbital electronics to the outer expedition.
razi-convergence-industrial-mandate=Vibrant and Vespera's mature factories contribute a tangible industrial shipment.
razi-convergence-deep-space-mandate=An outer-space shipment from Beetlejuice, Umbra and Deep Space research.
razi-convergence-resonance-mandate=Pulsar-grade processing and far-frontier materials tune the signal across interstellar distances.
razi-convergence-ignition-mandate=The three engineered assemblies unite all eight system cards. Send the completed Mandate aboard a deep-space expedition platform.
razi-convergence-calidus-frame=The inner three systems turn their research and orbital electronics into a calibrated structural frame.
razi-convergence-outer-matrix=Vibrant, Vespera, Beetlejuice and Umbra combine their industries into the array's signal matrix.
razi-convergence-void-lens=Deep-Space technology and compatible pulsar materials focus the final carrier signal.

