[technology-description]
razi-convergence-witness-network=Recovered evidence proves that RAZI's executive authentication cannot be trusted. Manufacture powered witnesses for all seven systems before final Ignition.
razi-archive-array=Build powered RAZI Archive Relays in three distinct star systems. Recover long-lost corporate transmissions without granting combat or science advantages.
space-discovery-asteroid-belt=Survey the metallic belt around Vibrant. Prepare a defended platform for the mandatory 5,000 km crossing.
razi-panglia-biooptic-glass=Coordinate the Moshine, Gleba and Panglia factories. Requires original Panglite glass and imported optical supplies.
razi-moshine-panglia-optical-cables=Return Panglite glass to Moshine without bypassing any of the native glass or optical-cable research steps.
razi-umbra-belt-survey=Survey Umbra's Shattered Divide at its safe outer rim, before heading inward to Tenebris and Crucible. The passage contains big and huge asteroids, so bring a defended space platform.

razi-convergence-commission=Begin a physical interstellar engineering commission beyond the transceiver and the Solar System Edge. Research alone cannot complete the campaign.
razi-convergence-synchronization=Authorize the Deep-Space and Pulsar Resonance freight stages; physical delivery and final ignition research are still necessary.
razi-convergence-ignition=Unify Calidus Dyson distribution, outer-frontier research and the synchronized transmission into one final, physically delivered ignition.
[space-location-description]
asteroid-belt-inner-edge=The resource-rich inner rim of Vibrant's metallic belt. Resupply before the hazardous passage.
asteroid-belt-outer-edge=The outer rim of Vibrant's metallic belt, leading onward to Paracelsin and Beetlejuice.

