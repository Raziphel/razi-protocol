[journal-chapter-story]
calidus=The first expedition does not begin at a launchpad. It begins on Nauvis, with the first powered machines, a reliable supply of iron and copper, and the decision to turn a factory into a vessel for exploration.
solaris=Solaris is a furnace of second chances. Vulcanus supplies the heat, Castra the scars of old industry, and Arig and Hyarion lead toward Tellus and Corrundum. Every branch teaches the crew to recover value from hostile ground.
nyxaris=Nyxaris challenges the division between organism and machine. Gleba and Moshine establish the first biological and computational footholds; Apia and Panglia push their discoveries into genetics, optics and simulation.
vibrant=Vibrant splits the survey between lightning and stone. Fulgora leads to Cerys, while Ribbonia marks the approach to the asteroid divide. Paracelsin waits beyond the crossing, where stronger ships become as important as stronger factories.
vespera=Vespera is no longer a solitary passage through the cold. Muria opens the expedition; Athos studies the mineral frontier, while Rubia branches toward Maraxsis's oceans and Aquilo's frozen industry. Beyond Aquilo, Nulla's abandoned robots hold another kind of science.
beetlejuice=Beyond the familiar supply lanes, Beetlejuice begins with Cubium and breaks toward Linox and Secretas. Frozeta lies farther along the Secretas branch. These worlds are not interchangeable stops: each supplies a different answer to the demands of the outer frontier.
umbra=Umbra begins at a surveyed divide, not at its inner worlds. The convoy must prepare for the belt crossing before Tenebris and Crucible; distant Vesta and its optional moon Abacayba become the last laboratories beneath the dark horizon.
stellar=The Dyson program draws distant discoveries back toward the Calidus star. Research grants access to the engineering, but the great work itself must be constructed, powered and supplied. The journal records the blueprint; the project dossier follows the build.
network=A chart of connected worlds is not yet a working supply network. This chapter connects frontier research, specialized production and actual cargo partnerships, including the recovery work linking Athos and Nulla.
finale=The outer frontier is the threshold, not the ending. The singularity experiments, Solar System Edge, Aegis and the Convergence Mandates turn every earlier expedition into one last test of whether the factory can reach beyond its own galaxy.

foundations=The archivist opens a battered factory ledger. Across its pages, copper wires become launch rails and the first impossible coordinates appear in the margins.
fleet=The fleet's history is measured in ordinary decisions: fuel reserves, cargo capacity, asteroid defenses and the first platform capable of crossing an unfamiliar route. These are the foundations of every later journey.
outposts=The smaller worlds refuse to stay in the footnotes. Their discoveries can provide unique industries and alternative research without becoming mandatory stepping stones for every expedition.
sciences=Every science pack is a different discipline learning to speak with another star. The research web is a story of cooperation, not a checklist of colored bottles.
defense=Defense records are written by crews who wanted to be explorers. They know that a factory cannot function if its supply ships cannot return.
deepworks=At the outer edge, the distinction between electricity, matter and information becomes increasingly expensive to defend. The laboratory keeps its doors closed.
echoes=The first fragments look like accidents. The final ones form a question. No one is sure whether it comes from the distant galaxy or the expedition's own future.
alliances=The first expedition discovered worlds. The second discovers that no world can finish every factory alone. Native technologies and optional trade recipes turn distant discoveries into a working industrial constellation.

fluxworks=The seven systems no longer need to manufacture in isolation. FluxWorks establishes one specialist workshop for each system, then connects five pairs of industries with source-backed cooperative recipes. Research records the designs; supplying the machines remains the player's work.

[journal-chapter-dispatch]
calidus=Four field acts trace Nauvis from early power, belts and electronics through green science, steel, engines and trains, then into oil, plastic and chemical research. The last act is the launch toward Muluna, Solaris and Nyxaris.
solaris=Survey Vulcanus and Castra first. The Arig and Hyarion branches converge on Tellus, then Corrundum closes this industrial frontier. Prepare separate industrial supply lines for each environment.
nyxaris=Establish Gleba and Moshine before Apia. From Apia and Moshine, investigate Panglia's native resource multiplication, glass, optics, DNA research and simulation chain. Connect useful products through the supply network.
vibrant=Fulgora and Ribbonia are parallel early discoveries. Reach Cerys through Fulgora; from Ribbonia survey the asteroid belt and prepare the designated crossing before attempting Paracelsin.
vespera=Begin at Muria. Athos branches from Muria and contributes Particulate Science; Rubia opens the routes to both Maraxsis and Aquilo. Explore Nulla after Aquilo and recover its Robotic Science. Maraxsis also hosts the Seadragon project.
beetlejuice=Reach Cubium before branching toward Linox and Secretas. Frozeta follows Secretas. These outer worlds contribute to the late mastery research rather than serving as disconnected optional detours.
umbra=Survey the Umbra belt from the outer approach, then proceed through Tenebris and Crucible toward Vesta. Abacayba is an optional moon reached after Vesta when its source mod is installed.
stellar=Return the discoveries of distant worlds to Calidus. Follow the real Dyson construction and receiver milestones rather than treating research alone as a completed megastructure.
network=Research the interplanetary trade backbone, precision matrix and extreme lattice as their real prerequisites become available. Visit Projects for cargo delivery progress; journal research milestones do not prove a shipment was made.
alliances=Combine the strengths of multiple installed industries. The production partnerships documented here link existing worlds and machines without inventing new factory tiers.
finale=Outer Frontier Mastery depends on the remote systems and the Athos–Nulla recovery charter. Complete singularity experiments before the Solar System Edge, investigate Aegis, and follow the physical Convergence Mandates through the Projects dossier.
foundations=Revisit the discoveries that made this voyage possible: power, automation, research, and the first machinery sturdy enough to leave the launchpad.
fleet=Explore flight engineering and the difficult practicalities of distant routes. Research the infrastructure that keeps platforms and their crews intact.
outposts=Optional worlds have their own stories. Each entry leads to real discoveries and their source-owned technologies without blocking the main campaign.
sciences=Connect scientific disciplines across worlds and learn which technologies demand later laboratories, material imports, and more capable research infrastructure.
defense=The frontier is not empty. Harden your factories and space platforms as each expedition opens increasingly dangerous shipping lanes.
deepworks=At the remote edges, recover advanced engineering, extraordinary materials, and the technologies that turn frontier experiments into workable machines.
echoes=Gather recovered transmissions only as their associated research is completed. These archival pages reveal expedition fiction rather than awarding new in-game powers.

fluxworks=Survey each workshop after its home system is accessible. Develop seven specialist technologies and five cross-system exchanges. All FluxWorks milestones are optional and only appear when the mod and their actual technologies are present.

