# Detailed prose lives in the chapter briefing, not the navigation label.
[journal-chapter-summary]
salvage=A spent rocket can leave useful metal behind, provided the recovery ship survives the wreck's arrival. Start with Rocket Chunk Processing and a Remnant Beacon. Fulgora and Aquilo unlock better recovery lines later.
calidus=The RAZI terminal on Nauvis welcomes an engineer back to work. Nobody's at the other desks. Bring the lights on, get the trains running, and build a launch system before worrying about the unanswered personnel records.
solaris=Vulcanus makes metal. Castra recovers old machines. Arig and Hyarion handle materials the others cannot, and Tellus and Corrundum finish the chain. Several old inventory forms suggest the machines stayed after their crews left.
nyxaris=Gleba spoils faster than a shipping schedule; Moshine can model the losses. Apia's biology and Panglia's research add problems that don't fit a neat corporate quota. You can explore the branches in different orders.
vibrant=Inside the rock belt: Fulgora, Ribbonia and Khemia. Outside: Paracelsin and Shchierbin. Cross at the surveyed southwest rims. The recovered maintenance files include emergency parts someone installed without permission.
vespera=Muria supplies corrosive chemistry, Rubia needs dependable freight, and Aquilo needs heat. Maraxsis works underwater, Athos processes dust, and Nulla's abandoned machines keep repairing a place nobody lives in.
beetlejuice=Cubium is the hub for Linox, Secretas and Frozeta. Farther out, the old Continuity Engine is still issuing orders to empty departments. It never got a replacement instruction when the people stopped answering.
umbra=Vesta can supply the expedition before the Shattered Divide. Cross once to reach Tenebris and Crucible. Old biological timestamps are turning up beside factory logs; the instruments here might explain them.
stellar=Calidus still has plans for a stellar power reserve. The authorization is one thing; working collectors, receivers and shipments are another. A finished Dyson network could keep far more than the home factory running.
network=A route line won't move a crate. Research the shared components, build the real production lines and arrange regular shipments. The old network demanded quotas; this one works only while the participants find it useful.
finale=The Continuity Engine won't release its emergency mandate on the strength of a research report. Build the seven-system witness network and physically deliver five Convergence shipments. The last transmission has to be earned.
foundations=Someone left pencil notes in the old factory ledger. They start beside a copper-wire order and end with coordinates no local survey has recorded.
fleet=Fuel reserves, collectors, turret coverage, cargo space. The first successful long flight depends on unglamorous work done before launch.
outposts=Some small worlds have industries worth the trip. None needs to become another compulsory stop on the way to the finale.
sciences=The laboratories on different worlds need different materials. The challenge is getting those materials to the right machines at the right time.
defense=Every escort and wall exists because someone expects the supply ship to come back. Build accordingly.
deepworks=The black laboratory is still locked. Its instruments demand rare materials, a serious power budget and careful handling.
echoes=First an odd checksum, then a repeated timestamp. The recovered fragments don't explain themselves, but they keep turning up on different worlds.
alliances=A factory on one world can use what another world makes. Set up the shipments and the joint designs finally become practical.

