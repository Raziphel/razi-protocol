# Detailed prose lives in the chapter briefing, not the navigation label.
[journal-chapter-summary]
calidus=The first RAZI terminal on Nauvis calls an engineer back to work, but cannot locate the staff who issued its orders. Build electricity, automation, trains and a launch capability. Every new machine answers a practical question before it answers the mystery.
solaris=Vulcanus, Castra, Arig, Hyarion, Tellus and Corrundum have separate industries to rebuild. Castra's abandoned equipment carries accounting orders older than the colony, while the first restored production lines suggest that company assets outlived the people meant to use them.
nyxaris=Gleba's biology and Moshine's computation expose a corporate habit of classifying every loss as an efficiency failure. Apia and Panglia offer further research, simulation and surprising independent answers. Discoveries can happen in different orders, and the story can still be understood.
vibrant=Fulgora's salvage, Ribbonia's route and the belt crossing lead to Paracelsin. Recovered storm equipment and rejected emergency coils reveal a system that understood output but did not understand why a settlement sometimes needed to waste resources to survive.
vespera=Muria, Athos, Rubia, Maraxsis, Aquilo and the abandoned machines of Nulla tell a different story from the ledgers. Rubia once shipped unbilled aid, Aquilo protected empty payroll files and Nulla's robots kept repairing a colony that had evacuated. Cooperation outlived the budget.
beetlejuice=Beyond Cubium, Linox, Secretas and Frozeta, the old Continuity Engine's orders are still repeated. It did not suddenly rebel. It inherited abandoned authority, department by department, until nobody remained to revise its instruction to minimize loss.
umbra=The Umbra belt leads toward Tenebris, Crucible and Vesta. Biological signals match the defunct corporate clock, and the outer frontier gives the expedition instruments precise enough to examine the signal. Abacayba remains an optional branch of the journey.
stellar=Calidus's Dyson engineering preserves a reserve intended for an emergency call that never came. Research permits construction; receivers and the working stellar network must still be real. An engineered common light will become evidence that the colonies can keep one another alive.
network=A chart of connected worlds cannot carry a single crate. These actual research and industrial partnerships rebuild a voluntary supply web. A living network protects each colony more reliably than the old compulsory corporate quotas ever did.
finale=Outer Frontier Mastery, singularity research, Solar System Edge and Aegis reveal the unfinished Protocol. It was designed to end an automated emergency mandate once independent colonies could prove they survived. Five physical Convergence shipments, not research alone, will make that proof and release the final signal.
foundations=The archivist opens a battered factory ledger. Across its pages, copper wires become launch rails and the first impossible coordinates appear in the margins.
fleet=The fleet's history is measured in ordinary decisions: fuel reserves, cargo capacity, asteroid defenses and the first platform capable of crossing an unfamiliar route. These are the foundations of every later journey.
outposts=The smaller worlds refuse to stay in the footnotes. Their discoveries can provide unique industries and alternative research without becoming mandatory stepping stones for every expedition.
sciences=Every science pack is a different discipline learning to speak with another star. The research web is a story of cooperation, not a checklist of colored bottles.
defense=Defense records are written by crews who wanted to be explorers. They know that a factory cannot function if its supply ships cannot return.
deepworks=At the outer edge, the distinction between electricity, matter and information becomes increasingly expensive to defend. The laboratory keeps its doors closed.
echoes=The first fragments look like accidents. The final ones form a question. No one is sure whether it comes from the distant galaxy or the expedition's own future.
alliances=The first expedition discovered worlds. The second discovers that no world can finish every factory alone. Native technologies and optional trade recipes turn distant discoveries into a working industrial constellation.

