[journal-chapter-story]
salvage=SALVAGE DIVISION / Rocket bodies used to be written off the moment they launched. The recovery team has found a use for them. Research the processing line, power a Remnant Beacon and defend against incoming wrecks. On Hard and Nightmare, some arrive from the sides.
calidus=It starts with a drill, a generator and a shortage of copper. Once those work reliably, there is enough spare capacity to think about leaving Nauvis.
solaris=Six worlds, six sets of repair manuals. Vulcanus provides foundry metal, Castra the salvage; Arig and Hyarion feed the industries beyond. Someone kept these factories running after the staffing records stopped.
nyxaris=Gleba grows things faster than they can always be shipped. Moshine keeps records the biologists can use. Apia and Panglia then present problems no spreadsheet can solve on its own.
vibrant=Fulgora's storms provide the electrical work. Ribbonia connects to Khemia and the Inner Rim. Across the belt, Paracelsin and Shchierbin require a ship able to take a beating.
vespera=Muria's first supply line is chemical. Athos branches into mineral processing; Rubia serves Maraxsis and Aquilo. Farther on, Nulla's maintenance robots are still on duty.
beetlejuice=Cubium's freight yard serves Linox and Secretas. Secretas has the road to Frozeta. Each world needs different machines, and none can rely on the others' cargo arriving by accident.
umbra=Vesta is outside the Shattered Divide. Tenebris and Crucible are inside. That makes the belt crossing the first engineering problem, not a decorative detour.
stellar=Bring the research home to Calidus, then build the collectors and receiving network. A drawing of a Dyson installation will not keep a factory powered.
network=The charter lists what the worlds can trade. The actual work is building the factories, loading the platforms and making sure the cargo arrives.
finale=Singularity experiments open the last chart. Aegis holds the missing safeguard, and the Convergence Commission lays out five shipments. The Engine still asks for authorization from a company nobody can find.

foundations=A ledger found under a ruined terminal starts with wire and iron orders. In the margin, somebody has drawn a flight path.
fleet=A platform's survival depends on a dozen small decisions: ammunition, fuel, repairs, collectors and enough spare cargo space to finish the trip.
outposts=Small places have a habit of being left off planning maps. Some of their industries deserve the detour, even when headquarters never budgeted for it.
sciences=A recipe may be ready long before the lab that can use it. Build the connections between the different research disciplines.
defense=The crews asked for better guns, not another speech about bravery. Give them turrets, ammunition and a return route.
deepworks=The sealed lab draws more power than its maintenance sheet admits. Read the material requirements twice before starting.
echoes=Recovered fragments share numbers and timing marks. File them in the archive; the pattern will make more sense later.
alliances=The first successful joint batch uses parts from factories that have never shared a sky. Now somebody has to arrange the second delivery.

[journal-chapter-dispatch]
salvage=Recover wrecks with a defended platform. Upgrade to precision, cryogenic and network crushing as the required industries come online.
calidus=Work through power, automation, rails, oil and advanced electronics. Launch toward Muluna, Solaris and Nyxaris when the factory can support it.
solaris=Open Vulcanus and Castra. Arig and Hyarion lead toward Tellus, with Corrundum closing the main industrial route.
nyxaris=Build on Gleba and Moshine, then investigate Apia and Panglia. Research alone won't move perishable cargo for you.
vibrant=Start with Fulgora and Ribbonia. Khemia is an inner branch off Ribbonia. Survey Inner Rim, defend the belt crossing, then reach Paracelsin and Shchierbin beyond Outer Rim.
vespera=Start at Muria; Athos is the mineral branch. Rubia opens Maraxsis and Aquilo. Nulla follows Aquilo; the Seadragon project belongs to Maraxsis.
beetlejuice=Establish Cubium, then choose Linox or Secretas. Frozeta follows Secretas. Build enough transport capacity to carry their specialist outputs.
umbra=Stage at Vesta on the exterior side of the belt. Cross the Shattered Divide to reach Tenebris and Crucible. Abacayba is optional.
stellar=Research the Dyson project, then construct and supply its working collectors and receivers. The project checklist tracks the real build.
network=Build the trade technologies and required intermediate goods. Use Projects to check actual deliveries; a researched recipe is not a shipped crate.
alliances=Look for recipes that combine existing planetary industries. These are manufacturing partnerships, not extra factory tiers.
finale=Complete the remote industry and Athos–Nulla recovery research. Investigate Aegis, finish singularity experiments, and track the five delivered Convergence mandates in Projects.
foundations=Revisit power, automation and the production lines that made your first launch possible.
fleet=Develop engines, cargo handling, collectors and ship defenses before taking longer routes.
outposts=Each optional destination keeps its own discovery and technologies. Visit whichever looks useful to your factories.
sciences=Check which laboratories accept each science pack and what material imports they need.
defense=Keep factory defenses and platform weapons ahead of the routes you intend to open.
deepworks=Bring the specialist materials and enough power for the advanced research equipment.
echoes=Recovered transmissions unlock with their associated milestones. Reading them gives context, not research bonuses.
