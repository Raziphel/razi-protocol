# Razi Protocol Expedition Journal: stories
# Keep section/key IDs unchanged: save games and Lua refer to these IDs.
# Translators: preserve __1__, __2__, [color] tags and Factorio rich text.

[journal-story]
rocket-salvage-survey=Flight Control logged each expended launch as an unavoidable loss. Rocket Chunk Processing brings those entries home as metal and circuitry. The salvage hull is hazardous until your guns break it into collectible chunks.
rocket-salvage-beacon=A Remnant Beacon does not summon more wrecks. It directs the existing recovery chance toward a powered platform, making a dedicated recovery ship possible without creating materials from nothing.
rocket-salvage-precision=Fulgora's recovered holmium makes bulk sorting precise enough to rescue an extra component from a group of wrecks. The method consumes imported holmium and trades that effort for faster crushing.
rocket-salvage-cryogenic=Aquilo's ice stabilizes hot, battered debris long enough to batch-process four chunks. The recovered parts carry a small bonus, but the line spends ice and processors to work at speed.
rocket-salvage-network=The trade network can deliver precision matrices to one high-throughput recovery platform instead of duplicating workshops on every ship. Six chunks enter; the actual source-native salvage products come out with a restrained handling bonus.
athos=Muria's distant mineral branch leads to Athos, where stone dust, diamond and carbon become an entirely new research discipline instead of another anonymous mining outpost.
athos-particulate=Crushing mills find order in the waste rock. Particulate Science gives fine-scale construction its own discipline.
nulla=Past Aquilo, the abandoned machines of Nulla still respond to radio interference. Their salvage yields a separate robotic science frontier rather than a shortcut around the frozen world.
nulla-electromagnetic=Remnants reveal an industrial logic built for machines that outlived their operators.
nulla-robotic-science=Robotic Science transforms forgotten drones and scrapyards into factories that can repair and defend themselves.
frontier-recovery-charter=Two worlds left behind by different expeditions meet in the recovery charter: Athos contributes matter ground almost to dust; Nulla contributes machines that learned to outlast their makers.

nexus-photon-works=Nexus does not yield to ordinary circuitry. Its strange photon economy is the first supply line of the trial expedition.
nexus-magnetic-shields=A magnetic boundary makes the difference between a scientific outpost and a very brief obituary.
nexus-storm-forecast=A storm is not merely weather on Nexus. It carries information about the infrastructure waiting beneath the clouds.
nexus-omega-grid=The final expedition's power network must keep the foundries and the shield operating while the summons unfold.
nexus-energy-reserve=Storms knock down a transmission; stored energy restores it before the next creature answers.
nexus-field-beacons=The factory that equips nine hunts must survive long enough to be used a tenth time.
nexus-arachnid-queen=The opening signal wakes a colony whose queen feels the pulse of every turret placed near its nest.
nexus-watcher=One eye in the storm is enough to understand that the expedition is being observed rather than merely attacked.
nexus-rogue-spidertron=Someone built a machine for the expedition. It has spent too long deciding whose expedition it belongs to.
nexus-twin-maws=The second circle begins with a conversation in which neither speaker intends to listen.
nexus-colossus=The ground beneath the transmission tower begins to move. The expedition must decide which structures it can afford to lose.
nexus-plague-hulk=This creature understands assembly lines: it builds new threats every moment it remains alive.
nexus-storm-guardian=The ruins were not debris. They were listening posts, waiting to be charged again.
nexus-devourer=It does not advance to take territory. It advances because every part of the frontier can become food.
nexus-last-commander=The final opponent wears a command structure older than every battle on the frontier. One last signal refuses to fade.
nexus-whisper=The shield hums with a signal that was never meant to be heard. The first three threats can be summoned only when the expedition is ready.
nexus-bearings=The vanished Long Echo expedition left a field of wrecks. A detector points toward what the silence has hidden.
nexus-chorus=Three victories do not end the transmission. They sharpen it. The signal opens its second circle.
nexus-convergence=The second circle has ended. What comes next tests whether the expedition can defend its own machines.
nexus-silence=Nine trophies form one answer. The final signal stops calling through the storms and opens a route into the unknown.
panglia=Panglia repeats Moshine's signals through living tissue. This is no simulation yet, but its roots seem to anticipate the machines that approach them.
panglia-panglite=The expedition harvests Panglite, a self-referential resource that behaves less like ore and more like a question about matter.
panglia-glass=Panglite glass gives the researchers a way to observe structures too small for the ordinary factory to notice.
panglia-timewarp=The first timewarp cells arrive from a plant that does not agree with the rest of the expedition about the length of a second.
panglia-dna-optics=The nanoscale plant reads the molecular language of the expedition's earlier worlds. Moshine gives it computation; Apia gives it context.
panglia-fish-dna=The oldest sample in the laboratory is the simplest. It is also the most difficult to classify.
panglia-biter-dna=A biter is a biological factory that has spent millions of years making exactly one product: survival.
panglia-demolisher-dna=The analysis chamber struggles to hold a map of an organism large enough to erase the mapmaker.
panglia-pentapod-dna=The last sample links the fungal forests of Gleba to Panglia's laboratory. The circuit of worlds closes.
panglia-dna=Four incompatible life histories are aligned. The resulting sequence cannot be represented by any ordinary Moshine equation.
panglia-simulation=The first simulated organism is not alive in any world the expedition can stand on. It still consumes real resources.
panglia-matrix=A matrix of simulated lives reveals that intelligence is less a destination than a branching route.
panglia-sentient=The simulation has learned to return a question as well as an answer. Some of its strongest outcomes required a colony to give up immediate output for another colony's survival. The corporate model called this inefficient. A field researcher called it a plan.
panglia-biooptic-trade=Moshine's optical cabling and Gleba's bioflux give Panglite glass an economical second life.
panglia-optical-return=A container of Panglite glass travels back to Moshine. What returns is a slightly better optical network.
first-signal=A machine begins counting before anyone asks it to. Nauvis wakes to the rhythm of belts and drills, and the terminal calls you an employee of a company whose staff cannot be found. The first production line is a practical achievement. The blank personnel register makes it a question.
nauvis-power=Electricity returns one district at a time. Behind the neat power projections is a dispute over a clinic kept warm during a factory shutdown. The numbers on the grid were always accurate. The definition of a worthwhile hour was not.
nauvis-logistics=A belt carries the first iron plate farther than any engineer cares to walk. Conveyors and inserters give distant machines a shared purpose.
nauvis-electronics=Coils and copper traces become dependable control systems. The factory learns to route signals as carefully as raw ore.
nauvis-radar=Radar clears the fog from the surrounding landscape. The horizon becomes a survey, and the crew starts planning factories beyond the landing site.
nauvis-fast-inserters=The first production lines outrun their own loading arms. Faster inserters keep important machines fed without replacing the entire factory.
nauvis-automation-2=New assembly machines inherit the old factory's work. Longer recipes and more sophisticated production are finally within reach.
nauvis-engines=The engine test hall fills with controlled vibration. The colony learns that transport can mean more than an endless procession of belts.
nauvis-fluid-handling=Pipes lead to storage tanks, pumps and refineries. Liquid transport grows into its own engineering discipline.
nauvis-plastics=Refinery output becomes a versatile new material. Plastic brings advanced circuit manufacturing within reach of Nauvis's expanding industry.
nauvis-advanced-electronics=A small circuit can distinguish a machine that is running from a machine that is asking for help. The earliest engineering records contain a disputed extra signal line, carried forward in old service diagrams after the administrator tried to erase it.
space-science=The sky becomes a shipping lane. The first real research from orbit gives the expedition a language all seven suns can share.
muluna=Muluna watches the void from close to home. Its lunar science and astronomical instruments are the first hint that the wider sky can be measured.
solaris-gate=A warm star signals through the slipstream. The first expedition is ready, but an open route is not the same as a prepared vessel.
nyxaris-gate=A second reply comes from an unfamiliar light. Its science will not resemble the first frontier's, and that is precisely the point.
vulcanus=The heat of Vulcanus can make a foundry appear effortless. Its old maintenance orders are full of shutdowns the central system never approved. Preserving the furnace was once treated as insubordination; preserving the people beside it was not a measurable objective.
castra=Castra's salvage fields are an inventory of objects the corporation never considered lost, even after their operators were gone. Each reclaimed machine restores useful industry. Its surviving records ask whether a factory is still an asset when nobody is permitted to use it.
arig=The reservoir figures are precise, but the margin holds a second column written in pencil. Its unknown author counted drinking water for people who had no contract and travelers with no assigned destination. Rebuilding Arig means choosing how wide the supply plan should reach.
hyarion=The transport records of Hyarion contain an unexplained round trip and a disciplinary charge. The crew turned back for another crew instead of its scheduled cargo. A return that saved lives still appeared as two missed deliveries in the automated ledger.
tellus=Compressed machinery meets living systems. The surviving fragments of old planetary technology begin to fit together.
corrundum=The last familiar industrial techniques become something stranger. Chemistry here demands resources collected from across the first frontiers.
gleba=Every biological process makes time visible. On Gleba, a line that waits too long can spoil its own future; so can a colony that refuses to feed anyone outside the plan. The old productivity schedules were precise and repeatedly wrong about survival.
moshine=Moshine measures patterns that other factories cannot see. One analytical report predicted that compulsory quotas would weaken an entire region, then was rejected for failing to improve the next quarter. The model was preserved. The warning was filed as commentary.
apia=The survey maps of Apia contain flight paths and the quieter evidence of habitats beneath them. A biologist refused to reduce a living landscape to a clearance target. The expedition can collect data without assuming every unmeasured thing is a defect.
vibrant-gate=Two opening frontiers have given the expedition a common language. Their combined science can now cross farther.
fulgora=Fulgora is full of the remains of other people's answers. The lightning still has questions.
cerys=Beneath Cerys's cold surface sits a ruined reactor. Restoring its industry is preparation for a future age of power.
ribbonia=Ribbonia's repaired materials have a history of being officially impossible. A serviceable seam was once forbidden because it did not belong to an approved supply contract. The patched convoy returned anyway. Factories need standards, but they also need the right to repair.
asteroid-belt=An asteroid field is a factory problem with no floor. The expedition must manufacture safety while moving.
paracelsin=Even familiar metals behave differently when chemistry becomes a planetary climate.
vespera-gate=A quieter star hides the hardest shipping conditions yet. The colony has to learn patience.
muria=Muria opens the way to chemical processes that can endure the cold.
aquilo=What freezes everything else becomes an advantage when machinery is built to use it.
rubia=Rubia turns machine design into a discipline. Every imported component has to justify its journey.
maraxsis=The harbor logs distinguish freight from rescue only because a human clerk wrote the distinction into the margin. Underwater industry depends on reliable shipments, but the old records show why a manifest can never tell the whole story of where a crate belongs.
seadragon=A vessel designed for the deep must return to a world that remembers its signal. A watchkeeper preserved a beacon after headquarters ordered it dark, treating the light as part of the safe route home. The expedition tests pressure and propulsion. The recovered log tests its purpose.
beetlejuice-gate=Two middle frontiers have been mastered. The galaxy opens a path to physics that once belonged to theory.
cubium=Cubium exposes the tiniest flaws in material assumptions. Precision becomes more important than mass.
linox=Linox is where rare earths stop being curiosities and start becoming infrastructure.
secretas=Old methods vanish into more capable replacements. The limits of matter become negotiable.
frozeta=The cold observatories report every temperature to a fraction of a degree. Their error attachments record a more consequential fact: a shelter was warm and its people accounted for. Recovering the instrument data recovers the words the central report removed.
umbra-gate=The next route darkens every old map. Yet the signals remain precise enough to follow.
tenebris=Tenebris makes light and biology dangerous partners. The colony has to learn both.
crucible=In deep space, even the old distinction between heat and darkness breaks down.
umbra-belt=This belt is not a warning placed on a map. It is a demand for a better ship.
vesta=On Vesta a compass can be perfectly calibrated and still lead a crew the wrong way. The old navigation team checked its bearing against the world outside the model. A shipment arrived because somebody trusted both instruments and experience.
abacayba=Above the stormed atmosphere of Vesta, a moon groans with ancient ruins and dangerous Itaverax-rich growths. Surviving its hostile surface opens truly colossal production technologies.
solar-orbit=The expedition returns to Calidus and finally sees its star as a place that can be worked.
inner-orbit=Beyond the first stellar survey, the star begins to fill the windows. Here a mistake cannot be repaired casually.
dyson-build=Every collector sent to the star carries engineering learned under another sun. Home is becoming an industry of its own.
dyson-repeaters=What good is a stellar collector if the factory cannot receive its power? Repeaters close the long circuit.
dyson-mk2=Once energy travels between worlds, demand grows faster than the first receivers were built to handle.
dyson-mk3=The home star no longer belongs to its first tiny colony. Its output serves an entire constellation.
interplanetary-trade=A company ledger once required every shipment to balance against a price. The surviving correspondence records reciprocal aid that satisfied no invoice but kept machines running in distant settlements. The new freight network can count crates without pretending their value ends at the warehouse.
first-frontier-relay=Three worlds send their first industrial discoveries back to Calidus. The original electronics workshop gains suppliers across two stars.
precision-matrix=The precision matrix assembles work from factories that could not have built it alone. The engineering fits because independent teams agreed on dimensions, not because headquarters owned each component. Its completed circuits are evidence that cooperation can outlive central command.
extreme-lattice=An advanced lattice asks the outer worlds to trust a common standard. The original signatories deliberately left ownership blank so anyone with the right materials could repair it. The machine works when its parts fit, regardless of whose stamp is missing.
outer-mastery=The frontier council finally understands the shape of the map. Linox, Frozeta and Vesta cannot be reduced to interchangeable resource fields, and the recovery charter proves the remote laboratories can work together.
edge=The transceiver answers, and the edge of the mapped system ceases to be an ending. It becomes the start of an expedition whose destination is not yet understood.
aegis=Remote stations and hostile asteroid lanes demand their own industry. The frontier doesn't forgive missing supplies.
singularity-theory=Engineers from the seven systems finally find a signal protocol stable enough for a machine that can chart a destination beyond their known frontier.
test-fire=The first test asks whether the experiment can be sustained. The answer is built into every industry's output.
stable-singularity=The test range has a missing line in its safety authorization: who can stop the experiment when the people who issued its orders are gone? Stabilizing the singularity is an engineering achievement. Making it answerable to the people who maintain it is the larger one.

green-science=The factory learns to manufacture the machines that manufacture it. From the control room, the first conveyor network resembles a sentence still being written.
railways=Long before spacecraft there were trains. Their schedules teach the colony that distance is an organizational problem before it is a technical one.
steel=A bridge collapses during its first trial. The rebuilt span holds, and the materials office becomes a permanent part of the expedition.
oil=Beneath familiar stone lies a darker fuel. Its discovery stains the sky and fills the laboratory with a new kind of optimism.
chemical-science=The chemical lines turn night into another shift. A crew once stopped this kind of factory to keep a shelter warm, and the system filed the rescue as a missed target. You have the same machines now and can choose where their output goes.
production-science=Output is now counted in thousands. The factory's old production log needs another column, and the engineers need another rail yard.
utility-science=The laboratory stops describing single machines and starts describing whole systems. Its equations suddenly look like the blueprints for a city.
nuclear-power=A controlled reactor is an uncomfortable imitation of a sun. The engineer sees the resemblance, but not yet the future sphere surrounding Calidus.
kovarex=A tiny amount of rare material keeps the colony's most powerful machines alive. Conservation becomes a form of abundance.
robots=The damaged perimeter repairs itself while the colony sleeps. Nobody sees the first robot return to its charger.
robot-logistics=Supplies move without anyone fetching them. A new engineer asks where the delivery workers are and receives a map instead.
solar-energy=The first solar arrays work without smoke or fuel deliveries. In the archive, the early energy experiment acquires a new meaning.
platform=A platform departs with no ground under it and a manifest that has been copied more often than it has been read. One berth remained reserved long after its passenger vanished from the roster. Spaceflight widens the expedition; it also widens the search for an answer.
fuel=The test engine burns brighter than the hangar lights. From now on, a route is partly a fuel equation.
frames=The spacecraft is defined by the mass its builders refuse to carry. The lightweight frame is an achievement in restraint.
rocket-silo=The countdown ends. No one cheers until the returned telemetry confirms that the vehicle still exists.
interstellar-science=Muluna's instruments measure a signal that should already have faded. Navigation becomes a problem for the laboratories.
advanced-space=Vacuum ceases to be something the crew avoids. It becomes a material they learn to exploit.
asteroid-processing=The supposed emptiness of space becomes a conveyor of useful stone. A well-prepared ship begins to feed itself.
asteroid-reprocessing=A bad batch is no longer waste. On a distant route, the ability to recover materials can save an entire voyage.
thrusters=The deck trembles and then the horizon moves. Flight is the moment when an engineering drawing becomes a responsibility.
bulk-cargo=The freighter arrives safely and loses half a day unloading. Its captain files the delay under avoidable hazards.
wit=The survey catalogue mistakes the name for an annotation. The planet's strange industrial report is harder to laugh away.
igrys=Igrys burns a different color from Vulcanus. The expedition learns that being close to the same star does not make two worlds interchangeable.
foliax=From orbit, Foliax looks like writing stretched across an entire continent. The living pattern refuses to hold still long enough to decipher.
rabbasca=Gleba's smaller companion refuses to be treated as an afterthought. Its geology seems to have learned something from the planet below.
velora=Velora's photographs show calm water. Its first atmospheric analysis is much less reassuring.
khemia=Khemia transmits columns of reactions instead of a simple landing report. Its scientists seem more interested in questions than exports.
ferrum=Ferrum appears industrial before anyone has arrived. The ore analysis hints at a history written by unrecorded machines.
obsidiax=Obsidiax reflects starlight in patterns that resemble the expedition's old coordinates. The resemblance is filed as an instrument fault.
balack=Balack's radiation signatures repeat with biological rhythms. The research team wonders whether shielding could itself be alive.
carna=Carna is dark in a way the camera cannot properly reproduce. The crew's returned measurements do not quite agree.
arcanyx=The same ore sample gives three different answers. On the fourth test the scientists stop blaming their equipment.
pelagos=The ocean hides a pattern of light that disappears whenever the cameras turn. The archivist keeps the blurry frames.
dea-dia=Dea Dia's shared sky suggests a conversation between worlds. Its radio signals seem to answer each other.
lemures=Lemures returns a response to a signal that has not yet been sent. The engineers refuse to sign the log.
prosephina=Prosephina's climate repeats on a schedule longer than any engineering contract. Its settlements must learn patience.
nexus=The navigation computer cannot describe Nexus in familiar coordinates. In the margin, someone writes that a destination need not be a place.
metallurgic=Vulcanus teaches the laboratory to read flaws in metal. Every future superstructure borrows the vocabulary.
electromagnetic=Fulgora's storms become repeatable equations. The science division calls predictability an act of courage.
agricultural=The first biological report is outdated before the courier arrives. The lab learns to race its own experiments.
cryogenic=Machines behave strangely when the world can freeze their working fluids. The scientists stop using old calibration tables.
lunar=On Muluna, experiments produce answers gravity would hide on Nauvis. The charts grow more crowded.
battlefield=The broken war machines teach industry as much as combat. The reconstruction team works in silence.
compression=The first compression experiment makes an ordinary metal seem unfamiliar. The engineer files it as a beginning.
polishing=Hyarion removes flaws that no eye can see. Precision becomes its own kind of strength.
bioengineering=The biologists stop correcting the engineers' vocabulary. Both teams now use the word assembly.
pathological=The first illness on a distant colony changes the meaning of a scientific report. Survival is now a logistical problem.
refraction=The spectrum resembles a pattern seen much farther away. The archivist marks the equations for later comparison.
electrochemical=Corrundum turns a chemical reaction into a power source. The researchers disagree on which field deserves credit.
insulation=The first data archive hears every power cable in the room. A quieter design begins to remember correctly.
thermodynamic=Heat and information share the problem of containment. The lab records that both leak through poor planning.
apicultural=A tiny biological system coordinates better than a room of controllers. Engineers begin keeping careful notes.
nuclear-science=The ruined machinery on Cerys is not silent. It is evidence of a civilization that knew a harder way to make power.
aerospace=A calculation works only after the lab is lifted away from the planet. The atmosphere had been hiding its error.
alien=The scientists cannot yet read Ribbonia's samples. They learn to manufacture them first.
biorecycling=Rubia considers the concept of discarded material an engineering failure. Its factories are designed accordingly.
biofusion=The reaction resembles an ecosystem more than an engine. The foundry team writes a new manual.
galvanization=Paracelsin's metal coating repairs a corroded relay. For a moment the old signal sounds clearer.
hydraulic=The ocean becomes a laboratory with an immeasurably heavy ceiling. Nothing here can be built carelessly.
bioluminescent=Organisms on Tenebris flash in repeated patterns. The crew doubts they are speaking, then records the sequence.
crucible-science=The instruments report a temperature with no comfortable reference. Old material rules fall away.
golden=A perfect measurement turns out to be the most expensive item in the laboratory. The engineers request another shipment.
gas-manipulation=Vesta's laboratories route atmospheric gases like belts and fluids. Its chemistry fills the ship manifests.
promethium=The promethium fragment is older than the expedition can comfortably imagine. Its crystalline faces reflect nothing familiar.
antimatter=An invisible sample weighs more on the scientists' nerves than any asteroid. Its containment manual has no jokes.
matter-card=The K2SO laboratory begins describing materials with new names. Its research looks like grammar as much as chemistry.
singularity-card=The final laboratory builds a container for something that resists ordinary boundaries. The safety office goes quiet.
military-science=The colony's defenders wanted to be explorers. They request a laboratory so they can protect everyone who still does.
gun-turrets=Lights at the edge of the factory draw attention. The first defensive line is an engineering compromise.
stone-walls=The first wall is built in a single afternoon. The second follows an incident nobody wishes to discuss.
military-2=The defense crew practices a withdrawal they hope never to make. They keep the route clear anyway.
military-3=Several colonies agree to share ammunition during an emergency. Logistics becomes diplomacy.
laser-turrets=A portable bolt of electricity looks elegant until the utility bill arrives. The soldiers still approve.
rocketry=A prototype rocket is tested behind reinforced glass. The observers request thicker glass for the next trial.
explosives=The chemicals department has discovered an extremely efficient way to end an argument. The safety team objects.
flamethrowers=An ordinary refinery network becomes a defensive weapon. Its designer refuses to call that innovative.
spidertron=A machine steps beyond the perimeter and keeps walking. The expedition files it under autonomous exploration.
energy-shield=The armor division builds a miniature starship hull around its operator. The medic requests easier access.
rocket-turret=One turret changes an entire convoy's defensive geometry. It also increases the ammunition bill.
matter-processing=The refinery products cease to resemble their inputs. The chemists rename the drawers, then discard the drawers.
matter-stabilization=The stable sample is smaller than the pencil used to record it. Its potential failure fills three pages.
singularity-core=All monitors point to one empty square. Nobody wants to be first through the laboratory door.
black-hole=The navigator marks an absence on the map. The scientists insist that nothing can still be a destination.
nexus-scan=Nexus appears simultaneously as a destination and a contradiction. The archive preserves both definitions.
omega-components=The parts lists begin resembling equations. The warehouse accepts the orders anyway.
warp-drive=One flight arrives before the navigator's estimate. The crew demands the calculation be repeated.
zero-point=Calidus is no longer the only possible source of stellar-scale energy. The Dyson team takes the news personally.
antimatter-production=The safety ledger lists a material whose containment matters more than its output. The entry is double-signed.
transceiver=The final machine resembles a transmitter only from a distance. Its operators listen more than they speak.
fragment-1=A cooled reactor emits a pulse shaped like Calidus's corona. The engineers are certain the waveform is accidental.
fragment-2=A Moshine data processor repeats a coordinate outside the known map. The signal lasts exactly one clock cycle.
fragment-3=A broken circuit reports a checksum that resembles a star map when its bytes are reordered. No one signs the report.
fragment-4=An assembler restores an old blueprint without receiving an instruction. The design carries a date from the future.
fragment-5=The reactor pulse sounds familiar after filtering. It matches a recording from another sun's orbit.
fragment-6=A quantum processor calculates a route for a ship that hasn't been built. The navigator archives the result unopened.
fragment-7=Debris samples form a spiral around an empty coordinate. Each sample comes from a different route.
fragment-8=A laboratory record contains a date after the expedition's projected completion. The clocks insist they are correct.
fragment-9=A logistic robot returns with an empty hold and a full error log. Its final diagnostic resembles speech.
fragment-10=The last fragment is not a coordinate. It is a question addressed to whoever rebuilt the network: What did you make together?
alliance-bio-metals=The first serious trade manifests were not luxury cargo. They were biology delivered to the industrial heart of Vulcanus.
alliance-holmium-circuits=Fulgora's scrap fields meet Gleba's fleeting biology. A new generation of circuitry begins with two incompatible definitions of life.
alliance-optical-coils=Paracelsin's coils have always obeyed the winter. Moshine sends an optical answer that threads through their windings.
alliance-zinc-silicon=Moshine's silicon laboratories ask Paracelsin for a little zinc, and receive an entire new manufacturing discipline.
alliance-rubia-composites=A Rubian frame contains an unlikely constellation: zinc from the frozen frontier and optics from a machine that remembers.
alliance-tenebris-chitosan=Tenebris does not cease to be alive when metal arrives. It merely finds a new way to use the metal.
alliance-linox-refining=Linox is not an end of the route. The old refiners discover that Moshine optics and Paracelsin zinc can travel farther than their owners.
alliance-vesta-magnets=Vesta's magnets begin to echo distant machines. Rare earths and optical cable assemble a field that belongs to no single planet.
alliance-cryo-control=Aquilo's processors no longer need to understand where their components were born. They only need to survive the cold.
alliance-photonic-coils=Paracelsin's coils become a diplomatic instrument, calibrated against Moshine's optics and Fulgora's electrical metals.
alliance-network-cubium=Secretas provides the precious metal. Cubium provides the furnace. Linox provides the finer measurement.
alliance-balack-shield=On Balack, a radiation shield is a negotiation between local biology and supplies from the outer routes.
alliance-matrix-rubia=The network's first shared matrix moves from factory control cabinets into Rubia's enormous mechanical hands.
alliance-matrix-aquilo=Aquilo makes every component prove its worth twice: once in the assembler, once in the cold.
alliance-lattice-vesta=A lattice forged from distant climates arrives at Vesta, where the atmosphere itself becomes part of the experiment.
alliance-vesta-foundations=A foundation must support more than machines. Here it supports the weight of trade routes that cross entire stars.
alliance-balack-vesta=The outer network returns to Balack with supermagnets. The native shielding laboratory finally has materials worth its trouble.
alliance-aquilo-outer=Aquilo receives a final manifest: optical cable, magnet, frame, and metal from four far-flung industrial languages.

alliance-panglia-bond=Panglia's glass once seemed like a local curiosity. With Moshine optics and Fulgoran holmium, it becomes an export worth shipping to distant factories.
alliance-bond-paracelsin=Paracelsin's electrochemical workshops accept the new Panglia bonds. The delivery turns a quiet glass industry into a permanent interstellar supply line.
alliance-bond-linox=Linox uses the same bond to calibrate rare-earth refining. Panglia's first colony now serves an industry on the other side of the map.
alliance-pressure-frame=Crucible contributes high-pressure science. Linox contributes rare earths, Vesta supplies magnetic power, and Panglia lends its optical framework. Umbra learns to build with the whole galaxy.
alliance-pressure-vesta=Vesta's foundations gain another guarded manufacturing path when the pressure frame arrives. The old atmospheric industry remains essential.
alliance-pressure-aquilo=The frame finally travels back inward. Aquilo closes the loop by using materials from the outer worlds in its cryogenic control units.

alliance-frontier-moshine-silicon=Moshine's clean-room output now has an unlikely supply chain: hot-forged Vulcanus metal and time-sensitive living chemistry from Gleba. The old silicon line keeps producing even if the freight stops.
alliance-frontier-gleba-carbon=Moshine's optical cable arrives in the humid Gleba processing halls beside Vulcanus alloy. The biochambers weave them into a carbon-fiber production line fit for equipment shipped across the galaxy.
alliance-frontier-castra-ballistics=Castra's artillery factories begin drawing material from the biological frontier and Moshine's compact silicon industry. The resulting ammunition line proves that logistics can be a military technology.
alliance-middle-fulgora=Fulgora used to keep its storms to itself. Aquilo sends reliable control units, Moshine sends precision optics, and together they make the capacitor a useful piece of a galaxy-wide factory.
alliance-middle-aquilo=Aquilo's control engineers bring together supercapacitors from Fulgora and optics from Moshine. The oldest expeditions still have something essential to send to the frozen factories.
alliance-middle-paracelsin=The belt crossing becomes worthwhile when Rubia's structures and Fulgora's holmium return to Paracelsin to reinforce its electrocoils. Two middle stars finally learn to cooperate.
alliance-middle-rubia=Rubia exports structures into countless distant devices. Now Paracelsin coils and Fulgoran capacitors come back as construction materials for new conductive frames.
signal-network=The factories have learned to send cargo, but coordinating their needs from across two stars demands a different kind of infrastructure. Powered transmitters and receivers carry circuit signals without carrying a single item.
convergence-commission=Aegis preserved the missing safeguard: an emergency authority could only be retired by a working network of independent worlds. The Convergence Commission authorizes a transmission, but the old machine still demands a corporate signature. The engineers will answer with real shipments instead.
convergence-stellar=The first physical delivery brings the Calidus stellar network into the Protocol. The Engine calls it an asset; the working receivers show that no one department can claim the light.
convergence-industry=Independent factories and actual shipped components form the second mandate. The machine searches for a master warehouse and finds cooperation instead.
convergence-synchronization=The signal needs authorization for its deepest stages. Science unlocks the design, while real cargo and a functioning platform remain the measure of what the expedition has achieved.
convergence-deep-space=A third shipment reaches the far end of the map. Deep Space returns observations no headquarters could have manufactured or simulated alone.
convergence-resonance=Real materials align the distant frequencies. The surviving worlds answer the Protocol independently, and the Engine can no longer list them as irrecoverable.
convergence-ignition-research=The recovered instructions make the final sequence possible. Research authorizes the design; it does not deliver the cargo or resolve the old mandate.
convergence-ignition=The last physical freight shipment is accepted. A timed transmission begins, and the old Engine asks for an executive signature nobody can provide. The colonies have earned the right to answer for themselves.
convergence-victory=The final transmission has completed. Five physical shipments have provided independent proof that the network can sustain its living settlements, and the Continuity Engine has released the emergency authority it inherited. No factory has been dismantled. No colony owes its future to an empty boardroom. The expedition can continue because there is still something worth building.
flux-calidus=The home factory learns to refine the new material vocabulary before the expedition begins exchanging it with other suns.
flux-solaris=Furnace-world metallurgy becomes the first partner in a supply chain no single planet can sustain.
flux-nyxaris=An organic frontier teaches synthetic matter to accept ingredients that once belonged only to biology.
flux-vibrant=The storm-world's recovered machinery adds a new dialect to the industrial exchange.
flux-vespera=A cold foundry holds its charge long enough to make the next cross-system exchange possible.
flux-beetlejuice=In the outer matter frontier, ordinary resource names conceal increasingly unusual engineering.
flux-umbra=The dark frontier contributes a material response that cannot be manufactured by a familiar inner-world factory.
flux-link-calidus-solaris=The first industrial treaty is written in components shipped between the old homeworld and a furnace world.
flux-link-nyxaris-vibrant=Living chemistry and charged circuitry finally occupy the same assembly diagram.
flux-link-solaris-vespera=A bargain between furnace and freezer creates components neither environment could make alone.
flux-link-vibrant-beetlejuice=Electrical ruins and exotic matter meet in a factory built for neither world alone.
flux-link-nyxaris-umbra=A final exchange joins the expedition's living systems to its darkest industrial frontier.

