# Razi Protocol Expedition Journal: stories
# Keep section/key IDs unchanged: save games and Lua refer to these IDs.
# Translators: preserve __1__, __2__, [color] tags and Factorio rich text.

[journal-story]
rocket-salvage-survey=Flight Control wrote off every rocket body after launch. That was convenient for accounting, less so for anyone short of metal. Shoot down incoming wrecks and collect the pieces.
rocket-salvage-beacon=A Remnant Beacon directs wrecks toward its powered platform. It doesn't increase how often they arrive. Put the guns somewhere sensible.
rocket-salvage-precision=Recovered Fulgoran holmium improves sorting. The process needs imported material, but recovers a little more from each batch.
rocket-salvage-cryogenic=Aquilo's ice keeps damaged parts stable long enough to crush four chunks together. Keep the coolant and processors stocked.
rocket-salvage-network=One well-supplied recovery platform can process six chunks at a time with imported precision matrices. There's no need to put a full crusher line on every ship.
athos=The survey from Muria ends in stone dust, carbon and diamond work. Athos has its own machinery and Particulate Science to build.
athos-particulate=A crushing mill can sort very fine powders if the filters survive. Athos turns that work into Particulate Science.
nulla=The place has been evacuated. Its robots haven't received that message, and their radio receivers still work.
nulla-electromagnetic=The repair shops contain useful electromagnetic equipment. The people who maintained it are gone.
nulla-robotic-science=Salvaged drones and robot parts make a fragile new science line. Package the results quickly.
frontier-recovery-charter=Athos supplies fine materials; Nulla supplies recovered robotics. The charter brings the two experiments together without replacing either one's research.

nexus-photon-works=Nexus photon components don't fit the usual circuit recipes. Set up a separate production line before attempting the trials.
nexus-magnetic-shields=The new magnetic shield held during its first storm test. The crew ordered a spare power unit before declaring success.
nexus-storm-forecast=A forecast won't stop a Nexus storm, but it gives you time to protect the machinery.
nexus-omega-grid=Foundries, shields and summons all need power at once. The omega grid earns its keep during the fights.
nexus-energy-reserve=A storm drops the transmitter. The reserve bank brings it back before the next trial begins.
nexus-field-beacons=The team marked each safe position with a beacon. Nine fights are a long time to operate from an improvised camp.
nexus-arachnid-queen=Every turret near the nest seems to draw a response from the queen. The advance team has stopped calling them 'test placements'.
nexus-watcher=The camera caught the same eye in three storm fronts. Somebody is watching the survey.
nexus-rogue-spidertron=The old Spidertron still patrols its assigned route. Unfortunately, its list of authorized operators has expired.
nexus-twin-maws=Two mouths, one attack. Keep the defensive line from being pulled in opposite directions.
nexus-colossus=The ground moved beneath the transmitter. The crew is drawing up a replacement site while the colossus is still standing.
nexus-plague-hulk=The longer the hulk survives, the more enemies it produces. Take the manufacturing problem personally.
nexus-storm-guardian=Those structures in the ruins weren't wreckage. Once powered, they began defending the site.
nexus-devourer=The devourer treats walls, vehicles and natural terrain as the same thing: food.
nexus-last-commander=The final opponent still carries an old command signal. Destroying its hardware may be easier than finding who issued the order.
nexus-whisper=The shield picked up three repeating signals. The first summons are ready when the platform defenses are.
nexus-bearings=Long Echo's last known route passes through a field of wrecks. The detector provides a bearing; the rest of the search is yours.
nexus-chorus=Three trophies secured. The receiver has opened another set of signals, and the repair crew hasn't finished with the first.
nexus-convergence=Six trials recorded. The remaining summons demand stronger defenses and a steadier power supply.
nexus-silence=All nine trophies register together. The interference clears and a new coordinate appears on the navigation display.
panglia=A probe picked up signals from Moshine in Panglia's roots. The biologists want a second sample before anyone calls it communication.
panglia-panglite=Panglite doesn't behave like the ore the drills were calibrated for. The sampling team has requested new equipment.
panglia-glass=Panglite glass makes tiny structures visible under the laboratory optics. Handling it without contamination is the next problem.
panglia-timewarp=The sample arrived on schedule according to one clock. The growth chamber disagreed by several minutes.
panglia-dna-optics=Moshine supplies the processors. Apia supplies biological samples. Panglia needs both for its DNA optics work.
panglia-fish-dna=The fish sample was supposed to be the easy one. The sequencing team has asked for another shift.
panglia-biter-dna=Biter tissue repairs damage faster than expected. The lab wants better containment before the next run.
panglia-demolisher-dna=The largest sample barely fits the analysis rig. The demolisher it came from would not fit the building.
panglia-pentapod-dna=The Gleba samples match sequences from Panglia's own organisms. The researchers have started checking the rest of the collection.
panglia-dna=Four species, four incompatible reference datasets. The new analysis finally lines them up.
panglia-simulation=The simulated organism needs real computing resources. Its population can be reset, but the electricity bill cannot.
panglia-matrix=The simulation records thousands of possible outcomes. The difficult part is choosing which conditions matter.
panglia-sentient=The model proposed sharing scarce supplies between colonies. Corporate scheduling had rejected that choice as inefficient. The biologists kept the result.
panglia-biooptic-trade=Optical cable from Moshine and bioflux from Gleba give Panglite glass another use.
panglia-optical-return=Panglite glass arrives back at Moshine. The optical line can finally make use of the shipment it helped create.
first-signal=The Nauvis terminal boots before the factory does. It greets you as an employee; the staff list is blank. There is still an unfinished production order.
nauvis-power=An old outage report shows a factory shut down to keep a nearby clinic warm. The generator capacity was recorded correctly. The reason for the shutdown was not.
nauvis-logistics=The first belt moves iron farther than anyone wants to carry it. An inserter takes over the repetitive part.
nauvis-electronics=Copper wire and a few simple components become a working control circuit. It still needs testing under a full factory load.
nauvis-radar=Radar fills in the surrounding map. The engineers immediately add more construction notes than the survey crew can review.
nauvis-fast-inserters=The assemblers are ready; their loading arms aren't. Faster inserters fix the bottleneck.
nauvis-automation-2=New assemblers accept recipes the old machines couldn't handle. The workshop's floor plan needs another revision.
nauvis-engines=The engine trial shakes the test stand but passes inspection. The rail crew has been waiting for this.
nauvis-fluid-handling=Oil and water don't care where the transport belts go. Pumps, tanks and pipes get their own drawings.
nauvis-plastics=The refinery can now supply plastic for advanced circuits. Expect the chemical lines to take more room than planned.
nauvis-advanced-electronics=A recovered circuit drawing contains an extra service line. Somebody tried to erase it from the official diagram; the workshop kept its copy.
space-science=The first research samples return from orbit. So does a long list of things the platform crew wants improved.
muluna=Muluna's instruments give the survey team a proper view beyond Nauvis. The moon base will need regular resupply.
solaris-gate=The Solaris route is open. Verify the fuel, ammunition and cargo plan before calling the platform ready.
nyxaris-gate=Nyxaris has answered the first navigation survey. Its factories will need very different supplies from Solaris.
vulcanus=A foundry shutdown once saved workers from a heat failure. The central system logged it as unauthorized downtime.
castra=The abandoned battlefield machines are still in the asset ledger. Nobody marked their missing crews. Salvage what can be repaired.
arig=An old water register has a handwritten second column for travelers without permits. The pumps kept supplying them anyway.
hyarion=A delivery crew doubled back to recover another crew. Their disciplinary report calls it two missed shipments.
tellus=The living machinery works, although several of its maintenance instructions appear to be written for a different species.
corrundum=The sulfur plant needs materials from across Solaris. The purchasing department will not enjoy this bill.
gleba=A harvest spoiled while a shipment waited for authorization. Someone corrected the delivery schedule in pencil and sent the next load without asking.
moshine=A processor predicted that fixed quotas would leave a colony short of supplies. The model was retained. Its recommendation was removed.
apia=The survey records list habitats as obstacles to clearing land. A biologist wrote new field notes in the margin.
vibrant-gate=With the first two frontiers surveyed, Vibrant is reachable. Prepare for electricity, salvage and a real asteroid crossing.
fulgora=An abandoned substation survived another lightning storm. The salvage crew is more interested in the components than the memorial plaque.
cerys=The reactor on Cerys hasn't run for years. Its cooling system is the first thing the restoration team checks.
ribbonia=An old repair order forbade a patched hull seam because the parts weren't on an approved contract. The patched ship came home.
asteroid-belt=The belt looks thin on the map. That impression ends when the first large rock reaches the guns.
paracelsin=Coils and cold chemistry keep the exterior factories running. Everything heavy must come across Vibrant's belt.
vespera-gate=Vespera is open. Muria's corrosion and the later cold-weather routes call for a well-stocked platform.
muria=Chlorine handling is the first serious problem. The rest of the Vespera supply chain depends on getting it right.
aquilo=The refinery works until its pipes freeze. The fix starts with reliable heat, not another production target.
rubia=Rubia's shipments travel through weather that makes schedules optimistic. The cargo still has to arrive.
maraxsis=A harbor clerk entered rescue supplies as an unbilled shipment. The boxes were delivered before the accounting dispute was resolved.
seadragon=A watchkeeper kept the harbor beacon lit after an order to switch it off. The Seadragon crew relied on it to find the return approach.
beetlejuice-gate=Cubium and the outer routes are in range. Set up freight capacity before sending specialist machines toward Linox and Secretas.
cubium=The cube process is sensitive to small mistakes in feedstock. The workshop has stopped accepting 'close enough' measurements.
linox=Rare-earth refining on Linox runs hot and takes space. The plant designers are running out of both.
secretas=The gas giant's debris lanes lead toward the recovery work at Frozeta. Plot the return path before departure.
frozeta=The observatory recorded a shelter's temperature and number of occupants. The central report kept the first figure and deleted the second.
umbra-gate=Umbra's route is open. Stage at the outer rim before taking a ship into the Shattered Divide.
tenebris=The biological samples emit light on their own. The lab wants shielding before the next experiment.
crucible=Pressure readings from Crucible don't fit the old equipment limits. A different pressure rig is already on order.
umbra-belt=From orbit it looks like a short passage. The ammunition estimate says otherwise.
vesta=A navigator's compass pointed to the scheduled bearing. The crew checked the view outside and found the magnetic map was wrong.
abacayba=Abacayba has ruins, dangerous growths and a hostile surface. The landing team has asked for heavier equipment.
solar-orbit=The expedition returns to Calidus with designs for working near its star. Nobody is volunteering to test the first collector without shielding.
inner-orbit=At this distance the star dominates the windows. Every maintenance procedure begins with thermal protection.
dyson-build=The first collectors take materials from several systems. The home star has never had such an expensive construction project.
dyson-repeaters=Collectors without receivers leave power in the wrong place. The repeaters finish the circuit.
dyson-mk2=The first receiver network is already at capacity. The engineers have started adding another row of collectors.
dyson-mk3=Calidus power is being used across the network now. The home grid finally needs interstellar planning.
interplanetary-trade=An old invoice has been crossed out and replaced with a note: 'Sent anyway. They needed it.' The new freight network can keep records without demanding payment for every rescue.
first-frontier-relay=Calidus receives its first materials from both Solaris and Nyxaris. The electronics workshop has outgrown its local suppliers.
precision-matrix=The first precision matrix contains parts from several stars. Engineers agreed on dimensions long before any central office approved the order.
extreme-lattice=The lattice specification has no company name on its title page. Any workshop with the right materials can repair it. That appears to have been deliberate.
outer-mastery=Linox, Frozeta and Vesta are finally supplying working industries. The research team can stop calling these routes provisional.
edge=The transceiver locks onto a destination beyond the surveyed chart. The navigation team wants another fuel estimate before anybody presses Launch.
aegis=Solaris and Nyxaris both lead to the Aegis Frontier Gate. The outer rim is a repair stop; beyond it, the belt and Point Warden need a better-defended ship.
singularity-theory=The lab has written a theory for sending a platform far beyond the current map. The safety office wants more than a diagram.
test-fire=The first test produces the readings the scientists hoped for. It also consumes a painful amount of power.
stable-singularity=The stabilization team asks who has authority to stop the machine. The recovered safety form still names a board that no longer exists.

green-science=Assemblers now produce the parts needed to build more assemblers. The factory's floor plan has changed again.
railways=The first train is ready. The signal engineer has already identified three places where the schedule will fail.
steel=The rebuilt bridge holds through the second load test. Nobody has thrown away the report on the first one.
oil=A new pump starts bringing crude to the refinery. The next problem is finding space for all the chemical equipment.
chemical-science=The chemical line runs into the night. An old shift log records a similar plant shut down to keep a shelter warm. The central report called it an outage.
production-science=The factory has started measuring output in railcars rather than crates. The old loading yard is no longer enough.
utility-science=Research now depends on machines built in several workshops. The laboratory needs new connections more than another bench.
nuclear-power=The reactor holds steady through its first full run. The temperature alarms remain installed, as requested.
kovarex=A small stock of enriched material can run a great deal of machinery. The fuel office is keeping careful counts.
robots=The repair bots reach the outer wall before the crew does. Somebody finally gets a full night of sleep.
robot-logistics=The first delivery robot brings the right crate to the wrong requester. A few circuit changes fix the routing.
solar-energy=Solar panels keep producing power without a fuel train. The accumulator crew would like everyone to remember that night exists.
platform=The first platform launches with more spare parts than anyone wanted to carry. By the return trip, the crew understands why.
fuel=Thrusters work well on paper. The actual fuel requirement is less charming.
frames=Lightweight frames save mass on the platform, although the welding shop must now meet much tighter tolerances.
rocket-silo=Telemetry confirms the rocket cleared the atmosphere. The control room cheers only after the signal comes back.
interstellar-science=Muluna's instruments catch a faint signal beyond the local chart. The astronomers ask for another array.
advanced-space=The vacuum tests reveal which materials warp, crack or simply refuse to behave. The surviving designs go into production.
asteroid-processing=A well-equipped platform can collect much of its own raw material. The crushers still need ammunition and power.
asteroid-reprocessing=Not every asteroid batch is useful as it arrives. Reprocessing keeps the wrong material from taking over the cargo hold.
thrusters=The platform moves under its own power for the first time. The test pilot immediately asks for better controls.
bulk-cargo=The freighter arrives safely, then spends half a shift unloading. The cargo team has filed a complaint with Engineering.
wit=The survey team laughed at the name until the instruments returned their first readings. Another specialist workshop is needed.
igrys=Igrys shares a sun with harsher worlds but has its own glass and fluid problems. Copying Vulcanus's layout is a poor start.
foliax=From orbit, the plant growth looks almost orderly. The harvesting crew says it isn't.
rabbasca=Gleba's small moon has guarded ruins and very little spare power. The first landing spent more time charging batteries than surveying.
velora=The landing pictures show calm water. The atmosphere readings suggest keeping the suits sealed.
khemia=Khemia is closer to Ribbonia now. Its alchemical equipment is no simpler for being on the safe side of Vibrant's belt.
ferrum=Ferrum's magnetic machinery looks as if it was assembled before anyone arrived. The robotics team has started taking it apart.
obsidiax=The survey found cold lava and stone that does not stay where it was placed. Foundations will take work.
balack=Radiation counts rise and fall with biological activity. The shielding team requests more samples and fewer surprises.
carna=The camera struggles with the snow and low light. Thermal readings show several machines still active beneath it.
arcanyx=Three tests of the same sample produce different results. The lab has ordered a fresh batch of sensors.
pelagos=The sea survey keeps losing a light source behind the waves. The captain wants better cameras, not another theory.
dea-dia=Two worlds share the same small system. The first route map is already covered in corrections.
lemures=Lemures returns an odd timing response. The team is checking its instruments before adding it to the archive.
prosephina=Seasonal cycles take longer than an ordinary production plan. Settlers will need stores that last.
nexus=The Nexus navigation display is missing several expected coordinates. The first survey crew is taking extra fuel.
metallurgic=Vulcanus foundries can now inspect defects before metal reaches final assembly. That saves expensive failures later.
electromagnetic=The first Fulgora tests give repeatable measurements despite the storms. The researchers can finally write stable specifications.
agricultural=The biological samples arrive older than their report. Research on Gleba needs faster handling.
cryogenic=Aquilo's calibration tables need to account for frozen working fluids. The lab has replaced most of the test rig.
lunar=Muluna's low gravity allows experiments that fail on Nauvis. Its storage cabinets are filling fast.
battlefield=The broken machines on Castra tell the workshop how they were made. They are less forthcoming about how they were destroyed.
compression=The first compressed material sample passed strength testing. The press needs a stronger frame.
polishing=Hyarion's polishing process removes flaws too small to see. The rejected test pieces can finally be recycled.
bioengineering=The biology and assembly teams now share equipment and a safety checklist. Neither enjoys the arrangement.
pathological=The first outbreak report reaches the lab with half its figures missing. Emergency storage and containment move up the priority list.
refraction=Hyarion optics reveal a faint signal hidden in a familiar spectrum. The lab is keeping the raw data.
electrochemical=Corrundum's test cell produces power from a chemical process. Two departments are arguing over the patent.
insulation=The original data recorder picked up interference from its own power supply. A quieter design keeps the results legible.
thermodynamic=The new heat measurements finally account for losses in the transfer lines. The redesign is less elegant and more useful.
apicultural=Apiary samples show coordinated behavior that the control engineers can't reproduce yet. The biologists are enjoying this.
nuclear-science=Cerys's old reactor parts survived a long shutdown. They are getting a thorough inspection before anyone restores power.
aerospace=One calculation was wrong until the experiment left the atmosphere. The corrected figures go into the flight manual.
alien=Ribbonia's samples don't match the laboratory's existing materials list. The engineers have started making their own reference set.
biorecycling=Rubia's recovery line accepts material other factories would discard. Space in the waste yard is already freeing up.
biofusion=The reaction needs biological feedstock and industrial containment at the same time. Nobody gets to skip the safety review.
galvanization=Paracelsin coating repairs an old corroded relay. The transmitter works better than expected.
hydraulic=Under Maraxsis's ocean, every pipe fitting has to survive pressure. The testing crew has stopped cutting corners.
bioluminescent=Tenebris specimens flash at repeatable intervals. The team has recorded the sequence without claiming to know what it means.
crucible-science=Crucible's pressure and temperature exceed the old test equipment's ratings. New instruments have been ordered.
golden=A near-perfect measurement takes a great deal of expensive material. The purchasing department notices.
gas-manipulation=Vesta's gas handling lines need careful separation. One bad valve would spoil an entire batch.
promethium=The oldest-looking fragment in the hold resists familiar cutting tools. The sample team wants a better containment box.
antimatter=The containment system has three independent shutdowns. The safety engineer asked for a fourth.
matter-card=The advanced lab sorts familiar materials into unfamiliar categories. The warehouse labels have not caught up.
singularity-card=The final test chamber is ready. Two engineers independently requested the emergency stop remain outside the room.
military-science=The colony's defenders wanted to be explorers. They request a laboratory so they can protect everyone who still does.
gun-turrets=Lights at the edge of the factory draw attention. The first defensive line is an engineering compromise.
stone-walls=The first wall is built in a single afternoon. The second follows an incident nobody wishes to discuss.
military-2=The defense crew practices a withdrawal they hope never to make. They keep the route clear anyway.
military-3=Several colonies agree to share ammunition during an emergency. Logistics becomes diplomacy.
laser-turrets=A portable bolt of electricity looks elegant until the utility bill arrives. The soldiers still approve.
rocketry=A prototype rocket is tested behind reinforced glass. The observers request thicker glass for the next trial.
explosives=The chemicals department has discovered an extremely efficient way to end an argument. The safety team objects.
flamethrowers=An ordinary refinery network becomes a defensive weapon. Its designer refuses to call that innovative.
spidertron=A machine steps beyond the perimeter and keeps walking. The expedition files it under autonomous exploration.
energy-shield=The armor division builds a miniature starship hull around its operator. The medic requests easier access.
rocket-turret=One turret changes an entire convoy's defensive geometry. It also increases the ammunition bill.
matter-processing=The refinery products cease to resemble their inputs. The chemists rename the drawers, then discard the drawers.
matter-stabilization=The stable sample is smaller than the pencil used to record it. Its potential failure fills three pages.
singularity-core=All monitors point to one empty square. Nobody wants to be first through the laboratory door.
black-hole=The navigator marks an absence on the map. The scientists insist that nothing can still be a destination.
nexus-scan=Nexus appears simultaneously as a destination and a contradiction. The archive preserves both definitions.
omega-components=The parts lists begin resembling equations. The warehouse accepts the orders anyway.
warp-drive=One flight arrives before the navigator's estimate. The crew demands the calculation be repeated.
zero-point=Calidus is no longer the only possible source of stellar-scale energy. The Dyson team takes the news personally.
antimatter-production=The safety ledger lists a material whose containment matters more than its output. The entry is double-signed.
transceiver=The final machine resembles a transmitter only from a distance. Its operators listen more than they speak.
fragment-1=A cooled reactor emits a pulse shaped like Calidus's corona. The engineers are certain the waveform is accidental.
fragment-2=A Moshine data processor repeats a coordinate outside the known map. The signal lasts exactly one clock cycle.
fragment-3=A broken circuit reports a checksum that resembles a star map when its bytes are reordered. No one signs the report.
fragment-4=An assembler restores an old blueprint without receiving an instruction. The design carries a date from the future.
fragment-5=The reactor pulse sounds familiar after filtering. It matches a recording from another sun's orbit.
fragment-6=A quantum processor calculates a route for a ship that hasn't been built. The navigator archives the result unopened.
fragment-7=Debris samples form a spiral around an empty coordinate. Each sample comes from a different route.
fragment-8=A laboratory record contains a date after the expedition's projected completion. The clocks insist they are correct.
fragment-9=A logistic robot returns with an empty hold and a full error log. Its final diagnostic resembles speech.
fragment-10=The last fragment is not a coordinate. It is a question addressed to whoever rebuilt the network: What did you make together?
alliance-bio-metals=The first serious trade manifests were not luxury cargo. They were biology delivered to the industrial heart of Vulcanus.
alliance-holmium-circuits=Fulgora's scrap fields meet Gleba's fleeting biology. A new generation of circuitry begins with two incompatible definitions of life.
alliance-optical-coils=Paracelsin's coils have always obeyed the winter. Moshine sends an optical answer that threads through their windings.
alliance-zinc-silicon=Moshine's silicon laboratories ask Paracelsin for a little zinc, and receive an entire new manufacturing discipline.
alliance-rubia-composites=A Rubian frame contains an unlikely constellation: zinc from the frozen frontier and optics from a machine that remembers.
alliance-tenebris-chitosan=Tenebris does not cease to be alive when metal arrives. It merely finds a new way to use the metal.
alliance-linox-refining=Linox is not an end of the route. The old refiners discover that Moshine optics and Paracelsin zinc can travel farther than their owners.
alliance-vesta-magnets=Vesta's magnets begin to echo distant machines. Rare earths and optical cable assemble a field that belongs to no single planet.
alliance-cryo-control=Aquilo's processors no longer need to understand where their components were born. They only need to survive the cold.
alliance-photonic-coils=Paracelsin's coils become a diplomatic instrument, calibrated against Moshine's optics and Fulgora's electrical metals.
alliance-network-cubium=Secretas provides the precious metal. Cubium provides the furnace. Linox provides the finer measurement.
alliance-balack-shield=On Balack, a radiation shield is a negotiation between local biology and supplies from the outer routes.
alliance-matrix-rubia=The network's first shared matrix moves from factory control cabinets into Rubia's enormous mechanical hands.
alliance-matrix-aquilo=Aquilo makes every component prove its worth twice: once in the assembler, once in the cold.
alliance-lattice-vesta=A lattice forged from distant climates arrives at Vesta, where the atmosphere itself becomes part of the experiment.
alliance-vesta-foundations=A foundation must support more than machines. Here it supports the weight of trade routes that cross entire stars.
alliance-balack-vesta=The outer network returns to Balack with supermagnets. The native shielding laboratory finally has materials worth its trouble.
alliance-aquilo-outer=Aquilo receives a final manifest: optical cable, magnet, frame, and metal from four far-flung industrial languages.

alliance-panglia-bond=Panglia's glass once seemed like a local curiosity. With Moshine optics and Fulgoran holmium, it becomes an export worth shipping to distant factories.
alliance-bond-paracelsin=Paracelsin's electrochemical workshops accept the new Panglia bonds. The delivery turns a quiet glass industry into a permanent interstellar supply line.
alliance-bond-linox=Linox uses the same bond to calibrate rare-earth refining. Panglia's first colony now serves an industry on the other side of the map.
alliance-pressure-frame=Crucible contributes high-pressure science. Linox contributes rare earths, Vesta supplies magnetic power, and Panglia lends its optical framework. Umbra learns to build with the whole galaxy.
alliance-pressure-vesta=Vesta's foundations gain another guarded manufacturing path when the pressure frame arrives. The old atmospheric industry remains essential.
alliance-pressure-aquilo=The frame finally travels back inward. Aquilo closes the loop by using materials from the outer worlds in its cryogenic control units.

alliance-frontier-moshine-silicon=Moshine's clean-room output now has an unlikely supply chain: hot-forged Vulcanus metal and time-sensitive living chemistry from Gleba. The old silicon line keeps producing even if the freight stops.
alliance-frontier-gleba-carbon=Moshine's optical cable arrives in the humid Gleba processing halls beside Vulcanus alloy. The biochambers weave them into a carbon-fiber production line fit for equipment shipped across the galaxy.
alliance-frontier-castra-ballistics=Castra's artillery factories begin drawing material from the biological frontier and Moshine's compact silicon industry. The resulting ammunition line proves that logistics can be a military technology.
alliance-middle-fulgora=Fulgora used to keep its storms to itself. Aquilo sends reliable control units, Moshine sends precision optics, and together they make the capacitor a useful piece of a galaxy-wide factory.
alliance-middle-aquilo=Aquilo's control engineers bring together supercapacitors from Fulgora and optics from Moshine. The oldest expeditions still have something essential to send to the frozen factories.
alliance-middle-paracelsin=The belt crossing becomes worthwhile when Rubia's structures and Fulgora's holmium return to Paracelsin to reinforce its electrocoils. Two middle stars finally learn to cooperate.
alliance-middle-rubia=Rubia exports structures into countless distant devices. Now Paracelsin coils and Fulgoran capacitors come back as construction materials for new conductive frames.
signal-network=The factories have learned to send cargo, but coordinating their needs from across two stars demands a different kind of infrastructure. Powered transmitters and receivers carry circuit signals without carrying a single item.
convergence-commission=Aegis preserved the missing safeguard: an emergency authority could only be retired by a working network of independent worlds. The Convergence Commission authorizes a transmission, but the old machine still demands a corporate signature. The engineers will answer with real shipments instead.
convergence-stellar=The first physical delivery brings the Calidus stellar network into the Protocol. The Engine calls it an asset; the working receivers show that no one department can claim the light.
convergence-industry=Independent factories and actual shipped components form the second mandate. The machine searches for a master warehouse and finds cooperation instead.
convergence-synchronization=The signal needs authorization for its deepest stages. Science unlocks the design, while real cargo and a functioning platform remain the measure of what the expedition has achieved.
convergence-deep-space=A third shipment reaches the far end of the map. Deep Space returns observations no headquarters could have manufactured or simulated alone.
convergence-resonance=Real materials align the distant frequencies. The surviving worlds answer the Protocol independently, and the Engine can no longer list them as irrecoverable.
convergence-ignition-research=The recovered instructions make the final sequence possible. Research authorizes the design; it does not deliver the cargo or resolve the old mandate.
convergence-ignition=The last physical freight shipment is accepted. A timed transmission begins, and the old Engine asks for an executive signature nobody can provide. The colonies have earned the right to answer for themselves.
convergence-victory=The final transmission has completed. Five physical shipments have provided independent proof that the network can sustain its living settlements, and the Continuity Engine has released the emergency authority it inherited. No factory has been dismantled. No colony owes its future to an empty boardroom. The expedition can continue because there is still something worth building.
flux-calidus=The home factory learns to refine the new material vocabulary before the expedition begins exchanging it with other suns.
flux-solaris=Furnace-world metallurgy becomes the first partner in a supply chain no single planet can sustain.
flux-nyxaris=An organic frontier teaches synthetic matter to accept ingredients that once belonged only to biology.
flux-vibrant=The storm-world's recovered machinery adds a new dialect to the industrial exchange.
flux-vespera=A cold foundry holds its charge long enough to make the next cross-system exchange possible.
flux-beetlejuice=In the outer matter frontier, ordinary resource names conceal increasingly unusual engineering.
flux-umbra=The dark frontier contributes a material response that cannot be manufactured by a familiar inner-world factory.
flux-link-calidus-solaris=The first industrial treaty is written in components shipped between the old homeworld and a furnace world.
flux-link-nyxaris-vibrant=Living chemistry and charged circuitry finally occupy the same assembly diagram.
flux-link-solaris-vespera=A bargain between furnace and freezer creates components neither environment could make alone.
flux-link-vibrant-beetlejuice=Electrical ruins and exotic matter meet in a factory built for neither world alone.
