[journal-story]
athos=The scorched foundries of Solaris are not the only road to industry. Athos coaxes useful matter out of stone, carbon and diamond dust.
athos-particulate=The crushing mills extract order from waste rock. Particulate Science becomes a new language for fine-scale construction.
nulla=The abandoned factories on Aquilo's irradiated moon still answer radio interference with steel. They were never truly silent.
nulla-electromagnetic=Recovered scrap reveals a machine logic built for factories that outlived their operators.
nulla-robotic-science=Robotic Science turns lost drones and sealed scrap heaps into designs for factories that can repair themselves.
frontier-recovery-charter=Two lost industries, one entombed in stone and one beneath frozen ruins, become a coordinated recovery network.

nexus-photon-works=Nexus does not yield to ordinary circuitry. Its strange photon economy is the first supply line of the trial expedition.
nexus-magnetic-shields=A magnetic boundary makes the difference between a scientific outpost and a very brief obituary.
nexus-storm-forecast=A storm is not merely weather on Nexus. It carries information about the infrastructure waiting beneath the clouds.
nexus-omega-grid=The final expedition's power network must keep the foundries and the shield operating while the summons unfold.
nexus-energy-reserve=Storms knock down a transmission; stored energy restores it before the next creature answers.
nexus-field-beacons=The factory that equips nine hunts must survive long enough to be used a tenth time.
nexus-arachnid-queen=The opening signal wakes a colony whose queen feels the pulse of every turret placed near its nest.
nexus-watcher=One eye in the storm is enough to understand that the expedition is being observed rather than merely attacked.
nexus-rogue-spidertron=Someone built a machine for the expedition. It has spent too long deciding whose expedition it belongs to.
nexus-twin-maws=The second circle begins with a conversation in which neither speaker intends to listen.
nexus-colossus=The ground beneath the transmission tower begins to move. The expedition must decide which structures it can afford to lose.
nexus-plague-hulk=This creature understands assembly lines: it builds new threats every moment it remains alive.
nexus-storm-guardian=The ruins were not debris. They were listening posts, waiting to be charged again.
nexus-devourer=It does not advance to take territory. It advances because every part of the frontier can become food.
nexus-last-commander=The final opponent wears a command structure older than every battle on the frontier. One last signal refuses to fade.
nexus-whisper=The shield hums with a signal that was never meant to be heard. The first three threats can be summoned only when the expedition is ready.
nexus-bearings=The vanished Long Echo expedition left a field of wrecks. A detector points toward what the silence has hidden.
nexus-chorus=Three victories do not end the transmission. They sharpen it. The signal opens its second circle.
nexus-convergence=The second circle has ended. What comes next tests whether the expedition can defend its own machines.
nexus-silence=Nine trophies form one answer. The final signal stops calling through the storms and opens a route into the unknown.
panglia=Panglia repeats Moshine's signals through living tissue. This is no simulation yet, but its roots seem to anticipate the machines that approach them.
panglia-panglite=The expedition harvests Panglite, a self-referential resource that behaves less like ore and more like a question about matter.
panglia-glass=Panglite glass gives the researchers a way to observe structures too small for the ordinary factory to notice.
panglia-timewarp=The first timewarp cells arrive from a plant that does not agree with the rest of the expedition about the length of a second.
panglia-dna-optics=The nanoscale plant reads the molecular language of the expedition's earlier worlds. Moshine gives it computation; Apia gives it context.
panglia-fish-dna=The oldest sample in the laboratory is the simplest. It is also the most difficult to classify.
panglia-biter-dna=A biter is a biological factory that has spent millions of years making exactly one product: survival.
panglia-demolisher-dna=The analysis chamber struggles to hold a map of an organism large enough to erase the mapmaker.
panglia-pentapod-dna=The last sample links the fungal forests of Gleba to Panglia's laboratory. The circuit of worlds closes.
panglia-dna=Four incompatible life histories are aligned. The resulting sequence cannot be represented by any ordinary Moshine equation.
panglia-simulation=The first simulated organism is not alive in any world the expedition can stand on. It still consumes real resources.
panglia-matrix=A matrix of simulated lives reveals that intelligence is less a destination than a branching route.
panglia-sentient=A sentient processor returns the expedition's opening signal with a detail no previous machine had recorded.
panglia-biooptic-trade=Moshine's optical cabling and Gleba's bioflux give Panglite glass an economical second life.
panglia-optical-return=A container of Panglite glass travels back to Moshine. What returns is a slightly better optical network.
first-signal=A factory can build itself more reliably than any crew. The first machines are humble, but every distant star will depend on this beginning.
space-science=The sky becomes a shipping lane. The first real research from orbit gives the expedition a language all seven suns can share.
muluna=Muluna watches the void from close to home. Its lunar science and astronomical instruments are the first hint that the wider sky can be measured.
solaris-gate=A warm star signals through the slipstream. The first expedition is ready, but an open route is not the same as a prepared vessel.
nyxaris-gate=A second reply comes from an unfamiliar light. Its science will not resemble the first frontier's, and that is precisely the point.
vulcanus=Industry is easiest when the ground itself is a foundry. The material sciences here will support machines far beyond this star.
castra=A dormant war machine teaches as much about logistics as it does about destruction. Recovery means understanding both.
arig=Arig teaches industry to compress what once seemed immovable. Its exports become a quiet revolution for neighboring worlds.
hyarion=Hyarion prizes precision where Arig prizes force. Both are necessary somewhere in the long engineering chain.
tellus=Compressed machinery meets living systems. The surviving fragments of old planetary technology begin to fit together.
corrundum=The last familiar industrial techniques become something stranger. Chemistry here demands resources collected from across the first frontiers.
gleba=On Gleba, factories have an expiration date. That makes logistics urgent rather than optional.
moshine=Moshine stores equations where other planets store metal. Information itself becomes an industrial resource.
apia=The Apia and Carnova system is a reminder that some worlds work in pairs. Biology and orbital engineering share a workshop.
vibrant-gate=Two opening frontiers have given the expedition a common language. Their combined science can now cross farther.
fulgora=Fulgora is full of the remains of other people's answers. The lightning still has questions.
cerys=Beneath Cerys's cold surface sits a ruined reactor. Restoring its industry is preparation for a future age of power.
ribbonia=Ribbonia marks the point where travel itself becomes part of the research problem.
asteroid-belt=An asteroid field is a factory problem with no floor. The expedition must manufacture safety while moving.
paracelsin=Even familiar metals behave differently when chemistry becomes a planetary climate.
vespera-gate=A quieter star hides the hardest shipping conditions yet. The colony has to learn patience.
muria=Muria opens the way to chemical processes that can endure the cold.
aquilo=What freezes everything else becomes an advantage when machinery is built to use it.
vespera-belt=The map shows a crossing. The hull shows the price. The difference is your engineering.
rubia=Rubia turns machine design into a discipline. Every imported component has to justify its journey.
maraxsis=The ocean above Maraxsis weighs more than any factory roof. Surviving below it means rethinking rockets.
seadragon=The deep ocean demands a rocket built for the pressure. When it flies, the colony has reclaimed the way upward.
beetlejuice-gate=Two middle frontiers have been mastered. The galaxy opens a path to physics that once belonged to theory.
cubium=Cubium exposes the tiniest flaws in material assumptions. Precision becomes more important than mass.
linox=Linox is where rare earths stop being curiosities and start becoming infrastructure.
secretas=Old methods vanish into more capable replacements. The limits of matter become negotiable.
frozeta=The outer factory must survive not just low temperatures, but long and hostile supply lines.
umbra-gate=The next route darkens every old map. Yet the signals remain precise enough to follow.
tenebris=Tenebris makes light and biology dangerous partners. The colony has to learn both.
crucible=In deep space, even the old distinction between heat and darkness breaks down.
umbra-belt=This belt is not a warning placed on a map. It is a demand for a better ship.
vesta=Vesta's alloys point to machines large enough to be called stellar engineering.
solar-orbit=The expedition returns to Calidus and finally sees its star as a place that can be worked.
inner-orbit=Beyond the first stellar survey, the star begins to fill the windows. Here a mistake cannot be repaired casually.
dyson-build=Every collector sent to the star carries engineering learned under another sun. Home is becoming an industry of its own.
dyson-repeaters=What good is a stellar collector if the factory cannot receive its power? Repeaters close the long circuit.
dyson-mk2=Once energy travels between worlds, demand grows faster than the first receivers were built to handle.
dyson-mk3=The home star no longer belongs to its first tiny colony. Its output serves an entire constellation.
interplanetary-trade=One ship is an adventure. A scheduled freight network is a civilization.
first-frontier-relay=Three worlds send their first industrial discoveries back to Calidus. The original electronics workshop gains suppliers across two stars.
precision-matrix=Four worlds develop one component that can travel between every factory.
extreme-lattice=Outer-frontier materials combine with the earlier matrix. No single planet could have invented it alone.
outer-mastery=Seven star systems have become one workshop. It is time to choose a destination beyond the chart.
edge=The transceiver answers, and the edge of the mapped system ceases to be an ending. It becomes the start of an expedition whose destination is not yet understood.
aegis=Remote stations and hostile asteroid lanes demand their own industry. The frontier doesn't forgive missing supplies.
singularity-theory=Engineers from the seven systems finally find a signal protocol stable enough for a machine that can chart a destination beyond their known frontier.
test-fire=The first test asks whether the experiment can be sustained. The answer is built into every industry's output.
stable-singularity=The singularity holds long enough to power an actual intergalactic transceiver. This is not the last achievement. It is the machine that opens the next page of the map.

green-science=The factory learns to manufacture the machines that manufacture it. From the control room, the first conveyor network resembles a sentence still being written.
railways=Long before spacecraft there were trains. Their schedules teach the colony that distance is an organizational problem before it is a technical one.
steel=A bridge collapses during its first trial. The rebuilt span holds, and the materials office becomes a permanent part of the expedition.
oil=Beneath familiar stone lies a darker fuel. Its discovery stains the sky and fills the laboratory with a new kind of optimism.
chemical-science=The windows burn blue through the night. The first chemical research report describes a machine able to transform any supply shortage into a new bottleneck.
production-science=Output is now counted in thousands. The factory's old production log needs another column, and the engineers need another rail yard.
utility-science=The laboratory stops describing single machines and starts describing whole systems. Its equations suddenly look like the blueprints for a city.
nuclear-power=A controlled reactor is an uncomfortable imitation of a sun. The engineer sees the resemblance, but not yet the future sphere surrounding Calidus.
kovarex=A tiny amount of rare material keeps the colony's most powerful machines alive. Conservation becomes a form of abundance.
robots=The damaged perimeter repairs itself while the colony sleeps. Nobody sees the first robot return to its charger.
robot-logistics=Supplies move without anyone fetching them. A new engineer asks where the delivery workers are and receives a map instead.
solar-energy=The first solar arrays work without smoke or fuel deliveries. In the archive, the early energy experiment acquires a new meaning.
platform=The first platform is a factory with no ground beneath it. Every spare part is suddenly an argument worth having.
fuel=The test engine burns brighter than the hangar lights. From now on, a route is partly a fuel equation.
frames=The spacecraft is defined by the mass its builders refuse to carry. The lightweight frame is an achievement in restraint.
rocket-silo=The countdown ends. No one cheers until the returned telemetry confirms that the vehicle still exists.
interstellar-science=Muluna's instruments measure a signal that should already have faded. Navigation becomes a problem for the laboratories.
advanced-space=Vacuum ceases to be something the crew avoids. It becomes a material they learn to exploit.
asteroid-processing=The supposed emptiness of space becomes a conveyor of useful stone. A well-prepared ship begins to feed itself.
asteroid-reprocessing=A bad batch is no longer waste. On a distant route, the ability to recover materials can save an entire voyage.
thrusters=The deck trembles and then the horizon moves. Flight is the moment when an engineering drawing becomes a responsibility.
bulk-cargo=The freighter arrives safely and loses half a day unloading. Its captain files the delay under avoidable hazards.
wit=The survey catalogue mistakes the name for an annotation. The planet's strange industrial report is harder to laugh away.
igrys=Igrys burns a different color from Vulcanus. The expedition learns that being close to the same star does not make two worlds interchangeable.
foliax=From orbit, Foliax looks like writing stretched across an entire continent. The living pattern refuses to hold still long enough to decipher.
rabbasca=Gleba's smaller companion refuses to be treated as an afterthought. Its geology seems to have learned something from the planet below.
velora=Velora's photographs show calm water. Its first atmospheric analysis is much less reassuring.
khemia=Khemia transmits columns of reactions instead of a simple landing report. Its scientists seem more interested in questions than exports.
ferrum=Ferrum appears industrial before anyone has arrived. The ore analysis hints at a history written by unrecorded machines.
obsidiax=Obsidiax reflects starlight in patterns that resemble the expedition's old coordinates. The resemblance is filed as an instrument fault.
balack=Balack's radiation signatures repeat with biological rhythms. The research team wonders whether shielding could itself be alive.
carna=Carna is dark in a way the camera cannot properly reproduce. The crew's returned measurements do not quite agree.
arcanyx=The same ore sample gives three different answers. On the fourth test the scientists stop blaming their equipment.
pelagos=The ocean hides a pattern of light that disappears whenever the cameras turn. The archivist keeps the blurry frames.
dea-dia=Dea Dia's shared sky suggests a conversation between worlds. Its radio signals seem to answer each other.
lemures=Lemures returns a response to a signal that has not yet been sent. The engineers refuse to sign the log.
prosephina=Prosephina's climate repeats on a schedule longer than any engineering contract. Its settlements must learn patience.
nexus=The navigation computer cannot describe Nexus in familiar coordinates. In the margin, someone writes that a destination need not be a place.
metallurgic=Vulcanus teaches the laboratory to read flaws in metal. Every future superstructure borrows the vocabulary.
electromagnetic=Fulgora's storms become repeatable equations. The science division calls predictability an act of courage.
agricultural=The first biological report is outdated before the courier arrives. The lab learns to race its own experiments.
cryogenic=Machines behave strangely when the world can freeze their working fluids. The scientists stop using old calibration tables.
lunar=On Muluna, experiments produce answers gravity would hide on Nauvis. The charts grow more crowded.
battlefield=The broken war machines teach industry as much as combat. The reconstruction team works in silence.
compression=The first compression experiment makes an ordinary metal seem unfamiliar. The engineer files it as a beginning.
polishing=Hyarion removes flaws that no eye can see. Precision becomes its own kind of strength.
bioengineering=The biologists stop correcting the engineers' vocabulary. Both teams now use the word assembly.
pathological=The first illness on a distant colony changes the meaning of a scientific report. Survival is now a logistical problem.
refraction=The spectrum resembles a pattern seen much farther away. The archivist marks the equations for later comparison.
electrochemical=Corrundum turns a chemical reaction into a power source. The researchers disagree on which field deserves credit.
insulation=The first data archive hears every power cable in the room. A quieter design begins to remember correctly.
thermodynamic=Heat and information share the problem of containment. The lab records that both leak through poor planning.
apicultural=A tiny biological system coordinates better than a room of controllers. Engineers begin keeping careful notes.
nuclear-science=The ruined machinery on Cerys is not silent. It is evidence of a civilization that knew a harder way to make power.
aerospace=A calculation works only after the lab is lifted away from the planet. The atmosphere had been hiding its error.
alien=The scientists cannot yet read Ribbonia's samples. They learn to manufacture them first.
biorecycling=Rubia considers the concept of discarded material an engineering failure. Its factories are designed accordingly.
biofusion=The reaction resembles an ecosystem more than an engine. The foundry team writes a new manual.
galvanization=Paracelsin's metal coating repairs a corroded relay. For a moment the old signal sounds clearer.
hydraulic=The ocean becomes a laboratory with an immeasurably heavy ceiling. Nothing here can be built carelessly.
bioluminescent=Organisms on Tenebris flash in repeated patterns. The crew doubts they are speaking, then records the sequence.
crucible-science=The instruments report a temperature with no comfortable reference. Old material rules fall away.
golden=A perfect measurement turns out to be the most expensive item in the laboratory. The engineers request another shipment.
gas-manipulation=Vesta's laboratories route atmospheric gases like belts and fluids. Its chemistry fills the ship manifests.
promethium=The promethium fragment is older than the expedition can comfortably imagine. Its crystalline faces reflect nothing familiar.
antimatter=An invisible sample weighs more on the scientists' nerves than any asteroid. Its containment manual has no jokes.
matter-card=The K2SO laboratory begins describing materials with new names. Its research looks like grammar as much as chemistry.
singularity-card=The final laboratory builds a container for something that resists ordinary boundaries. The safety office goes quiet.
military-science=The colony's defenders wanted to be explorers. They request a laboratory so they can protect everyone who still does.
gun-turrets=Lights at the edge of the factory draw attention. The first defensive line is an engineering compromise.
stone-walls=The first wall is built in a single afternoon. The second follows an incident nobody wishes to discuss.
military-2=The defense crew practices a withdrawal they hope never to make. They keep the route clear anyway.
military-3=Several colonies agree to share ammunition during an emergency. Logistics becomes diplomacy.
laser-turrets=A portable bolt of electricity looks elegant until the utility bill arrives. The soldiers still approve.
rocketry=A prototype rocket is tested behind reinforced glass. The observers request thicker glass for the next trial.
explosives=The chemicals department has discovered an extremely efficient way to end an argument. The safety team objects.
flamethrowers=An ordinary refinery network becomes a defensive weapon. Its designer refuses to call that innovative.
spidertron=A machine steps beyond the perimeter and keeps walking. The expedition files it under autonomous exploration.
energy-shield=The armor division builds a miniature starship hull around its operator. The medic requests easier access.
rocket-turret=One turret changes an entire convoy's defensive geometry. It also increases the ammunition bill.
matter-processing=The refinery products cease to resemble their inputs. The chemists rename the drawers, then discard the drawers.
matter-stabilization=The stable sample is smaller than the pencil used to record it. Its potential failure fills three pages.
singularity-core=All monitors point to one empty square. Nobody wants to be first through the laboratory door.
black-hole=The navigator marks an absence on the map. The scientists insist that nothing can still be a destination.
nexus-scan=Nexus appears simultaneously as a destination and a contradiction. The archive preserves both definitions.
omega-components=The parts lists begin resembling equations. The warehouse accepts the orders anyway.
warp-drive=One flight arrives before the navigator's estimate. The crew demands the calculation be repeated.
zero-point=Calidus is no longer the only possible source of stellar-scale energy. The Dyson team takes the news personally.
antimatter-production=The safety ledger lists a material whose containment matters more than its output. The entry is double-signed.
transceiver=The final machine resembles a transmitter only from a distance. Its operators listen more than they speak.
fragment-1=A cooled reactor emits a pulse shaped like Calidus's corona. The engineers are certain the waveform is accidental.
fragment-2=A Moshine data processor repeats a coordinate outside the known map. The signal lasts exactly one clock cycle.
fragment-3=A broken circuit reports a checksum that resembles a star map when its bytes are reordered. No one signs the report.
fragment-4=An assembler restores an old blueprint without receiving an instruction. The design carries a date from the future.
fragment-5=The reactor pulse sounds familiar after filtering. It matches a recording from another sun's orbit.
fragment-6=A quantum processor calculates a route for a ship that hasn't been built. The navigator archives the result unopened.
fragment-7=Debris samples form a spiral around an empty coordinate. Each sample comes from a different route.
fragment-8=A laboratory record contains a date after the expedition's projected completion. The clocks insist they are correct.
fragment-9=A logistic robot returns with an empty hold and a full error log. Its final diagnostic resembles speech.
fragment-10=The last fragment is not a coordinate. It is a question addressed to whoever rebuilt the network: What did you make together?
alliance-bio-metals=The first serious trade manifests were not luxury cargo. They were biology delivered to the industrial heart of Vulcanus.
alliance-holmium-circuits=Fulgora's scrap fields meet Gleba's fleeting biology. A new generation of circuitry begins with two incompatible definitions of life.
alliance-optical-coils=Paracelsin's coils have always obeyed the winter. Moshine sends an optical answer that threads through their windings.
alliance-zinc-silicon=Moshine's silicon laboratories ask Paracelsin for a little zinc, and receive an entire new manufacturing discipline.
alliance-rubia-composites=A Rubian frame contains an unlikely constellation: zinc from the frozen frontier and optics from a machine that remembers.
alliance-tenebris-chitosan=Tenebris does not cease to be alive when metal arrives. It merely finds a new way to use the metal.
alliance-linox-refining=Linox is not an end of the route. The old refiners discover that Moshine optics and Paracelsin zinc can travel farther than their owners.
alliance-vesta-magnets=Vesta's magnets begin to echo distant machines. Rare earths and optical cable assemble a field that belongs to no single planet.
alliance-cryo-control=Aquilo's processors no longer need to understand where their components were born. They only need to survive the cold.
alliance-photonic-coils=Paracelsin's coils become a diplomatic instrument, calibrated against Moshine's optics and Fulgora's electrical metals.
alliance-network-cubium=Secretas provides the precious metal. Cubium provides the furnace. Linox provides the finer measurement.
alliance-balack-shield=On Balack, a radiation shield is a negotiation between local biology and supplies from the outer routes.
alliance-matrix-rubia=The network's first shared matrix moves from factory control cabinets into Rubia's enormous mechanical hands.
alliance-matrix-aquilo=Aquilo makes every component prove its worth twice: once in the assembler, once in the cold.
alliance-lattice-vesta=A lattice forged from distant climates arrives at Vesta, where the atmosphere itself becomes part of the experiment.
alliance-vesta-foundations=A foundation must support more than machines. Here it supports the weight of trade routes that cross entire stars.
alliance-balack-vesta=The outer network returns to Balack with supermagnets. The native shielding laboratory finally has materials worth its trouble.
alliance-aquilo-outer=Aquilo receives a final manifest: optical cable, magnet, frame, and metal from four far-flung industrial languages.

alliance-panglia-bond=Panglia's glass once seemed like a local curiosity. With Moshine optics and Fulgoran holmium, it becomes an export worth shipping to distant factories.
alliance-bond-paracelsin=Paracelsin's electrochemical workshops accept the new Panglia bonds. The delivery turns a quiet glass industry into a permanent interstellar supply line.
alliance-bond-linox=Linox uses the same bond to calibrate rare-earth refining. Panglia's first colony now serves an industry on the other side of the map.
alliance-pressure-frame=Crucible contributes high-pressure science. Linox contributes rare earths, Vesta supplies magnetic power, and Panglia lends its optical framework. Umbra learns to build with the whole galaxy.
alliance-pressure-vesta=Vesta's foundations gain another guarded manufacturing path when the pressure frame arrives. The old atmospheric industry remains essential.
alliance-pressure-aquilo=The frame finally travels back inward. Aquilo closes the loop by using materials from the outer worlds in its cryogenic control units.

alliance-frontier-moshine-silicon=Moshine's clean-room output now has an unlikely supply chain: hot-forged Vulcanus metal and time-sensitive living chemistry from Gleba. The old silicon line keeps producing even if the freight stops.
alliance-frontier-gleba-carbon=Moshine's optical cable arrives in the humid Gleba processing halls beside Vulcanus alloy. The biochambers weave them into a carbon-fiber production line fit for equipment shipped across the galaxy.
alliance-frontier-castra-ballistics=Castra's artillery factories begin drawing material from the biological frontier and Moshine's compact silicon industry. The resulting ammunition line proves that logistics can be a military technology.
alliance-middle-fulgora=Fulgora used to keep its storms to itself. Aquilo sends reliable control units, Moshine sends precision optics, and together they make the capacitor a useful piece of a galaxy-wide factory.
alliance-middle-aquilo=Aquilo's control engineers bring together supercapacitors from Fulgora and optics from Moshine. The oldest expeditions still have something essential to send to the frozen factories.
alliance-middle-paracelsin=The belt crossing becomes worthwhile when Rubia's structures and Fulgora's holmium return to Paracelsin to reinforce its electrocoils. Two middle stars finally learn to cooperate.
alliance-middle-rubia=Rubia exports structures into countless distant devices. Now Paracelsin coils and Fulgoran capacitors come back as construction materials for new conductive frames.
signal-network=The factories have learned to send cargo, but coordinating their needs from across two stars demands a different kind of infrastructure. Powered transmitters and receivers carry circuit signals without carrying a single item.
convergence-commission=Beyond the transceiver, the old arguments over which star matters most have become irrelevant. The signal can only be understood by the factories that built its receiver.
convergence-stellar=Calidus supplies the first letters. Solaris and Nyxaris send the machines that taught distant colonies to understand them. The Dyson works brighten again.
convergence-industry=No single planet made this equipment. It is the record of factories that learned to trust vessels crossing between stars.
convergence-synchronization=The signal can now be interpreted. The final engineering challenge is synchronizing seven independent technological histories into a single transmission.
convergence-deep-space=Beetlejuice and Umbra bring knowledge that resists impossible distances. Deep Space supplies the next frequency.
convergence-resonance=The distant pulsars do not agree on a rhythm. By trading holmium, outer-system research and surviving frontier materials, the expedition learns to make them sing together.
convergence-ignition-research=The Calidus Dyson works have been prepared for a purpose greater than lighting one system. Its engineering, joined with the far expedition, authorizes a final accord.
convergence-ignition=The factories of seven suns send their best work. Not seven rival signals, but one carefully constructed answer carried beyond the known maps.
convergence-victory=A hundred worlds can produce machines. Only one civilization can agree to build something together. The final transmission leaves the vessel, and the stars answer with room to grow.
[journal-tip]
athos=Research Athos's native discovery, preserve Crushing Industry and plan for earthquakes. Razi does not replace the author's stone and diamond production.
athos-particulate=Research the native Particulate Science unlock and ship its real science packs to an advanced laboratory.
nulla=Travel from Aquilo using the original moon connection. Prepare for native radio-interference combat drones and salvage.
nulla-electromagnetic=Mine the original industrial remnants to uncover electromagnetic robotics. The author owns this unlock.
nulla-robotic-science=Collect Nulla scrap and manufacture the real, perishable Robotic Science. Move finished science quickly.
frontier-recovery-charter=Produce Robotic Science on Nulla and Particulate Science on Athos. Ship both to an existing late-tier research lab to complete the joint recovery project.

nexus-photon-works=Develop native photon electronics before committing to sustained Nexus production. This research cannot substitute for a victory.
nexus-magnetic-shields=Research the source magnetic shielding technology and leave space for emergency power and repairs.
nexus-storm-forecast=Unlock Nexus storm prediction. Nexus Threat manages real storms, while Razi records the preparation milestone.
nexus-omega-grid=Expand Nexus power distribution with its native omega substation. Keep redundancy and logistics off the frontline.
nexus-energy-reserve=Unlock Nexus's omega accumulator and test the reserve under realistic defenses.
nexus-field-beacons=Develop native omega beacons for efficient, defended industry. These are production beacons, not duplicate boss summoning items.
nexus-arachnid-queen=Summon and defeat the Arachnid Queen on Nexus. Her native trophy and victory state are managed by Nexus Bosses.
nexus-watcher=Defeat the Watcher with anti-air defense and reliable repairs; follow the Codex for actual tactics.
nexus-rogue-spidertron=Defeat the Rogue Spidertron. The Codex reveals its log and can guide you toward a rewarding lair encounter.
nexus-twin-maws=Defeat Twin Maws. Protect your summoning position against both incendiary and corrosive pressure.
nexus-colossus=Defeat the Colossus using sustained battlefield logistics and source-provided summons.
nexus-plague-hulk=Defeat the Plague Hulk. Keep its reinforcements from overrunning your forward supply chain.
nexus-storm-guardian=Find charged storm shards and use the source charged-beacon system to weaken the Storm Guardian before defeating it.
nexus-devourer=Defeat the Devourer with concentrated firepower. Its regeneration makes brief, scattered attacks costly.
nexus-last-commander=Defeat the Last Commander. Protect your frontline, then recover its native trophy for the nine-part warp key.
nexus-whisper=Establish a protected base on Nexus and construct a shield stabilizer. The boss mod controls the encounters and research trigger.
nexus-bearings=Find the first expedition log to unlock the source direction finder. Lair fights are optional but more rewarding.
nexus-chorus=Defeat all three Whisper bosses at your own summon beacons. Bring enough defense to protect the countdown.
nexus-convergence=Clear the three Chorus encounters to open Convergence. The source mod awards the research upon success.
nexus-silence=Defeat all nine bosses and craft the native Nexus warp key. Silence becomes available only when the source boss-gate setting is enabled.
panglia=Bring Moshine data-cell production and Apia's biological expertise. Source Panglia discovery still needs its native extractor and foundry research.
panglia-panglite=Build Panglia's native Panglite chain. Its initial processing stays restricted to this world.
panglia-glass=Make Panglite glass locally with its original metallurgy and pressure rules. You will need it for nanoscale DNA work.
panglia-timewarp=Use the native timewarp analyzer and datacell recipes. Accelerated zones need reliable power and defenses.
panglia-dna-optics=Craft Panglite glass to trigger its native optics breakthrough, then prepare the nanoscale DNA scanner.
panglia-fish-dna=Complete Panglia's native fish DNA collection trigger. This is not an ordinary research-pack milestone.
panglia-biter-dna=Follow the source mod's biter DNA task. Keep specimen handling and defense independent of the laboratory.
panglia-demolisher-dna=Acquire the required demolisher sample using Panglia's original scripted research objective.
panglia-pentapod-dna=Finish the source pentapod DNA objective. Nothing in Razi bypasses this collection challenge.
panglia-dna=Combine all native DNA milestones and continue Panglia's original data-cell research.
panglia-simulation=Develop the original simulation chamber after DNA research. The Moshine AI and Panglia timewarp chains remain essential.
panglia-matrix=Craft a simulated specimen to satisfy the original research trigger. Razi does not grant the matrix for free.
panglia-sentient=Finish Panglia's native processor research. This deep objective enriches the story without blocking Vibrant travel.
panglia-biooptic-trade=When available, unlock the optional Panglia glass exchange. Four native batches and imported materials yield one extra glass, with no productivity stacking.
panglia-optical-return=This optional return shipment keeps Moshine's native optics recipe untouched. If incompatible machines exist, the guarded bonus stays hidden.
first-signal=Research automation; reliable factory capacity matters more than rushing the first rocket.
space-science=Space science and a reliable rocket pipeline come before large-scale system travel.
muluna=Explore Muluna's native research instead of skipping straight to dangerous stars.
solaris-gate=Solaris and Nyxaris can be opened independently. Build spare engines, fuel and asteroid defense.
nyxaris-gate=Choose either opening system first. Neither star should depend on the other's research.
vulcanus=Prepare foundries and K2SO metallurgy. Native Vulcanus research remains useful throughout the campaign.
castra=Bring defense and repair supplies. Castra's battlefield science supports later Solaris branches.
arig=Arig and Hyarion are parallel discoveries after Castra. Neither should require completing the other first.
hyarion=Research Hyarion's native polishing and inspect its original machines before exporting its products.
tellus=Tellus is downstream of the Arig and Hyarion branches. Expect biological research to be involved.
corrundum=Before Corrundum, complete Tellus and the relevant Nyxaris exports required by its real technology.
gleba=Spoilage, bioflux and agricultural research are the foundation. Avoid shipping unstable intermediates needlessly.
moshine=Build toward data processors and data storage. Some upgrades need science from later systems.
apia=Follow the original Apia/Carnova discovery. Razi keeps its native orbital setup intact.
vibrant-gate=Vibrant and Vespera remain parallel after the first-frontier campaign.
fulgora=Recycling and electromagnetics unlock industries that the outer systems will continue to need.
cerys=Recover native Cerys nuclear scrap and repair technology; the moon contributes to advanced Dyson engineering.
ribbonia=Plan a vessel for the original asteroid belt before making the crossing. The belt is a progression challenge.
asteroid-belt=Study asteroid distribution and stockpile ammunition. The original belt's science remains source-owned.
paracelsin=Paracelsin zinc and electrochemistry support cross-world industry, including stellar engineering.
vespera-gate=You may explore Vespera or Vibrant first. Both demand the completed first frontiers.
muria=Muria's native chemistry feeds later Aquilo and outer-frontier exchanges.
aquilo=Protect pipes and power, and develop native cryogenic science before expecting reliable outer-system logistics.
vespera-belt=Survey Vespera's native debris divide and use a ship built for the route's actual asteroid threats.
rubia=Rubia's native logistics, composites and science become inputs for later shared manufacturing.
maraxsis=Use source-owned underwater construction and hydraulic science; the sea is not another land factory.
seadragon=Project Seadragon is an existing Maraxsis technology; it unlocks the source's specialised rocket-part production.
beetlejuice-gate=Beetlejuice and Umbra are both late frontiers. Preserve their paired access and belt encounters.
cubium=Cubium science supports Secretas, advanced K2SO systems and specialized refining.
linox=Refine native Linox rare earths and integrate them with precision manufacturing.
secretas=Use Cubium research and native Secretas science before expanding to Frozeta.
frozeta=Frozeta is late Beetlejuice territory. Bring source-compatible machinery and a proven defensive ship.
umbra-gate=Umbra is a parallel outer entry alongside Beetlejuice, not its subordinate.
tenebris=Chitosan and native biological science support the far outer industrial network.
crucible=Follow Crucible's native orbital chain and research before attempting its late material exchanges.
umbra-belt=Do not attempt the fractured route with early Calidus defenses. Survey and prepare first.
vesta=Build native Vesta supermagnets and foundations; the final fleet will need extreme materials.
solar-orbit=The source Dyson mod owns solar plasma, locations and satellite launching; ordinary orbit access is not free power.
inner-orbit=Bring plasma-capable defenses and build the source's inner orbit machinery only when prepared.
dyson-build=The researched technology is only permission to build. Satellite totals are tracked by the source mod.
dyson-repeaters=Use the source's repeater satellites and power connectors. Research completion does not imply an active energy link.
dyson-mk2=Advanced receiver research follows Project Seadragon; the source still limits real transmitted power.
dyson-mk3=Final receiver engineering belongs to the outer frontier. Watch the source's actual energy allocation.
interplanetary-trade=Planet Express manages dispatch and schedules; Razi's Cargo Network can help you find unscheduled platforms.
first-frontier-relay=Optional research after Vulcanus, Gleba and Moshine. Inspect actual ingredients and manufacturing conditions; native K2SO electronics remain available.
precision-matrix=Precision matrices need native holmium, rare metals, optical cable and zinc. The source manufacturing chains remain untouched.
extreme-lattice=Extreme lattice production is an optional efficiency reward, never a gate for planetary science.
outer-mastery=Complete the outer research network and its asteroid crossings before attempting the final edge.
edge=Master both outer frontiers, stabilise and physically activate the native K2SO intergalactic transceiver, then research the Solar System Edge. Deep Space is the next chapter, not victory.
aegis=Prepare defense and sustained space-platform manufacturing. Keep Aegis/Bellicos native mechanics intact.
singularity-theory=Complete Outer Frontier Mastery and study all seven existing system cards. This research is now before Deep Space, with no post-edge Promethium requirement.
test-fire=Complete the source-owned Dyson receiver research and the required singularity experimentation.
stable-singularity=Complete staged outer-system card research, build and activate the original K2SO transceiver, then follow its signal to the Solar System Edge.

green-science=Automate green science before scaling the rest of the base.
railways=Keep junctions clear and leave room for future unloading stations.
steel=Reserve iron smelting for steel, especially before mass-producing rocket structures.
oil=Use circuit-controlled cracking to prevent one oil product from clogging the refinery.
chemical-science=Keep a steady chemical-science line instead of a temporary manual batch.
production-science=Build reliable rails and throughput before scaling production science.
utility-science=Utility science underpins late equipment, logistics and high-tier machinery.
nuclear-power=Build uranium processing and heat buffering before depending on the reactor.
kovarex=Bootstrap enrichment carefully; do not consume your first isotope reserve.
robots=Keep construction bots, repair packs and roboport coverage ready for distant outposts.
robot-logistics=Use bots for flexible, low-volume supply and trains or belts for bulk cargo.
solar-energy=Solar generation is useful for low-demand remote outposts, but requires storage.
platform=Plan asteroid collection, power, defenses and hub throughput before launch.
fuel=Build a separate rocket-fuel supply for platforms and cargo launches.
frames=Protect copper, steel and plastic supplies for repeated rocket manufacturing.
rocket-silo=Automate rocket parts, not merely the first ceremonial launch.
interstellar-science=Follow the native Muluna science process and its orbital production rules.
advanced-space=Respect specialized space-platform crafting categories.
asteroid-processing=Crush asteroid chunks where the route supports sustainable resupply.
asteroid-reprocessing=Reprocessing can help balance asteroid chunks during long shipments.
thrusters=Match oxidizer and fuel generation to travel distances.
bulk-cargo=Optimize hub loading and unloading rather than simply adding more ships.
wit=Wit is a native optional branch; preserve its own machine economy.
igrys=Carry supplies appropriate for Igrys rather than assuming a duplicate hot-world recipe set.
foliax=Its biological systems are independent from Gleba's familiar processes.
rabbasca=Keep Rabbasca's true moon orbit and source-owned progression.
velora=Bring the machinery needed for Velora's native surface conditions.
khemia=Plan fluid and chemical supply around the native technology.
ferrum=Ferrum is source-owned; it must not become a shortcut through the asteroid belt.
obsidiax=Obsidiax materials contribute to the broader middle-frontier research network.
balack=Native Balack shielding matters to extreme late-game manufacturing.
carna=Prepare a late-game platform and respect the source-owned landing rules.
arcanyx=Keep the native Arcanyx refinery rather than replacing its chemistry.
pelagos=Pelagos is optional and skips safely when not installed.
dea-dia=This optional system does not block required Nyxaris worlds.
lemures=Explore the native Dea Dia extension when available.
prosephina=Preserve its source-owned cycle and machinery.
nexus=Nexus is late game, linked to the original transceiver chain.
metallurgic=Maintain native foundries and metallurgic science.
electromagnetic=Keep reliable electromagnetics and recycling supply.
agricultural=Keep spoilable science moving through short delivery chains.
cryogenic=Keep Aquilo's power and fluids protected.
lunar=Use original lunar research rather than guessing recipes.
battlefield=Castra's native battlefield science is valuable beyond defense.
compression=Build using the source-native Arig machinery.
polishing=Preserve polishing science and machine categories.
bioengineering=Tellus bioengineering blends living and mechanical chains.
pathological=Plan source-specific biological processing carefully.
refraction=Original refraction science supports Solaris research.
electrochemical=Keep electrical and chemical materials close.
insulation=Moshine data science benefits from reliable power.
thermodynamic=Check the source's thermodynamic recipe chain.
apicultural=Preserve native hive science and spoilage-sensitive shipping.
nuclear-science=Cerys recovery is a major chapter in stellar engineering.
aerospace=Check native orbital crafting requirements.
alien=Respect native alien science and the source crafting chain.
biorecycling=Reuse byproducts when possible before importing more.
biofusion=Biofusion has source-specific production, not a generic furnace.
galvanization=Paracelsin zinc supports the larger industrial network.
hydraulic=Respect native underwater infrastructure.
bioluminescent=Biological source research differs from ordinary lighting.
crucible-science=Follow Crucible's native science chain.
golden=Golden science belongs to the advanced Cubium industry.
gas-manipulation=Reserve specialized gases for native source recipes.
promethium=Use a serious armored platform for hostile promethium routes.
antimatter=Keep antimatter production late and source-owned.
matter-card=Keep original K2SO matter-card requirements.
singularity-card=Singularity tech belongs to the native endgame.
military-science=Automate military science alongside civilian priorities.
gun-turrets=Feed turrets ammunition and cover them with repair robots.
stone-walls=Wall geometry must support weapon ranges and repair access.
military-2=Use weapons appropriate to each world's environment.
military-3=Protect ammunition delivery across remote outposts.
laser-turrets=Lasers exchange ammunition logistics for power demand.
rocketry=Prepare rockets for advanced defenses and platforms.
explosives=Reserve explosives without starving chemical science.
flamethrowers=Protect fuel pipes to flamethrower defenses.
spidertron=Use remote construction and recovery where supported.
energy-shield=Keep enough power generation for shields.
rocket-turret=This source turret technology may differ by version and skips safely.
matter-processing=Matter processing is a K2SO late-game specialty.
matter-stabilization=Containment machinery and power matter more than speed.
singularity-core=Maintain source-owned Nexus singularity core research.
black-hole=Approach native black-hole research with an endgame ship.
nexus-scan=Follow the source Nexus scanning chain.
omega-components=Use native Omega industry and labs.
warp-drive=Warp drives belong to late Nexus research.
zero-point=Do not bypass the existing Dyson construction stage.
antimatter-production=Native antimatter production stays at deep-space tier.
transceiver=Build the native K2SO transceiver when the research unlocks.
fragment-1=Uranium processing is the foundation of nuclear and Cerys engineering.
fragment-2=Complex circuits become indispensable on the data frontier.
fragment-3=Processing units are the backbone of advanced automation.
fragment-4=High-tier assembly supports complex native machinery.
fragment-5=Fusion remains a late power technology.
fragment-6=Quantum research belongs to Aquilo's source chain.
fragment-7=Asteroid processing matters on every hazardous crossing.
fragment-8=Research productivity helps late science but cannot replace source progression.
fragment-9=Robot speed is not a substitute for bulk freight.
fragment-10=The actual source transceiver must be activated for its physical signal gate.
alliance-bio-metals=Research the alternate rare-metal process, ship bioflux from Gleba, and compare its throughput with native K2SO casting.
alliance-holmium-circuits=Route stable support logistics for bioflux and holmium. Keep the original electronic-components line running while trialling the alternate recipe.
alliance-optical-coils=Import Moshine optical cable for the Paracelsin coil alternative. Confirm the native mechanics-category machine and world restrictions.
alliance-zinc-silicon=Ship Paracelsin zinc solder to Moshine and unlock the native-compatible silicon-cell alternative. Native silicon research still comes first.
alliance-rubia-composites=Supply zinc plates and optical cables for the optional Rubia craptonite composite line. Keep its original byproducts and production rules intact.
alliance-tenebris-chitosan=Deliver Paracelsin zinc rivets into Tenebris chitosan production. The native chitin recipe remains the foundation.
alliance-linox-refining=Unlock the guarded Linox refining alternative and import optical cable and zinc plate. Do not assume the native rare-earth recipe is replaced.
alliance-vesta-magnets=Ship Linox rare-earth powder and Moshine optical cables to Vesta. The native supermagnet category and atmospheric restrictions still apply.
alliance-cryo-control=Research the alternate K2SO control-unit process after Aquilo, Fulgora and Gleba. Verify native cryogenics and coolant inputs before shipping.
alliance-photonic-coils=Connect optical cables and holmium to Paracelsin's real electric-coil production. The technology appears only when the guarded recipe exists.
alliance-network-cubium=Try the guarded Cubium gold alternative with Linox rare earths, Paracelsin zinc and Vulcanus rare metals. All source recipe unlocks remain authoritative.
alliance-balack-shield=When Balack's guarded optional shielding alternative exists, use Rubian frames and Tenebris chitosan without bypassing its native recipe.
alliance-matrix-rubia=Manufacture Precision Control Matrices from the earlier four-world supply chain, then research the Rubia inserter alternative.
alliance-matrix-aquilo=Deliver Precision Control Matrices into Aquilo's native K2SO cryogenic controllers. The bonus is optional and capped.
alliance-lattice-vesta=Craft Extreme-Environment Lattices and unlock the Vesta supermagnet alternative. Importing the lattice does not remove native atmospheric limits.
alliance-vesta-foundations=Deep interdependence only: ship Rubian frames, Tenebris chitosan and Fulgoran holmium to Vesta for an optional foundation process.
alliance-balack-vesta=Deep interdependence only: source Vesta supermagnets, Rubia frames and Tenebris chitosan for Balack shielding. Preserve its native requirements.
alliance-aquilo-outer=Deep interdependence only: unite Moshine optics, Vesta magnets, Rubia frames and Fulgoran holmium in a source-guarded cryogenic alternative.

alliance-panglia-bond=Research Panglia glass, Moshine optical cable and Fulgora holmium, then build Panglia Optic Bonds. No source glass or science requirements are replaced.
alliance-bond-paracelsin=Ship Panglia Optic Bonds to Paracelsin for the guarded electrochemical coil alternative. The native recipe and machinery are still required.
alliance-bond-linox=After discovering Linox, import Panglia Optic Bonds for optional rare-earth refining. Production remains locked behind Linox's original research.
alliance-pressure-frame=Deep interdependence only. Ship Panglia Optic Bonds, Crucible high-pressure science, Linox rare earths and Vesta supermagnets to assemble the Umbra Pressure Frame.
alliance-pressure-vesta=Deep interdependence only. Use Umbra Pressure Frames in Vesta's native foundation production. Bonus yield is capped and recycling/productivity is disabled.
alliance-pressure-aquilo=Deep interdependence only. Bring finished Umbra Pressure Frames back to Aquilo's native cryogenic facilities for an optional K2SO controller recipe.

alliance-frontier-moshine-silicon=Compare the optional silicon cell batch with the native Moshine recipe. Ensure rare metal and bioflux supply arrives before manufacturing; this is not a chapter gate.
alliance-frontier-gleba-carbon=Use the original Gleba carbon-fiber technology and a Biochamber. Import optical cable and rare metals, and keep the native yumako/carbon supply running.
alliance-frontier-castra-ballistics=The alternative batch needs native piercing-magazine technology and a supported Castra crafting machine. Ship carbon fiber and silicon cells. Original ammunition remains craftable.
alliance-middle-fulgora=Keep the original supercapacitor production unlocked. Deliver native Aquilo energy controls and Moshine optics to Fulgora; the premium recipe is an optional upgrade.
alliance-middle-aquilo=Use native control-unit technology and a proper cryogenic machine on Aquilo. Import Fulgora supercapacitors and Moshine optical cable; ordinary control units remain craftable.
alliance-middle-paracelsin=This research becomes a conditional prerequisite for the outer systems. Import native Rubia craptonite frames and Fulgora holmium; the original Paracelsin coil factory remains usable.
alliance-middle-rubia=This research becomes a conditional prerequisite for the outer systems. Import native Paracelsin coils and Fulgora supercapacitors; the original Rubia casting process remains usable.
signal-network=Research native AAI Signal Transmission, place a powered transmitter and receiver on matching channels, then wire import reserves or stock signals. Planet Express still handles actual rockets and cargo. The Razi Codex tracks research, not whether a communication circuit has been wired.
convergence-commission=Research The Convergence Commission after the Solar System Edge and installed native post-edge milestones. Open the Convergence panel for real shipping requirements.
convergence-stellar=Craft and deliver eight Stellar Mandates from a real character inventory aboard your force's expedition platform at the Solar System Edge or farther.
convergence-industry=Craft and deliver ten Industrial Mandates. Both stages are tracked across your entire force and can be completed cooperatively.
convergence-synchronization=Research Deep-Space Synchronization after the Commission. It unlocks outer-space and resonance manufacturing but does not grant victory.
convergence-deep-space=Craft and deliver six Deep-Space Mandates while physically at a supported expedition platform after Synchronization research.
convergence-resonance=Deliver four Pulsar Resonance Mandates, combining outer cards, real holmium and available Aegis/Nexus-produced supplies.
convergence-ignition-research=Research Convergence Ignition Protocol after Synchronization and installed Calidus Dyson distribution milestones. Source technologies remain source-owned.
convergence-ignition=Craft and deliver one final Convergence Ignition Mandate using all seven systems and Deep Space science. The victory is triggered by its actual delivery.
convergence-victory=Complete all five real freight deliveries. The final accepted cargo triggers Factorio's real victory screen with an option to continue playing.
[journal-weather]
panglia=The source weather add-on paints this timewarp world with drifting clouds, luminous sparks and dust. This is a visual profile, not a forecast of timewarp-zone behavior.
muria=Corrosive skies may include spores, dust, fog and cloud cover. The add-on can replace the planet's original rain unless its separate rain setting is enabled.
vesta=The gas giant's thick fog and layered clouds emphasize limited visibility over its atmospheric industry. These are visual effects, not additional gas-processing requirements.
rubia=Clouds and suspended dust add atmosphere to the biological machinery of Rubia; production and spoilage mechanics still come from the planet mod.
paracelsin=The additional winter/darkness profile is disabled by the source default. If enabled, its permanent-dark option can alter actual day/night presentation.
cubium=Suspended clouds and faint electrical sparks characterize Cubium. The effects do not change its gas-processing recipes.
rabbasca=Electric sparks, fog and dust make the forgotten Gleba moon visually distinct while its vaults and energy limits remain native gameplay.
igrys=Use the source settings to tune Igrys's industrial atmospheric effects; the visual layer does not change extraction rules.
khemia=An atmospheric haze accompanies the chemical expedition. Weather settings govern visuals rather than research unlocks.
carna=The outer organic frontier's native hazards remain intact beneath the configurable celestial visual layer.
pelagos=Ocean-world weather should complement ship-based logistics, not spawn an extra or contradictory production barrier.

