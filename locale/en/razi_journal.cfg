[journal-chapter-story]
calidus=The star behind your first factory is not the limit of your world. Beneath the familiar sky lies a communications network no one remembers building.
solaris=Across the industrial frontier, metallurgy and ruined battlefields contain fragments of an earlier interstellar age.
nyxaris=Under a greener sun, biology begins to look uncomfortably like computation. The frontier is alive with useful contradictions.
vibrant=The next star glimmers through metallic dust. Buried machines, charged weather and an ancient frozen moon tell different parts of the same story.
vespera=Past the familiar heat of industry, the light turns pale and distant. Survival becomes a matter of careful logistics.
beetlejuice=Here industry begins to dismantle the distinction between materials and energy. Old rules become expensive suggestions.
umbra=Deep-space darkness has weight. Nothing here is truly empty, and the routes demand machines built to survive it.
stellar=You left home to seek energy among the stars. Now everything you learned must return to the star where it began.
network=An empire of disconnected outposts is only a collection of lonely factories. A galaxy is built from shipments.
finale=The last experiment is not another mining operation. It is a question aimed into the space between galaxies.

