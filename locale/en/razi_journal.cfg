[journal-story]
first-signal=A factory can build itself more reliably than any crew. The first machines are humble, but every distant star will depend on this beginning.
space-science=The sky becomes a shipping lane. The first real research from orbit gives the expedition a language all seven suns can share.
muluna=Muluna watches the void from close to home. Its lunar science and astronomical instruments are the first hint that the wider sky can be measured.
solaris-gate=A warm star signals through the slipstream. The first expedition is ready, but an open route is not the same as a prepared vessel.
nyxaris-gate=A second reply comes from an unfamiliar light. Its science will not resemble the first frontier's, and that is precisely the point.
vulcanus=Industry is easiest when the ground itself is a foundry. The material sciences here will support machines far beyond this star.
castra=A dormant war machine teaches as much about logistics as it does about destruction. Recovery means understanding both.
arig=Arig teaches industry to compress what once seemed immovable. Its exports become a quiet revolution for neighboring worlds.
hyarion=Hyarion prizes precision where Arig prizes force. Both are necessary somewhere in the long engineering chain.
tellus=Compressed machinery meets living systems. The surviving fragments of old planetary technology begin to fit together.
corrundum=The last familiar industrial techniques become something stranger. Chemistry here demands resources collected from across the first frontiers.
gleba=On Gleba, factories have an expiration date. That makes logistics urgent rather than optional.
moshine=Moshine stores equations where other planets store metal. Information itself becomes an industrial resource.
apia=The Apia and Carnova system is a reminder that some worlds work in pairs. Biology and orbital engineering share a workshop.
vibrant-gate=Two opening frontiers have given the expedition a common language. Their combined science can now cross farther.
fulgora=Fulgora is full of the remains of other people's answers. The lightning still has questions.
cerys=Beneath Cerys's cold surface sits a ruined reactor. Restoring its industry is preparation for a future age of power.
ribbonia=Ribbonia marks the point where travel itself becomes part of the research problem.
asteroid-belt=An asteroid field is a factory problem with no floor. The expedition must manufacture safety while moving.
paracelsin=Even familiar metals behave differently when chemistry becomes a planetary climate.
vespera-gate=A quieter star hides the hardest shipping conditions yet. The colony has to learn patience.
muria=Muria opens the way to chemical processes that can endure the cold.
aquilo=What freezes everything else becomes an advantage when machinery is built to use it.
vespera-belt=The map shows a crossing. The hull shows the price. The difference is your engineering.
rubia=Rubia turns machine design into a discipline. Every imported component has to justify its journey.
maraxsis=The ocean above Maraxsis weighs more than any factory roof. Surviving below it means rethinking rockets.
seadragon=The deep ocean demands a rocket built for the pressure. When it flies, the colony has reclaimed the way upward.
beetlejuice-gate=Two middle frontiers have been mastered. The galaxy opens a path to physics that once belonged to theory.
cubium=Cubium exposes the tiniest flaws in material assumptions. Precision becomes more important than mass.
linox=Linox is where rare earths stop being curiosities and start becoming infrastructure.
secretas=Old methods vanish into more capable replacements. The limits of matter become negotiable.
frozeta=The outer factory must survive not just low temperatures, but long and hostile supply lines.
umbra-gate=The next route darkens every old map. Yet the signals remain precise enough to follow.
tenebris=Tenebris makes light and biology dangerous partners. The colony has to learn both.
crucible=In deep space, even the old distinction between heat and darkness breaks down.
umbra-belt=This belt is not a warning placed on a map. It is a demand for a better ship.
vesta=Vesta's alloys point to machines large enough to be called stellar engineering.
solar-orbit=The expedition returns to Calidus and finally sees its star as a place that can be worked.
inner-orbit=Beyond the first stellar survey, the star begins to fill the windows. Here a mistake cannot be repaired casually.
dyson-build=Every collector sent to the star carries engineering learned under another sun. Home is becoming an industry of its own.
dyson-repeaters=What good is a stellar collector if the factory cannot receive its power? Repeaters close the long circuit.
dyson-mk2=Once energy travels between worlds, demand grows faster than the first receivers were built to handle.
dyson-mk3=The home star no longer belongs to its first tiny colony. Its output serves an entire constellation.
interplanetary-trade=One ship is an adventure. A scheduled freight network is a civilization.
precision-matrix=Four worlds develop one component that can travel between every factory.
extreme-lattice=Outer-frontier materials combine with the earlier matrix. No single planet could have invented it alone.
outer-mastery=Seven star systems have become one workshop. It is time to choose a destination beyond the chart.
edge=The solar system edge is not a wall. It is a place where old navigation stops promising anything.
aegis=Remote stations and hostile asteroid lanes demand their own industry. The frontier doesn't forgive missing supplies.
singularity-theory=A transceiver is not merely a transmitter. Something on the far side may know the language already.
test-fire=The first test asks whether the experiment can be sustained. The answer is built into every industry's output.
stable-singularity=The network holds. The final transmission is possible, but the final choice belongs to the engineer.

green-science=The factory learns to manufacture the machines that manufacture it. From the control room, the first conveyor network resembles a sentence still being written.
railways=Long before spacecraft there were trains. Their schedules teach the colony that distance is an organizational problem before it is a technical one.
steel=A bridge collapses during its first trial. The rebuilt span holds, and the materials office becomes a permanent part of the expedition.
oil=Beneath familiar stone lies a darker fuel. Its discovery stains the sky and fills the laboratory with a new kind of optimism.
chemical-science=The windows burn blue through the night. The first chemical research report describes a machine able to transform any supply shortage into a new bottleneck.
production-science=Output is now counted in thousands. The factory's old production log needs another column, and the engineers need another rail yard.
utility-science=The laboratory stops describing single machines and starts describing whole systems. Its equations suddenly look like the blueprints for a city.
nuclear-power=A controlled reactor is an uncomfortable imitation of a sun. The engineer sees the resemblance, but not yet the future sphere surrounding Calidus.
kovarex=A tiny amount of rare material keeps the colony's most powerful machines alive. Conservation becomes a form of abundance.
robots=The damaged perimeter repairs itself while the colony sleeps. Nobody sees the first robot return to its charger.
robot-logistics=Supplies move without anyone fetching them. A new engineer asks where the delivery workers are and receives a map instead.
solar-energy=The first solar arrays work without smoke or fuel deliveries. In the archive, the early energy experiment acquires a new meaning.
platform=The first platform is a factory with no ground beneath it. Every spare part is suddenly an argument worth having.
fuel=The test engine burns brighter than the hangar lights. From now on, a route is partly a fuel equation.
frames=The spacecraft is defined by the mass its builders refuse to carry. The lightweight frame is an achievement in restraint.
rocket-silo=The countdown ends. No one cheers until the returned telemetry confirms that the vehicle still exists.
interstellar-science=Muluna's instruments measure a signal that should already have faded. Navigation becomes a problem for the laboratories.
advanced-space=Vacuum ceases to be something the crew avoids. It becomes a material they learn to exploit.
asteroid-processing=The supposed emptiness of space becomes a conveyor of useful stone. A well-prepared ship begins to feed itself.
asteroid-reprocessing=A bad batch is no longer waste. On a distant route, the ability to recover materials can save an entire voyage.
thrusters=The deck trembles and then the horizon moves. Flight is the moment when an engineering drawing becomes a responsibility.
bulk-cargo=The freighter arrives safely and loses half a day unloading. Its captain files the delay under avoidable hazards.
eneas=The small moon returns a narrow signal at regular intervals. Its survey crew cannot determine whether the pattern comes from equipment or geology.
wit=The survey catalogue mistakes the name for an annotation. The planet's strange industrial report is harder to laugh away.
igrys=Igrys burns a different color from Vulcanus. The expedition learns that being close to the same star does not make two worlds interchangeable.
athos=The radio signal repeats after an exact interval. It is an ordinary geological rhythm, the scientists insist, while recording it again.
foliax=From orbit, Foliax looks like writing stretched across an entire continent. The living pattern refuses to hold still long enough to decipher.
rabbasca=Gleba's smaller companion refuses to be treated as an afterthought. Its geology seems to have learned something from the planet below.
velora=Velora's photographs show calm water. Its first atmospheric analysis is much less reassuring.
khemia=Khemia transmits columns of reactions instead of a simple landing report. Its scientists seem more interested in questions than exports.
ferrum=Ferrum appears industrial before anyone has arrived. The ore analysis hints at a history written by unrecorded machines.
obsidiax=Obsidiax reflects starlight in patterns that resemble the expedition's old coordinates. The resemblance is filed as an instrument fault.
nulla=Half the report fields are blank. The survey leader orders the empty measurements preserved rather than corrected.
balack=Balack's radiation signatures repeat with biological rhythms. The research team wonders whether shielding could itself be alive.
carna=Carna is dark in a way the camera cannot properly reproduce. The crew's returned measurements do not quite agree.
arcanyx=The same ore sample gives three different answers. On the fourth test the scientists stop blaming their equipment.
pelagos=The ocean hides a pattern of light that disappears whenever the cameras turn. The archivist keeps the blurry frames.
dea-dia=Dea Dia's shared sky suggests a conversation between worlds. Its radio signals seem to answer each other.
lemures=Lemures returns a response to a signal that has not yet been sent. The engineers refuse to sign the log.
prosephina=Prosephina's climate repeats on a schedule longer than any engineering contract. Its settlements must learn patience.
nexus=The navigation computer cannot describe Nexus in familiar coordinates. In the margin, someone writes that a destination need not be a place.
metallurgic=Vulcanus teaches the laboratory to read flaws in metal. Every future superstructure borrows the vocabulary.
electromagnetic=Fulgora's storms become repeatable equations. The science division calls predictability an act of courage.
agricultural=The first biological report is outdated before the courier arrives. The lab learns to race its own experiments.
cryogenic=Machines behave strangely when the world can freeze their working fluids. The scientists stop using old calibration tables.
lunar=On Muluna, experiments produce answers gravity would hide on Nauvis. The charts grow more crowded.
battlefield=The broken war machines teach industry as much as combat. The reconstruction team works in silence.
compression=The first compression experiment makes an ordinary metal seem unfamiliar. The engineer files it as a beginning.
polishing=Hyarion removes flaws that no eye can see. Precision becomes its own kind of strength.
bioengineering=The biologists stop correcting the engineers' vocabulary. Both teams now use the word assembly.
pathological=The first illness on a distant colony changes the meaning of a scientific report. Survival is now a logistical problem.
refraction=The spectrum resembles a pattern seen much farther away. The archivist marks the equations for later comparison.
electrochemical=Corrundum turns a chemical reaction into a power source. The researchers disagree on which field deserves credit.
insulation=The first data archive hears every power cable in the room. A quieter design begins to remember correctly.
thermodynamic=Heat and information share the problem of containment. The lab records that both leak through poor planning.
apicultural=A tiny biological system coordinates better than a room of controllers. Engineers begin keeping careful notes.
nuclear-science=The ruined machinery on Cerys is not silent. It is evidence of a civilization that knew a harder way to make power.
aerospace=A calculation works only after the lab is lifted away from the planet. The atmosphere had been hiding its error.
alien=The scientists cannot yet read Ribbonia's samples. They learn to manufacture them first.
biorecycling=Rubia considers the concept of discarded material an engineering failure. Its factories are designed accordingly.
biofusion=The reaction resembles an ecosystem more than an engine. The foundry team writes a new manual.
galvanization=Paracelsin's metal coating repairs a corroded relay. For a moment the old signal sounds clearer.
hydraulic=The ocean becomes a laboratory with an immeasurably heavy ceiling. Nothing here can be built carelessly.
bioluminescent=Organisms on Tenebris flash in repeated patterns. The crew doubts they are speaking, then records the sequence.
crucible-science=The instruments report a temperature with no comfortable reference. Old material rules fall away.
golden=A perfect measurement turns out to be the most expensive item in the laboratory. The engineers request another shipment.
gas-manipulation=Vesta's laboratories route atmospheric gases like belts and fluids. Its chemistry fills the ship manifests.
promethium=The promethium fragment is older than the expedition can comfortably imagine. Its crystalline faces reflect nothing familiar.
antimatter=An invisible sample weighs more on the scientists' nerves than any asteroid. Its containment manual has no jokes.
matter-card=The K2SO laboratory begins describing materials with new names. Its research looks like grammar as much as chemistry.
singularity-card=The final laboratory builds a container for something that resists ordinary boundaries. The safety office goes quiet.
military-science=The colony's defenders wanted to be explorers. They request a laboratory so they can protect everyone who still does.
gun-turrets=Lights at the edge of the factory draw attention. The first defensive line is an engineering compromise.
stone-walls=The first wall is built in a single afternoon. The second follows an incident nobody wishes to discuss.
military-2=The defense crew practices a withdrawal they hope never to make. They keep the route clear anyway.
military-3=Several colonies agree to share ammunition during an emergency. Logistics becomes diplomacy.
laser-turrets=A portable bolt of electricity looks elegant until the utility bill arrives. The soldiers still approve.
rocketry=A prototype rocket is tested behind reinforced glass. The observers request thicker glass for the next trial.
explosives=The chemicals department has discovered an extremely efficient way to end an argument. The safety team objects.
flamethrowers=An ordinary refinery network becomes a defensive weapon. Its designer refuses to call that innovative.
spidertron=A machine steps beyond the perimeter and keeps walking. The expedition files it under autonomous exploration.
energy-shield=The armor division builds a miniature starship hull around its operator. The medic requests easier access.
rocket-turret=One turret changes an entire convoy's defensive geometry. It also increases the ammunition bill.
matter-processing=The refinery products cease to resemble their inputs. The chemists rename the drawers, then discard the drawers.
matter-stabilization=The stable sample is smaller than the pencil used to record it. Its potential failure fills three pages.
singularity-core=All monitors point to one empty square. Nobody wants to be first through the laboratory door.
black-hole=The navigator marks an absence on the map. The scientists insist that nothing can still be a destination.
nexus-scan=Nexus appears simultaneously as a destination and a contradiction. The archive preserves both definitions.
omega-components=The parts lists begin resembling equations. The warehouse accepts the orders anyway.
warp-drive=One flight arrives before the navigator's estimate. The crew demands the calculation be repeated.
zero-point=Calidus is no longer the only possible source of stellar-scale energy. The Dyson team takes the news personally.
antimatter-production=The safety ledger lists a material whose containment matters more than its output. The entry is double-signed.
transceiver=The final machine resembles a transmitter only from a distance. Its operators listen more than they speak.
fragment-1=A cooled reactor emits a pulse shaped like Calidus's corona. The engineers are certain the waveform is accidental.
fragment-2=A Moshine data processor repeats a coordinate outside the known map. The signal lasts exactly one clock cycle.
fragment-3=A broken circuit reports a checksum that resembles a star map when its bytes are reordered. No one signs the report.
fragment-4=An assembler restores an old blueprint without receiving an instruction. The design carries a date from the future.
fragment-5=The reactor pulse sounds familiar after filtering. It matches a recording from another sun's orbit.
fragment-6=A quantum processor calculates a route for a ship that hasn't been built. The navigator archives the result unopened.
fragment-7=Debris samples form a spiral around an empty coordinate. Each sample comes from a different route.
fragment-8=A laboratory record contains a date after the expedition's projected completion. The clocks insist they are correct.
fragment-9=A logistic robot returns with an empty hold and a full error log. Its final diagnostic resembles speech.
fragment-10=The last fragment is not a coordinate. It is a question addressed to whoever rebuilt the network: What did you make together?
[journal-tip]
first-signal=Research automation; reliable factory capacity matters more than rushing the first rocket.
space-science=Space science and a reliable rocket pipeline come before large-scale system travel.
muluna=Explore Muluna's native research instead of skipping straight to dangerous stars.
solaris-gate=Solaris and Nyxaris can be opened independently. Build spare engines, fuel and asteroid defense.
nyxaris-gate=Choose either opening system first. Neither star should depend on the other's research.
vulcanus=Prepare foundries and K2SO metallurgy. Native Vulcanus research remains useful throughout the campaign.
castra=Bring defense and repair supplies. Castra's battlefield science supports later Solaris branches.
arig=Arig and Hyarion are parallel discoveries after Castra. Neither should require completing the other first.
hyarion=Research Hyarion's native polishing and inspect its original machines before exporting its products.
tellus=Tellus is downstream of the Arig and Hyarion branches. Expect biological research to be involved.
corrundum=Before Corrundum, complete Tellus and the relevant Nyxaris exports required by its real technology.
gleba=Spoilage, bioflux and agricultural research are the foundation. Avoid shipping unstable intermediates needlessly.
moshine=Build toward data processors and data storage. Some upgrades need science from later systems.
apia=Follow the original Apia/Carnova discovery. Razi keeps its native orbital setup intact.
vibrant-gate=Vibrant and Vespera remain parallel after the first-frontier campaign.
fulgora=Recycling and electromagnetics unlock industries that the outer systems will continue to need.
cerys=Recover native Cerys nuclear scrap and repair technology; the moon contributes to advanced Dyson engineering.
ribbonia=Plan a vessel for the original asteroid belt before making the crossing. The belt is a progression challenge.
asteroid-belt=Study asteroid distribution and stockpile ammunition. The original belt's science remains source-owned.
paracelsin=Paracelsin zinc and electrochemistry support cross-world industry, including stellar engineering.
vespera-gate=You may explore Vespera or Vibrant first. Both demand the completed first frontiers.
muria=Muria's native chemistry feeds later Aquilo and outer-frontier exchanges.
aquilo=Protect pipes and power, and develop native cryogenic science before expecting reliable outer-system logistics.
vespera-belt=Survey Vespera's native debris divide and use a ship built for the route's actual asteroid threats.
rubia=Rubia's native logistics, composites and science become inputs for later shared manufacturing.
maraxsis=Use source-owned underwater construction and hydraulic science; the sea is not another land factory.
seadragon=Project Seadragon is an existing Maraxsis technology; it unlocks the source's specialised rocket-part production.
beetlejuice-gate=Beetlejuice and Umbra are both late frontiers. Preserve their paired access and belt encounters.
cubium=Cubium science supports Secretas, advanced K2SO systems and specialized refining.
linox=Refine native Linox rare earths and integrate them with precision manufacturing.
secretas=Use Cubium research and native Secretas science before expanding to Frozeta.
frozeta=Frozeta is late Beetlejuice territory. Bring source-compatible machinery and a proven defensive ship.
umbra-gate=Umbra is a parallel outer entry alongside Beetlejuice, not its subordinate.
tenebris=Chitosan and native biological science support the far outer industrial network.
crucible=Follow Crucible's native orbital chain and research before attempting its late material exchanges.
umbra-belt=Do not attempt the fractured route with early Calidus defenses. Survey and prepare first.
vesta=Build native Vesta supermagnets and foundations; the final fleet will need extreme materials.
solar-orbit=The source Dyson mod owns solar plasma, locations and satellite launching; ordinary orbit access is not free power.
inner-orbit=Bring plasma-capable defenses and build the source's inner orbit machinery only when prepared.
dyson-build=The researched technology is only permission to build. Satellite totals are tracked by the source mod.
dyson-repeaters=Use the source's repeater satellites and power connectors. Research completion does not imply an active energy link.
dyson-mk2=Advanced receiver research follows Project Seadragon; the source still limits real transmitted power.
dyson-mk3=Final receiver engineering belongs to the outer frontier. Watch the source's actual energy allocation.
interplanetary-trade=Planet Express manages dispatch and schedules; Razi's Cargo Network can help you find unscheduled platforms.
precision-matrix=Precision matrices need native holmium, rare metals, optical cable and zinc. The source manufacturing chains remain untouched.
extreme-lattice=Extreme lattice production is an optional efficiency reward, never a gate for planetary science.
