[journal-chapter-story]
calidus=The star behind your first factory is not the limit of your world. Beneath the familiar sky lies a communications network no one remembers building.
solaris=Across the industrial frontier, metallurgy and ruined battlefields contain fragments of an earlier interstellar age.
nyxaris=Under a greener sun, biology begins to look uncomfortably like computation. The frontier is alive with useful contradictions.
vibrant=The next star glimmers through metallic dust. Buried machines, charged weather and an ancient frozen moon tell different parts of the same story.
vespera=Past the familiar heat of industry, the light turns pale and distant. Survival becomes a matter of careful logistics.
beetlejuice=Here industry begins to dismantle the distinction between materials and energy. Old rules become expensive suggestions.
umbra=Deep-space darkness has weight. Nothing here is truly empty, and the routes demand machines built to survive it.
stellar=You left home to seek energy among the stars. Now everything you learned must return to the star where it began.
network=An empire of disconnected outposts is only a collection of lonely factories. A galaxy is built from shipments.
finale=The last experiment is not another mining operation. It is a question aimed into the space between galaxies.

foundations=The archivist opens a battered factory ledger. Across its pages, copper wires become launch rails and the first impossible coordinates appear in the margins.
fleet=A shipwright's log of engines, asteroids, cargo manifests and the small unglamorous decisions that prevent an expedition from becoming debris.
outposts=The celebrated planets claim the headlines. The quiet moons and neglected worlds hold the evidence the main expedition never thought to request.
sciences=Every science pack is a different discipline learning to speak with another star. The research web is a story of cooperation, not a checklist of colored bottles.
defense=Defense records are written by crews who wanted to be explorers. They know that a factory cannot function if its supply ships cannot return.
deepworks=At the outer edge, the distinction between electricity, matter and information becomes increasingly expensive to defend. The laboratory keeps its doors closed.
echoes=The first fragments look like accidents. The final ones form a question. No one is sure whether it comes from the distant galaxy or the expedition's own future.
alliances=The first expedition discovered worlds. The second discovers that no world can finish every factory alone. Native technologies and optional trade recipes turn distant discoveries into a working industrial constellation.

