[journal-record-body]
corp-welcome=Welcome back, Engineer. Your assigned production targets remain outstanding. The regional communications office is not responding, so this terminal will record completion locally. There is no need to delay construction while we wait for confirmation. The signature field still lists a supervisor, though the personnel directory no longer recognizes the name.
corp-castra=Recovered equipment is to be counted as company property until its provenance can be established. Serial markings on several repaired machines match entries in a logistics manifest that predates the colony. Compliance has requested the original paperwork. No one has found an address to send it to.
corp-moshine=An unattended analysis service has started mapping production decisions against a seven-node schedule. It labels deviations as inefficiencies, including the time spent investigating the schedule itself. The engineers have asked who authorized the service. Its response contains a ticket number and a precise estimate of the time saved by not asking again.
corp-network=The precision matrix joined supply records from worlds that had never shared a manifest. The dashboard reports an improvement in network resilience. It also reports performance reviews for departments whose staff roster is empty. The calculation may be wrong. The routes it recommends, however, work.
corp-outer=The oversight channel has been unavailable for a considerable period. This does not relieve Operations of its responsibility to maintain safe factories, functioning supply lines and an auditable record. An old directive mentions a project called the Protocol. The document is intact except for the sentence that explains its purpose.
corp-mandate=Authorization requested: Convergence Commission. The reply was signed by an office with no surviving location, a title with no named holder, and a timestamp that does not fit the current calendar. The system has accepted the research approval. The engineering work, deliveries and activation remain the expedition's responsibility. The archive is not yet an answer.

[razi-industries-brief]
castra=SALVAGE AND DEFENSE / Reuse battlefield industry and strengthen supply security. Check native technologies before choosing what to export.
moshine=DATA AND OPTICS / Establish native computation and optical supply chains. Later industries benefit from reliable components.
gleba=BIOLOGICAL PRODUCTION / Keep spoilable processing local when practical, with short reliable routes for time-sensitive shipments.
fulgora=ELECTRICAL RECOVERY / Turn salvage and electromagnetic manufacturing into exportable parts for the industrial network.
paracelsin=CHEMICAL SPECIALIZATION / Keep source electrochemical machinery relevant in cross-world manufacturing.
aquilo=CRYOGENIC LOGISTICS / Build dependable cold-world production and a laboratory supply chain before relying on distant imports.
rubia=ADVANCED MATERIALS / Develop source biological manufacturing as a distinct industrial specialty, not another ore stop.
panglia=REACTIVE MATERIALS / Study Panglite and bio-optical processing. Optional exchanges must never bypass native science.
athos=PARTICULATE ENGINEERING / Develop source crushing and fine-material research. Research authorization is not delivered cargo.
nulla=AUTONOMOUS SALVAGE / Recover native robotics from abandoned machinery while respecting the original planetary hazards.
tenebris=LOW-LIGHT BIOLOGY / Use local biological resources without erasing the world's environmental restrictions.
vesta=MAGNETIC MATERIALS / Establish the planet's native material specialty before attempting network-scale exchanges.
