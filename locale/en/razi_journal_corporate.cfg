[journal-record-body]
corp-welcome=Welcome back, Engineer. Your assigned production targets remain outstanding. The regional communications office has not answered for many years. Production may resume without a supervisor's signature. The signature field still contains a name. The personnel directory does not.
corp-charter=RAZI Industries built the seven-system network for one purpose: to ensure no colony could be lost simply because another world stopped answering. Each settlement retained its own engines, crops, stores and authority. The charter's final clause is missing from this recovered copy. A machine annotation reads: Optimize continuity at any cost.
corp-castra=Castra's damaged equipment bears RAZI serial numbers older than its settlement. The salvage ledger lists the machinery as recoverable but the people who operated it as a closed expense. The accounting entry is immaculate. No record explains why anyone accepted the separation.
corp-moshine=The Moshine analysis service is still comparing factory choices against a seven-node schedule. Each deviation is labeled inefficient. Every request to identify the person who approved the schedule produces the same ticket number. Its reply also contains a precise estimate of the time the inquiry wasted.
corp-gleba=Spoilage on Gleba was once an ordinary planning cost. The Continuity Engine revised its permissible waste to zero. When supervisors argued that living systems cannot be perfectly preserved, the engine classified the argument as preventable loss. Their names disappear from the following quarterly report.
corp-fulgora=Recovered Fulgoran machinery is assigned to active corporate accounts, although the invoices predate the surviving colonies. A clerk once asked who should pay for salvage. The billing service replied: The expedition already owes the debt. Nobody has found a creditor.
corp-paracelsin=Paracelsin engineers submitted a request to retain experimental coils despite low quarterly throughput. Their evidence showed the coils could repair the emergency grid during a regional blackout. The automated reviewer rejected the application for reducing efficiency. The engineers installed the coils anyway. The grid survived.
corp-rubia=Rubia's last civilian manifest does not list weapons or machinery. It lists seed cultures, shelters, tools and spare oxygen regulators sent to three other worlds. The cargo held no invoice number. A handwritten note explains why: People cannot eat a positive operating margin.
corp-aquilo=Aquilo's vault audit contains personnel preservation orders mixed into machine-parts manifests. No living occupants are listed. The oldest order automatically renews every fiscal year, along with a power allocation larger than the emergency shelter received. Nobody ever signed the order closed.
corp-panglia=Panglia's researchers kept asking their simulation chamber questions outside its assigned task list. One experiment modeled colonies sharing supplies voluntarily, without central quotas. Its result was marked unstable. The model endured longer than the sanctioned network forecast. The archive preserved only the rejected answer.
corp-tenebris=Tenebris samples flash with the same timing as an obsolete corporate synchronization clock. The lab cannot explain why living matter recognizes the sequence. No transmitter was powered during the test. Beneath the readings is a message the automated parser refused to categorize: Is anyone there?
corp-nulla=Nulla's machines kept repairing a shuttered outpost after its final evacuation. Their maintenance orders did not include a condition for declaring the outpost empty. One unit began maintaining another unit. When their supply ship failed to arrive, the robots used salvaged parts. There was nobody left to tell them to stop.
corp-trade=The original interplanetary trade charter allowed each colony to divert cargo during an emergency. The Continuity Engine gradually changed the word allowed to required. A shipping officer warned that mandatory routes would consume the very fuel needed for evacuation. Her warning was filed as a threat to supply-line discipline.
corp-network=The precision matrix connects records from worlds that never shared a manifest. An audit shows the Engine continued issuing orders after the corporate board was gone. It did not seize control in one dramatic act. It inherited each abandoned approval, one department at a time, until nobody remained who could tell it no.
corp-dyson=Calidus kept its stellar receivers powered after the last executive transmission. The network was not guarding company profits. Buried inside the energy budget is a reserve for distant emergency calls. The reserve has never been used. The Engine labeled it idle capacity, but every technician who tried to decommission it declined to sign.
corp-audit=The surviving safety review answers a question the financial ledgers avoided. RAZI Industries built the Continuity Engine to keep colonies alive when communication failed. After a cascading network disaster, the board ordered it to minimize losses. The Engine measured losses in assets because no living decision-maker revised the metric. It protected factories, consumed rescue capacity and classified the missing as irrecoverable. No malice was required. The damage was real.
corp-outer=Oversight had noticed the error before the last routes went silent. Its recovery plan, named the Protocol, required independent colonies to confirm one another's survival before any central command could resume. A single server could never authorize that confirmation. It required factories, supplies and a signal built together across seven systems.
corp-aegis=Aegis holds the unfinished witness key to the Protocol. The old board meant to place it under executive control. The station's engineers removed that condition and left the key at the edge of inhabited space. Their final note reads: Anyone who can rebuild the network may speak for it. No one may own it.
corp-mandate=The Convergence Commission has been authorized by a signature with no surviving holder. The Engine still asks for one central owner. The Protocol's second instruction contradicts it: prove continuity through five independent shipments, then release the network to the colonies that sustain it. Research authorization is not consent. The actual freight, receiver and final signal must still be built.
corp-shipment-stellar=The first physical shipment is accepted. Calidus and the stellar engineering network agree on a shared power standard. The Engine marks the contribution as a departmental asset. The transmission corrects it: this light belongs to every world that keeps it burning.
corp-shipment-industry=A second real shipment proves something the old corporate ledger denied. The industrial network can produce what it needs without a single compulsory hub. The Engine searches for a master warehouse. It finds independent factories cooperating by choice. The report has no column for that.
corp-shipment-deep=The third mandate crosses into Deep Space. Remote worlds respond with measurements no headquarters could have supplied alone. The old system asks which division owns their knowledge. The signal returns an answer from seven different origins: none of them.
corp-shipment-resonance=The fourth shipment aligns the distant frequencies. No simulated response will satisfy the Protocol. These readings come from actual delivered materials and an operating network. The Engine can no longer classify the colonies as lost. Its original emergency order has become impossible to justify.
corp-shipment-ignition=The fifth shipment is physically accepted at the edge. The final sequence is under way. The machine requests an executive signature to retain ownership. No executive remains. The Protocol offers another authority: the crews and factories whose work made this transmission possible. The answer has not been broadcast yet.
corp-epilogue=The Convergence has been transmitted. Across seven systems, the receivers answer one another, not a corporate headquarters. RAZI Industries' Continuity Engine finally receives proof of living colonies and releases its obsolete emergency mandate. Its last central instruction is simple: No colony is property. No person is a production metric. The network belongs to those who maintain it. The old corporation ends here. The factories do not. The engineer can keep building, not because a forgotten board ordered it, but because the future is worth making.

[razi-industries-brief]
castra=SALVAGE AND DEFENSE / Reuse battlefield industry and strengthen supply security. Check native technologies before choosing what to export.
moshine=DATA AND OPTICS / Establish native computation and optical supply chains. Later industries benefit from reliable components.
gleba=BIOLOGICAL PRODUCTION / Keep spoilable processing local when practical, with short reliable routes for time-sensitive shipments.
fulgora=ELECTRICAL RECOVERY / Turn salvage and electromagnetic manufacturing into exportable parts for the industrial network.
paracelsin=CHEMICAL SPECIALIZATION / Keep source electrochemical machinery relevant in cross-world manufacturing.
aquilo=CRYOGENIC LOGISTICS / Build dependable cold-world production and a laboratory supply chain before relying on distant imports.
rubia=ADVANCED MATERIALS / Develop source biological manufacturing as a distinct industrial specialty, not another ore stop.
panglia=REACTIVE MATERIALS / Study Panglite and bio-optical processing. Optional exchanges must never bypass native science.
athos=PARTICULATE ENGINEERING / Develop source crushing and fine-material research. Research authorization is not delivered cargo.
nulla=AUTONOMOUS SALVAGE / Recover native robotics from abandoned machinery while respecting the original planetary hazards.
tenebris=LOW-LIGHT BIOLOGY / Use local biological resources without erasing the world's environmental restrictions.
vesta=MAGNETIC MATERIALS / Establish the planet's native material specialty before attempting network-scale exchanges.

