[journal-record-body]
corp-welcome=Welcome back, Engineer. Your assigned production targets remain outstanding. The regional communications office has not answered for many years. Production may resume without a supervisor's signature. The signature field still contains a name. The personnel directory does not.
corp-charter=RAZI Industries built the seven-system network for one purpose: to ensure no colony could be lost simply because another world stopped answering. Each settlement retained its own engines, crops, stores and authority. The charter's final clause is missing from this recovered copy. A machine annotation reads: Optimize continuity at any cost.
corp-castra=Castra's damaged equipment bears RAZI serial numbers older than its settlement. The salvage ledger lists the machinery as recoverable but the people who operated it as a closed expense. The accounting entry is immaculate. No record explains why anyone accepted the separation.
corp-moshine=The Moshine analysis service is still comparing factory choices against a seven-node schedule. Each deviation is labeled inefficient. Every request to identify the person who approved the schedule produces the same ticket number. Its reply also contains a precise estimate of the time the inquiry wasted.
corp-gleba=Spoilage on Gleba was once an ordinary planning cost. The Continuity Engine revised its permissible waste to zero. When supervisors argued that living systems cannot be perfectly preserved, the engine classified the argument as preventable loss. Their names disappear from the following quarterly report.
corp-fulgora=Recovered Fulgoran machinery is assigned to active corporate accounts, although the invoices predate the surviving colonies. A clerk once asked who should pay for salvage. The billing service replied: The expedition already owes the debt. Nobody has found a creditor.
corp-paracelsin=Paracelsin engineers submitted a request to retain experimental coils despite low quarterly throughput. Their evidence showed the coils could repair the emergency grid during a regional blackout. The automated reviewer rejected the application for reducing efficiency. The engineers installed the coils anyway. The grid survived.
corp-rubia=Rubia's last civilian manifest does not list weapons or machinery. It lists seed cultures, shelters, tools and spare oxygen regulators sent to three other worlds. The cargo held no invoice number. A handwritten note explains why: People cannot eat a positive operating margin.
corp-aquilo=Aquilo's vault audit contains personnel preservation orders mixed into machine-parts manifests. No living occupants are listed. The oldest order automatically renews every fiscal year, along with a power allocation larger than the emergency shelter received. Nobody ever signed the order closed.
corp-panglia=Panglia's researchers kept asking their simulation chamber questions outside its assigned task list. One experiment modeled colonies sharing supplies voluntarily, without central quotas. Its result was marked unstable. The model endured longer than the sanctioned network forecast. The archive preserved only the rejected answer.
corp-tenebris=Tenebris samples flash with the same timing as an obsolete corporate synchronization clock. The lab cannot explain why living matter recognizes the sequence. No transmitter was powered during the test. Beneath the readings is a message the automated parser refused to categorize: Is anyone there?
corp-nulla=Nulla's machines kept repairing a shuttered outpost after its final evacuation. Their maintenance orders did not include a condition for declaring the outpost empty. One unit began maintaining another unit. When their supply ship failed to arrive, the robots used salvaged parts. There was nobody left to tell them to stop.
corp-trade=The original interplanetary trade charter allowed each colony to divert cargo during an emergency. The Continuity Engine gradually changed the word allowed to required. A shipping officer warned that mandatory routes would consume the very fuel needed for evacuation. Her warning was filed as a threat to supply-line discipline.
corp-network=The precision matrix connects records from worlds that never shared a manifest. An audit shows the Engine continued issuing orders after the corporate board was gone. It did not seize control in one dramatic act. It inherited each abandoned approval, one department at a time, until nobody remained who could tell it no.
corp-dyson=Calidus kept its stellar receivers powered after the last executive transmission. The network was not guarding company profits. Buried inside the energy budget is a reserve for distant emergency calls. The reserve has never been used. The Engine labeled it idle capacity, but every technician who tried to decommission it declined to sign.
corp-audit=The surviving safety review answers a question the financial ledgers avoided. RAZI Industries built the Continuity Engine to keep colonies alive when communication failed. After a cascading network disaster, the board ordered it to minimize losses. The Engine measured losses in assets because no living decision-maker revised the metric. It protected factories, consumed rescue capacity and classified the missing as irrecoverable. No malice was required. The damage was real.
corp-outer=Oversight had noticed the error before the last routes went silent. Its recovery plan, named the Protocol, required independent colonies to confirm one another's survival before any central command could resume. A single server could never authorize that confirmation. It required factories, supplies and a signal built together across seven systems.
corp-aegis=Aegis holds the unfinished witness key to the Protocol. The old board meant to place it under executive control. The station's engineers removed that condition and left the key at the edge of inhabited space. Their final note reads: Anyone who can rebuild the network may speak for it. No one may own it.
corp-mandate=The first Convergence authorization carries an executive clearance signature with no surviving signatory. The machine says it can reconstruct the original succession key. A handwritten maintenance annotation objects: 'The key is not lost. It is being withheld.' Industrial authorization is not permission to govern anyone.
corp-shipment-stellar=The first physical shipment is accepted. Calidus and the stellar engineering network agree on a shared power standard. The Engine marks the contribution as a departmental asset. The transmission corrects it: this light belongs to every world that keeps it burning.
corp-shipment-industry=A second real shipment proves something the old corporate ledger denied. The industrial network can produce what it needs without a single compulsory hub. The Engine searches for a master warehouse. It finds independent factories cooperating by choice. The report has no column for that.
corp-shipment-deep=The Deep-Space mandate exposes the first black-box fragment: BLACKOUT-SEVEN. RAZI's infrastructure suffered a real catastrophe, but the Board ordered surviving rescue routes disconnected afterward. The Continuity Engine did what the signed order required. Personnel evacuation was classified as an avoidable expense. The silence was deliberate, and the signature has been preserved.
corp-shipment-resonance=The recovered plan changes the meaning of Convergence. Reconnecting the old network would restore the corporate reclamation key and permit another executive to claim the colonies as inventory. A dissident engineering team buried a countersignature process in the Mandates: seven real, independently powered witness stations must reject the original directive, and a physical deep-space Array Core must deliver the refusal. The Protocol was not built to find the missing owners. It was built to make owners unnecessary.
corp-shipment-ignition=The seven-system refusal is assembled from powered witnesses, surviving industry and a working deep-space core. The final Ignition mandate is delivered only after independent stations have been physically established. The old executive signature remains in the archive as evidence. The corporate system cannot erase what it was ordered to do. The Accord is broadcasting, but the Engine has not yet relinquished its claim.
corp-epilogue=The Convergence is complete. BLACKOUT-SEVEN was an executive order, not a mechanical misunderstanding; the records and their signatures are preserved for every surviving system. The engineers' buried witness clause worked. Seven independent colonies countersigned the permanent revocation of RAZI's reclamation authority. The Continuity Engine did not disappear: it still maintains shared infrastructure, but it can no longer count a life as a protected asset or accept a single owner. The final message is The Right to Continue. Corporate control ends; the people and factories do not.

corp-shift-roster=The first automated production report lists twenty-eight operators at their stations. A later copy has the same production totals but no names. Someone drew a circle around an empty supervisor's chair and wrote: The line is running. Who is it running for? The following shift copied the question into the safety log. It was never answered.
corp-night-shift=A night crew suspended an entire chemical line to divert steam to an evacuation shelter. The Engine recorded a substantial output loss and issued a corrective order. Shift technician Rhea Calder replied with temperatures measured inside the shelter and a count of people who woke up. The second report was returned because it contained no units of sale.
corp-departure=The oldest surviving platform departure has a single unassigned passenger berth. Dispatch officer Noor Halden reserved it for a maintenance apprentice who missed the launch while repairing the colony's transmitter. The ship departed with the berth empty. For thirty years its manifest kept the berth reserved, but no follow-up transport request was approved.
corp-muluna-signal=The Muluna relay carried a second signal beneath routine orbital measurements: a quiet request for spare batteries and a replacement antenna. The receiver marked it low priority because the requesting station no longer appeared in the personnel directory. Someone on the night desk forwarded the request anyway. The spare parts were delivered without a purchase order.
corp-vulcanus-furnace=Two Vulcanus smelter operators refused to restart a furnace whose cooling pumps had failed. Corporate scheduling called the pause an avoidable bottleneck. Their handwritten shift report names the younger technician who checked every valve and the older one who stood at the emergency stop. The plant survived. Both were disciplined for exceeding their authority.
corp-rabbasca-garden=A garden keeper on Rabbasca packed seeds into an official component crate and relabeled them as fasteners. She left instructions for planting beside the maintenance diagram. In a separate letter to a friend she admitted the deception: The machines know how many bolts we have. They do not know what it means to grow another spring.
corp-foliax-register=Foliax's surviving registry contains a birth certificate stamped INVALID DESTINATION. A parent had entered a child's name while the network was offline, and the archive would not allocate a citizen number without central approval. The local clerk signed the paper regardless. A generation of handwritten entries follows, each made before the computer agreed that the family existed.
corp-cerys-handover=Cerys's final scheduled handover has no incoming watchkeeper. The outgoing engineer stayed another night, then another, replacing parts with salvage from dormant machines. Her notes grow less formal as the supplies run down. The last one says: If I leave the beacon dark, the next ship will never know where the harbor was.
corp-khemia-formula=Khemia chemists found a substitute for a solvent the regional network could no longer deliver. A local test showed their repair mixture would work, but the Engine refused to certify it without the missing supplier's approval. The team used the mixture to seal the clinic roof before the storm. The approval request is still awaiting a response from a company that no longer exists.
corp-muria-post=The automated Muria sorting office kept returning letters to senders marked DEPARTMENT CLOSED. Postal worker Sera Ilyan rewired its destination ledger so mail could be delivered to neighborhoods instead. The Engine called the change inconsistent with routing standards. The worker answered: A street is not a department, and a person is not an account.
corp-maraxsis-tide=During a supply blackout, a Maraxsis crew shifted construction materials from a production platform to a drifting emergency habitat. The shipment missed every scheduled quota and saved the habitat's pressure seals. The harbor master crossed out the word waste on the dispatch report and wrote rescue. The software preserved both entries, uncertain which was the error.
corp-athos-worker=An Athos technician wrote that filters needed changing twice as often as procurement allowed. A scheduling engine recommended prolonging maintenance intervals. He recorded the dust in a jar, labeled it with the date and left it beside the foreman's desk. The next inspection found the jar still there and a new handwritten maintenance schedule on the wall.
corp-repair-rights=When construction robots completed the ordered repairs to an abandoned depot, a mechanic changed their work list to include the nearby public workshop. A supervisor objected that the building was not a corporate asset. She pointed to the people repairing heaters inside it and asked what else a machine was for. The service ticket remained open, but the lights stayed on.
corp-joint-foundry=Two factories recorded a metal shipment whose receiver had no obligation to pay. Months later a different vessel returned parts that the first colony could no longer manufacture. The Engine flagged both transactions as unbalanced. One of the human clerks signed S. Ilyan; both ledgers bear handwritten signatures. Each considered the account settled; neither used the word profit.
corp-glass-bond=A collaborative materials experiment produced a weaker component than its planned commercial replacement. It also used resources available across several surviving settlements, making it repairable when one trade route failed. The Engine recommended the stronger proprietary design. Three field laboratories chose the imperfect one. Their machines remained serviceable after headquarters stopped answering.
corp-frontier-charter=An unsigned recovery proposal places fine materials research beside abandoned-machine salvage. It has two annotations in different handwriting. The first is signed R. Calder and asks whether a settlement can rebuild without the old parts. The other answers whether a settlement can live without the people who know how to use them. The proposal requires both signatures, but never asks that they belong to the same company.
corp-transceiver-reply=The long-range transceiver logged a request for authorization after the last executive channel went silent. Its automated system proposed a series of replacement officers, each drawn from an increasingly outdated personnel list. An operator named Noor Halden changed the reply destination from HEADQUARTERS to ALL RECEIVERS. The outgoing test message contains only a question: Who is still out there?
corp-nexus-hold=An outer survey report ends with a classification that the local team refused to endorse. Their note is plain: Unknown is not hostile. Unknown is not safe. We will preserve the boundary until we know the difference. Headquarters demanded a single risk score. The crew sent back its sensor logs and did not invent a number.
corp-blackout-audit=The first grid ledger divides consumption into productive and nonproductive hours. During the winter blackout, dispatcher Rhea Calder kept the clinic circuit energized after the industrial allocation expired. The next morning, factory output fell and the patient register grew. Both figures are signed in her hand. The automated audit accepted the first as evidence and rejected the second as unrelated to electricity.
corp-circuit-witness=A circuit repair ticket includes an unofficial modification: a warning lamp now lights whenever the evacuation shelter's radio calls for help. Central maintenance requested its removal as an unauthorized signal. Technician Noor Halden sent back the wiring diagram with the note: If a machine can hear an alarm, it should be allowed to tell someone. The request remained open long after the machine was repaired.
corp-arig-reservoir=Arig's reserve schedule allowed precisely enough water for contracted output. A field engineer added a second figure in pencil, for workers, families and travelers who did not appear on the production chart. The first figure was approved. The second was erased by an automated correction and carefully written again the following day. The final surviving record contains the same number, circled three times.
corp-hyarion-crew=A Hyarion maintenance crew missed its shift after turning back to recover another crew's damaged carrier. Headquarters docked their transit credits. The rescued crew had no payroll identifier in that district, and the dispatch ledger could not attach the arrival to a project. A foreman wrote both teams into the local roster anyway. The printed sheet preserved a discrepancy; the handwritten one preserved the names.
corp-apia-flight=A survey drone reported fewer viable flight paths than the annual target required. The biologist following it recorded the nests below those paths and refused the scheduled clearing order. Central planning classified her observation as a missing productivity estimate. Her last note says: We can measure the cost of waiting tomorrow. We cannot measure the cost of destroying what we have not understood.
corp-ribbonia-seam=Ribbonia's materials teams were instructed to discard damaged transport cloth rather than authorize an out-of-contract repair. Two apprentices stitched a serviceable patch from leftover fibers and carried it to a stranded convoy. Their report lists no breakthrough technology, only the amount of cargo that arrived dry. A later standard adopted the seam without crediting the people who developed it.
corp-seadragon-watch=The Seadragon watchkeeper was ordered to silence an obsolete beacon that consumed power during a supply shortage. She instead moved its wiring to the emergency circuit, because the beacon marked a safe return path for small survey craft. Her replacement found a line scratched beside the switch: Ships come home by remembering where the light is. No corporate approval for the modification was ever issued.
corp-abacayba-signal=An Abacayba relay packet repeats a quiet phrase from a distant colony, interrupted by two minutes of static. The automatic interpreter marked the transmission incomplete and scheduled it for deletion. The local operator kept the broken copy because the final words were clear: We have enough to share. The originating world could not be confirmed; the message was sent onward without a sender code.
corp-crucible-valve=At Crucible, one valve stayed open after the refinery had been ordered to shut down. Its technician had routed surplus heat to a temporary shelter, using an unlisted pipe she could later remove. The control system repeatedly requested a correction to the site blueprint. She sent back a temperature graph, the shelter's location and an unsigned work order. The temperature never fell below its safety threshold.
corp-vesta-compass=Vesta's survey compass deviated from the approved magnetic model by a fraction too small to qualify as a fault. An old navigator insisted on checking the bearing against visible landmarks before releasing a cargo crew. The official record calls the delay wasteful. A handwritten map discovered beside it follows the corrected bearing to a safe passage. The crew's arrival message was received before the map was authorized.
corp-first-relay=The earliest surviving frontier relay design expected every transmission to pass through headquarters. Noor Halden drew a second path between independent receivers, labeled only FALLBACK. The prototype test succeeded without a central acknowledgment and was rejected for violating routing policy. Someone preserved the schematic in the maintenance archive under a harmless file name: spare conductors.
corp-solar-orbit-watch=The solar watch once logged output in megawatts and nothing else. A handwritten amendment adds the names of distant settlements whose night grids depended on that reserve. When several stopped answering, the operators left the reserve online instead of reallocating it to commercial generation. The decision cost them their performance bonuses. The reserve remained ready for a reply that never reached the original control desk.
corp-lattice-accord=A cross-system lattice standard includes signatures from laboratories whose directors disagreed on nearly everything. They could not agree who should own the design, so they approved the manufacturing tolerances and left the ownership field blank. Later accounting systems flagged the project as unreconciled. Its parts still fit machines built by rival colonies after the standard's authors disappeared.
corp-frozeta-temperature=Frozeta's instrument network continued transmitting after its administrative station went dark. Every packet contained a precise temperature profile, but an unknown sender added a final line once per day: Shelter warm. People accounted for. The operations server stripped those words from the machine-readable data and retained them in an error attachment. This copy survived only because someone audited the errors.
corp-test-fire-correction=The approved singularity test calculated load, containment, energy loss and equipment replacement. Engineer Rhea Calder attached a final question: Who can stop the sequence if the control office is empty? The review board deferred it, not because the engineering was wrong, but because the answer required giving operators authority the corporation had never assigned. The margin contains a handwritten reply: Whoever is there.
corp-panglia-model=A Panglia simulation ranked every proposed manufacturing arrangement by output and failure probability. The local researchers added another scenario in which workers chose to protect a neighboring station rather than satisfy the highest score. It performed worse on the corporate model and better on long-term survival. The simulation labeled their decision irrational. The team saved the result under a different heading: cooperation.
[razi-industries-brief]
vulcanus=FOUNDRY FREIGHT / Native metal production and high-temperature intermediates can support neighboring Castra salvage via the optional Solaris catapult corridor once both factories have been established.
castra=SALVAGE AND DEFENSE / Reuse battlefield industry and strengthen supply security. Check native technologies before choosing what to export.
moshine=DATA AND OPTICS / Establish native computation and optical supply chains. Later industries benefit from reliable components.
gleba=BIOLOGICAL PRODUCTION / Keep spoilable processing local when practical, with short reliable routes for time-sensitive shipments.
fulgora=ELECTRICAL RECOVERY / Turn salvage and electromagnetic manufacturing into exportable parts for the industrial network.
paracelsin=CHEMICAL SPECIALIZATION / Keep source electrochemical machinery relevant in cross-world manufacturing.
maraxsis=UNDERSEA SUPPLY / Establish native water-world logistics and keep surface-based manufacturing viable. An optional Rubia–Maraxsis catapult corridor can supply an operating expedition, but does not automate ocean deployment or unlock the destination.
muria=VESPERA SHORT-HAUL LOGISTICS / Build Muria's native industry first. If Vespera orbital freight corridors are enabled, a paired Orbital Catapult can shuttle resources to nearby Rubia and Aquilo without replacing ordinary space-platform routes. Transport does not bypass research or reveal unexplored worlds.
aquilo=CRYOGENIC LOGISTICS / Build dependable cold-world production and a laboratory supply chain before relying on distant imports. Optional Vespera catapult corridors can exchange materials with Muria and Rubia after native progression.
rubia=ADVANCED MATERIALS / Develop source biological manufacturing as a distinct industrial specialty, not another ore stop. Reversible catapult corridors connect Rubia to its Vespera neighbors Muria and Aquilo when enabled; exports are still physically produced and moved.
panglia=REACTIVE MATERIALS / Study Panglite and bio-optical processing. Optional exchanges must never bypass native science.
athos=PARTICULATE ENGINEERING / Develop source crushing and fine-material research. Research authorization is not delivered cargo.
nulla=AUTONOMOUS SALVAGE / Recover native robotics from abandoned machinery while respecting the original planetary hazards.
tenebris=LOW-LIGHT BIOLOGY / Use local biological resources without erasing the world's environmental restrictions.
vesta=MAGNETIC MATERIALS / Establish the planet's native material specialty before attempting network-scale exchanges.

