[recipe-description]
razi-deep-vulcanus-zinc-metals=Import Paracelsin zinc to Vulcanus to improve K2SO rare metal yield without bypassing native foundry research. Native recipe, research, specialist machinery and byproducts are preserved; no productivity/recycling bonus.
razi-deep-fulgora-optical-components=Use Moshine optics in Fulgora's magnetic industrial environment to improve K2SO electronics. Native recipe, research, specialist machinery and byproducts are preserved; no productivity/recycling bonus.
razi-deep-aquilo-optical-controllers=Combine Moshine optics, Fulgoran holmium and Aquilo coolant for a late control-unit manufacturing alternative. Native recipe, research, specialist machinery and byproducts are preserved; no productivity/recycling bonus.
razi-deep-moshine-holmium-silicon=Ship Fulgoran holmium to Moshine to enhance silicon-cell batches while preserving native production. Native recipe, research, specialist machinery and byproducts are preserved; no productivity/recycling bonus.
razi-deep-rubia-rare-earth-logistics=Combine Linox rare-earth powder with Rubia's native stack-inserter machinery. Native recipe, research, specialist machinery and byproducts are preserved; no productivity/recycling bonus.
razi-deep-tenebris-zinc-optics=Use Paracelsin rivets and Moshine optical cable in Tenebris chitin chemistry. Native recipe, research, specialist machinery and byproducts are preserved; no productivity/recycling bonus.
razi-deep-vesta-precious-supermagnets=Import Secretas and Cubium gold plates into Vesta's native supermagnet manufacture. Native recipe, research, specialist machinery and byproducts are preserved; no productivity/recycling bonus.
razi-deep-linox-craptonite-refining=Ship Rubia craptonite frames to Linox's original rare-earth processing. Native recipe, research, specialist machinery and byproducts are preserved; no productivity/recycling bonus.
razi-deep-ferrum-galvanic-magnets=Use Paracelsin zinc alongside Ferrum's original rare-earth magnet industry. Native recipe, research, specialist machinery and byproducts are preserved; no productivity/recycling bonus.
razi-bio-rare-metal-casting=Introduce Gleba bioflux into Vulcanus foundry casting. Four native rare-metal batches produce five plates, with the same molten-metal inputs and dirty-water byproducts. Bonus recipe has no productivity or automatic recycling.
razi-electrobiological-components=Combine Fulgora's holmium with imported Gleba bioflux, native silicon, glass, and plastic. Requires Fulgora's electromagnetic environment. No productivity or automatic recycling.
razi-cryo-energy-control=Ship Fulgoran supercapacitors and Gleban carbon fiber to Aquilo for cryogenic power-core assembly. Expands K2SO's native energy-control recipe without skipping its research. No productivity or automatic recycling.
razi-gleba-tenebris-biopolymer=Blend Gleba bioflux with Tenebris chitin to make ten plastic bars from two native biopolymer batches. Tenebris's original pressure restrictions and chitin economy remain mandatory.
razi-linox-rare-earth-exchange=Use imported K2SO rare metals and Fulgoran holmium to improve Linox rare-earth processing. The original sulfuric acid and stone requirements still apply.
razi-cubium-precious-metal-alloying=Refine imported Secretas gold ore on Cubium with K2SO rare metals and Fulgoran holmium. Each four native batches yields five gold plates.
razi-vesta-frontier-foundations=Combine Vesta's own gases and ceramics with Tenebris crystals, K2SO rare metals, and Fulgoran holmium. Build fifteen foundations instead of the native ten.
razi-modded-rubia-craptonite-composites=Combine Paracelsin zinc and Moshine optical cable with Rubia's original frothing and craptonite casting chain. Four frames from three native batches; returned concrete is preserved. No productivity stacking.
razi-modded-paracelsin-optical-coils=Import Moshine optical cable to reinforce Paracelsin's native nitric-acid coil manufacturing. Five coils from four native batches, made in the original mechanical machinery.
razi-modded-moshine-zinc-silicon=Use Paracelsin zinc solder to stabilize Moshine silicon cells. Five cells from four original batches while retaining the native silicon production chain.
razi-modded-linox-precision-refining=Optical components from Moshine and zinc plates from Paracelsin raise Linox rare-earth refining from four powder to five, retaining stone, acid and original surface restrictions.
razi-modded-vesta-rare-earth-supermagnets=Moshine optical cable and Linox rare-earth powder reinforce Vesta supermagnets. Four from three native batches with all original electrolyte and local atmosphere requirements.
razi-modded-tenebris-galvanized-chitosan=Paracelsin zinc rivets supplement Tenebris chitin and sulfuric-acid processing. Ten chitosan from two native batches, only in Tenebris's original pressure environment.
razi-modded-rubia-precision-inserters=Moshine optics and Paracelsin coils improve Rubia long stack inserter manufacture. Four inserters from three base batches, without eliminating Rubia's own special components.
razi-ferrum-linox-optical-magnets=Bring Linox rare-earth powder and Moshine optical components into Ferrum metallurgy. Four rare-earth magnets from three native batches, preserving the original oxide, electrolyte and molten iron requirements. No productivity bonuses.
razi-wit-ferrum-grid-storage=Import Ferrum rare-earth magnets, Linox rare-earth powder and Moshine optical cable to build five of Wit's advanced accumulators from four native batches. Requires Wit's own late research and all original quantum components. No productivity bonuses.
razi-balack-rubia-chitosan-shielding=Reinforce Balack bio-cube radiation shielding using Rubia craptonite frames and Tenebris chitosan. Twelve shielding from two native batches, with all original promethium chunks, tungsten, carbon-fiber and heavy-oil requirements retained. No productivity bonuses.

