[recipe-description]
razi-bio-rare-metal-casting=Makes 5 rare metals from the ingredients of 4 crafts plus Gleba bioflux. Uses less molten rare metal.
razi-electrobiological-components=Combine Fulgora's holmium with imported Gleba bioflux, native silicon, glass, and plastic. Requires Fulgora's electromagnetic environment. No productivity or automatic recycling.
razi-gleba-tenebris-biopolymer=Makes 10 plastic bars from the ingredients of 2 crafts plus Gleba bioflux. Made on Tenebris.
razi-modded-moshine-zinc-silicon=Makes 5 silicon cells from the ingredients of 4 crafts plus Paracelsin zinc solder. Uses less silicon.
razi-modded-vesta-rare-earth-supermagnets=Moshine optical cable and Linox rare-earth powder reinforce Vesta supermagnets. Five from four native batches, with all original electrolyte and local atmosphere requirements.
razi-network-matrix-cryo-controllers=Use an imported Precision Control Matrix to improve the output of four native Aquilo K2SO control-unit batches, with no productivity stacking.
razi-network-lattice-vesta-magnets=Makes 5 supermagnets from the ingredients of 4 crafts plus an Extreme Lattice.
razi-network-bond-paracelsin-coils=Makes 5 electric coils from the ingredients of 4 crafts plus a Panglia Optic Bond.
razi-network-bond-linox-refining=Rare earth refining with a Panglia Optic Bond added, for extra output per craft.
razi-network-frame-vesta-foundations=Vesta foundations with an Umbra Pressure Frame added, for extra output per craft. Deep mode only.
razi-frontier-castra-composite-rounds=Makes 5 piercing magazines from the ingredients of 4 crafts plus Gleba carbon fiber and Moshine silicon cells.

