[recipe-description]
razi-deep-vulcanus-zinc-metals=Import Paracelsin zinc to Vulcanus to improve K2SO rare metal yield without bypassing native foundry research. Native recipe, research, specialist machinery and byproducts are preserved; no productivity/recycling bonus.
razi-deep-fulgora-optical-components=Use Moshine optics in Fulgora's magnetic industrial environment to improve K2SO electronics. Native recipe, research, specialist machinery and byproducts are preserved; no productivity/recycling bonus.
razi-deep-aquilo-optical-controllers=Combine Moshine optics, Fulgoran holmium and Aquilo coolant for a late control-unit manufacturing alternative. Native recipe, research, specialist machinery and byproducts are preserved; no productivity/recycling bonus.
razi-deep-moshine-holmium-silicon=Ship Fulgoran holmium to Moshine to enhance silicon-cell batches while preserving native production. Native recipe, research, specialist machinery and byproducts are preserved; no productivity/recycling bonus.
razi-deep-rubia-rare-earth-logistics=Combine Linox rare-earth powder with Rubia's native stack-inserter machinery. Native recipe, research, specialist machinery and byproducts are preserved; no productivity/recycling bonus.
razi-deep-tenebris-zinc-optics=Use Paracelsin rivets and Moshine optical cable in Tenebris chitin chemistry. Native recipe, research, specialist machinery and byproducts are preserved; no productivity/recycling bonus.
razi-deep-vesta-precious-supermagnets=Import Secretas and Cubium gold plates into Vesta's native supermagnet manufacture. Native recipe, research, specialist machinery and byproducts are preserved; no productivity/recycling bonus.
razi-deep-linox-craptonite-refining=Ship Rubia craptonite frames to Linox's original rare-earth processing. Native recipe, research, specialist machinery and byproducts are preserved; no productivity/recycling bonus.
razi-deep-ferrum-galvanic-magnets=Use Paracelsin zinc alongside Ferrum's original rare-earth magnet industry. Native recipe, research, specialist machinery and byproducts are preserved; no productivity/recycling bonus.
razi-bio-rare-metal-casting=Introduce Gleba bioflux into Vulcanus foundry casting. Four native rare-metal batches produce five plates, with the same molten-metal inputs and dirty-water byproducts. Bonus recipe has no productivity or automatic recycling.
razi-electrobiological-components=Combine Fulgora's holmium with imported Gleba bioflux, native silicon, glass, and plastic. Requires Fulgora's electromagnetic environment. No productivity or automatic recycling.
razi-cryo-energy-control=Ship Fulgoran supercapacitors and Gleban carbon fiber to Aquilo for cryogenic power-core assembly. Expands K2SO's native energy-control recipe without skipping its research. No productivity or automatic recycling.
razi-gleba-tenebris-biopolymer=Blend Gleba bioflux with Tenebris chitin to make ten plastic bars from two native biopolymer batches. Tenebris's original pressure restrictions and chitin economy remain mandatory.
razi-linox-rare-earth-exchange=Use imported K2SO rare metals and Fulgoran holmium to improve Linox rare-earth processing. The original sulfuric acid and stone requirements still apply.
razi-cubium-precious-metal-alloying=Refine imported Secretas gold ore on Cubium with K2SO rare metals and Fulgoran holmium. Each four native batches yields five gold plates.
razi-vesta-frontier-foundations=Combine Vesta's own gases and ceramics with Tenebris crystals, K2SO rare metals, and Fulgoran holmium. Four native foundation batches gain a bounded bonus from the imported cargo.
razi-modded-rubia-craptonite-composites=Combine Paracelsin zinc and Moshine optical cable with Rubia's original frothing and craptonite casting chain. Four frames from three native batches; returned concrete is preserved. No productivity stacking.
razi-modded-paracelsin-optical-coils=Import Moshine optical cable to reinforce Paracelsin's native nitric-acid coil manufacturing. Five coils from four native batches, made in the original mechanical machinery.
razi-modded-moshine-zinc-silicon=Use Paracelsin zinc solder to stabilize Moshine silicon cells. Five cells from four original batches while retaining the native silicon production chain.
razi-modded-linox-precision-refining=Optical components from Moshine and zinc plates from Paracelsin raise Linox rare-earth refining from four powder to five, retaining stone, acid and original surface restrictions.
razi-modded-vesta-rare-earth-supermagnets=Moshine optical cable and Linox rare-earth powder reinforce Vesta supermagnets. Four from three native batches with all original electrolyte and local atmosphere requirements.
razi-modded-tenebris-galvanized-chitosan=Paracelsin zinc rivets supplement Tenebris chitin and sulfuric-acid processing. Ten chitosan from two native batches, only in Tenebris's original pressure environment.
razi-modded-rubia-precision-inserters=Moshine optics and Paracelsin coils improve Rubia long stack inserter manufacture. Four inserters from three base batches, without eliminating Rubia's own special components.
razi-ferrum-linox-optical-magnets=Bring Linox rare-earth powder and Moshine optical components into Ferrum metallurgy. Four rare-earth magnets from three native batches, preserving the original oxide, electrolyte and molten iron requirements. No productivity bonuses.
razi-wit-ferrum-grid-storage=Import Ferrum rare-earth magnets, Linox rare-earth powder and Moshine optical cable to build five of Wit's advanced accumulators from four native batches. Requires Wit's own late research and all original quantum components. No productivity bonuses.
razi-balack-rubia-chitosan-shielding=Reinforce Balack bio-cube radiation shielding using Rubia craptonite frames and Tenebris chitosan. Twelve shielding from two native batches, with all original promethium chunks, tungsten, carbon-fiber and heavy-oil requirements retained. No productivity bonuses.

razi-galactic-vulcanus-bioptic-casting=Gleba bioflux and Moshine optical cable provide an optional boost to Vulcanus native K2SO casting. Native recipes, byproducts, world-specific machinery and original discovery rules remain in place. At most 25% extra production without productivity/recycling stacking.
razi-first-frontier-relay-components=Optional Nauvis K2SO electronics recipe with imported Vulcanus rare metals, Gleba bioflux and Moshine optical cable. Native ingredients and byproducts are retained. No productivity or automatic recycling.
razi-network-photonic-coils=Fulgoran holmium and Moshine optical cables improve Paracelsin coil manufacturing. Native recipes, byproducts, world-specific machinery and original discovery rules remain in place. At most 25% extra production without productivity/recycling stacking.
razi-network-crystal-silicon=Paracelsin zinc solder and Fulgoran holmium enhance Moshine silicon batches. Native recipes, byproducts, world-specific machinery and original discovery rules remain in place. At most 25% extra production without productivity/recycling stacking.
razi-network-bio-optical-craptonite=Rubia's original organic casting incorporates Tenebris chitosan, Paracelsin zinc and Moshine optics. Native recipes, byproducts, world-specific machinery and original discovery rules remain in place. At most 25% extra production without productivity/recycling stacking.
razi-network-precision-chitosan=Tenebris chitin chemistry benefits from Rubia frames, Paracelsin rivets and Moshine optics. Native recipes, byproducts, world-specific machinery and original discovery rules remain in place. At most 25% extra production without productivity/recycling stacking.
razi-network-integrated-rare-earths=Linox refining adds Rubia craptonite, Moshine optical cables and Paracelsin zinc plates. Native recipes, byproducts, world-specific machinery and original discovery rules remain in place. At most 25% extra production without productivity/recycling stacking.
razi-network-magnetic-rubia-inserters=Rubia stack inserter manufacturing integrates Paracelsin coils, Moshine optics and Linox powder. Native recipes, byproducts, world-specific machinery and original discovery rules remain in place. At most 25% extra production without productivity/recycling stacking.
razi-network-precious-vesta-magnets=Vesta magnet production integrates Secretas gold, Linox rare earths and Moshine optics. Native recipes, byproducts, world-specific machinery and original discovery rules remain in place. At most 25% extra production without productivity/recycling stacking.
razi-network-galvanic-ferrum-magnets=Optional Ferrum rare-earth magnets incorporate Linox powder, Moshine optics and Paracelsin zinc. Native recipes, byproducts, world-specific machinery and original discovery rules remain in place. At most 25% extra production without productivity/recycling stacking.
razi-network-golden-cubium-alloys=Cubium's Secretas gold refining integrates Linox rare earths, Paracelsin zinc and Vulcanus K2SO metals. Native recipes, byproducts, world-specific machinery and original discovery rules remain in place. At most 25% extra production without productivity/recycling stacking.
razi-network-wit-outer-storage=Deep industry: Wit's late accumulators incorporate Ferrum and Vesta magnets, Linox powder and Moshine optics. Native recipes, byproducts, world-specific machinery and original discovery rules remain in place. At most 25% extra production without productivity/recycling stacking.
razi-network-balack-vesta-shielding=Deep industry: Balack shielding incorporates Rubia craptonite, Tenebris chitosan and Vesta magnets, preserving promethium. Native recipes, byproducts, world-specific machinery and original discovery rules remain in place. At most 25% extra production without productivity/recycling stacking.
razi-network-vesta-biofoundations=Deep industry: Vesta's native foundation manufacturing imports Rubia craptonite, Tenebris chitosan and Fulgoran holmium. Native recipes, byproducts, world-specific machinery and original discovery rules remain in place. At most 25% extra production without productivity/recycling stacking.
razi-network-aquilo-outer-controllers=Deep K2SO industry: Aquilo cryogenic units combine Moshine optics, Vesta magnets, Rubia frames and Fulgoran holmium. Native recipes, byproducts, world-specific machinery and original discovery rules remain in place. At most 25% extra production without productivity/recycling stacking.

razi-network-precision-matrix=A portable industrial control matrix combining Vulcanus rare metals, Moshine optical cable, Paracelsin zinc and Fulgoran holmium.
razi-network-extreme-lattice=A late-game composite of precision matrices, Rubia craptonite, Tenebris chitosan, Linox rare earths and stable Gleba carbon fiber.
razi-network-matrix-cryo-controllers=Use an imported Precision Control Matrix to improve the output of four native Aquilo K2SO control-unit batches, with no productivity stacking.
razi-network-matrix-rubia-logistics=Improve Rubia inserter manufacturing with a shared precision matrix assembled from four other planetary industries.
razi-network-matrix-linox-refining=Use the precision manufacturing network for a guarded rare-earth refining alternative on Linox.
razi-network-lattice-vesta-magnets=Four native Vesta supermagnet batches can benefit from an exotic lattice assembled using Rubia, Tenebris, Linox and earlier engineering.
razi-network-lattice-vesta-foundations=Deep industry alternative for Vesta foundations consuming the extreme-environment composite. Native foundation recipes remain intact.
razi-network-lattice-balack-shielding=Deep industry bonus to Balack's original shielding recipe, using earlier Rubia, Tenebris and Linox materials. Promethium requirements remain native.

razi-network-panglia-optic-bond=Forge portable optical bonds from Panglia glass, Moshine cables and Fulgoran holmium. A returning freight line gives Panglia a lasting role in distant factories.
razi-network-umbra-pressure-frame=Combine Panglia optical bonds, Fulgoran holmium, Vesta supermagnets and Linox rare earths into a late industrial frame. Crucible discovery and source manufacturing remain mandatory, but no science cards are consumed as parts.
razi-network-bond-paracelsin-coils=Ship Panglia optical bonds to Paracelsin for a guarded, batch-efficient alternative to native electrochemical coil production. Never replaces the original coil recipe.
razi-network-bond-linox-refining=Use Panglia optical bonds to improve Linox rare-earth batches while retaining its native chemistry and research requirements.
razi-network-frame-vesta-foundations=Import deep-frontier pressure frames to Vesta for reinforced foundation production. Requires the native Vesta process and preserves its original ingredients.
razi-network-frame-aquilo-controllers=Return pressure frames from the outer systems to Aquilo for specialized cryogenic control units. Requires existing Aquilo machinery and coolant research.

razi-frontier-moshine-biometal-silicon=Moshine silicon cells become an optional partnership with Vulcanus rare metals and Gleba bioflux. Native manufacturing, costs and byproducts remain intact; imported cargo adds a bounded batch bonus.
razi-frontier-gleba-photofiber=A Gleba Biochamber alternative combines the original carbon fiber recipe with Moshine optical cables and Vulcanus rare metals. It leaves the base organic ingredients and recipe restrictions intact.
razi-frontier-castra-composite-rounds=An optional Castra ammunition batch imports Gleba carbon fiber and Moshine silicon cells. Native piercing-round recipes and military unlocks stay unchanged.
razi-middle-fulgora-resilient-capacitors=Fulgoran capacitors can import finished Aquilo control units and Moshine optical cable. Native recipe inputs, electromagnetic manufacturing and byproducts remain intact.
razi-middle-aquilo-capacitor-controls=Aquilo's native energy-control units combine Fulgora supercapacitors and Moshine optics as supplemental inputs without bypassing the original cryogenic recipe.
razi-middle-paracelsin-shielded-coils=Paracelsin electrocoils can import Rubia craptonite and Fulgora holmium for a better batch. Original source processes remain available without freight.
razi-middle-rubia-conductive-frames=Rubia's organic craptonite manufacturing can import finished Paracelsin coils and Fulgora supercapacitors, preserving native ingredients and organic machines.
