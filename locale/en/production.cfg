[technology-description]
razi-bio-rare-metal-casting=Unlocks rare-metal casting with Gleba bioflux for more output per craft.
razi-electrobiological-components=Unlocks electronic components with Gleba bioflux and Fulgora holmium for more output per craft.
razi-gleba-tenebris-biopolymer=Unlocks plastic made with Gleba bioflux on Tenebris.
razi-modded-moshine-zinc-silicon=Unlocks silicon cells made with zinc solder for more output per craft. Needs silicon-cell and zinc-solder research.
razi-modded-vesta-rare-earth-supermagnets=Unlocks supermagnets made with rare-earth powder and optical cable for more output per craft.
razi-network-matrix-cryo-controllers=Unlocks control units made with a Precision Control Matrix, for more output per craft.
razi-network-lattice-vesta-magnets=Unlocks supermagnets made with an Extreme-Environment Lattice, for more output per craft.
razi-network-bond-paracelsin-coils=Unlocks electric coils made with a Panglia Optic Bond, for more output per craft.
razi-network-bond-linox-refining=Unlocks rare earth refining with a Panglia Optic Bond, for more output per craft.
razi-network-frame-vesta-foundations=Unlocks Vesta foundations made with an Umbra Pressure Frame, for more output per craft. Deep mode only.
razi-frontier-castra-composite-rounds=Unlocks piercing magazines made with Gleba carbon fiber and Moshine silicon cells.

[razi-industry-profile]
catalytic=Uses up to 12% less of one normal ingredient, rounded down per craft. Needs the research of the normal recipe.
accelerated=Output per second is up to 17% above the normal recipe. No productivity or recycling.
bulk=Larger batch with extra output. Same planet requirements as the normal recipe.
