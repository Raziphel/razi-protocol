[technology-description]
razi-deep-vulcanus-zinc-metals=Import Paracelsin zinc to Vulcanus to improve K2SO rare metal yield without bypassing native foundry research. Native recipe and all suppliers must be unlocked before this optional research.
razi-deep-fulgora-optical-components=Use Moshine optics in Fulgora's magnetic industrial environment to improve K2SO electronics. Native recipe and all suppliers must be unlocked before this optional research.
razi-deep-aquilo-optical-controllers=Combine Moshine optics, Fulgoran holmium and Aquilo coolant for a late control-unit manufacturing alternative. Native recipe and all suppliers must be unlocked before this optional research.
razi-deep-moshine-holmium-silicon=Ship Fulgoran holmium to Moshine to enhance silicon-cell batches while preserving native production. Native recipe and all suppliers must be unlocked before this optional research.
razi-deep-rubia-rare-earth-logistics=Combine Linox rare-earth powder with Rubia's native stack-inserter machinery. Native recipe and all suppliers must be unlocked before this optional research.
razi-deep-tenebris-zinc-optics=Use Paracelsin rivets and Moshine optical cable in Tenebris chitin chemistry. Native recipe and all suppliers must be unlocked before this optional research.
razi-deep-vesta-precious-supermagnets=Import Secretas and Cubium gold plates into Vesta's native supermagnet manufacture. Native recipe and all suppliers must be unlocked before this optional research.
razi-deep-linox-craptonite-refining=Ship Rubia craptonite frames to Linox's original rare-earth processing. Native recipe and all suppliers must be unlocked before this optional research.
razi-deep-ferrum-galvanic-magnets=Use Paracelsin zinc alongside Ferrum's original rare-earth magnet industry. Native recipe and all suppliers must be unlocked before this optional research.
razi-bio-rare-metal-casting=Connect Vulcanus's rare-metal foundries with Gleba's biological catalysts. Optional higher-yield casting without weakening either original production route.
razi-electrobiological-components=Invest in long-distance Gleba/Fulgora logistics to increase K2SO electronic-component production using Fulgora's electromagnetic machinery.
razi-cryo-energy-control=Use products from Gleba and Fulgora in Aquilo's cryogenic factories for more efficient K2SO energy-control-unit production.
razi-gleba-tenebris-biopolymer=Combine Gleba's bioflux supply with the fungal and chitin-based industry of Tenebris, improving plastics only after both worlds are available.
razi-linox-rare-earth-exchange=Bring K2SO rare metals and Fulgoran holmium to Linox for an optional higher-yield method of processing its native rare-earth powders.
razi-cubium-precious-metal-alloying=Expand Cubium's late-game metallurgy using Secretas gold ore, K2SO rare metals and Fulgoran holmium. The native gold refining process remains available.
razi-vesta-frontier-foundations=Combine Vesta atmospheric construction with K2SO metallurgy, Fulgoran electronics and Tenebris bioluminescent crystals. Native foundation production is unchanged.
razi-modded-rubia-craptonite-composites=Combine the industrial strengths of Rubia, Paracelsin and Moshine for optional craptonite manufacturing efficiency. All three native research chains must first be established.
razi-modded-paracelsin-optical-coils=Introduce Moshine optical cable into Paracelsin's mechanical plant to improve coil yields without bypassing its zinc or nitric-acid manufacturing.
razi-modded-moshine-zinc-silicon=Exchange Paracelsin's electrochemical metals for more efficient Moshine silicon processing. Native silicon-cell and zinc-solder technologies are required.
razi-modded-linox-precision-refining=Unite the rare-earth facilities of Linox with Moshine optics and Paracelsin zinc. Native rare-earth research and imported-material unlocks remain necessary.
razi-modded-vesta-rare-earth-supermagnets=Integrate Linox mineral processing and Moshine optics into Vesta supermagnets while preserving the original atmospheric specialty.
razi-modded-tenebris-galvanized-chitosan=Apply Paracelsin's zinc-rivet industry to Tenebris chitosan chemistry. Tenebris's own chitin and pressure-limited research are still needed.
razi-modded-rubia-precision-inserters=Combine native Rubia logistics with Paracelsin coils and Moshine optics. This is a late optional industrial specialization, not a replacement for Rubia's original inserter path.
razi-ferrum-linox-optical-magnets=Earn a higher-yield Ferrum magnet process by linking Ferrum's remotely managed factories to Linox refining and Moshine optical production. Native research and both exporters are required.
razi-wit-ferrum-grid-storage=Wit's late advanced accumulator production benefits from magnet exports from Ferrum, rare earths from Linox and optics from Moshine. The original interstellar science and component costs remain essential.
razi-balack-rubia-chitosan-shielding=Add Rubia craptonite and Tenebris chitosan to Balack's original pollution-heavy bio-cube manufacturing for improved shielding output. Promethium remains mandatory.
razi-galactic-vulcanus-bioptic-casting=Gleba bioflux and Moshine optical cable provide an optional boost to Vulcanus native K2SO casting. Requires original production and every supplier discovery. Optional only; no planetary or system card uses this recipe.
razi-first-frontier-relay-components=Optional Calidus manufacturing requiring real source electronics, Vulcanus, Gleba, Moshine and verified supplier technologies. No mandatory system gate uses this research.
razi-network-photonic-coils=Fulgoran holmium and Moshine optical cables improve Paracelsin coil manufacturing. Requires original production and every supplier discovery. Optional only; no planetary or system card uses this recipe.
razi-network-crystal-silicon=Paracelsin zinc solder and Fulgoran holmium enhance Moshine silicon batches. Requires original production and every supplier discovery. Optional only; no planetary or system card uses this recipe.
razi-network-bio-optical-craptonite=Rubia's original organic casting incorporates Tenebris chitosan, Paracelsin zinc and Moshine optics. Requires original production and every supplier discovery. Optional only; no planetary or system card uses this recipe.
razi-network-precision-chitosan=Tenebris chitin chemistry benefits from Rubia frames, Paracelsin rivets and Moshine optics. Requires original production and every supplier discovery. Optional only; no planetary or system card uses this recipe.
razi-network-integrated-rare-earths=Linox refining adds Rubia craptonite, Moshine optical cables and Paracelsin zinc plates. Requires original production and every supplier discovery. Optional only; no planetary or system card uses this recipe.
razi-network-magnetic-rubia-inserters=Rubia stack inserter manufacturing integrates Paracelsin coils, Moshine optics and Linox powder. Requires original production and every supplier discovery. Optional only; no planetary or system card uses this recipe.
razi-network-precious-vesta-magnets=Vesta magnet production integrates Secretas gold, Linox rare earths and Moshine optics. Requires original production and every supplier discovery. Optional only; no planetary or system card uses this recipe.
razi-network-galvanic-ferrum-magnets=Optional Ferrum rare-earth magnets incorporate Linox powder, Moshine optics and Paracelsin zinc. Requires original production and every supplier discovery. Optional only; no planetary or system card uses this recipe.
razi-network-golden-cubium-alloys=Cubium's Secretas gold refining integrates Linox rare earths, Paracelsin zinc and Vulcanus K2SO metals. Requires original production and every supplier discovery. Optional only; no planetary or system card uses this recipe.
razi-network-wit-outer-storage=Deep industry: Wit's late accumulators incorporate Ferrum and Vesta magnets, Linox powder and Moshine optics. Requires original production and every supplier discovery. Optional only; no planetary or system card uses this recipe.
razi-network-balack-vesta-shielding=Deep industry: Balack shielding incorporates Rubia craptonite, Tenebris chitosan and Vesta magnets, preserving promethium. Requires original production and every supplier discovery. Optional only; no planetary or system card uses this recipe.
razi-network-vesta-biofoundations=Deep industry: Vesta's native foundation manufacturing imports Rubia craptonite, Tenebris chitosan and Fulgoran holmium. Requires original production and every supplier discovery. Optional only; no planetary or system card uses this recipe.
razi-network-aquilo-outer-controllers=Deep K2SO industry: Aquilo cryogenic units combine Moshine optics, Vesta magnets, Rubia frames and Fulgoran holmium. Requires original production and every supplier discovery. Optional only; no planetary or system card uses this recipe.
razi-network-precision-matrix=A portable industrial control matrix combining Vulcanus rare metals, Moshine optical cable, Paracelsin zinc and Fulgoran holmium. Original native crafting stays available, and premium alternatives are not needed for system tech cards.
razi-network-extreme-lattice=A late-game composite of precision matrices, Rubia craptonite, Tenebris chitosan, Linox rare earths and stable Gleba carbon fiber. Original native crafting stays available, and premium alternatives are not needed for system tech cards.
razi-network-matrix-cryo-controllers=Use an imported Precision Control Matrix to improve the output of four native Aquilo K2SO control-unit batches, with no productivity stacking. Original native crafting stays available, and premium alternatives are not needed for system tech cards.
razi-network-matrix-rubia-logistics=Improve Rubia inserter manufacturing with a shared precision matrix assembled from four other planetary industries. Original native crafting stays available, and premium alternatives are not needed for system tech cards.
razi-network-matrix-linox-refining=Use the precision manufacturing network for a guarded rare-earth refining alternative on Linox. Original native crafting stays available, and premium alternatives are not needed for system tech cards.
razi-network-lattice-vesta-magnets=Four native Vesta supermagnet batches can benefit from an exotic lattice assembled using Rubia, Tenebris, Linox and earlier engineering. Original native crafting stays available, and premium alternatives are not needed for system tech cards.
razi-network-lattice-vesta-foundations=Deep industry alternative for Vesta foundations consuming the extreme-environment composite. Native foundation recipes remain intact. Original native crafting stays available, and premium alternatives are not needed for system tech cards.
razi-network-lattice-balack-shielding=Deep industry bonus to Balack's original shielding recipe, using earlier Rubia, Tenebris and Linox materials. Promethium requirements remain native. Original native crafting stays available, and premium alternatives are not needed for system tech cards.
razi-network-panglia-optic-bond=Forge portable optical bonds from Panglia glass, Moshine cables and Fulgoran holmium. A returning freight line gives Panglia a lasting role in distant factories.
razi-network-umbra-pressure-frame=Combine Panglia optical bonds, Fulgoran holmium, Vesta supermagnets and Linox rare earths into a late industrial frame. Crucible discovery and source manufacturing remain mandatory, but no science cards are consumed as parts.
razi-network-bond-paracelsin-coils=Ship Panglia optical bonds to Paracelsin for a guarded, batch-efficient alternative to native electrochemical coil production. Never replaces the original coil recipe.
razi-network-bond-linox-refining=Use Panglia optical bonds to improve Linox rare-earth batches while retaining its native chemistry and research requirements.
razi-network-frame-vesta-foundations=Import deep-frontier pressure frames to Vesta for reinforced foundation production. Requires the native Vesta process and preserves its original ingredients.
razi-network-frame-aquilo-controllers=Return pressure frames from the outer systems to Aquilo for specialized cryogenic control units. Requires existing Aquilo machinery and coolant research.
razi-frontier-moshine-biometal-silicon=Optional four-batch Moshine silicon industry using verified Vulcanus and Gleba supplies. Native production remains unlocked through its original technology.
razi-frontier-gleba-photofiber=Optional Gleba carbon-fiber production with Moshine optics and Vulcanus metallurgy. Its original research, Biochamber category and native ingredients stay mandatory.
razi-frontier-castra-composite-rounds=Optional Castra ammunition industry combining native piercing magazines with verified Gleba/Moshine suppliers. Original research and native ammunition recipes remain.

razi-middle-fulgora-resilient-capacitors=Optional Fulgora capacitor industry requiring original supercapacitor research plus finished Aquilo controls and Moshine optics.
razi-middle-aquilo-capacitor-controls=Optional Aquilo K2SO control production using real Fulgora and Moshine materials. The native manufacturing restrictions remain.
razi-middle-paracelsin-shielded-coils=A Paracelsin-Rubia workshop research milestone. When its actual source recipes can be registered, this research helps qualify the outer-system expedition.
razi-middle-rubia-conductive-frames=A Rubia-Paracelsin workshop research milestone. When its actual source recipes can be registered, this research helps qualify the outer-system expedition.