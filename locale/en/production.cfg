[technology-description]
razi-bio-rare-metal-casting=Connect Vulcanus's rare-metal foundries with Gleba's biological catalysts. Optional higher-yield casting without weakening either original production route.
razi-electrobiological-components=Invest in long-distance Gleba/Fulgora logistics to increase K2SO electronic-component production using Fulgora's electromagnetic machinery.
razi-gleba-tenebris-biopolymer=Combine Gleba's bioflux supply with the fungal and chitin-based industry of Tenebris, improving plastics only after both worlds are available.
razi-modded-moshine-zinc-silicon=Exchange Paracelsin's electrochemical metals for more efficient Moshine silicon processing. Native silicon-cell and zinc-solder technologies are required.
razi-modded-vesta-rare-earth-supermagnets=Integrate Linox mineral processing and Moshine optics into Vesta supermagnets while preserving the original atmospheric specialty.
razi-network-precision-matrix=A portable industrial control matrix combining Vulcanus rare metals, Moshine optical cable, Paracelsin zinc and Fulgoran holmium. Original native crafting stays available, and premium alternatives are not needed for system tech cards.
razi-network-extreme-lattice=A late-game composite of precision matrices, Rubia craptonite, Tenebris chitosan, Linox rare earths and stable Gleba carbon fiber. Original native crafting stays available, and premium alternatives are not needed for system tech cards.
razi-network-matrix-cryo-controllers=Use an imported Precision Control Matrix to improve the output of four native Aquilo K2SO control-unit batches, with no productivity stacking. Original native crafting stays available, and premium alternatives are not needed for system tech cards.
razi-network-lattice-vesta-magnets=Four native Vesta supermagnet batches can benefit from an exotic lattice assembled using Rubia, Tenebris, Linox and earlier engineering. Original native crafting stays available, and premium alternatives are not needed for system tech cards.
razi-network-panglia-optic-bond=Forge portable optical bonds from Panglia glass, Moshine cables and Fulgoran holmium. A returning freight line gives Panglia a lasting role in distant factories.
razi-network-umbra-pressure-frame=Combine Panglia optical bonds, Fulgoran holmium, Vesta supermagnets and Linox rare earths into a late industrial frame. Crucible discovery and source manufacturing remain mandatory, but no science cards are consumed as parts.
razi-network-bond-paracelsin-coils=Ship Panglia optical bonds to Paracelsin for a guarded, batch-efficient alternative to native electrochemical coil production. Never replaces the original coil recipe.
razi-network-bond-linox-refining=Use Panglia optical bonds to improve Linox rare-earth batches while retaining its native chemistry and research requirements.
razi-network-frame-vesta-foundations=Import deep-frontier pressure frames to Vesta for reinforced foundation production. Requires the native Vesta process and preserves its original ingredients. Deep only.
razi-frontier-castra-composite-rounds=Optional Castra ammunition industry combining native piercing magazines with verified Gleba/Moshine suppliers. Original research and native ammunition recipes remain.

[razi-industry-profile]
catalytic=[color=#D1B17A]CATALYTIC PROCESS[/color]  Imported reagents replace part of a specific native input. You still need the native process and research; only this optional recipe receives the savings. Exact savings are rounded down per craft.
accelerated=[color=#84C8C0]ACCELERATED PRODUCTION[/color]  Imported precision hardware improves manufacturing throughput, capped at 17% above the same native batches per second. No productivity or recycling stacking.
bulk=[color=#D1B17A]BULK INDUSTRY[/color]  Exported goods support a larger manufacturing batch with a bounded output bonus. The original native process and world requirements are still enforced.
