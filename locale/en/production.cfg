[technology-description]
razi-bio-rare-metal-casting=Connect Vulcanus's rare-metal foundries with Gleba's biological catalysts. Optional higher-yield casting without weakening either original production route.
razi-electrobiological-components=Invest in long-distance Gleba/Fulgora logistics to increase K2SO electronic-component production using Fulgora's electromagnetic machinery.
razi-cryo-energy-control=Use products from Gleba and Fulgora in Aquilo's cryogenic factories for more efficient K2SO energy-control-unit production.
razi-gleba-tenebris-biopolymer=Combine Gleba's bioflux supply with the fungal and chitin-based industry of Tenebris, improving plastics only after both worlds are available.
razi-linox-rare-earth-exchange=Bring K2SO rare metals and Fulgoran holmium to Linox for an optional higher-yield method of processing its native rare-earth powders.
razi-cubium-precious-metal-alloying=Expand Cubium's late-game metallurgy using Secretas gold ore, K2SO rare metals and Fulgoran holmium. The native gold refining process remains available.
razi-vesta-frontier-foundations=Combine Vesta atmospheric construction with K2SO metallurgy, Fulgoran electronics and Tenebris bioluminescent crystals. Native foundation production is unchanged.
razi-modded-rubia-craptonite-composites=Combine the industrial strengths of Rubia, Paracelsin and Moshine for optional craptonite manufacturing efficiency. All three native research chains must first be established.
razi-modded-paracelsin-optical-coils=Introduce Moshine optical cable into Paracelsin's mechanical plant to improve coil yields without bypassing its zinc or nitric-acid manufacturing.
razi-modded-moshine-zinc-silicon=Exchange Paracelsin's electrochemical metals for more efficient Moshine silicon processing. Native silicon-cell and zinc-solder technologies are required.
razi-modded-linox-precision-refining=Unite the rare-earth facilities of Linox with Moshine optics and Paracelsin zinc. Native rare-earth research and imported-material unlocks remain necessary.
razi-modded-vesta-rare-earth-supermagnets=Integrate Linox mineral processing and Moshine optics into Vesta supermagnets while preserving the original atmospheric specialty.
razi-modded-tenebris-galvanized-chitosan=Apply Paracelsin's zinc-rivet industry to Tenebris chitosan chemistry. Tenebris's own chitin and pressure-limited research are still needed.
razi-modded-rubia-precision-inserters=Combine native Rubia logistics with Paracelsin coils and Moshine optics. This is a late optional industrial specialization, not a replacement for Rubia's original inserter path.
