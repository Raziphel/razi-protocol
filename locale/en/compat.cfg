[space-location-description]
calidus-bellicos-stargate-calidus=Shared arrival gate from Solaris and Nyxaris. The route continues to Aegis Outer Edge, crosses the debris belt to Inner Edge, and reaches Near Bellicos Orbit or Point Warden.

