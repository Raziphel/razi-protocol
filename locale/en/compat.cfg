[item-description]
mech-armor-mk2=Mech armor with a larger equipment grid and more inventory. Made in an electromagnetic plant where the magnetic field is at least 99.
mech-armor-mk3=Mech armor with a larger grid and higher resistances than MK2. Made in a cryogenic plant in zero gravity, on a space platform.
mech-armor-mk4=The top tier of mech armor. Made in a cryogenic plant in zero gravity, on a space platform.

