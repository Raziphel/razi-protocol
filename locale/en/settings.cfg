[mod-setting-description]
razi-enable-enemy-routing=When enabled, Razi Protocol moves supported enemy mods onto themed planets and suppresses vanilla enemy spawns on those custom enemy worlds. Disable this to leave enemy spawning to the original enemy and planet mods.
razi-hide-redundant-assembler-tiers=Hides the tier-4 assembling machines of Planetaris Hyarion and Lithium Battery, with their items, recipes and unlocks. Krastorio 2's earlier advanced assembler already fills that role, so they only clutter progression and Factoriopedia.
razi-starmap-orbit-density=Full draws all native planet rings; Balanced and Clean draw fewer; Off hides Razi-managed rings.
razi-planetary-interdependence=Balanced: planet discoveries within a system also need the science of their neighbours, for example Arig and Hyarion wait for Castra's battlefield science; every installed world of a system is researched before the gateways of the next system; optional exchange recipes reward freight from other planets with better output. Deep: the same, with every imported ingredient raised by 50% and one more exchange. Off: planets of a system open independently, only the system gates apply, installed worlds are not required before them, and there are no exchange recipes. New campaigns recommended.
razi-stage-aquilo-breakthroughs=Keep Aquilo's cryogenic tools, but earn foundation after Maraxsis and Paracelsin, fusion after Cubium and Tenebris, and legendary quality after outer-frontier mastery. Off keeps original unlock timing. New campaigns recommended.
razi-distributed-technology=Tie nuclear power, and Planet Express' trade research, to the science of the first planets: nuclear power waits for Vulcanus and Gleba. Robots and the logistic system stay on Nauvis. Off (default) keeps the source unlocks; Hard and Nightmare turn it on by themselves. The balance is not confirmed yet.
razi-group-barreling-recipes=Move verified fill/empty barrel recipes into a Fluids group. Recipes and crafting are unchanged.
razi-group-spoilable-recipes=Put single-output spoilable intermediates in their own group. Experimental; does not change spoil timers.
razi-hand-crafting-cleanup=Remove machine-only recipes from the character crafting menu. Hand-craftable recipes, machines, research and Factoriopedia stay intact. All: every installed mod. Razi: only razi- recipes. Off: leave every recipe visible. Shared startup setting: restart to apply.
razi-curated-space-routes=Use Razi's intended interplanetary connections while retaining essential source routes. Off keeps source-mod extras.
razi-route-distance-repair=Correct unusually short travel distances on faraway source routes. Off retains the source mods' distances.
razi-difficulty-preset=Sets several Razi settings at once: asteroid danger and numbers, belt threats and ore, planetary interdependence, spread technology, pollution spread, enemy attack groups and colonies, spoilage, rocket launch cost, factory speed and wall strength. On a new map Easy, Hard and Nightmare also scale ore, enemy bases, evolution and research cost of every planet. Normal changes nothing. A setting changed by hand keeps its value; Custom uses only the saved values. The settings below show saved values, not the level's. Hard and Nightmare also make Razi Rocket Reusability harsher. Easy, Hard and Nightmare also set numeric options of Muluna, Cerys, Rubia and Biological Machines while the game loads (science pack output and craft time, research counts, radar power, Balack bio fabricator); their saved settings stay and Custom leaves them alone. Restart Factorio after changing it.
razi-asteroid-difficulty-scale=Balanced keeps the intended 10-level route danger. Challenging and Relentless raise it on the advanced routes. Hard and Nightmare select these on their own.
razi-asteroid-population=Change hostile asteroid frequency on Razi-curated routes: 65%, 100%, 130% or 160%. Does not change asteroid types.
razi-belt-threats=Scale the big and huge asteroids on the two belt crossings, Vibrant and Umbra: 50%, 100% or 150%.
razi-belt-resource-richness=Scale Razi-added belt ore to 60%, 100% or 150%. Other planets and original asteroid mining are unchanged.
razi-belt-midsection-salvage=Add harvestable ore to the dangerous middle of Razi belt crossings. Off keeps the original resource layout.
razi-belt-edge-harvesting=Add passive ore harvesting at safer belt edges. Off makes belt trips more dependent on combat.
razi-enable-expedition-briefings=Add short system notes to original planet descriptions. Off restores the original descriptions. Text only.
razi-starmap-soften-bellicos=Dim excess Bellicos pulsar glare while keeping its recognizable shape.
razi-performance-compact-route-overlays=Use fewer precomputed route-line sprites. Saves map graphics work but makes some curves less smooth. Does not affect UPS. Off by default.
razi-route-overlay-mode=Off uses native lines; Danger colors routes by level 1-10; Chapter adds chapter styling. Routes stay clickable.
razi-route-overlay-scope=All colors every verified route; Major colors only main corridors and belt crossings. Missing geometry stays native.
razi-route-intelligence=Add distance, hazards, harvestable chunks and ship advice to route tooltips. Travel itself is unchanged.
razi-route-visibility=Change colored route opacity: Soft, Standard or Bright. Native connections remain visible and clickable.
razi-route-detail=Economy draws fewer curve points; Smooth draws more. Standard balances line quality and map graphics cost.
razi-route-show-danger=Show each route's danger rating on the 1-10 scale in tooltips.
razi-route-show-sizes=Identify the largest hostile asteroid expected on a route.
razi-route-show-salvage=List collectible asteroid chunk types along each route.
razi-route-show-advice=Include suggested ship defenses for hazardous routes.
razi-route-show-unknown=Warn when a source mod's asteroid hazards cannot be determined.
razi-route-show-belts=Identify required asteroid belt crossings in route tooltips.
razi-route-show-sectors=Identify a route's origin and destination star systems.
razi-route-show-haul=Flag long-distance cargo journeys in route tooltips.
razi-starmap-background-style=Off: native background. Subtle: a few extra details. Cinematic: more and brighter details. Cosmetic only.
razi-starmap-system-halos=Show faint color glows around star systems. Does not alter map positions.
razi-starmap-belt-atmosphere=Show thin dust rings around the real asteroid belts. Hazards remain unchanged.
razi-starmap-fine-details=Show sparse background stars beyond the main planetary systems.
razi-starmap-galactic-ornaments=Show a few faint nebula pockets between the main systems.
razi-starmap-micro-details=Show tiny, low-opacity star flecks for extra sky texture.
razi-starmap-cartography=Add a small observatory-style star chart near Calidus. Off by default.
razi-map-star-intensity=Adjust background star brightness; does not affect gameplay.
razi-map-halo-intensity=Adjust star-system halo brightness; does not affect gameplay.
razi-map-belt-intensity=Adjust belt dust brightness; asteroid encounters are unchanged.
razi-map-dust-intensity=Adjust small nebula and dust accents; does not affect gameplay.
razi-quality-asteroids=Hostile asteroids on space routes sometimes appear with higher quality; the chance grows with the route's danger. Resource chunks are unchanged. On by default; on an older save, strengthen platform defenses before updating or turn this off.
razi-performance-asteroid-particles=Removes the cosmetic debris particles and smoke puffs from the explosions that asteroids create when they break. May improve FPS, not UPS. Mining is unchanged. Off by default.
razi-performance-weapon-particles=Removes cosmetic particles from projectiles and beams. Damage is unchanged; some weapon effects look simpler. Off by default.
razi-performance-reduced-fragments=Halves the chunks released by small metallic, carbonic, oxide and promethium asteroids when they break. Lowers entity counts AND the resources you can mine. Off by default.
razi-performance-outer-hostile-density=Reduces hostile asteroid spawns by 28% on the most dangerous routes (danger 8-10). Resource chunks are unchanged, but the outer galaxy becomes easier. Off by default.
razi-performance-space-explosion-smoke=Removes smoke and cosmetic particles from asteroid, rocket, railgun, artillery and other space-combat explosions. Damage and sounds stay. Off by default.
razi-default-new-game-map=New Game opens with the Razi Protocol profile of the chosen difficulty selected instead of the default preset; the other presets stay in the list. Easy, Hard and Nightmare then also change the ore, enemy and map settings of every planet and the global map settings; Normal changes nothing. Off keeps the default preset and the map settings of the mods, and the difficulty does not change the map. Restart Factorio after changing it.
razi-pollution-pressure=Scales how far pollution spreads and the amount a chunk needs before it spreads. A map setting: applies to new games.
razi-raid-coordination=Scales the size of enemy attack groups, how many gather at once and how long they gather. A map setting: applies to new games.
razi-colony-expansion=Scales the size of enemy settler groups and the cooldown between expansions. A map setting: applies to new games.
razi-spoilage-pressure=Scales the spoil time of all spoilable items. A map setting: applies to new games.
razi-resource-frequency=Scales ore frequency on every planet. Easy, Hard and Nightmare already set it in their map profile; a value changed by hand (or Custom) is applied on top. Resources a planet does not have stay absent. Applies to new maps.
razi-resource-patch-size=Scales ore patch size on every planet. A value changed by hand (or Custom) is applied on top of the level's own. Applies to new maps.
razi-resource-richness=Scales ore and oil richness on every planet. A value changed by hand (or Custom) is applied on top of the level's own. Applies to new maps.
razi-science-demand=Scales the price of technologies in the map settings. A value changed by hand (or Custom) is applied on top of the level's own. Applies to new games.
razi-evolution-speed=Scales the three enemy evolution factors: time, pollution and destroyed nests. A value changed by hand (or Custom) is applied on top of the level's own. Applies to new games.
razi-rocket-launch-cost=Scales the rocket parts a launch needs, on every rocket silo of the base game and of other mods. A rocket that is already being built needs the new number of parts. Applies when the game loads.
razi-factory-throughput=Scales the crafting speed of the assembling machines and furnaces of the base game and of other mods. Machines with a fixed recipe and machines that players cannot build keep their speed. Also applies to existing factories when the game loads.
razi-fortification-durability=Scales the maximum health of the walls and gates of the base game and of other mods. Enemies and turrets are not changed. Also applies to existing walls when the game loads.
