[mod-setting-description]
razi-hide-spoilers=ON by default. Conceal future Razi-owned technologies from the native research screen until their actual prerequisites are researched, and hide undiscovered Journal quests, future chapter names and unrecovered archive titles. All currently available or completed discoveries remain visible. Third-party technologies are not disabled or altered. OFF immediately restores the technologies hidden by this option and reveals the complete Journal. Shared map setting for multiplayer; no restart required.
razi-belt-resource-richness=Change only Razi-added resource deposits in the two custom asteroid belt expeditions. Other planets and original source asteroid mining are unchanged.
razi-belt-midsection-salvage=Allow Razi to add extra harvestable asteroid ore around the dangerous middle section of its custom belt crossings. Turn off to leave existing source resources untouched.
razi-belt-edge-harvesting=Allow passive resource harvesting at the safe inner and outer rims of the two custom Razi asteroid belts. Disable for a more combat-focused journey.
razi-asteroid-population=Scales vanilla hostile asteroid probabilities only on routes authored and tuned by Razi. Sparse, standard, dense, or swarm. Does not invent asteroid species or change difficulty stages. Restart required.
razi-belt-threats=Scales only the extra big and huge asteroid encounters added to Razi's two custom belt crossings. Native and modded asteroid encounters stay unchanged. Restart required.
razi-route-distance-repair=Optional protection against grossly underpriced far-away source routes; turning it off retains original travel lengths. Startup setting. Restart Factorio to apply. Default keeps Razi's original behavior.
razi-route-visibility=Adjust Razi colored ribbon opacity while retaining native navigation routes. Startup setting. Restart Factorio to apply. Default keeps Razi's original behavior.
razi-route-detail=Economy reduces ribbon sprite cost, Smooth improves curve sampling, Standard preserves current quality. Startup setting. Restart Factorio to apply. Default keeps Razi's original behavior.
razi-route-show-danger=Show Razi ten-level hazard assessments. Startup setting. Restart Factorio to apply. Default keeps Razi's original behavior.
razi-route-show-sizes=Show the largest hostile asteroid on a route. Startup setting. Restart Factorio to apply. Default keeps Razi's original behavior.
razi-route-show-salvage=Show the number of collectable asteroid chunk categories. Startup setting. Restart Factorio to apply. Default keeps Razi's original behavior.
razi-route-show-advice=Show route preparation tips for dangerous areas. Startup setting. Restart Factorio to apply. Default keeps Razi's original behavior.
razi-route-show-unknown=Warn when a source route hazard cannot be inspected. Startup setting. Restart Factorio to apply. Default keeps Razi's original behavior.
razi-route-show-belts=Explain intentional asteroid-belt progression crossings. Startup setting. Restart Factorio to apply. Default keeps Razi's original behavior.
razi-route-show-sectors=Identify the origin and destination system. Startup setting. Restart Factorio to apply. Default keeps Razi's original behavior.
razi-route-show-haul=Explain long-distance space-platform freight routes. Startup setting. Restart Factorio to apply. Default keeps Razi's original behavior.
razi-map-star-intensity=Control background star opacity without extra rendering work. Startup setting. Restart Factorio to apply. Default keeps Razi's original behavior.
razi-map-halo-intensity=Control the existing system glow layers. Startup setting. Restart Factorio to apply. Default keeps Razi's original behavior.
razi-map-belt-intensity=Change visual asteroid-belt dust brightness, not asteroid spawns. Startup setting. Restart Factorio to apply. Default keeps Razi's original behavior.
razi-map-dust-intensity=Change the brightness of small dust and nebula accents. Startup setting. Restart Factorio to apply. Default keeps Razi's original behavior.
razi-performance-asteroid-creation-dust=OFF by default. Removes only cosmetic particle and trivial-smoke effects from asteroid creation. Preserves scripted quality-asteroid replacement, damage, real entities, resources and research. May improve FPS during high-density asteroid spawning; restart required.
razi-performance-space-explosion-smoke=OFF by default. Removes purely cosmetic smoke and particle effects from asteroid, rocket, railgun and related space-combat explosion visuals. Keeps weapon damage, explosion animations, sound and gameplay effects intact. May affect visual clarity. Restart required.
razi-performance-compact-route-overlays=OFF by default. Draws ten-color starmap connections with fewer precomputed sprite layers (roughly half the normal budget) and wider spacing. Does NOT affect space-platform UPS, asteroid counts, world routes or game simulation. Some curved lines may look less smooth. Restart required.
razi-performance-asteroid-particles=OFF by default. Removes purely cosmetic particle/small smoke effects from asteroid and asteroid-chunk damage or destruction. Leaves damage, actual drops and Quality Asteroids conversion untouched. Potential FPS benefit; UPS gains may be minimal in Factorio 2.1. Restart required.
razi-performance-weapon-particles=OFF by default. Strips visual particles from projectile, artillery projectile and beam effects without removing damage, explosions or game logic. Potential FPS benefit only; test custom weapons visually. Restart required.
razi-performance-reduced-fragments=OFF by default. Halves the creation probability of native metallic, carbonic, oxide and promethium chunks when big/huge hostile asteroids break. Reduces moving chunk entities, but ALSO reduces harvest yields; modded Auric/Imersite species are excluded. Restart required.
razi-performance-outer-hostile-density=OFF by default. Reduces hostile asteroid spawn probability by 28% ONLY on difficulty Level 8-10 routes and orbits. Chunks, tier colors, quality probabilities, travel connections and technology are unchanged. Changes challenge; does not preserve identical combat difficulty. Restart required.
razi-quality-asteroids=Spawn real quality asteroids based on Razi's 10-level route threat scale. Safe home routes stay normal; dangerous belts and Deep Space grow increasingly legendary. Built-in, no external mod. Resource chunks keep their original quality and probability.
razi-asteroid-difficulty-scale=Balanced is the designed 10-stage progression. Challenging adds roughly three quarters of a stage on dangerous routes; Relentless adds one and a half stages. Deep Space remains legendary and Calidus home routes stay safe. Restart required.
razi-companion-science-weave=Source-guarded, optional nuclear/fusion railway and superconducting shield research can gain regional science cards, after the relevant planets and labs exist. Mod detection, recipe unlocks, lab coverage and prerequisite cycles are checked independently. All other companions retain the original authors' unlocks, cargo rules and logistics. Disable for unchanged source technologies. Startup restart required.
razi-orbital-catapult-local-links=Experimental and OFF by default. With Orbital Catapult manually installed, provide only reversible Muria-Aquilo shuttle links using the source link prototype. This never links across asteroid belts or between star systems. Orbital Catapult specifically warns against regular modpack dependency load ordering, so its installation is separate. Confirm source research, loading order and existing-save routes in a disposable game first. Startup restart required.
razi-distributed-technology=Recommended for the Razi seven-system campaign. Shift selected existing technologies off early Nauvis science: construction robots need Gleba agricultural science; nuclear power and logistic robots need both Vulcanus metallurgy and Gleba biology; the advanced logistic system needs Fulgora electromagnetic science; and nuclear fuel reprocessing benefits from Cerys nuclear science. Installed Planet Express and AAI Signal Transmission research can gain matching guarded planetary research as well. Does not change rocket building, flying robot frames, native lab entities, technology IDs, discovered planets or existing research progress. If a science pack, producer, prerequisite or compatible lab is missing, that individual change is skipped. Disable for the original technology distribution. Restart required.
razi-curated-space-routes=Recommended. Replace ordinary source-mod connections across Razi's seven mapped star systems with the routes explicitly authored for Razi Protocol. Keep native moons, the original 5,000 km asteroid crossing, Dyson stations and special external systems connected. Preserve native asteroid resources on retained routes. Disable only to troubleshoot other mods' original extra lanes. Restart required.
razi-route-overlay-mode=Razi adds thin, ten-color continuous overlays that follow verified native route geometry. Level 1 is blue; Level 10 is crimson. Chapter mode keeps quality danger colors active. Native routes remain clickable. There are no offset dotted tracks or per-tick rendering. Restart required.
razi-route-overlay-scope=All (default) paints verified main and local routes with the ten quality colors. Major limits coverage to long corridors and real asteroid belts. When a modded arc has insufficient coordinates, Razi leaves it grey rather than inventing a line; native connections remain unchanged.
razi-dyson-milestone-weave=Research the existing Dyson Sphere Reworked technologies through successive Razi frontiers. Later receiver upgrades require substantial existing Cerys, Moshine, Aquilo and Maraxsis milestones where those technologies exist and don't create cycles. The original satellites, plasma production, repeaters, power output and K2 plasma science remain owned by the installed mods. Disabling affects Razi's added prerequisites, not the source mod.
razi-dyson-calidus-layout=Place the source mod's actual outer and inner solar-orbit locations as two compact rings around Calidus. Native solar plasma encounters, icons and the existing solar connection remain intact. This only adjusts space-map positions. Disabled: leave source orbit geometry unchanged.
razi-enable-enemy-routing=[font=default-bold]World population routing[/font]\nYes: Move supported modded enemy factions to fitting worlds and suppress vanilla enemy spawns there. [color=red]RECOMMENDED[/color]\nNo: Leave enemy placement to the original enemy and planet mods.\n\n[font=default-small][color=yellow]Changes planet generation. Affects newly generated terrain; existing enemies are not removed.[/color][/font]
razi-planetary-interdependence=[font=default-bold]Planetary interdependence[/font]\\nBalanced: Retain the existing interwoven planet sciences, K2SO research-data deliveries and alternate industry recipes. [color=red]RECOMMENDED[/color]\\nDeep: Additionally unlock nine guarded, import-intensive alternatives with at most 30% extra output before productivity (which is disabled).\\nOff: Disable Razi's optional cross-planet science weave, data deliveries and exchange recipes; essential seven-system gates and source-mod production stay intact.\\n\\n[font=default-small][color=cyan]Startup setting. Back up existing saves before switching progression modes. The two individual exchange toggles still apply.[/color][/font]
razi-enable-k2so-production-exchanges=[font=default-bold]Optional K2SO industry[/font]\nYes: Add the independent K2SO-based alternate recipes connecting early, middle and outer industries when their source materials, technologies and machines are available. [color=red]RECOMMENDED[/color]\nNo: Keep the original K2SO recipes without Razi's extra production exchanges.\n\n[font=default-small][color=cyan]Does not disable K2SO, system tech cards, essential research, or native recipes.[/color][/font]
razi-enable-modded-planet-exchanges=[font=default-bold]Modded-world manufacturing[/font]\nYes: Add optional alternate recipes connecting Rubia, Paracelsin, Moshine, Linox, Vesta and Tenebris with each other's materials. [color=red]RECOMMENDED[/color]\nNo: Leave those source mods' native production intact without Razi's additional cross-mod recipes.\n\n[font=default-small][color=cyan]Independent from the K2SO industry toggle. Neither choice changes required planet discoveries.[/color][/font]
razi-hide-redundant-assembler-tiers=[font=default-bold]Cleaner machine progression[/font]\nYes: Hide the redundant fourth-tier assemblers from Planetaris Hyarion and Lithium Battery when present. Their items, recipes, technologies and obsolete upgrade links are cleaned up. [color=red]RECOMMENDED[/color]\nNo: Preserve those mods' native assembler tiers.\n\n[font=default-small][color=green]K2SO's advanced assembler already covers this role. Changing this startup setting requires a restart.[/color][/font]
razi-enable-expedition-briefings=[font=default-bold]Galaxy exploration notes[/font]\nYes: Keep each planet mod author's description and append Razi's colored system heading and short expedition briefing. [color=red]RECOMMENDED[/color]\nNo: Leave original planet and space-location descriptions untouched.\n\n[font=default-small][color=green]Text only. Does not change destinations, routes, research or production.[/color][/font]

razi-route-intelligence=Show extra information when hovering space connections: route type, distance, asteroid danger, largest threat, collectible chunk varieties, and recommended ship preparations. Important belt crossings are identified. Works with modded connections, preserves their existing tooltips and does not alter travel progression. Startup setting; no runtime polling.
razi-starmap-background-style=Small feathered system halos and star pockets on the native sky. Cinematic has a stronger tint but no giant nebula shapes, geometric rifts or stitched tiles. Better Starmap Background takes precedence if installed.
razi-starmap-orbit-density=Full shows native Factorio 2.1 orbit rings for every positioned planet by default. Balanced and Clean show fewer rings; Off hides Razi-managed native planetary rings. Source moons and custom orbit artwork are preserved. This is cosmetic only. Existing saves with Balanced selected can switch to Full manually. Restart required.
razi-starmap-system-halos=Show one small, feathered color accent around each star. Does not move any world or add false orbit rings.
razi-starmap-belt-atmosphere=Show one narrow, dim dust circumference at each of the three real Razi belts; no duplicate offset rings. Native hazards, connections and research stay intact.
razi-starmap-soften-bellicos=Dim the Bellicos pulsar map layers only where the source art can be identified. Preserves the beam silhouette, Aegis hazards, star position and all routes.
razi-starmap-galactic-ornaments=Four star-dust pockets in empty regions; no galaxy arms, fake portals, or line-shaped decorations.
razi-starmap-micro-details=Four small, low-opacity star flecks outside main planet orbits, without repeated nebula motifs or animated effects.
razi-starmap-fine-details=Keep a few distant star flecks beyond the busy stellar systems. No spiral filaments, giant rifts or layered clouds.
razi-starmap-cartography=Optional small starfield detail near Calidus, with no misleading decorative orbit rings.
