[mod-setting-name]
razi-enable-enemy-routing=[color=yellow][font=heading-2]Worlds & Encounters[/font][/color] Route modded enemy factions
razi-enable-k2so-production-exchanges=[color=cyan][font=heading-2]Production Integration[/font][/color] K2SO interplanetary industry
razi-enable-modded-planet-exchanges=[color=cyan][font=heading-2]Production Integration[/font][/color] Modded-planet industrial exchanges
razi-hide-redundant-assembler-tiers=[color=green][font=heading-2]Quality of Life[/font][/color] Hide redundant tier-4 assemblers
razi-enable-expedition-briefings=[color=green][font=heading-2]Quality of Life[/font][/color] Expedition descriptions on the starmap

razi-route-highlight-style=[color=purple][font=heading-2]Quality of Life[/font][/color] Starmap route highlights

[string-mod-setting]
razi-route-highlight-style-off=Off
razi-route-highlight-style-subtle=Subtle
razi-route-highlight-style-clear=Clear

[mod-setting-description]
razi-enable-enemy-routing=[font=default-bold]World population routing[/font]\nYes: Move supported modded enemy factions to fitting worlds and suppress vanilla enemy spawns there. [color=red]RECOMMENDED[/color]\nNo: Leave enemy placement to the original enemy and planet mods.\n\n[font=default-small][color=yellow]Changes planet generation. Affects newly generated terrain; existing enemies are not removed.[/color][/font]
razi-enable-k2so-production-exchanges=[font=default-bold]Optional K2SO industry[/font]\nYes: Add the independent K2SO-based alternate recipes connecting early, middle and outer industries when their source materials, technologies and machines are available. [color=red]RECOMMENDED[/color]\nNo: Keep the original K2SO recipes without Razi's extra production exchanges.\n\n[font=default-small][color=cyan]Does not disable K2SO, system tech cards, essential research, or native recipes.[/color][/font]
razi-enable-modded-planet-exchanges=[font=default-bold]Modded-world manufacturing[/font]\nYes: Add optional alternate recipes connecting Rubia, Paracelsin, Moshine, Linox, Vesta and Tenebris with each other's materials. [color=red]RECOMMENDED[/color]\nNo: Leave those source mods' native production intact without Razi's additional cross-mod recipes.\n\n[font=default-small][color=cyan]Independent from the K2SO industry toggle. Neither choice changes required planet discoveries.[/color][/font]
razi-hide-redundant-assembler-tiers=[font=default-bold]Cleaner machine progression[/font]\nYes: Hide the redundant fourth-tier assemblers from Planetaris Hyarion and Lithium Battery when present. Their items, recipes, technologies and obsolete upgrade links are cleaned up. [color=red]RECOMMENDED[/color]\nNo: Preserve those mods' native assembler tiers.\n\n[font=default-small][color=green]K2SO's advanced assembler already covers this role. Changing this startup setting requires a restart.[/color][/font]
razi-enable-expedition-briefings=[font=default-bold]Galaxy exploration notes[/font]\nYes: Keep each planet mod author's description and append Razi's colored system heading and short expedition briefing. [color=red]RECOMMENDED[/color]\nNo: Leave original planet and space-location descriptions untouched.\n\n[font=default-small][color=green]Text only. Does not change destinations, routes, research or production.[/color][/font]

razi-route-highlight-style=Visual-only colored guides for major interstellar travel and dangerous asteroid belt crossings. Colors indicate approximate asteroid danger: teal, amber, orange and violet. Subtle (recommended) leaves curved approach routes gray and reduces opacity. Clear includes the additional belt approach highlight. Off shows Factorio's original unmodified route lines. This startup setting never creates routes or changes research. If Space Route Overlay is installed, Razi does not draw duplicate overlays.
