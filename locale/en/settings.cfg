[mod-setting-description]
razi-habitat-armoured-biters=Controls which listed planets receive additional armoured biters nests from RP3. Easy uses Limited, Normal Curated, Hard Expanded and Nightmare All. Nexus remains included whenever enabled. Off disables only RP3-added nests, never the original mod's natural enemies. Requires restart; previously generated chunks stay unchanged. Eligible: Hyarion, Crucible, Castra, Athos, Ferrum, Obsidiax, and Nexus (always eligible when enabled). Follow difficulty is the recommended default; a manually selected tier overrides only this family.
razi-habitat-cold-biters=Controls which listed planets receive additional cold biters nests from RP3. Easy uses Limited, Normal Curated, Hard Expanded and Nightmare All. Nexus remains included whenever enabled. Off disables only RP3-added nests, never the original mod's natural enemies. Requires restart; previously generated chunks stay unchanged. Eligible: Aquilo, Frozeta, Shchierbin, Vesta, Muria, Balack, and Nexus (always eligible when enabled). Follow difficulty is the recommended default; a manually selected tier overrides only this family.
razi-habitat-explosive-biters=Controls which listed planets receive additional explosive biters nests from RP3. Easy uses Limited, Normal Curated, Hard Expanded and Nightmare All. Nexus remains included whenever enabled. Off disables only RP3-added nests, never the original mod's natural enemies. Requires restart; previously generated chunks stay unchanged. Eligible: Moshine, Cubium, Corrundum, Crucible, Obsidiax, and Nexus (always eligible when enabled). Follow difficulty is the recommended default; a manually selected tier overrides only this family.
razi-habitat-toxic-biters=Controls which listed planets receive additional toxic biters nests from RP3. Easy uses Limited, Normal Curated, Hard Expanded and Nightmare All. Nexus remains included whenever enabled. Off disables only RP3-added nests, never the original mod's natural enemies. Requires restart; previously generated chunks stay unchanged. Eligible: Cubium, Vesta, Paracelsin, Rabbasca, Foliax, Gleba, Velora, Khemia, Crucible, and Nexus (always eligible when enabled). Follow difficulty is the recommended default; a manually selected tier overrides only this family.
razi-habitat-arachnids=Controls which listed planets receive additional arachnids nests from RP3. Easy uses Limited, Normal Curated, Hard Expanded and Nightmare All. Nexus remains included whenever enabled. Off disables only RP3-added nests, never the original mod's natural enemies. Requires restart; previously generated chunks stay unchanged. Eligible: Arig, Crucible, Castra, Athos, Panglia, Tenebris, and Nexus (always eligible when enabled). Follow difficulty is the recommended default; a manually selected tier overrides only this family.
razi-habitat-electric-enemies=Controls which listed planets receive additional electric enemies nests from RP3. Easy uses Limited, Normal Curated, Hard Expanded and Nightmare All. Nexus remains included whenever enabled. Off disables only RP3-added nests, never the original mod's natural enemies. Requires restart; previously generated chunks stay unchanged. Eligible: Corrundum, Ribbonia, Fulgora, Ferrum, Cerys, Khemia, and Nexus (always eligible when enabled). Follow difficulty is the recommended default; a manually selected tier overrides only this family.
razi-factory-throughput=Scales crafting speed of supported assembling machines and furnaces, including K2SO and source-mod buildings. Existing factories are affected after mod reload.
razi-fortification-durability=Scales maximum health of walls and gates from installed mods without modifying enemy units, weapons or turrets.
razi-resource-frequency=Custom mode: scale ore, scrap and modded resource frequency on eligible planet map-generation controls. Doesn't enable resources forbidden on a planet.
razi-resource-patch-size=Custom mode: adjust patch sizes on all registered compatible world resources. Preserves each planet's original generation recipe.
razi-resource-richness=Custom mode: adjust richness of eligible ore, scrap and oil controls. Doesn't rewrite mined inventories or existing chunks.
razi-science-demand=Custom mode: adjust research price without modifying technology requirements or science-pack unlocks.
razi-evolution-speed=Custom mode: scale the native enemy evolution rates from time, pollution and destroyed nests. No additional enemy AI scripts.
razi-rocket-launch-cost=Adjust the number of rocket-part crafts needed per launch. Applies to compatible vanilla and modded silos when the game loads. Changing this on existing saves can affect partially assembled rockets.
razi-spoilage-pressure=Adjusts the Factorio 2.1 global spoil-time modifier, affecting spoilable items from supported mods. Easy grants more time, Hard and Nightmare demand faster biological logistics. Requires starting a new game to reliably take effect.
razi-pollution-pressure=Sets pollution diffusion and its threshold using native Factorio map settings.
razi-raid-coordination=Controls native enemy attack group size, number of gathering groups and preparation time. Multiplayer-safe caps.
razi-colony-expansion=Controls colony settler group size and native expansion cooldowns without per-tick scripts.
razi-default-new-game-map=After changing Difficulty and restarting Factorio, New Game automatically selects the matching Razi Protocol preset: Easy, Normal, Hard, Nightmare or Custom. When enabled, Razi takes priority over other mods' initial preset selection (their presets remain available). Disable this setting to retain vanilla or another mod's default. Factorio cannot store explicit map-generation controls in a default-selected preset, so the four full editable map profiles remain available for manual selection. Custom uses Normal world-generation baselines together with your saved advanced Razi gameplay overrides.
razi-enemy-pressure=Controls generation frequency of integrated enemy nests, not the number of script events every tick. Already explored chunks remain unchanged.
razi-nexus-hostility=Raises the intensity of Nexus's combined enemy ecosystem, without suppressing native biters.
razi-big-monsters-events=RP3 uses the source mod's published on/off and surface APIs when installed. Hard and Nightmare enable events. Its interval and event probabilities remain adjustable in Big-Monsters settings.
razi-difficulty-preset=[color=#E6BC80]WARNING - CROSS-MOD GAMEPLAY OVERRIDES:[/color] Razi's difficulty affects many integrated systems from other mods, including enemies, resources, research, rocket launches, factory throughput, asteroids, Nexus, Big Monsters and HELIOS. [color=#E6BC80]These difficulty rules can override or stack with related gameplay settings from compatible mods, even if you change those mods' settings yourself.[/color] Their saved settings are not overwritten, and unrelated mod options still work normally. [color=#E6BC80]RESTART REQUIRED:[/color] After changing difficulty, confirm your settings and [color=#E6BC80]restart Factorio immediately[/color] before creating or loading a game. Automatic map preset selection follows the chosen difficulty after restarting. Individual settings in this menu may still show their saved values rather than the effective difficulty values; manually overridden Razi controls are respected. Custom uses your manually saved Razi values. Already-generated terrain is not rebuilt. Source-owned runtime integration: Rocket Reusability 1.1.8+ can adjust five of its own actual Map settings on Hard/Nightmare (recovery chance, approach distance, wreck limit, side approaches and side chance), then restore saved manual values outside those difficulties. Razi Protocol cannot directly change other mods' saved settings, especially their startup settings. Razi also applies difficulty-selected values to compatible foreign startup settings read during later mod prototype passes (numeric Muluna and Rubia output, research requirement (fixed/percentage) and cost multipliers only; K2SO recipe/feature toggles are excluded); their saved Mod Settings menu values remain unchanged. Custom disables these cross-mod overrides.
razi-hide-spoilers=Hide unreached research and Journal chapters. Available discoveries stay visible. Shared by the whole map; changes apply immediately.
razi-hide-other-tech-spoilers=Also hide future research from other mods. Turn off if a mod manages its own tech visibility. Requires Hide future discoveries.
razi-clean-startup-chat=Clear the console once at the start of a new map. Also removes other mods' startup messages and warnings; later chat stays untouched.
razi-show-welcome=Show your first-visit expedition briefing with Journal, wiki and Discord links. Use /razi-welcome to read it again.
razi-journal-show-button=Show the gold Journal shortcut in the top-left. The Ctrl+Shift+J shortcut still works when hidden. Personal setting; instant.
razi-journal-show-tracker=Show the sidebar for pinned Journal objectives. Hiding it keeps your pinned objective. Personal setting; instant.
razi-enable-enemy-routing=Place supported enemy factions on fitting worlds. Off restores source-mod placement. Only newly generated terrain is affected.
razi-quality-asteroids=Spawn higher-quality asteroids along the 10-level threat scale. Home routes stay safe; outer routes offer greater risk and rewards.
razi-asteroid-difficulty-scale=Balanced preserves the intended 10-level progression; Challenging and Relentless increase danger on advanced routes.
razi-asteroid-population=Change hostile asteroid frequency on Razi-curated routes: 65%, 100%, 130% or 160%. Does not change asteroid types.
razi-belt-threats=Scale extra large asteroid encounters in Razi's belt crossings: 50%, 100% or 150%. Native encounters are unchanged.
razi-belt-resource-richness=Scale Razi-added belt ore to 60%, 100% or 150%. Other planets and original asteroid mining are unchanged.
razi-belt-midsection-salvage=Add harvestable ore to the dangerous middle of Razi belt crossings. Off keeps the original resource layout.
razi-belt-edge-harvesting=Add passive ore harvesting at safer belt edges. Off makes belt trips more dependent on combat.
razi-performance-asteroid-particles=Reduce cosmetic asteroid impact particles. May improve FPS, not necessarily UPS. Gameplay and resource drops stay intact. Off by default.
razi-performance-weapon-particles=Reduce cosmetic projectile and beam particles. Damage is unchanged; some weapon effects look simpler. Off by default.
razi-performance-reduced-fragments=Reduce native chunks released by destroyed large asteroids. Lowers entity counts AND resource yields. Off by default.
razi-performance-outer-hostile-density=Reduce hostile asteroid spawns by 28% on level 8-10 routes. Makes the outer galaxy easier. Off by default.
razi-performance-space-explosion-smoke=Reduce cosmetic smoke in space explosions. Damage and sounds remain; visuals may be plainer. Off by default.
razi-performance-asteroid-creation-dust=Reduce cosmetic dust when asteroids spawn. Real asteroids and quality rolls stay unchanged. Off by default.
razi-performance-compact-route-overlays=Use fewer precomputed route-line sprites. Saves map graphics work but makes some curves less smooth. Does not affect UPS. Off by default.
razi-planetary-interdependence=Off removes optional freight alternatives; Balanced offers a curated network of material-based factories; Deep raises imported ingredient quantities by 50%. Existing planet progression stays intact.
razi-enable-k2so-production-exchanges=Enable curated cross-world K2SO production using real exported goods. Exchange research uses ordinary science, and source recipes remain unchanged.
razi-enable-modded-planet-exchanges=Enable curated manufacturing links and the four industrial network components when source mods are available. Off preserves original source recipes.
razi-distributed-technology=Tie selected robots, nuclear and companion research to appropriate planetary science. Off keeps source unlocks.
razi-stage-aquilo-breakthroughs=Keep Aquilo's cryogenic tools, but earn foundation after Maraxsis and Paracelsin, fusion after Cubium and Tenebris, and legendary quality after outer-frontier mastery. Off keeps original unlock timing. New campaigns recommended.
razi-companion-science-weave=Connect supported rail and shield research to regional science when all prerequisites exist. Off keeps source technologies.
razi-orbital-catapult-local-links=Add two-way freight links among Muria, Rubia and Aquilo. Uses Orbital Catapult's normal machines and costs.
razi-orbital-catapult-regional-links=Add short two-way catapult links in Solaris, Nyxaris and Vespera. Does not bypass asteroid belts.
razi-route-distance-repair=Correct unusually short travel distances on faraway source routes. Off retains the source mods' distances.
razi-dyson-milestone-weave=Link later Dyson upgrades to regional research milestones. Native Dyson machinery and output remain unchanged.
razi-dyson-calidus-layout=Arrange the source Dyson orbit locations in compact rings around Calidus. Visual placement only.
razi-helios-progression=Late adds HELIOS engineering after the middle systems. Epic delays star access until outer-frontier mastery if the research graph permits it. Legacy retains the existing research gates.
razi-helios-construction=Off leaves source recipes and research unchanged. Engineering adds physical corona shields, swarm frames and relay matrices. Satellites also adds one component to native satellite recipes when a compatible machine has sufficient ingredient slots.
razi-helios-commissioning=Expedition creates two physical orbital consignments and a powered planetary-grid project. Monumental increases requirements. Real cargo must be delivered while physically aboard a stopped, force-owned platform. Off leaves native Dyson progress unchanged.
razi-helios-coronal-surges=Coronal pulses interrupt commissioning and reset uninterrupted station keeping. Occasional: 60 seconds every 10 minutes; Volatile: 80 seconds every 6 minutes 40 seconds. No extra asteroid spawning or hull damage. Native plasma hazards remain.
razi-helios-convergence-proof=Optional for new campaigns: require commissioned solar projects and powered planetary anchors before the last Convergence delivery. Off protects existing campaigns and preserves the native source mod's victory-neutral mechanics.
razi-helios-route-danger=Native preserves source hazards. Challenging and Extreme add a stronger asteroid gauntlet to every retained solar-orbit route. Source plasma and modded asteroid drops stay intact.
razi-helios-route-distance=Every surviving stellar approach is an endgame expedition: Extended outer/inner minimums are 125,000 / 65,000 km; Marathon 175,000 / 100,000 km. Longer native links are kept. The two legs show Level 8–9 and 9–10 danger under Razi's shared quality scale.
razi-hide-redundant-assembler-tiers=Hide duplicate tier-4 assemblers already covered by K2SO. Off keeps the source mods' machines and unlocks.
razi-enable-expedition-briefings=Add short system notes to original planet descriptions. Off restores the original descriptions. Text only.
razi-group-barreling-recipes=Move verified fill/empty barrel recipes into a Fluids group. Recipes and crafting are unchanged.
razi-group-spoilable-recipes=Put single-output spoilable intermediates in their own group. Experimental; does not change spoil timers.
razi-hand-crafting-cleanup=Remove machine-only recipes from the character crafting menu. Keep hand-craftable recipes, machines, research and Factoriopedia intact. All covers installed mods; Razi covers razi-prefixed recipes only. Shared startup setting: restart to apply.
razi-route-overlay-mode=Off uses native lines; Danger colors routes by level 1-10; Chapter adds chapter styling. Routes stay clickable.
razi-route-overlay-scope=All colors every verified route; Major colors only main corridors and belt crossings. Missing geometry stays native.
razi-curated-space-routes=Use Razi's intended interplanetary connections while retaining essential source routes. Off keeps source-mod extras.
razi-route-intelligence=Add distance, hazards, harvestable chunks and ship advice to route tooltips. Travel itself is unchanged.
razi-route-visibility=Change colored route opacity: Soft, Standard or Bright. Native connections remain visible and clickable.
razi-route-detail=Economy draws fewer curve points; Smooth draws more. Standard balances line quality and map graphics cost.
razi-route-show-danger=Show each route's danger rating on the 1-10 scale in tooltips.
razi-route-show-sizes=Identify the largest hostile asteroid expected on a route.
razi-route-show-salvage=List collectible asteroid chunk types along each route.
razi-route-show-advice=Include suggested ship defenses for hazardous routes.
razi-route-show-unknown=Warn when a source mod's asteroid hazards cannot be determined.
razi-route-show-belts=Identify required asteroid belt crossings in route tooltips.
razi-route-show-sectors=Identify a route's origin and destination star systems.
razi-route-show-haul=Flag long-distance cargo journeys in route tooltips.
razi-starmap-background-style=Off preserves the native sky. Subtle keeps a clean, quiet navigation chart. Cinematic adds distinctly denser stellar clusters, layered real-star lighting and distant coloured dust while keeping paths readable. Cosmetic only.
razi-starmap-orbit-density=Full draws all native planet rings; Balanced and Clean draw fewer; Off hides Razi-managed rings.
razi-starmap-system-halos=Show faint color glows around star systems. Does not alter map positions.
razi-starmap-belt-atmosphere=Show thin dust rings around the real asteroid belts. Hazards remain unchanged.
razi-starmap-soften-bellicos=Dim excess Bellicos pulsar glare while keeping its recognizable shape.
razi-starmap-fine-details=Show sparse background stars beyond the main planetary systems.
razi-starmap-galactic-ornaments=Show a few faint nebula pockets between the main systems.
razi-starmap-micro-details=Show tiny, low-opacity star flecks for extra sky texture.
razi-starmap-cinematic-extras=Only in Cinematic: additional nearby star clusters, layered coronas around actual stars, and soft sector-coloured dust far from planets. Independent of route and orbit gameplay. Honors halo, fine-detail, ornament and micro-detail switches. Uses existing textures, with no per-tick effects.
razi-starmap-cartography=Add a small observatory-style star chart near Calidus. Off by default.
razi-map-star-intensity=Adjust background star brightness; does not affect gameplay.
razi-map-halo-intensity=Adjust star-system halo brightness; does not affect gameplay.
razi-map-belt-intensity=Adjust belt dust brightness; asteroid encounters are unchanged.
razi-map-dust-intensity=Adjust small nebula and dust accents; does not affect gameplay.

[map-gen-preset-name]
razi-protocol-custom=Razi Protocol: Custom

[map-gen-preset-description]
razi-protocol-custom=Uses your manually configured Razi gameplay settings with Normal world-generation baselines. Set difficulty to Custom and restart Factorio before starting a game. Selecting a full Razi map profile manually is still possible.
