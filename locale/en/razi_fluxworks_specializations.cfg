[recipe-description]
razi-fw-calidus-specialty=Use Calidus ores and crystallised Flux to make a batch of industrial metal mesh. The Synthesis Plant stays productive even when the galaxy is still unfamiliar.
razi-fw-solaris-specialty=Red Flux and tungsten carbide anneal ordinary cermet into an advanced structural composite inside the Arc Foundry.
razi-fw-nyxaris-specialty=Regenerate nutrient beds using Gleba bioflux, spoilage and Biological Flux. A recycling loop for biological factory districts.
razi-fw-vibrant-specialty=Combine holmium and superconductors into a higher-volume resonance substrate production line.
razi-fw-vespera-specialty=A cryogenic synthesis using frozen fluoroketone, lithium, ice and Matter Flux to produce industrial cryogel.
razi-fw-beetlejuice-specialty=Gold from Secretas and established FluxWorks electronics meet Purple and Yellow Flux to form precision quantum computers.
razi-fw-umbra-specialty=Tenebris chitosan stabilizes a dual-spectrum fabrication process, creating useful phase manifolds from existing advanced materials.
