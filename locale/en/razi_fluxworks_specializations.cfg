[technology-description]
razi-fw-calidus-industry=Train the home-system workshops in spectrum-assisted metal fabrication. Optional research; does not gate the campaign.
razi-fw-solaris-industry=Establish a Vulcanus-grade refractory industrial line. Optional research; does not gate the campaign.
razi-fw-nyxaris-industry=Turn Nyxaris spoilage into reusable factory infrastructure. Optional research; does not gate the campaign.
razi-fw-vibrant-industry=Convert Fulgoran electrical materials into resonance-grade industrial components. Optional research; does not gate the campaign.
razi-fw-vespera-industry=Use the Vespera system's extreme cold for refined FluxWorks manufacturing. Optional research; does not gate the campaign.
razi-fw-beetlejuice-industry=Link Secretas precious metals to late-spectrum computation. Optional research; does not gate the campaign.
razi-fw-umbra-industry=Blend Umbra's biological materials with advanced phase manufacturing. Optional research; does not gate the campaign.

