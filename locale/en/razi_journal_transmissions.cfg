[journal-record-body]
nexus-signal=SIGNAL MONITORING / Shield stabilizer online. Three unfamiliar frequencies appeared at once, each with a different repeating beat. Nine empty entries populated the threat display. The team called them 'unknown contacts' until the first one arrived.
nexus-nine=OBSERVATORY LOG / The first six recovered trophies contain fragments matching the old relay casing. When the next summons began, the fragments responded to a signal beneath the storm. The crew's current theory: the relay isn't asking for reinforcements. It's checking whether the expedition can withstand its defenses.
nexus-silence-record=FINAL NEXUS LOG / All nine trophies were placed together. The storm interference dropped and an additional coordinate appeared. No instructions accompanied it. The route is now charted; whether to use it remains a crew decision.
reception=SURVEY ARCHIVE / Spare iron, copper wire, food and two cracked accumulators. That's the first surviving inventory. Someone wrote 'keep the lights on' on the back. A string of numbers below it still doesn't match any local equipment list.
moon=MULUNA ARRAY / A faint repeating interval appeared in three nights of telescope data. The team swapped receivers twice. The timing matches an old factory control diagram found on Nauvis, although nobody knows why.
furnace=CASTRA SALVAGE / The retrieved machine contains almost no original parts. Its serial number matches the mark from Muluna's timing circuit. Engineers called it a reused stencil. The archivist copied both records before the machine went back to work.
living=MOSHINE ANALYSIS / Decoding the lunar signal produced seven bright points and several weaker ones. The team cleared the memory and tried again. This time the line toward Calidus was brighter. No one had entered a route chart.
scar=CERYS REACTOR / The restart diagnostic briefly recorded the same interval seen on Muluna. The chief mechanic asked to keep the raw output, then returned to fixing the coolant pumps.
belt=CONVOY BLACK BOX / The ship reached the far rim with armor missing along the port side. Between the rocks, one frame shows a curved grid against a star. The navigator called it a cage. Years later the Dyson design team drew almost the same shape.
ocean=MARAXSIS TEST / Seadragon launch calculations reproduced the lunar timing interval when optimized for pressure and fuel. Changing either input made the match disappear. The lead engineer wrote 'KEEP' across the readout.
shadow=TENEBRIS LAB / A shielded specimen replied to electrical pulses with light. The first three intervals matched the Muluna recording. All radios were disconnected. The researchers have saved the measurements and declined to name the cause.
network=PRECISION MATRIX TEST / Components from four stars fitted and functioned on the first complete run. The old archive diagram showed another connected line. The technicians checked the imported component records before touching the instrument settings.
sphere=CALIDUS STELLAR WORKS / The first Dyson proposal arrived with a huge bill of materials. A diagram attached by the survey team matched the old asteroid-belt recording. The engineer responsible marked it 'useful reference' and approved the design review.
threshold=RESTRICTED SCIENCE / The seven bright points correspond to working star systems. The blank part of the chart is still unexplained. The lab's new proposal treats it as a signal range rather than a destination. Tests will need singularity equipment.
answer=FINAL ARCHIVE / The fragments contain a question, not a destination: 'What did you keep running when nobody told you to?' The record lists repaired factories, shared supplies, returned ships and a network built without a central owner. The outgoing transmission remains unsigned. It is yours to send.

