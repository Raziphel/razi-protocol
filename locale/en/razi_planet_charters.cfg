# Editorial planetary charters: recommendations, never completed quest flags.
# No charter entry should promise automatic shipments or source-owned unlocks.

[razi-planet-charter]
muluna=Get the lunar base supplying its orbital platform in both directions before attempting longer trips.
vulcanus=Keep the furnaces supplied and find real customers for the metal rather than building an enormous stockpile.
castra=Salvage the battlefield equipment. Plan ammunition production without starving the civilian workshops.
arig=Solve the water and mineral handling first; send specialist materials toward Hyarion afterward.
hyarion=Give crystal processing a stable production line, then check what Arig can supply.
tellus=Protect the biological equipment and join materials from both Solaris branches.
corrundum=Build a sulfur-chemistry line that supplies another factory, not just your laboratory.
gleba=Move perishables quickly. Before exporting anything, check what will still be fresh on arrival.
moshine=Develop processors and optical production. Panglia will give both a purpose.
apia=Study Apia's own biology and royal-jelly processing; don't fold it into Carnova's research sheet.
panglia=Get the DNA and optics labs working reliably before designing an export schedule.
fulgora=Separate the scrap-sorting yard from the manufacturing line you intend to keep running.
cerys=Restore safe reactor operation before counting on its output elsewhere.
ribbonia=Make repaired components worth collecting. Khemia is a nearby customer; Outer Rim requires a defended platform.
paracelsin=Bring zinc and electrical production online after the belt crossing. Keep the return ship stocked.
muria=Set up corrosion-resistant chemical production before trying to supply Rubia or Athos.
athos=Make particulate processing work at scale. Its science also contributes to the recovery charter.
rubia=Turn recovered material into dependable factory inputs. Find out which colonies actually need them.
aquilo=Solve heat distribution first. Higher-tier machinery won't help a production line that freezes.
nulla=Recover useful robotic equipment from the abandoned facilities. Expect resistance from the machines still operating.
maraxsis=Get pressure-safe production and submarine logistics working before planning interplanetary deliveries.
cubium=Build a steady central yard before supplying Linox and Secretas.
linox=Make rare-earth refining reliable despite the heat and cramped working conditions.
secretas=Plan the recovery capacity and cargo routes; expensive materials are useless if the ship doesn't return.
frozeta=Put the salvaged parts into a workable cold-weather production line.
tenebris=Plan around the living chemistry rather than treating it as ordinary ore processing.
crucible=Test the extreme-pressure machinery before relying on its output in other systems.
vesta=Establish magnetic and gas-processing production; outer projects will need both.
abacayba=Bring what you need for a self-contained optional survey. Do not plan essential freight around it.

[razi-planet-freight]
muluna=Check whether the moon and its platform can keep supplies moving regularly.
vulcanus=Export foundry products that another installed recipe can use. Check the actual item cost first.
castra=Military parts may be useful elsewhere. Verify the recipe and available stock before loading a platform.
arig=Compare Arig's output with the downstream ingredient lists; don't ship blind.
hyarion=Precision parts make sensible regional freight when the receiving recipe is unlocked.
tellus=Biological production needs timed deliveries and real storage capacity.
corrundum=Sulfur-chemistry exports are worthwhile only when there's a factory ready to receive them.
gleba=Check spoilage against flight time before committing a full hold.
moshine=Processors and optical parts are useful trade goods once the source recipes are available.
apia=Keep its biological production separate from Carnova's; review native recipes before exporting.
panglia=Panglite products may feed Moshine equipment. Confirm the actual exchange recipe before scheduling cargo.
fulgora=Sort usable salvage and holmium products before treating the scrapyard as a supplier.
cerys=Reactor research alone doesn't put export goods on a launch pad. Inspect the available production.
ribbonia=Repairable components can supplement the inner-system factories, including Khemia.
paracelsin=Zinc and electrical equipment must cross the belt and arrive at a factory with a use for them.
muria=Check current stock and the destination's chemistry requirements before shipping bulk minerals.
athos=Particulate Science is research. Any physical cargo still needs a ship and a receiver.
rubia=Make the composites to order rather than filling storage with speculative exports.
aquilo=Cold-control equipment is valuable when the destination can actually craft with it.
nulla=Robotic salvage may be useful freight. Verify the installed recovery recipes.
maraxsis=Subsea products need pressure-safe production on the planet and ordinary logistics above it.
cubium=Look for recipes that use Cubium's specialist processing instead of assuming every output is tradable.
linox=Rare-earth parts are worth hauling once the receiving factory is ready.
secretas=Gold and other unusual materials justify targeted loads, not unrestricted supply lines.
frozeta=Check which recovered components other worlds can use, then arrange the freight.
tenebris=Its biological materials can feed other industries only when those recipes are present.
crucible=Plan shipments from the actual pressure-production recipes, not a proposed shortcut.
vesta=Supermagnets may support high-tier projects. Check the installed bill of materials first.
abacayba=No essential export is expected from this optional world.

[razi-star-signature]
calidus=Home workshop / Keep the power stable, launch a reliable platform and maintain the Muluna supply run.
solaris=Foundries and defense / Different colonies make different parts. Arrange the freight instead of expecting research to deliver them.
nyxaris=Biology and computation / Fresh materials need short delays. Let optical production and living factories support each other.
vibrant=Salvage and electrical works / Fulgora, Ribbonia and Khemia are inside the belt. Build a ship for the crossing to Paracelsin.
vespera=Harsh-weather industry / Muria's chemicals, Rubia's machines and Aquilo's cold lines need dependable shipments.
beetlejuice=Outer materials / Keep Cubium, Linox, Secretas and Frozeta supplied without flooding the network with unused stock.
umbra=Pressure and magnets / Vesta serves the exterior; the Shattered Divide guards the inner Tenebris and Crucible routes.
