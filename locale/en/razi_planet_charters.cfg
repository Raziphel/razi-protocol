# Editorial planetary charters: recommendations, never completed quest flags.
# No charter entry should promise automatic shipments or source-owned unlocks.

[razi-planet-charter]
muluna=Prove that a lunar outpost and its orbital platform can supply one another before relying on longer voyages.
vulcanus=Establish dependable foundry throughput, then investigate which distant manufacturers can actually use its metals.
castra=Recover defense production and plan how to supply weapons without starving the civilian industrial chain.
arig=Solve the desert's scarce-resource processing, then connect it to Hyarion's precision industry.
hyarion=Build a reliable crystal-processing base and investigate a complementary exchange with Arig.
tellus=Protect biological manufacturing from disruption while integrating materials from both Solaris branches.
corrundum=Make sulfur chemistry into a useful cross-frontier industry rather than an isolated science stop.
gleba=Engineer spoilage-aware output and decide which perishables are worth the cost of sending between stars.
moshine=Develop computation and optical infrastructure, then test how its data work supports Panglia.
apia=Investigate the twin biological expedition without reducing its ecosystems to a single research purchase.
panglia=Turn unusual optics and DNA research into an accountable factory program, not just another unlock chain.
fulgora=Separate salvage recycling from dependable advanced manufacturing before planning exports.
cerys=Restore cold-world systems and assess their usefulness without confusing reactor recovery with delivered power.
ribbonia=Build a repair economy from recovered components and trace which shortages it can relieve.
paracelsin=Develop its specialist chemistry and electronics, then examine both the Moshine and Rubia links.
muria=Make the Vespera mineral works capable of supporting its remote Rubia and Athos expeditions.
athos=Develop fine particulate processing and connect this specialized knowledge to the recovery charter.
rubia=Build a robust waste-to-industry program and decide which colonies most need its unconventional materials.
aquilo=Solve extreme cold and power resilience without allowing late technology to erase every remaining challenge.
nulla=Investigate abandoned robotic maintenance and connect its salvaged expertise to Athos's restoration effort.
maraxsis=Make underwater logistics and native marine industry support the wider Vespera frontier.
cubium=Establish an outer-system industrial base that has reasons to cooperate with Linox and Secretas.
linox=Develop rare-earth production into a strategic resource without bypassing its own difficult extraction.
secretas=Recover valuable materials without allowing high-value imports to trivialize all subsequent planets.
frozeta=Survive the outer cold while making existing industry useful beyond a single world.
tenebris=Harness dangerous organic chemistry and plan routes that preserve its local constraints.
crucible=Engineer robust extreme-heat production before trusting its output in an outer-frontier supply network.
vesta=Develop specialized magnetic engineering as an earned step toward the last deep-space projects.
abacayba=Survey the optional outer moon as an independent expedition, not a mandatory checkpoint for victory.

[razi-planet-freight]
muluna=Lunar instruments and asteroid processing offer a nearby proving ground for practical platform supply. No shipment is assumed.
vulcanus=Treat Vulcanus as a candidate metallurgy supplier. The planning board uses installed recipes rather than inventing export stock.
castra=Castra's military components may support other worlds, but researched recipes and real stock decide what can ship.
arig=Test Arig materials against currently available downstream factory recipes. Desert routes are not automatic freight.
hyarion=Precision components are a prospective regional input. Verify the native ingredient bill before preparing cargo.
tellus=Living production needs reliable deliveries; any claimed import quantity must come from a real enabled recipe.
corrundum=Use the native chemical chain as a candidate supplier to later worlds; a researched gate does not certify transport.
gleba=Perishable goods require deliberate handling and transit planning; a proposed supply line is not delivered freight.
moshine=Optical and analytical production make a possible partnership, subject to actual source recipe unlocks.
apia=Royal-jelly and paired-world biology invite careful native production; preserve the author's source recipes.
panglia=Panglite-derived materials can participate in optional native-checked exchanges with Moshine.
fulgora=Scrap recovery and holmium-related industry are possible inputs; require actual craftable products.
cerys=Cerys technologies remain source-owned; inspect the real bill of materials before declaring a supplier.
ribbonia=Recovered manufacturing may complement other factories; no speculative item or active route is promised.
paracelsin=Zinc and electrical products are candidates for recipe-backed trade, not proof that any platform is loaded.
muria=Bulk minerals create potential export pressure; inspect current cargo and routes before planning a transfer.
athos=Particulate research is an authentic milestone; physical freight remains a separate, manual operation.
rubia=Rubia composites belong in deliberate interplanetary planning, with costs verified against installed recipes.
aquilo=Cryogenic equipment is powerful but should be evaluated alongside live research and destination requirements.
nulla=Robotic salvage is a source-world discipline; do not promise a cargo output until the installed recipe proves it.
maraxsis=Ocean-produced materials require real surfaces, recipes and transport; the Journal does not invent deliveries.
cubium=Cubium's specialist processing can use external materials where source recipes allow it.
linox=Rare-earth components are a candidate outer-system export; exact quantities depend on unlocked native recipes.
secretas=Gold and unusual native resources invite targeted exchange, not unrestricted cross-system shortcuts.
frozeta=Treat cold-world production as a specialized supplier; cargo feasibility is checked separately.
tenebris=Tenebris's chitin industry may support Rubia or Vesta, subject to verified source materials and recipes.
crucible=Hazardous manufacture should be a distinct supplier role, never a free substitute for source progression.
vesta=Supermagnet production offers distinctive high-tier collaboration, without creating a new first-discovery gate.
abacayba=No required export is presumed from this optional world; use only genuinely installed source technologies.
