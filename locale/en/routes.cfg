dispatch=RAZI field dispatch
dispatch-home-departure=The first manifest needs fuel, supplies and a platform able to return; neither new frontier is a one-way instruction.
dispatch-lunar-proving=Short lunar freight is where asteroid-fed production becomes a dependable interstellar supply chain.
dispatch-solaris-first=Foundries and defense contracts were among the first links restored. Bring materials for heat and industrial construction.
dispatch-nyxaris-first=Old biology shipments spoiled on delayed routes. Plan fresh inputs and resilient cargo handling.
dispatch-vibrant-link=This branch carries the skills of metalworking toward a world where power and salvage matter more.
dispatch-vespera-link=The living frontier once supplied colonies that could not grow their own essentials. Plan for cold and corrosive industry.
dispatch-umbra-link=The last ordinary logistics corridor ends at a frontier whose inner worlds require a real belt crossing.
dispatch-frontier-bridge=The two first-frontier industries exchange what neither produces well alone; this route never substitutes for discovery.
dispatch-aegis-solaris=First-frontier power and ammunition must survive a long, asteroid-rich Aegis crossing. Prepare for big asteroids before departure.
dispatch-aegis-nyxaris=Biological logistics meet hostile Aegis debris. Supply sustained turret fire and repairs before committing the expedition.
dispatch-outer-bridge=An outer-ring freight option joins wreckage recovery and deep industrial work without erasing either chapter.
dispatch-vibrant-outer=Outer-side approach only. The true inner-to-outer crossing remains a separate hazardous connection.
dispatch-vibrant-inner=Load the ringworld's electrical supplies here and verify ammunition before taking the physical belt passage.
dispatch-vibrant-crossing=No ledger can make this rock field safe. Sustain weapons, repairs and power through the full crossing.
dispatch-beetlejuice-outbound=Past the belt, the outer industries begin with Cubium's demanding cargo network.
dispatch-paracelsin-reach=The journey beyond the rocks ends in cold chemistry. Preserve your ship's supplies for surface work.
dispatch-furnace-approach=The first industrial shipment is simple metal until its furnaces must supply another world.
dispatch-foundry-defense=Castra's defense manufacturing depends on the reliability of upstream heavy industry.
dispatch-furnace-desert=Metallurgy travels into dust and sandstorms; carry spare construction parts for exposed machinery.
dispatch-battle-desert=Two harsh industries share materials, but each solves a different survival problem.
dispatch-glass-crystal=Dry-world processing and crystal precision meet on this short industrial return route.
dispatch-crystal-tellus=Optics leave the lava fields for a living world where contamination is the greater hazard.
dispatch-tellus-sulfur=The final Solaris leg changes living-world products into a sulfur-chemistry research chain.
dispatch-crystal-sulfur=A regional alternative keeps specialized glass and crystal freight moving toward chemical finishing.
dispatch-solaris-loop=The northern return arc closes Solaris's industrial loop without requiring another solar departure.
dispatch-bio-data=Perishable biomass and durable observations have different shipping clocks. Plan both.
dispatch-data-twins=Scientific records enter a paired biological subsystem; the original orbital links still matter.
dispatch-bio-twins=A direct supply option links living production to the twin-world investigation.
dispatch-data-panglia=Data work supports the later timewarp and DNA studies; research still controls entry.
dispatch-twins-panglia=Biological expertise travels outward, but Panglia's native experiments remain its own.
dispatch-gleba-approach=Arriving platforms need a plan for perishables before the first biological factory can run.
dispatch-moshine-approach=Research probes and heat-resistant supply lines begin at the desert-world approach.
dispatch-ringworld-link=Salvaged electromagnetics feed a ringworld whose transport and plasma systems are unforgiving.
dispatch-muria-approach=Start with materials that survive corrosive chemistry; the reliable network begins with this landing.
dispatch-muria-rubia=A storm-scoured industrial partner needs more than a map line: establish repeatable freight.
dispatch-rubia-ocean=Surface logistics give way to pressure domes and submarine industry beneath the ocean.
dispatch-rubia-aquilo=Cold-chain supply matters more than speed. Keep cryogenic industry fed on the remote ice world.
dispatch-cubium-approach=The first outer yard can support two separate expeditions; stock it before committing a fleet.
dispatch-linox-furnace=Confined furnace production demands careful materials accounting and robust cargo capacity.
dispatch-secretas-branch=Industrial freight yields to a distant asteroid crossroads and the recovery branch beyond.
dispatch-frozeta-recovery=Wreckage salvage is production, not a convenient shortcut; plan room for recovered materials.
dispatch-beetlejuice-shuttle=The two outer specialists can exchange cargo without returning through Cubium.
dispatch-umbra-staging=Exterior staging point. Ammunition reserves and repair stock are part of the route plan.
dispatch-umbra-crossing=The Shattered Divide has one surveyed passage. A defended platform is not optional.
dispatch-umbra-inner=Inside the debris band, darkness and bioluminescent industry replace the outer cargo yard.
dispatch-umbra-pressure=The dark-world supply chain ends at a pressure-intensive orbital transfer.
dispatch-vesta-exterior=The gas-world yards stay outside the belt, ready to supply later inward expeditions.
dispatch-deep-from-secretas=An outer shipyard can supply the final staging edge; distant research still gates departure.
dispatch-deep-from-vesta=Pressure and fluid industry make a useful final resupply before the charter's old maps run out.
dispatch-deep-nexus-survey=The first deep-sector crossing needs reserves for sustained asteroid defense and the return leg before investigating Nexus.
dispatch-deep-black-hole-approach=Resupply points are sparse along this remote passage. Check repair materials, power and ammunition for both directions.
dispatch-deep-black-hole-final=A short final transfer follows an immense expedition. Keep this approach distinct from the long-haul corridor that brought you here.
dispatch-deep-oort-transition=This frontier grows quieter, not necessarily safer. Dependable cargo reserves matter more than nominal cruise speed.
dispatch-deep-sol-approach=Sol lies beyond another long haul. The previous station's emergency stock will not follow a departing fleet automatically.
dispatch-deep-shattered-approach=Survey the approach before the true Shattered expedition. Reaching this waypoint does not mean the real planet has been visited.
dispatch-deep-shattered-shuttle=Only 1,000 km separates the Approach from the actual Shattered Planet. They remain two distinct destinations.
dispatch-deep-lost-beyond=This optional expedition continues beyond the real Shattered Planet. Plan for a distant frontier, not a nearby moon transfer.
dispatch-athos-spur=An optional mineral-science side route from corrosive industry to the dry world's native challenges.
dispatch-obsidiax-spur=Cold lava and unusual stone production are served from Vesta without crossing the Shattered Divide.
dispatch-rabbasca-moon=A short moon run still requires a plan for power and defended installations.
dispatch-velora-moon=Old ruins and unusual manufacturing sit close to Gleba, but this optional trip has its own risks.
dispatch-shchierbin-spur=A direct vanadium supply path remains entirely on the outer side of Vibrant's belt.
dispatch-alchemy-spur=Inner-side electrical freight reaches Khemia directly from Ribbonia. This optional alchemy branch does not cross the asteroid belt.
dispatch-arcanyx-spur=A specialist voidcrafting branch follows the inner Umbra industry rather than bypassing its belt.
dispatch-carna-spur=Snowbound salvage joins the inner network only after the actual hazardous crossing.
dispatch-balack-spur=Optional post-Aquilo salvage keeps its native research requirements and exposure risks.
dispatch-ferrum-spur=Magnetic and remote-controlled industry offers an optional branch from the outer shipyard.
dispatch-foliax-spur=An optional botanical works belongs to Nyxaris without becoming a chapter prerequisite.
dispatch-pelagos-spur=Optional ocean freight supports local exploration, never a compulsory chapter gate.
dispatch-pelagos-data=A research-oriented side route to a world with its own oceanic rules.
dispatch-dea-dia-spur=Optional subsystem approach; local routes and discoveries remain source-owned.
