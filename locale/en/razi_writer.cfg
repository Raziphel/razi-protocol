# Razi Protocol: writer mode (scripts/razi_writer.lua, scripts/razi_story.lua).
# Plain facts only. The stub shows where a text slot is and how long its text may be.

[razi-writer]
command-help=Writer mode for the story text. Admin only. Usage: /razi-writer on|off, /razi-writer keys on|off, /razi-writer quest <id>, /razi-writer chapter <id>, /razi-writer records [off]
slot=[color=gray][slot __1__ — __2__, up to __3__ characters][/color]
key-tooltip=Slot key: __1__
admin-only=Writer mode is for admins only.
mode-on=Writer mode is on. Story slots are shown with your text from locale/en/story-*.cfg, or a stub.
mode-off=Writer mode is off.
not-on=Writer mode is off. Turn it on with /razi-writer on.
keys-on=Slot keys are shown in the tooltip of each text.
keys-off=Slot keys are hidden.
records-on=All Archive records are open.
records-off=Archive records open as their quests are completed.
unknown-id=Unknown id: __1__
quest-hidden=Quest __1__ is not available yet. Research what it needs, for example with /razi-cheat.
usage=Usage: /razi-writer on|off, /razi-writer keys on|off, /razi-writer quest <id>, /razi-writer chapter <id>, /razi-writer records [off]
