[recipe-description]
razi-fw-calidus-solaris-assembly=Combines Calidus-made metal mesh with Solaris cermet and Fuel Flux to form high-volume aerospace frames. The original low-density structure recipe remains available.
razi-fw-nyxaris-vibrant-assembly=Turn Nyxaris nutrient beds and Vibrant resonance hardware into processing units using Biological and Chemical Flux.
razi-fw-solaris-vespera-assembly=Fuse Solaris annealed cermet with Vespera cryogel and two Flux spectra to produce durable thermal buffers.
razi-fw-vibrant-beetlejuice-assembly=Combine advanced Vibrant resonance substrates with Secretas-made quantum computers to forge resonance cells.
razi-fw-nyxaris-umbra-assembly=Blend Nyxaris nutrient culture with Tenebris chitosan and phase manifolds under two Flux spectra to make rift stabilizers.
