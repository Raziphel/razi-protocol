[technology-description]
razi-fw-calidus-solaris-exchange=Exchange Nauvis metal mesh and Solaris annealed cermet to build low-density structures. Requires both optional industry milestones; never gates another research branch.
razi-fw-nyxaris-vibrant-exchange=Connect cultivated nutrient-bed composites with Vibrant's resonance substrates and superconductors. An optional bioelectronic supply line.
razi-fw-solaris-vespera-exchange=Move refractory alloys and cryogel between Solaris and Vespera to unlock an alternate thermal-buffer industry.
razi-fw-vibrant-beetlejuice-exchange=Trade Vibrant substrates for Beetlejuice quantum computation and manufacture late-spectrum resonance cells.
razi-fw-nyxaris-umbra-exchange=Use Nyxaris biological substrate and Umbra phase engineering for an optional late-game rift-stabilizer route.

