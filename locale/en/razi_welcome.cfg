priority-network=[color=#D9AE70]FIELD DIRECTIVE 04[/color]  Build reciprocal industry. Shared freight can sustain worlds that no longer answer to one headquarters.
priority-commission=[color=#D9AE70]FIELD DIRECTIVE 05[/color]  Authorized work remains incomplete. Follow the Convergence project for the physical proof still required.
