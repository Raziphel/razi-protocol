project-nexus-trials=The Ninefold Signal
project-caption-nexus-trials=Defeat all nine Nexus bosses across the Whisper, Chorus and Final circles. Silence alone cannot substitute for real victories.
project-progress-nexus-trials=__1__ / __2__ Nexus bosses defeated
project-context-nexus-trials=Nexus never answered an ordinary distress call. The Long Echo expedition heard the signal first and left its warnings scattered. Nine victories are proof that the frontier can meet what answered.
project-measures-nexus-trials=Uses the source Nexus Bosses mod's nine per-force victory flags, not trophies in storage, research unlocks or forged encounter logs.
project-nexus-guide=Call each boss through its native summon beacon, defend the beacon, defeat the arriving threat and recover the source mod's trophies. Three cleared bosses open each successive circle. The original warp key and Silence remain source-owned.
