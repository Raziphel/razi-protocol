project-nexus-silence=Once all nine enemies fall, use their original trophies to forge the warp key and unlock Silence's distant routes. That is still Nexus Bosses progression, not an alternative Razi campaign victory.
project-next-nexus-unavailable=Nexus Bosses is required. Its public victory record is not currently available. Check the mod and its remote interface; progress cannot be guessed.
