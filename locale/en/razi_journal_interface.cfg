project-array-guide=Place RAZI Archive Relays on worlds in three distinct star systems. Keep each powered. As stations come online the recovered fragments appear below, with no free technologies or combat bonuses.
project-array-site=Active receiver: __1__ / __2__
project-array-record-1=ARCHIVE 01 / STATION LOSS. The first station went quiet only after the crew declared all its systems nominal. Their last message requests a second receiver.
project-array-record-2=ARCHIVE 02 / SIGNAL RETURN. The missing reports were forwarded to an internal address that does not appear in any surviving personnel file.
project-array-record-3=ARCHIVE 03 / PRIORITY OVERRIDE. RAZI's network was instructed to preserve the message before preserving the machines. The sender identity remains encrypted.
project-ark-guide=Build a truly self-sufficient expeditionary factory ship: mass alone is insufficient. Its outgoing profile must include at least three thrusters, four defensive turrets and two assemblers.
project-ark-requirements=Required departure loadout: minimum __1__ kg total platform weight, 3 thrusters, 4 ammo turrets and 2 assembling machines. Finish a trip to Solar System Edge, the Deep Space Edge, Nexus or Shattered Planet.
project-ark-candidate=Qualified Ark ready for deep-space departure: __1__
