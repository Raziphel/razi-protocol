project-caption-skybridge=Build catapults at both ends of a corridor and carry a signed consignment between the two worlds.
project-caption-beltbreaker=Cross the Vibrant and Umbra asteroid belts by platform.
project-caption-array=Build and power Archive Relays in three star systems.
project-caption-ark=Build a heavy platform with thrusters, turrets and assemblers and send it to Deep Space.
