project-skybridge-deliver=Certify received freight
project-skybridge-evidence=The signed item certifies delivery between the two worlds. The source mod does not expose which vehicle transported it; this is not proof of a catapult firing.
project-beltbreaker-guide=Prove an actual route traversal. Each record requires a platform departure on the genuine native belt connection followed by a completed trip and arrival. Visiting the rim markers does not qualify.
