project-progress-beltbreaker=__1__ / __2__ belts crossed
project-progress-array=__1__ / __2__ star systems with a powered relay
project-progress-ark=__1__ / __2__ Ark trips completed
project-context-skybridge=The first freight charter ended with a simple question: could two distant colonies move something that both could actually verify?
project-context-beltbreaker=The shipping accounts stopped at the edge of the rock fields. Nobody filed a manifest for the vessels that never emerged.
project-context-array=Three surviving frequencies point to messages older than the expedition. RAZI left receivers without explaining who they were listening for.
project-context-ark=This is not a passenger ship. It is a mobile factory built to keep functioning after every familiar supply route ends.
project-measures-skybridge=Needs Orbital Catapult machines on both ends of a configured corridor and the consignment item carried between the worlds. The game does not record which transport moved it.
project-measures-beltbreaker=Counts platform arrivals after a recorded direct crossing of the Vibrant and Umbra belts. Visits do not count.
project-measures-array=Counts powered Archive Relays in three different star systems. Unpowered or disconnected relays do not count.
project-measures-ark=Needs a heavy platform with thrusters, turrets and assemblers and a completed trip to Deep Space. Weight alone is not enough.
project-next-skybridge-missing=No Orbital Catapult machine was found in the installed mods. Check Orbital Catapult and the corridor settings.
project-next-skybridge-build=Build Orbital Catapult machines at both ends of an available corridor.
project-next-skybridge-sign=Sign the consignment on the sending world. It costs 20 processing units.
project-next-skybridge-deliver=Carry the consignment to the destination world and certify its arrival.
project-next-skybridge-done=Both endpoints are built and the consignment was delivered.
project-next-beltbreaker-vibrant=Fly a platform directly between the Vibrant Inner Rim and Outer Rim.
project-next-beltbreaker-umbra=Fly a platform directly through Umbra's Shattered Divide.
project-next-beltbreaker-done=Both belt crossings are recorded.
project-next-array-build=Build and power Archive Relays in three different star systems.
