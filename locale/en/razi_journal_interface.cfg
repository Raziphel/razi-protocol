project-array-guide=Place Archive Relays on worlds in three different star systems and keep them powered. The project grants no technologies or combat bonuses.
project-array-site=Powered relay: __1__ / __2__
project-array-record-1=ARCHIVE 01 / STATION LOSS. The first station went quiet only after the crew declared all its systems nominal. Their last message requests a second receiver.
project-array-record-2=ARCHIVE 02 / SIGNAL RETURN. The missing reports were forwarded to an internal address that does not appear in any surviving personnel file.
project-array-record-3=ARCHIVE 03 / PRIORITY OVERRIDE. RAZI's network was instructed to preserve the message before preserving the machines. The sender identity remains encrypted.
project-ark-guide=Build a heavy platform with at least 3 thrusters, 4 ammo turrets and 2 assembling machines. Weight alone does not qualify it.
project-ark-requirements=Required at departure: platform weight of at least __1__ kg, 3 thrusters, 4 ammo turrets and 2 assembling machines. Then complete a trip to Solar System Edge, Deep Space Edge, Nexus or Shattered Planet.
