project-next-nexus-done=All nine native Nexus bosses have fallen. Their force-wide victories are confirmed and the final Accord can proceed.
project-next-convergence-nexus=Defeat all nine Nexus bosses before final Ignition. The Ninefold Signal project shows your progress.
project-next-convergence-witness=Establish and power the seven independent witness anchors before initiating the final accord.
