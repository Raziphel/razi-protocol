project-context-platform=RAZI's earliest charter listed a shipyard as the moment a settlement stopped being alone. There is no crew left to sign the launch manifest; your first platform is the proof.
project-context-voyage=One platform in orbit proves a factory can reach space. A completed route proves two places can still be connected.
project-context-dyson=An old Calidus reserve still answers requests for power. The research dossier explains what can be built; the satellites and receivers must exist outside the archive.
project-context-transceiver=A transmission stamped APPROVED is not the same as an open passage. A working machine must make the connection real.
project-context-convergence=Five physical deliveries can answer a question that surviving paperwork cannot. Each shipment is recorded only when the original machinery accepts it.
project-next-convergence-receiver=Install an eligible Dyson receiver before attempting the final mandate.
project-measures-platform=Complete only when a built hub exists. The achievement remains in your force's record if the platform is later lost.
project-measures-voyage=Complete only when Factorio records an actual platform trip between space locations. Destruction cannot erase the achievement.
project-measures-dyson=Tracks real technology research, not satellite count, power output or physical sphere completion.
project-measures-transceiver=Counts only an activated source-owned transceiver, not research alone.
project-measures-convergence=Tracks completed physical shipments. Partial cargo delivery is detailed below; victory requires the final transmission.
