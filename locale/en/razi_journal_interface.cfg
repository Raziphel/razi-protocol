project-context-skybridge=The first freight charter ended with a simple question: could two distant colonies move something that both could actually verify?
project-context-beltbreaker=The shipping accounts stopped at the edge of the rock fields. Nobody filed a manifest for the vessels that never emerged.
project-context-array=Three surviving frequencies point to messages older than the expedition. RAZI left receivers without explaining who they were listening for.
project-context-ark=This is not a passenger ship. It is a mobile factory built to keep functioning after every familiar supply route ends.
project-measures-skybridge=Uses installed native catapult hardware, configured regional links and a physically carried receipt. RAZI cannot prove which transport moved it.
project-measures-beltbreaker=Counts engine-observed platform arrivals after recorded direct crossings of Vibrant and Umbra, not mere visits.
project-measures-array=Counts powered RAZI Archive Relays on three different star systems; disconnected or unpowered hardware does not count.
project-measures-ark=Requires a large defended production ship and a completed deep-space voyage. A massive stationary platform is insufficient.
project-next-skybridge-missing=Native catapult endpoints are not detectable in this installed version. Check Orbital Catapult and RAZI corridor settings.
project-next-skybridge-build=Build actual Orbital Catapult equipment on both ends of a discovered regional link.
project-next-skybridge-sign=On the sending world, bring 20 processing units and sign a sealed freight consignment.
project-next-skybridge-deliver=Take the sealed consignment to its paired destination and certify its arrival there.
project-next-skybridge-done=Skybridge established: both endpoints and a verified interplanetary handoff.
project-next-beltbreaker-vibrant=Cross directly between Vibrant's Inner Rim and Outer Rim with a real platform.
project-next-beltbreaker-umbra=Cross directly through Umbra's Shattered Divide to finish the second trial.
project-next-beltbreaker-done=Both hazardous crossings are recorded. The rocks no longer divide the supply network.
project-next-array-build=Build and power Archive Relays on three different star systems.
project-next-array-done=Three interstellar receiver stations are online. The archive signal is reconstructed.
project-next-ark-build=Build a heavy factory ship with thrusters, turrets and assemblers, then complete an expedition to Deep Space.
project-next-ark-done=The Ark arrived on its own power. Its expedition is now part of the permanent record.
project-skybridge-guide=Certified regional freight: build native catapult installations on both ends of a configured RAZI corridor, sign an outbound packet, then carry its real receipt to the receiving world.
project-skybridge-native-unavailable=This modpack exposes no recognized physical Orbital Catapult device. No fictional progress is awarded.
