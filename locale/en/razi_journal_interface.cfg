project-context-nexus-trials=Nexus never answered an ordinary distress call. The Long Echo expedition heard the signal first and left its warnings scattered. Nine victories are proof that the frontier can meet what answered.
project-measures-nexus-trials=Counts the nine victory flags that Nexus Bosses records for your force. Trophies, research and encounter logs do not count.
project-nexus-guide=Start each boss with its summon beacon, defend the beacon and defeat the boss that arrives. Collect the trophies. Each circle opens after three bosses are defeated. The warp key and Silence belong to Nexus Bosses.
