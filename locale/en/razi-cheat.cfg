[razi-cheat]
help=Safely unlock research in stages for testing: /razi-cheat [start|status|cancel]
admin-tip=Razi Protocol testing tip: use /razi-cheat instead of /cheat on large modpacks. It unlocks research in small steps to avoid long freezes. You can check progress with /razi-cheat status.
builtin-warning=Razi Protocol: the built-in /cheat can freeze heavily modded games. On your next test, use /razi-cheat instead. This message cannot stop the original command already issued.
message=[Razi Protocol] __1__
player-only=Run /razi-cheat from an admin player.
admin-only=Only server admins can use /razi-cheat.
usage=Usage: /razi-cheat [start|status|cancel]
status=Researching __1__ of __2__ technologies.
status-idle=No staged research is running for your force.
cancelled=Stopped after __1__ of __2__ technologies. Already granted research is kept.
cancel-idle=There is no staged research to stop.
already-running=Research is already running. Use /razi-cheat status or cancel.
nothing-left=All eligible technologies are already researched. Free crafting enabled.
started=Free crafting enabled. Researching __1__ technologies in small steps.
progress=Research progress: __1__%.
complete=Staged research complete: __1__ granted, __2__ failed.
