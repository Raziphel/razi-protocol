convergence-transmission-dyson=Calidus reserve synchronized. The Continuity Engine acknowledges the directive was never an accident, and preserves the signed order as evidence.
convergence-transmission-resonance=Seven witness stations answer independently. BLACKOUT-SEVEN is rejected; the colony rescue channels are restored without an executive owner.
convergence-transmission-alignment=The corporate succession key is invalidated. The Engine transfers infrastructure custody to the systems keeping the network alive.
