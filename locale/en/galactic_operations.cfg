convergence-victory-title=Razi Protocol: The Right to Continue
convergence-victory-message=The seven-system network has answered. The Continuity Engine finally recognizes living colonies and withdraws the emergency authority it had carried beyond its owners.
convergence-victory-stellar=The working Calidus stellar network sustained the signal.
convergence-victory-industry=Independent factories delivered the proof of cooperation.
convergence-victory-deep=The outer expeditions answered from beyond the familiar routes.
convergence-victory-resonance=Distant frequencies aligned as separate, living witnesses.
convergence-victory-ignition=The final physical shipment allowed the Protocol to release the obsolete mandate.
convergence-victory-final=RAZI Industries' command is finished. The factories, colonies and future belong to those who keep them alive. Keep building.

catapult-network-heading=RAZI / REGIONAL ORBITAL FREIGHT
catapult-network-intro=Short-haul freight across Solaris, Nyxaris and Vespera. These are source-backed routes you can build, not live catapults or completed shipments.
catapult-network-disabled=Both Razi Orbital Catapult corridor groups are disabled in Startup Mod Settings. The required transport mod remains installed.
catapult-network-unrevealed=Further local corridors will appear after the neighboring worlds are discovered. Enable spoilers to preview all routes.
catapult-network-none=No compatible Vespera planet pairs are registered in the current mod configuration.
catapult-network-region=__1__ / LOCAL CORRIDORS
catapult-network-pair=__1__  ⇄  __2__
catapult-network-surveyed=Both native planet discovery technologies researched. Check the source mod's catapult equipment and destination rules.
catapult-network-purpose-cold-resupply=Muria / Aquilo: short-haul support for nearby manufacturing and cryogenic supplies. Establish native production before exporting.
catapult-network-purpose-materials-transfer=Muria / Rubia: local exchange of useful crafted materials; manufacturing and catapult operation remain entirely source-owned.
catapult-network-purpose-cryo-materials=Rubia / Aquilo: optional advanced-materials and cold-world logistics, without replacing their native science paths.
catapult-network-purpose-smelting-salvage=Vulcanus / Castra: shuttle foundry products and salvaged manufacturing inputs between adjacent Solaris industries.
catapult-network-purpose-bio-compute=Gleba / Moshine: local movement of biological and analytical manufacturing supplies, without overriding spoilage or native recipe costs.
catapult-network-purpose-subsea-supply=Rubia / Maraxsis: establish supplies for water-world expansion and move finished materials after both factories are operational.
catapult-network-research=Discovery research is still pending on at least one endpoint. A declared link is not a research unlock.
catapult-network-build=Build and power source Orbital Catapult hardware at both endpoints, then configure targets and cargo in the source mod. Both regional corridor groups are separately configurable under Startup Mod Settings. Razi does not place machines or auto-transfer items.
catapult-network-safety=These local corridors supplement platforms. Inventory, transfers and energy remain managed by Orbital Catapult. Research state is not proof of a working or connected catapult.

