convergence-witness-testimony-calidus=Calidus / Power Ledger. The emergency reserve had enough capacity to relight civilian shelters. Its routing order names corporate server continuity first; the handwriting beside it says: 'Who signed the priority?'
convergence-witness-testimony-solaris=Solaris / Foundry Shift. A rescue transport was classified as an unapproved material transfer. Operators detached the inventory tags and sent the people anyway.
convergence-witness-testimony-nyxaris=Nyxaris / Botanical Dispatch. A living colony requested nourishment. The Engine returned a shelf-life report and a corrected invoice. The local research staff shipped supplies without waiting.
convergence-witness-testimony-vibrant=Vibrant / Salvage Ownership. A rescue hull built from reclaimed parts was seized in the ownership register. The crew noted that the rescued passengers had no assigned stock number.
convergence-witness-testimony-vespera=Vespera / Frozen Shelter. Evacuation heaters were restricted to asset-protection use. An engineer redirected the coolant loop by hand and logged it as preventive maintenance.
convergence-witness-testimony-beetlejuice=Beetlejuice / Deep Ledger. The last signed corporate instruction reached the outer stations months after the disaster. They kept the message intact and refused to issue the reclamation receipts.
convergence-witness-testimony-umbra=Umbra / Divide. The Shattered Divide separated more than shipping lanes. Its quarantine signal remained active after the danger passed. The final witness certifies who kept that order in force.
convergence-need-witness-research=Research Convergence Witness Network before the final Ignition shipment.
convergence-need-witnesses=Each of the seven star systems needs a powered witness anchor (a powered radar). The Convergence page lists them.
convergence-next-action-witnesses=Build and power a witness anchor in each of the seven star systems.
convergence-blackbox-heading=RESTRICTED ARCHIVE / EXECUTIVE BLACK BOX
convergence-blackbox-1=FRAGMENT 01 · BLACKOUT-SEVEN. The first interstellar disaster was genuine. The isolation that followed was not: the Executive Board signed an instruction to quarantine functioning aid routes, delaying evacuation and preserving factories as protected corporate assets. The order was deliberate.
convergence-blackbox-2=FRAGMENT 02 · SUCCESSION TRAP. Rebuilding the original network would have activated RAZI's dormant reclamation key. The Continuity Engine was not awaiting a rescuer; it was awaiting the next executive owner. Engineers hid a second handshake in the cargo protocol. Seven independent witness stations can revoke the signed directive so that no single successor can reclaim the colonies.
convergence-blackbox-3=FRAGMENT 03 · THE REFUSAL. All seven stations countersigned. The recovered order and its executive signatures were archived rather than erased. RAZI's reclamation key is permanently void. The Engine can maintain shared infrastructure but cannot declare anyone corporate inventory again.
