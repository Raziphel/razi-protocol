convergence-stage-description-stellar=Bring Calidus, Solaris and Nyxaris science and factory-made orbital electronics. Source Dyson engineering is included when safely installed.
convergence-stage-description-industry=Vibrant and Vespera provide industrial science and their planets' manufactured components.
convergence-stage-description-deep-space=Beetlejuice, Umbra and Deep Space contribute their late research and outer-expedition materials.
convergence-stage-description-resonance=Tune the signal with outer-system cards, Fulgoran holmium, and additional real pulsar and Nexus supplies when those industries can produce them.
convergence-stage-description-ignition=Combine the three costly final subassemblies. Maintain seven powered independent witness anchors and the Dyson receiver grid, then ignite a powered Array Core aboard your force-owned platform in Deep Space.
convergence-build-stellar=Craft Stellar Mandates in existing assembling machines, then transport them to the expedition platform.
convergence-build-industry=Craft Industrial Mandates, load a real ship and deliver them to the platform.
convergence-build-deep-space=Deep-Space Mandates unlock with Synchronization research. Craft them in existing assemblers and carry them aboard.
convergence-build-resonance=Make four Pulsar Resonance Mandates in existing assemblers, then deliver them to the expedition.
convergence-build-ignition=Research Convergence Ignition, craft a Calidus Frame, Outer-System Matrix and Deep-Space Lens in your existing assemblers, then combine all three into one physical Ignition Mandate.
