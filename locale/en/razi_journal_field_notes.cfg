# Razi Protocol Expedition Journal: field notes
# Keep section/key IDs unchanged: save games and Lua refer to these IDs.
# Translators: preserve __1__, __2__, [color] tags and Factorio rich text.

[journal-tip]
rocket-salvage-survey=Research Rocket Chunk Processing in the rocket mod. Keep defenses and collectors ready: an incoming wreck is dangerous and its smaller chunks are not free cargo. Recovery chance and intact-wreck caps are configurable.
rocket-salvage-beacon=Research and place a powered Remnant Beacon on a space platform to prioritize wreck arrivals. It changes destination, not launch frequency. Hard and Nightmare automatically allow side-arriving rocket wrecks; defend both flanks. Side-arrival chance remains configurable.
rocket-salvage-precision=After Fulgora, research RAZI Precision Rocket Reclamation. Crush three rocket chunks with holmium to obtain three native batches plus a small sorting bonus. The native crushing category and K2SO outputs are preserved.
rocket-salvage-cryogenic=After Aquilo, research RAZI Cryogenic Rocket Reclamation. Spend ice and processors to treat four rocket chunks in one compact batch, keeping the original incomplete-parts compatibility.
rocket-salvage-network=With the precision-matrix trade network operational, research RAZI Network Rocket Reclamation. Import a real RAZI matrix and process six rocket chunks; if the source industry is unavailable this optional mission stays hidden.
athos=Reach Athos from Muria through its native discovery. Develop the source-owned mineral industries and Particulate Science; its research unlock alone is not a completed cargo delivery.
athos-particulate=Research Athos's actual Particulate Science unlock; ship its real science packs to a late laboratory.
nulla=Approach from Aquilo using the moon's original connection. Prepare defenses against radio-sensitive autonomous drones.
nulla-electromagnetic=Mine native industrial remnants to recover electromagnetic robotics before progressing to Robotic Science.
nulla-robotic-science=Make Nulla's perishable Robotic Science from original salvage and robot parts. Ship it quickly.
frontier-recovery-charter=Recover Particulate Science from Athos and Robotic Science from Nulla. Complete the charter research using its real prerequisites; any physical deliveries are tracked separately by their project systems.

nexus-photon-works=Develop native photon electronics before committing to sustained Nexus production. This research cannot substitute for a victory.
nexus-magnetic-shields=Research the source magnetic shielding technology and leave space for emergency power and repairs.
nexus-storm-forecast=Unlock Nexus storm prediction. Nexus Threat manages real storms, while Razi records the preparation milestone.
nexus-omega-grid=Expand Nexus power distribution with its native omega substation. Keep redundancy and logistics off the frontline.
nexus-energy-reserve=Unlock Nexus's omega accumulator and test the reserve under realistic defenses.
nexus-field-beacons=Develop native omega beacons for efficient, defended industry. These are production beacons, not duplicate boss summoning items.
nexus-arachnid-queen=Summon and defeat the Arachnid Queen on Nexus. Her native trophy and victory state are managed by Nexus Bosses.
nexus-watcher=Defeat the Watcher with anti-air defense and reliable repairs; follow the Codex for actual tactics.
nexus-rogue-spidertron=Defeat the Rogue Spidertron. The Codex reveals its log and can guide you toward a rewarding lair encounter.
nexus-twin-maws=Defeat Twin Maws. Protect your summoning position against both incendiary and corrosive pressure.
nexus-colossus=Defeat the Colossus using sustained battlefield logistics and source-provided summons.
nexus-plague-hulk=Defeat the Plague Hulk. Keep its reinforcements from overrunning your forward supply chain.
nexus-storm-guardian=Find charged storm shards and use the source charged-beacon system to weaken the Storm Guardian before defeating it.
nexus-devourer=Defeat the Devourer with concentrated firepower. Its regeneration makes brief, scattered attacks costly.
nexus-last-commander=Defeat the Last Commander. Protect your frontline, then recover its native trophy for the nine-part warp key.
nexus-whisper=Establish a protected base on Nexus and construct a shield stabilizer. The boss mod controls the encounters and research trigger.
nexus-bearings=Find the first expedition log to unlock the source direction finder. Lair fights are optional but more rewarding.
nexus-chorus=Defeat all three Whisper bosses at your own summon beacons. Bring enough defense to protect the countdown.
nexus-convergence=Clear the three Chorus encounters to open Convergence. The source mod awards the research upon success.
nexus-silence=Defeat all nine bosses and craft the native Nexus warp key. Silence becomes available only when the source boss-gate setting is enabled.
panglia=Bring Moshine data-cell production and Apia's biological expertise. Source Panglia discovery still needs its native extractor and foundry research.
panglia-panglite=Build Panglia's native Panglite chain. Its initial processing stays restricted to this world.
panglia-glass=Make Panglite glass locally with its original metallurgy and pressure rules. You will need it for nanoscale DNA work.
panglia-timewarp=Use the native timewarp analyzer and datacell recipes. Accelerated zones need reliable power and defenses.
panglia-dna-optics=Craft Panglite glass to trigger its native optics breakthrough, then prepare the nanoscale DNA scanner.
panglia-fish-dna=Complete Panglia's native fish DNA collection trigger. This is not an ordinary research-pack milestone.
panglia-biter-dna=Follow the source mod's biter DNA task. Keep specimen handling and defense independent of the laboratory.
panglia-demolisher-dna=Acquire the required demolisher sample using Panglia's original scripted research objective.
panglia-pentapod-dna=Finish the source pentapod DNA objective. Nothing in Razi bypasses this collection challenge.
panglia-dna=Combine all native DNA milestones and continue Panglia's original data-cell research.
panglia-simulation=Develop the original simulation chamber after DNA research. The Moshine AI and Panglia timewarp chains remain essential.
panglia-matrix=Craft a simulated specimen to satisfy the original research trigger. Razi does not grant the matrix for free.
panglia-sentient=Finish Panglia's native processor research. This deep objective enriches the story without blocking Vibrant travel.
panglia-biooptic-trade=When available, unlock the optional Panglia glass exchange. Four native batches and imported materials yield one extra glass, with no productivity stacking.
panglia-optical-return=This optional return shipment keeps Moshine's native optics recipe untouched. If incompatible machines exist, the guarded bonus stays hidden.
first-signal=Research automation; reliable factory capacity matters more than rushing the first rocket.
nauvis-power=Follow the installed Electricity research when available. Keep steam generation, power poles and miners supplied before building a larger factory.
nauvis-logistics=Research Logistics and use belts, undergrounds and splitters to create a clear flow of material that can expand later.
nauvis-electronics=Research Electronics and automate circuits. In this modpack, early inserter and loader unlocks may depend on this research.
nauvis-radar=Research Radar to help survey ore, hazards and future construction sites. Place stations where they can reach your power network.
nauvis-fast-inserters=Research Fast Inserters and upgrade your actual bottlenecks first. More arms are not always better than a cleaner layout.
nauvis-automation-2=Research Automation 2 and organize assemblers around reusable inputs, output buffers and sufficient electricity.
nauvis-engines=Research Engine technology and automate its inputs. Leave a production line ready for rail transport and later science.
nauvis-fluid-handling=Research Fluid Handling, then organize pipes, storage and pumping capacity so refinery outputs cannot silently jam.
nauvis-plastics=Research Plastics and keep petroleum gas supplied to the advanced electronics production line.
nauvis-advanced-electronics=Research Advanced Electronics and establish a steady red-circuit supply. Actual research requirements still follow the installed technology tree.
space-science=Space science and a reliable rocket pipeline come before large-scale system travel.
muluna=Explore Muluna's native research instead of skipping straight to dangerous stars.
solaris-gate=Solaris and Nyxaris can be opened independently. Build spare engines, fuel and asteroid defense.
nyxaris-gate=Choose either opening system first. Neither star should depend on the other's research.
vulcanus=Prepare foundries and K2SO metallurgy. Native Vulcanus research remains useful throughout the campaign.
castra=Bring defense and repair supplies. Castra's battlefield science supports later Solaris branches.
arig=Arig and Hyarion are parallel discoveries after Castra. Neither should require completing the other first.
hyarion=Research Hyarion's native polishing and inspect its original machines before exporting its products.
tellus=Tellus is downstream of the Arig and Hyarion branches. Expect biological research to be involved.
corrundum=Before Corrundum, complete Tellus and the relevant Nyxaris exports required by its real technology.
gleba=Spoilage, bioflux and agricultural research are the foundation. Avoid shipping unstable intermediates needlessly.
moshine=Build toward data processors and data storage. Some upgrades need science from later systems.
apia=Follow the original Apia/Carnova discovery. Razi keeps its native orbital setup intact.
vibrant-gate=Vibrant and Vespera remain parallel after the first-frontier campaign.
fulgora=Recycling and electromagnetics unlock industries that the outer systems will continue to need.
cerys=Recover native Cerys nuclear scrap and repair technology; the moon contributes to advanced Dyson engineering.
ribbonia=Plan a vessel for the original asteroid belt before making the crossing. The belt is a progression challenge.
asteroid-belt=Study asteroid distribution and stockpile ammunition. The original belt's science remains source-owned.
paracelsin=Paracelsin zinc and electrochemistry support cross-world industry, including stellar engineering.
vespera-gate=You may explore Vespera or Vibrant first. Both demand the completed first frontiers.
muria=Muria's native chemistry feeds later Aquilo and outer-frontier exchanges.
aquilo=Protect pipes and power, and develop native cryogenic science before expecting reliable outer-system logistics.
rubia=Rubia's native logistics, composites and science become inputs for later shared manufacturing.
maraxsis=Use source-owned underwater construction and hydraulic science; the sea is not another land factory.
seadragon=Project Seadragon is an existing Maraxsis technology; it unlocks the source's specialised rocket-part production.
beetlejuice-gate=Beetlejuice and Umbra are both late frontiers. Preserve their paired access and belt encounters.
cubium=Cubium science supports Secretas, advanced K2SO systems and specialized refining.
linox=Refine native Linox rare earths and integrate them with precision manufacturing.
secretas=Use Cubium research and native Secretas science before expanding to Frozeta.
frozeta=Frozeta is late Beetlejuice territory. Bring source-compatible machinery and a proven defensive ship.
umbra-gate=Umbra is a parallel outer entry alongside Beetlejuice, not its subordinate.
tenebris=Chitosan and native biological science support the far outer industrial network.
crucible=Follow Crucible's native orbital chain and research before attempting its late material exchanges.
umbra-belt=Research the Umbra belt survey before pursuing the inner worlds. The map crossing remains a real route hazard; the journal does not substitute for an equipped platform.
vesta=Build native Vesta supermagnets and foundations; the final fleet will need extreme materials.
abacayba=Finish Vesta discovery, then research the source-owned Abacayba arrival and take its short moon route. Prepare overwhelming defenses. Its Itaverax, Ominous Science and UMR/UFP factories are genuine source gameplay.
solar-orbit=The source Dyson mod owns solar plasma, locations and satellite launching; ordinary orbit access is not free power.
inner-orbit=Bring plasma-capable defenses and build the source's inner orbit machinery only when prepared.
dyson-build=The researched technology is only permission to build. Satellite totals are tracked by the source mod.
dyson-repeaters=Use the source's repeater satellites and power connectors. Research completion does not imply an active energy link.
dyson-mk2=Advanced receiver research follows Project Seadragon; the source still limits real transmitted power.
dyson-mk3=Final receiver engineering belongs to the outer frontier. Watch the source's actual energy allocation.
interplanetary-trade=Planet Express manages dispatch and schedules; Razi's Cargo Network can help you find unscheduled platforms.
first-frontier-relay=Optional research after Vulcanus, Gleba and Moshine. Inspect actual ingredients and manufacturing conditions; native K2SO electronics remain available.
precision-matrix=Precision matrices need native holmium, rare metals, optical cable and zinc. The source manufacturing chains remain untouched.
extreme-lattice=Extreme lattice production is an optional efficiency reward, never a gate for planetary science.
outer-mastery=Develop the late outer frontiers and finish the recovery charter before Outer Frontier Mastery. Missing or optional discoveries should not be described as completed merely because a chapter is open.
edge=Complete stable singularity research and outer frontier mastery before attempting the Solar System Edge discovery. This milestone opens the route; it does not finish the final project.
aegis=Prepare defense and sustained space-platform manufacturing. Keep Aegis/Bellicos native mechanics intact.
singularity-theory=Complete Outer Frontier Mastery and study all seven existing system cards. This research is now before Deep Space, with no post-edge Promethium requirement.
test-fire=Complete the source-owned Dyson receiver research and the required singularity experimentation.
stable-singularity=Complete staged outer-system card research, build and activate the original K2SO transceiver, then follow its signal to the Solar System Edge.

green-science=Automate green science before scaling the rest of the base.
railways=Keep junctions clear and leave room for future unloading stations.
steel=Reserve iron smelting for steel, especially before mass-producing rocket structures.
oil=Use circuit-controlled cracking to prevent one oil product from clogging the refinery.
chemical-science=Keep a steady chemical-science line instead of a temporary manual batch.
production-science=Build reliable rails and throughput before scaling production science.
utility-science=Utility science underpins late equipment, logistics and high-tier machinery.
nuclear-power=Build uranium processing and heat buffering before depending on the reactor.
kovarex=Bootstrap enrichment carefully; do not consume your first isotope reserve.
robots=Keep construction bots, repair packs and roboport coverage ready for distant outposts.
robot-logistics=Use bots for flexible, low-volume supply and trains or belts for bulk cargo.
solar-energy=Solar generation is useful for low-demand remote outposts, but requires storage.
platform=Plan asteroid collection, power, defenses and hub throughput before launch.
fuel=Build a separate rocket-fuel supply for platforms and cargo launches.
frames=Protect copper, steel and plastic supplies for repeated rocket manufacturing.
rocket-silo=Automate rocket parts, not merely the first ceremonial launch.
interstellar-science=Follow the native Muluna science process and its orbital production rules.
advanced-space=Respect specialized space-platform crafting categories.
asteroid-processing=Crush asteroid chunks where the route supports sustainable resupply.
asteroid-reprocessing=Reprocessing can help balance asteroid chunks during long shipments.
thrusters=Match oxidizer and fuel generation to travel distances.
bulk-cargo=Optimize hub loading and unloading rather than simply adding more ships.
wit=Wit is a native optional branch; preserve its own machine economy.
igrys=Carry supplies appropriate for Igrys rather than assuming a duplicate hot-world recipe set.
foliax=Its biological systems are independent from Gleba's familiar processes.
rabbasca=Keep Rabbasca's true moon orbit and source-owned progression.
velora=Bring the machinery needed for Velora's native surface conditions.
khemia=Plan fluid and chemical supply around the native technology.
ferrum=Ferrum lies west of Beetlejuice's sun. Travel from its Slip Stream; the source's remote robotic industry and native research remain intact.
obsidiax=Obsidiax lies beyond Umbra's Shattered Divide on Vesta's safe exterior side. Its original frozen lava and rock-growing machines remain source-owned.
balack=Native Balack shielding matters to extreme late-game manufacturing.
carna=Prepare a late-game platform and respect the source-owned landing rules.
arcanyx=Keep the native Arcanyx refinery rather than replacing its chemistry.
pelagos=Pelagos is optional and skips safely when not installed.
dea-dia=This optional system does not block required Nyxaris worlds.
lemures=Explore the native Dea Dia extension when available.
prosephina=Preserve its source-owned cycle and machinery.
nexus=Nexus is late game, linked to the original transceiver chain.
metallurgic=Maintain native foundries and metallurgic science.
electromagnetic=Keep reliable electromagnetics and recycling supply.
agricultural=Keep spoilable science moving through short delivery chains.
cryogenic=Keep Aquilo's power and fluids protected.
lunar=Use original lunar research rather than guessing recipes.
battlefield=Castra's native battlefield science is valuable beyond defense.
compression=Build using the source-native Arig machinery.
polishing=Preserve polishing science and machine categories.
bioengineering=Tellus bioengineering blends living and mechanical chains.
pathological=Plan source-specific biological processing carefully.
refraction=Original refraction science supports Solaris research.
electrochemical=Keep electrical and chemical materials close.
insulation=Moshine data science benefits from reliable power.
thermodynamic=Check the source's thermodynamic recipe chain.
apicultural=Preserve native hive science and spoilage-sensitive shipping.
nuclear-science=Cerys recovery is a major chapter in stellar engineering.
aerospace=Check native orbital crafting requirements.
alien=Respect native alien science and the source crafting chain.
biorecycling=Reuse byproducts when possible before importing more.
biofusion=Biofusion has source-specific production, not a generic furnace.
galvanization=Paracelsin zinc supports the larger industrial network.
hydraulic=Respect native underwater infrastructure.
bioluminescent=Biological source research differs from ordinary lighting.
crucible-science=Follow Crucible's native science chain.
golden=Golden science belongs to the advanced Cubium industry.
gas-manipulation=Reserve specialized gases for native source recipes.
promethium=Use a serious armored platform for hostile promethium routes.
antimatter=Keep antimatter production late and source-owned.
matter-card=Keep original K2SO matter-card requirements.
singularity-card=Singularity tech belongs to the native endgame.
military-science=Automate military science alongside civilian priorities.
gun-turrets=Feed turrets ammunition and cover them with repair robots.
stone-walls=Wall geometry must support weapon ranges and repair access.
military-2=Use weapons appropriate to each world's environment.
military-3=Protect ammunition delivery across remote outposts.
laser-turrets=Lasers exchange ammunition logistics for power demand.
rocketry=Prepare rockets for advanced defenses and platforms.
explosives=Reserve explosives without starving chemical science.
flamethrowers=Protect fuel pipes to flamethrower defenses.
spidertron=Use remote construction and recovery where supported.
energy-shield=Keep enough power generation for shields.
rocket-turret=This source turret technology may differ by version and skips safely.
matter-processing=Matter processing is a K2SO late-game specialty.
matter-stabilization=Containment machinery and power matter more than speed.
singularity-core=Maintain source-owned Nexus singularity core research.
black-hole=Approach native black-hole research with an endgame ship.
nexus-scan=Follow the source Nexus scanning chain.
omega-components=Use native Omega industry and labs.
warp-drive=Warp drives belong to late Nexus research.
zero-point=Do not bypass the existing Dyson construction stage.
antimatter-production=Native antimatter production stays at deep-space tier.
transceiver=Build the native K2SO transceiver when the research unlocks.
fragment-1=Uranium processing is the foundation of nuclear and Cerys engineering.
fragment-2=Complex circuits become indispensable on the data frontier.
fragment-3=Processing units are the backbone of advanced automation.
fragment-4=High-tier assembly supports complex native machinery.
fragment-5=Fusion remains a late power technology.
fragment-6=Quantum research belongs to Aquilo's source chain.
fragment-7=Asteroid processing matters on every hazardous crossing.
fragment-8=Research productivity helps late science but cannot replace source progression.
fragment-9=Robot speed is not a substitute for bulk freight.
fragment-10=The actual source transceiver must be activated for its physical signal gate.
alliance-bio-metals=Research the alternate rare-metal process, ship bioflux from Gleba, and compare its throughput with native K2SO casting.
alliance-holmium-circuits=Route stable support logistics for bioflux and holmium. Keep the original electronic-components line running while trialling the alternate recipe.
alliance-optical-coils=Import Moshine optical cable for the Paracelsin coil alternative. Confirm the native mechanics-category machine and world restrictions.
alliance-zinc-silicon=Ship Paracelsin zinc solder to Moshine and unlock the native-compatible silicon-cell alternative. Native silicon research still comes first.
alliance-rubia-composites=Supply zinc plates and optical cables for the optional Rubia craptonite composite line. Keep its original byproducts and production rules intact.
alliance-tenebris-chitosan=Deliver Paracelsin zinc rivets into Tenebris chitosan production. The native chitin recipe remains the foundation.
alliance-linox-refining=Unlock the guarded Linox refining alternative and import optical cable and zinc plate. Do not assume the native rare-earth recipe is replaced.
alliance-vesta-magnets=Ship Linox rare-earth powder and Moshine optical cables to Vesta. The native supermagnet category and atmospheric restrictions still apply.
alliance-cryo-control=Research the alternate K2SO control-unit process after Aquilo, Fulgora and Gleba. Verify native cryogenics and coolant inputs before shipping.
alliance-photonic-coils=Connect optical cables and holmium to Paracelsin's real electric-coil production. The technology appears only when the guarded recipe exists.
alliance-network-cubium=Try the guarded Cubium gold alternative with Linox rare earths, Paracelsin zinc and Vulcanus rare metals. All source recipe unlocks remain authoritative.
alliance-balack-shield=When Balack's guarded optional shielding alternative exists, use Rubian frames and Tenebris chitosan without bypassing its native recipe.
alliance-matrix-rubia=Manufacture Precision Control Matrices from the earlier four-world supply chain, then research the Rubia inserter alternative.
alliance-matrix-aquilo=Deliver Precision Control Matrices into Aquilo's native K2SO cryogenic controllers. The bonus is optional and capped.
alliance-lattice-vesta=Craft Extreme-Environment Lattices and unlock the Vesta supermagnet alternative. Importing the lattice does not remove native atmospheric limits.
alliance-vesta-foundations=Deep interdependence only: ship Rubian frames, Tenebris chitosan and Fulgoran holmium to Vesta for an optional foundation process.
alliance-balack-vesta=Deep interdependence only: source Vesta supermagnets, Rubia frames and Tenebris chitosan for Balack shielding. Preserve its native requirements.
alliance-aquilo-outer=Deep interdependence only: unite Moshine optics, Vesta magnets, Rubia frames and Fulgoran holmium in a source-guarded cryogenic alternative.

alliance-panglia-bond=Research Panglia glass, Moshine optical cable and Fulgora holmium, then build Panglia Optic Bonds. No source glass or science requirements are replaced.
alliance-bond-paracelsin=Ship Panglia Optic Bonds to Paracelsin for the guarded electrochemical coil alternative. The native recipe and machinery are still required.
alliance-bond-linox=After discovering Linox, import Panglia Optic Bonds for optional rare-earth refining. Production remains locked behind Linox's original research.
alliance-pressure-frame=Research the Crucible and Vesta branches, then ship Panglia Optic Bonds, Fulgoran holmium, Linox rare earths and Vesta supermagnets for the Umbra Pressure Frame. Available in Balanced and Deep; Deep requires larger industrial shipments for optional upgrades.
alliance-pressure-vesta=Deep interdependence only. Use Umbra Pressure Frames in Vesta's native foundation production. Bonus yield is capped and recycling/productivity is disabled.
alliance-pressure-aquilo=Deep interdependence only. Bring finished Umbra Pressure Frames back to Aquilo's native cryogenic facilities for an optional K2SO controller recipe.

alliance-frontier-moshine-silicon=Compare the optional silicon cell batch with the native Moshine recipe. Ensure rare metal and bioflux supply arrives before manufacturing; this is not a chapter gate.
alliance-frontier-gleba-carbon=Use the original Gleba carbon-fiber technology and a Biochamber. Import optical cable and rare metals, and keep the native yumako/carbon supply running.
alliance-frontier-castra-ballistics=The alternative batch needs native piercing-magazine technology and a supported Castra crafting machine. Ship carbon fiber and silicon cells. Original ammunition remains craftable.
alliance-middle-fulgora=Keep the original supercapacitor production unlocked. Deliver native Aquilo energy controls and Moshine optics to Fulgora; the premium recipe is an optional upgrade.
alliance-middle-aquilo=Use native control-unit technology and a proper cryogenic machine on Aquilo. Import Fulgora supercapacitors and Moshine optical cable; ordinary control units remain craftable.
alliance-middle-paracelsin=This research becomes a conditional prerequisite for the outer systems. Import native Rubia craptonite frames and Fulgora holmium; the original Paracelsin coil factory remains usable.
alliance-middle-rubia=This research becomes a conditional prerequisite for the outer systems. Import native Paracelsin coils and Fulgora supercapacitors; the original Rubia casting process remains usable.
signal-network=Research native AAI Signal Transmission, place a powered transmitter and receiver on matching channels, then wire import reserves or stock signals. Planet Express still handles actual rockets and cargo. The Razi Codex tracks research, not whether a communication circuit has been wired.
convergence-commission=Research The Convergence Commission after the Solar System Edge and installed native post-edge milestones. Open the Convergence panel for real shipping requirements.
convergence-stellar=Craft and deliver eight Stellar Mandates from a real character inventory aboard your force's expedition platform at the Solar System Edge or farther.
convergence-industry=Craft and deliver ten Industrial Mandates. Both stages are tracked across your entire force and can be completed cooperatively.
convergence-synchronization=Research Deep-Space Synchronization after the Commission. It unlocks outer-space and resonance manufacturing but does not grant victory.
convergence-deep-space=Craft and deliver six Deep-Space Mandates while physically at a supported expedition platform after Synchronization research.
convergence-resonance=Deliver four Pulsar Resonance Mandates, combining outer cards, real holmium and available Aegis/Nexus-produced supplies.
convergence-ignition-research=Research Convergence Ignition Protocol after Synchronization and installed Calidus Dyson distribution milestones. Source technologies remain source-owned.
convergence-ignition=Craft and deliver one final Convergence Ignition Mandate using all seven systems and Deep Space science. The victory is triggered by its actual delivery.
convergence-victory=Follow the Convergence project stages through actual construction, deliveries, resonance and ignition. Research unlocks and project completion are separate records.

[journal-weather]
panglia=The source weather add-on paints this timewarp world with drifting clouds, luminous sparks and dust. This is a visual profile, not a forecast of timewarp-zone behavior.
muria=Corrosive skies may include spores, dust, fog and cloud cover. The add-on can replace the planet's original rain unless its separate rain setting is enabled.
vesta=The gas giant's thick fog and layered clouds emphasize limited visibility over its atmospheric industry. These are visual effects, not additional gas-processing requirements.
rubia=Clouds and suspended dust add atmosphere to the biological machinery of Rubia; production and spoilage mechanics still come from the planet mod.
paracelsin=The additional winter/darkness profile is disabled by the source default. If enabled, its permanent-dark option can alter actual day/night presentation.
cubium=Suspended clouds and faint electrical sparks characterize Cubium. The effects do not change its gas-processing recipes.
rabbasca=Electric sparks, fog and dust make the forgotten Gleba moon visually distinct while its vaults and energy limits remain native gameplay.
igrys=Use the source settings to tune Igrys's industrial atmospheric effects; the visual layer does not change extraction rules.
khemia=An atmospheric haze accompanies the chemical expedition. Weather settings govern visuals rather than research unlocks.
carna=The outer organic frontier's native hazards remain intact beneath the configurable celestial visual layer.
pelagos=Ocean-world weather should complement ship-based logistics, not spawn an extra or contradictory production barrier.

