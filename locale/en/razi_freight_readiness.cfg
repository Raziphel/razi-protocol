# Real carried-stock planning checks. These are NOT transport telemetry.
[razi-ops]
freight-board-readiness=Departure inventory: __1__ ready, __2__ short, __3__ on other worlds, __4__ marked packed.
freight-board-readiness-caution=Checks use only your carried items on your physical departure world. Orders do not reserve stock or confirm that a catapult launched anything.
freight-board-load-ready=Enough carried materials for this order after earlier pending plans. Not yet shipped.
freight-board-load-short=Short by __1__ carried items after earlier pending plans. Stock at launchers is not inspected.
freight-board-load-remote=Visit __1__ to check carried materials at this route's departure world.
freight-board-load-packed=Manually marked packed. No transport or delivery is verified.
freight-board-load-unknown=Carried stock could not be checked; packing remains manual.
freight-board-move-up=Give this planned order higher stock-allocation priority
freight-board-move-down=Give this planned order lower stock-allocation priority
freight-board-hidden-plan=Inaccessible saved order (route undiscovered/disabled or item removed)
freight-infra-endpoints=Hardware candidates: __1__: __2__; __3__: __4__.
freight-infra-orbit=Orbit: __1__: __2__; __3__: __4__.
freight-infra-hardware-count=__1__ possible launch machine(s)
freight-infra-hardware-none=no matching candidates detected
freight-infra-hardware-unknown=not inspected (surface or source prototype unavailable)
freight-infra-platforms-count=__1__ docked, __2__ sharing enabled, __3__ without schedules, __4__ standard cargo bays
freight-infra-platforms-unknown=orbit data unavailable
freight-infra-disclaimer=Read-only infrastructure snapshot. Machine names are candidates, not proof of functional catapults. Docked platforms and sharing flags do not establish deliveries.
freight-infra-companion-installed=Platform Logistics Overhaul detected. Platform counts and sharing flags come from the Factorio 2.1 engine, not mod transport telemetry.
freight-infra-companion-absent=Native Factorio 2.1 platform logistics shown; Platform Logistics Overhaul is not installed.
freight-infra-bays-unknown=unverified
freight-pod-ledger-heading=Observed cargo-pod deliveries
freight-pod-ledger-summary=__1__ engine-confirmed cargo-pod delivery events at discovered RAZI corridor worlds since this tracking feature was installed.
freight-pod-ledger-empty=No matching cargo-pod delivery events recorded yet.
freight-pod-ledger-row=Arrived at __1__ (game tick __2__).
freight-pod-route-evidence=Pod deliveries recorded at these worlds: __1__ (__2__), __3__ (__4__). These are destination totals, not deliveries along the selected route.
freight-pod-ledger-caution=Factorio confirms that a cargo pod delivered its contents, not the cargo's origin, type, quantity or transport mod. These counts include eligible modded pods and never complete a Catapult freight order or campaign contract.
