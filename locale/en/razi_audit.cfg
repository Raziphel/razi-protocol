[razi-audit]
help=Read-only audit of the loaded Razi Protocol finale: native labs, real mandate recipes, science prerequisites and source supply warnings. Admins only; never edits a save.
victory-help=Lists the external victory opt-outs and the stray game endings that were undone. Admins only; changes nothing.
admin-only=[Razi Audit] Administrators only.
summary=[Razi Audit] Native Convergence cargo: __1__/__2__. Blockers: __3__.
blocker=[Razi Audit] Blocker: __1__
note=[Razi Audit] Note: __1__
read-only=[Razi Audit] Read-only: no recipes or saves are changed.
no-registry=No force or prototype registry available.
missing-research=Missing Convergence research: __1__
missing-cargo=Missing native cargo: __1__
no-recipe=__1__: no recipe with the same name; check its other producers.
recipe-locked=__1__: its recipe is not researched yet.
victory-header=[Razi Audit] Only Convergence sets the campaign victory.
victory-interface=[Razi Audit] __1__: __2__
victory-error=[Razi Audit] __1__: __2__ (__3__)
victory-recovered=[Razi Audit] Stray game endings undone: __1__
victory-unmanaged=[Razi Audit] Unmanaged: another mod has a victory opt-out that Razi does not call, because it cannot verify the API.
victory-note=[Razi Audit] A mod that calls game.set_game_state directly cannot be stopped.
state-absent=not installed
state-unsupported=no opt-out
state-unverified=opt-out set, state cannot be read
state-error=read failed
state-disabled=victory off
state-enabled=victory on
state-unmanaged=not managed
