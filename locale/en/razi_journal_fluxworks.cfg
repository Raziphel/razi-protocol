[journal-tip]
flux-calidus=Build your first spectrum-capable industrial district on Nauvis. Feed Yellow Flux into a Synthesis Plant with ordinary iron, copper and crystallised Flux to produce metal mesh.
flux-solaris=Combine Vulcanus tungsten carbide with Red Flux in the Arc Foundry. The annealed cermet will support stronger structures and more advanced machinery.
flux-nyxaris=Supply a Synthesis Plant with bioflux, spoilage, filters and Green Flux. Turn unwanted biological material into nutrient beds for the next growing cycle.
flux-vibrant=Use holmium, superconductors and circuit substrates in a Synthesis Plant with Yellow Flux to manufacture resonance substrates.
flux-vespera=Combine ice, lithium, salt, chilled fluoroketone and Purple Flux to make cryogel in the Synthesis Plant. Keep your thermal inputs flowing.
flux-beetlejuice=Import Secretas gold and established FluxWorks logic hardware. Combine Purple and Yellow Flux to assemble quantum computers in the Synthesis Plant.
flux-umbra=Bring chitosan from Tenebris into a two-spectrum synthesis process. Use Purple and Green Flux with resonance substrates and condensed matrices to create phase manifolds.

[journal-story]
flux-calidus=The first recovered records describe a workshop, not a weapon. Engineers learned that every new world would bring new ores and stranger physics, but every breakthrough would still need metal, electricity, pumps and pipes.
flux-solaris=Solaris teaches the first lesson of interstellar industry: the environment is not just an obstacle. Its violent heat becomes a tool for more durable production.
flux-nyxaris=On Nyxaris, waste is only matter that has not found its next purpose. The factory begins to look less like a mine and more like a cultivated ecosystem.
flux-vibrant=Vibrant's storms reveal precise electrical structures hidden inside chaos. The new workshop can turn recovered holmium into the substrate for the next generation of machinery.
flux-vespera=Cold becomes a manufacturing advantage on Vespera. Stable materials can be assembled under conditions that would destroy a conventional factory's reaction chamber.
flux-beetlejuice=Farther from Calidus, prosperity means more than rare ore. Gold, intelligence and precise matter manipulation meet inside a workshop designed to hold impossibly complex calculations.
flux-umbra=Umbra joins organic structures to phase engineering. Materials discovered as fragile living defenses become the final reinforcement of the industrial frontier.
