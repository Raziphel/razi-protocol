[map-gen-preset-description]
razi-protocol=Automatically selected Razi world defaults using your effective RP3 difficulty startup setting. Factorio's default-preset rule limits this entry to base map settings; choose a named Razi profile for the full starting-area and resource configuration.
razi-protocol-easy=Larger safe zone, richer ores, fewer nests and slower enemy expansion. Other worlds retain their specialized ecosystems.
razi-protocol-normal=Curated RP3 campaign baseline: a larger first foothold, modest early resources and meaningful enemy evolution.
razi-protocol-hard=Smaller safe zone, scarce ores, faster evolution and more aggressive biter expansion.
razi-protocol-nightmare=Minimal early safety, scarce production resources, rapid evolution and severe hostile expansion. No extra scripted enemy scans.
razi-protocol-custom=Editable Normal starting point. Tweak map sliders freely. Map presets do not change RP3's master mod difficulty setting.
