[map-gen-preset-description]
razi-protocol-easy=Before starting, open Settings > Mod settings > Razi Protocol to choose Easy and review your gameplay options. Restart Factorio to apply startup settings. More plentiful resources and fewer enemies across supported planets. You may adjust map sliders here.
razi-protocol-normal=Before starting your new galaxy: open Settings > Mod settings > Razi Protocol and choose your difficulty and gameplay options. Restart Factorio after changing startup settings. The matching world preset is then selected automatically, balancing resource patches, enemy pressure, evolution, expansion and research across compatible worlds. You can still fine-tune the map sliders here.
razi-protocol-hard=Before starting, open Settings > Mod settings > Razi Protocol and choose Hard. Restart Factorio to apply startup settings. Smaller resource deposits, faster evolution, stronger enemy expansion and more expensive research on compatible planets.
razi-protocol-nightmare=Before starting, open Settings > Mod settings > Razi Protocol and choose Nightmare. Restart Factorio to apply startup settings. Scarce ores, hostile colonies, rapid evolution and difficult research throughout the galaxy. Adjust settings before committing to a long campaign.
