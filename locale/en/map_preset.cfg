[map-gen-preset-description]
razi-protocol-easy=Ore frequency 130%, size 130%, richness 155%; oil richness 162%; enemy bases 48%; starting area 255%; slower evolution; research price 100%. The Easy difficulty applies the same factors to every planet.
razi-protocol-normal=The game's own map settings. The planets of the mods keep their own values. Selected when the difficulty is Normal.
razi-protocol-hard=Ore frequency 82%, size 85%, richness 75%; oil richness 82%; enemy bases 135%; starting area 115%; faster evolution and enemy expansion; research price 125%. The Hard difficulty applies the same factors to every planet.
razi-protocol-nightmare=Ore frequency 68%, size 75%, richness 60%; oil richness 65%; enemy bases 170%; starting area 90%; faster evolution and enemy expansion; research price 175%. The Nightmare difficulty applies the same factors to every planet.
razi-protocol-curated=Ore frequency 105%, size 108%, richness 120%; oil richness 120%; enemy bases 85%; trees 105%; starting area 165%; enemy expansion 2 to 7 chunks, settler groups of 5 to 12, cooldown 4 to 60 minutes. Only picked here; no difficulty selects it.
razi-protocol-custom=The game's own map settings with the Razi Protocol settings saved by hand. Selected when the difficulty is Custom.
